<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FF7A00">
<meta name="description" content="离线点餐收银工作台">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="YH POS SYS">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="YH POS SYS">
<title>YH POS SYS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* ==========================================================================
   点餐收银离线 PWA · 全局样式
   风格：白色背景 + 橘色栏目 + 轻毛玻璃
   字体：仅系统自带字体，无任何网络字体 / 外部资源
   ========================================================================== */

/* ---------- 设计令牌 ---------- */
:root{
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC",
               "Noto Sans CJK SC", "WenQuanYi Micro Hei", sans-serif;

  --bg:#F8F9FA;
  --bg-plain:#FFFFFF;
  --surface:rgba(255,255,255,.85);
  --surface-solid:#FFFFFF;
  --surface-strong:rgba(255,255,255,.92);
  --surface-soft:rgba(255,255,255,.6);

  --primary:#FF7A00;
  --primary-hi:#E66A00;
  --primary-soft:rgba(255,122,0,.10);
  --primary-soft-2:rgba(255,122,0,.18);
  --grad:linear-gradient(135deg,#FF8A00 0%,#FF6A00 100%);

  --text:#1F2937;
  --muted:#6B7280;
  --faint:#9CA3AF;
  --border:#E5E7EB;

  --ok:#0F9D58;
  --warn:#EA580C;
  --danger:#DC2626;
  --danger-soft:#FEF2F2;
  --danger-line:#FECACA;

  --r-sm:10px;
  --r-md:14px;
  --r-lg:16px;
  --r-xl:20px;
  --shadow:0 4px 12px rgba(0,0,0,.08);
  --shadow-up:0 -4px 16px rgba(0,0,0,.12);
  --shadow-lg:0 10px 30px rgba(0,0,0,.16);
  --blur:blur(10px);

  --topbar-h:60px;
  --tabbar-h:62px;
  --side-w:236px;

  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);

  --clock-size:17px;
}

/* ---------- 换肤主题（暖色 / 中性，禁止紫蓝绿） ---------- */
[data-theme="caramel"]{
  --primary:#B45309; --primary-hi:#92400E;
  --primary-soft:rgba(180,83,9,.10); --primary-soft-2:rgba(180,83,9,.18);
  --grad:linear-gradient(135deg,#C2701B 0%,#9A4A0B 100%);
  --warn:#B45309;
}
[data-theme="cinnabar"]{
  --primary:#E23D28; --primary-hi:#B91C1C;
  --primary-soft:rgba(226,61,40,.10); --primary-soft-2:rgba(226,61,40,.18);
  --grad:linear-gradient(135deg,#EF5A3E 0%,#C62D1A 100%);
  --warn:#E23D28;
}
[data-theme="graphite"]{
  --primary:#4B5563; --primary-hi:#374151;
  --primary-soft:rgba(75,85,99,.10); --primary-soft-2:rgba(75,85,99,.18);
  --grad:linear-gradient(135deg,#5B6675 0%,#3A4351 100%);
  --warn:#57534E;
}
/* 大字号主题（无障碍） */
[data-fontscale="large"]{ font-size:17px; }
[data-fontscale="xlarge"]{ font-size:19px; }

/* ---------- 基础重置 ---------- */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; padding:0;
  font-family:var(--font-sans);
  font-size:16px; line-height:1.5;
  color:var(--text);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
button{ cursor:pointer; border:none; background:none; padding:0; }
input,select,textarea{ outline:none; }
ul,ol{ margin:0; padding:0; list-style:none; }
h1,h2,h3,h4,p{ margin:0; }
img{ display:block; max-width:100%; }
svg{ display:block; }
[hidden]{ display:none !important; }

::-webkit-scrollbar{ width:6px; height:6px; }
::-webkit-scrollbar-thumb{ background:rgba(0,0,0,.16); border-radius:99px; }
::-webkit-scrollbar-track{ background:transparent; }

/* ==========================================================================
   布局骨架
   ========================================================================== */
#app-shell{
  position:relative;
  min-height:100dvh;
  display:flex; flex-direction:column;
  background:
    radial-gradient(900px 420px at 110% -8%, var(--primary-soft) 0%, transparent 62%),
    radial-gradient(700px 380px at -10% 4%, rgba(255,138,0,.06) 0%, transparent 60%),
    var(--bg);
}

/* ---------- 顶部橘色栏目 ---------- */
#topbar{
  position:sticky; top:0; z-index:60;
  padding-top:var(--safe-t);
  background:var(--grad);
  box-shadow:0 2px 12px rgba(255,106,0,.24);
  flex:0 0 auto;
}
.topbar-inner{
  height:var(--topbar-h);
  padding:0 12px;
  display:flex; align-items:center; gap:10px;
  color:#fff;
}
.topbar-inner .icon-btn{ color:#fff; }
.topbar-clock{
  flex:1 1 auto; min-width:0; text-align:center;
  color:#fff; line-height:1.15;
  text-shadow:0 1px 2px rgba(0,0,0,.12);
}
.clock-time{
  font-size:var(--clock-size);
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:.4px;
}
.clock-sub{
  font-size:calc(var(--clock-size) - 6px);
  opacity:.92; font-weight:500;
}
.clock-sub .dot{ margin:0 5px; opacity:.7; }
.topbar-right{ display:flex; align-items:center; gap:6px; justify-content:flex-end; min-width:44px; }
.pill-status{
  font-size:11px; font-weight:600; padding:3px 8px; border-radius:99px;
  background:rgba(255,255,255,.22);
  -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
  white-space:nowrap;
}

/* ---------- 主内容 ---------- */
#main{
  flex:1 1 auto; min-height:0;
  position:relative;
  display:flex; flex-direction:column;
}
#view-root{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
.page{
  flex:1 1 auto; min-height:0;
  display:flex; flex-direction:column;
  padding:12px 12px calc(10px + var(--tabbar-h) + var(--safe-b));
  padding-left:calc(12px + var(--safe-l));
  padding-right:calc(12px + var(--safe-r));
}
.page-scroll{ overflow-y:auto; -webkit-overflow-scrolling:touch; }
.page-title{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin-bottom:12px; flex:0 0 auto;
}
.page-title h1{ font-size:20px; font-weight:800; letter-spacing:.3px; }
.page-title .sub{ font-size:12px; color:var(--muted); margin-top:2px; }

/* ---------- 底部 Tab（手机） ---------- */
#tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  display:flex;
  padding-bottom:var(--safe-b);
  background:var(--surface-strong);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
  box-shadow:var(--shadow-up);
}
#tabbar .tab{
  flex:1 1 0; min-width:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  height:var(--tabbar-h);
  color:var(--muted); font-size:11px; font-weight:600;
}
#tabbar .tab svg{ width:22px; height:22px; }
#tabbar .tab.active{ color:var(--primary); }
#tabbar .tab.active svg{ transform:translateY(-1px); }

/* ---------- 侧边导航 ---------- */
#sidenav{
  position:fixed; top:0; left:0; bottom:0; z-index:80;
  width:var(--side-w);
  padding:calc(var(--safe-t) + 14px) 12px calc(14px + var(--safe-b));
  padding-left:calc(12px + var(--safe-l));
  background:var(--grad);
  color:#fff;
  display:flex; flex-direction:column;
  transform:translateX(-100%);
  transition:transform .26s cubic-bezier(.4,0,.2,1);
  box-shadow:var(--shadow-lg);
  overflow-y:auto;
}
#sidenav.open{ transform:translateX(0); }
.sidenav-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:16px; }
.brand{ display:flex; align-items:center; gap:10px; }
.brand-logo{
  width:40px;height:40px;border-radius:12px;flex:0 0 auto;
  background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:19px;
  -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
}
.brand-text b{ display:block; font-size:15px; font-weight:800; }
.brand-text small{ display:block; font-size:11px; opacity:.85; }
.nav-list{ flex:1 1 auto; display:flex; flex-direction:column; gap:4px; }
.nav-list li a,.nav-list li button{
  display:flex; align-items:center; gap:10px;
  width:100%; text-align:left;
  padding:12px 12px; border-radius:12px;
  color:#fff; font-size:14px; font-weight:600;
  transition:background .18s;
}
.nav-list li svg{ width:20px;height:20px;flex:0 0 auto; opacity:.95; }
.nav-list li a:hover,.nav-list li button:hover{ background:rgba(255,255,255,.14); }
.nav-list li .active{ background:rgba(255,255,255,.24); box-shadow:inset 0 0 0 1px rgba(255,255,255,.28); }
.sidenav-foot{ padding-top:12px; border-top:1px solid rgba(255,255,255,.22); }
#nav-backdrop{
  position:fixed; inset:0; z-index:70;
  background:rgba(17,24,39,.42);
  opacity:0; pointer-events:none; transition:opacity .26s;
}
#nav-backdrop.show{ opacity:1; pointer-events:auto; }

/* ==========================================================================
   通用组件
   ========================================================================== */
.card{
  background:var(--surface);
  -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
  border:1px solid rgba(255,255,255,.6);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow);
  padding:14px;
  margin-bottom:12px;
}
.card.tight{ padding:12px; }
.card-title{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  font-size:14px; font-weight:800; margin-bottom:10px;
}
.card-title .hint{ font-size:12px; font-weight:500; color:var(--muted); }

/* 橘色栏目 */
.bar-orange{
  background:var(--grad);
  color:#fff;
  border-radius:var(--r-lg);
  padding:12px 14px;
  box-shadow:0 6px 16px rgba(255,106,0,.20);
}
.bar-orange .lbl{ font-size:12px; opacity:.9; font-weight:600; }
.bar-orange .val{ font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:.5px; }

/* 按钮 */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:48px; padding:0 16px;
  border-radius:12px;
  font-size:15px; font-weight:700;
  background:var(--primary); color:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.10);
  transition:transform .12s, background .18s, box-shadow .18s;
  white-space:nowrap;
}
.btn:active{ transform:scale(.975); }
.btn:hover{ background:var(--primary-hi); }
.btn svg{ width:18px;height:18px; }
.btn-block{ width:100%; }
.btn-ghost{
  background:var(--surface-solid); color:var(--primary);
  border:1.5px solid var(--primary);
  box-shadow:none;
}
.btn-ghost:hover{ background:var(--primary-soft); }
.btn-soft{
  background:var(--primary-soft); color:var(--primary-hi);
  box-shadow:none;
}
.btn-soft:hover{ background:var(--primary-soft-2); }
.btn-danger{
  background:var(--danger-soft); color:var(--danger);
  border:1px solid var(--danger-line); box-shadow:none;
}
.btn-danger:hover{ background:#FEE2E2; }
.btn-gray{
  background:#F3F4F6; color:var(--text); box-shadow:none;
}
.btn-gray:hover{ background:#E5E7EB; }
.btn-ghost-light{
  min-height:44px; width:100%;
  background:rgba(255,255,255,.18); color:#fff;
  border:1px solid rgba(255,255,255,.32); box-shadow:none;
  font-weight:600;
}
.btn-ghost-light:hover{ background:rgba(255,255,255,.28); }
.btn-sm{ min-height:38px; padding:0 12px; font-size:13px; border-radius:10px; }
.btn:disabled{ opacity:.5; pointer-events:none; }

.icon-btn{
  width:40px;height:40px;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:11px; color:var(--text);
  transition:background .18s;
}
.icon-btn:hover{ background:rgba(0,0,0,.06); }
.icon-btn.light:hover{ background:rgba(255,255,255,.18); }

/* 表单 */
.field{ margin-bottom:12px; }
.field > label{
  display:block; font-size:13px; font-weight:700; color:var(--muted);
  margin-bottom:6px;
}
.input,.select,.textarea{
  width:100%; min-height:48px;
  padding:10px 12px;
  background:var(--surface-solid);
  border:1.5px solid var(--border);
  border-radius:12px;
  font-size:15px;
  transition:border-color .18s, box-shadow .18s;
}
.textarea{ min-height:84px; resize:vertical; line-height:1.5; }
.input:focus,.select:focus,.textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-soft);
}
.select{
  appearance:none; -webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
                   linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 21px, calc(100% - 12px) 21px;
  background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;
  padding-right:34px;
}
.input-money{ font-variant-numeric:tabular-nums; font-weight:700; }

/* 分段控件 */
.seg{
  display:flex; gap:6px; padding:4px;
  background:#F3F4F6; border-radius:12px;
}
.seg button{
  flex:1 1 0; min-height:38px; border-radius:9px;
  font-size:14px; font-weight:700; color:var(--muted);
  transition:all .18s;
}
.seg button.active{
  background:var(--surface-solid); color:var(--primary);
  box-shadow:0 2px 6px rgba(0,0,0,.10);
}

/* 开关 */
.switch{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; }
.switch .sw-label{ font-size:14px; font-weight:700; }
.switch .sw-desc{ font-size:12px; color:var(--muted); margin-top:2px; }
.sw-track{
  flex:0 0 auto; width:52px;height:31px;border-radius:99px;
  background:#D1D5DB; position:relative; transition:background .2s;
}
.sw-track::after{
  content:""; position:absolute; top:3px; left:3px;
  width:25px;height:25px;border-radius:50%;
  background:#fff; box-shadow:0 2px 5px rgba(0,0,0,.22);
  transition:transform .2s;
}
.switch.on .sw-track{ background:var(--primary); }
.switch.on .sw-track::after{ transform:translateX(21px); }

/* 徽标 / 标签 */
.tag{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;border-radius:99px;
  font-size:11px;font-weight:700;
  background:var(--primary-soft); color:var(--primary-hi);
}
.tag.gray{ background:#F3F4F6; color:var(--muted); }
.tag.ok{ background:#ECFDF5; color:var(--ok); }
.tag.warn{ background:#FFF7ED; color:var(--warn); }
.tag.danger{ background:var(--danger-soft); color:var(--danger); }

/* 统计网格 */
.stat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:12px; }
.stat{
  background:var(--surface);
  -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
  border:1px solid rgba(255,255,255,.6);
  border-radius:var(--r-md);
  box-shadow:var(--shadow);
  padding:12px;
}
.stat .k{ font-size:12px; color:var(--muted); font-weight:600; }
.stat .v{ font-size:21px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:3px; }

/* 列表行 */
.row{
  display:flex; align-items:center; gap:10px;
  padding:11px 0; border-bottom:1px solid var(--border);
}
.row:last-child{ border-bottom:none; }
.row .grow{ flex:1 1 auto; min-width:0; }
.row .t{ font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .s{ font-size:12px; color:var(--muted); margin-top:2px; }
.row .amt{ font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
.amount-in{ color:var(--ok); }
.amount-out{ color:var(--danger); }

.empty{
  text-align:center; padding:34px 16px; color:var(--faint);
}
.empty .em{ font-size:34px; margin-bottom:8px; opacity:.55; }
.empty p{ font-size:14px; }

/* 弹窗 */
#modal-root{ position:fixed; inset:0; z-index:100; pointer-events:none; }
.modal-mask{
  position:absolute; inset:0;
  background:rgba(17,24,39,.46);
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
  display:flex; align-items:flex-end; justify-content:center;
  pointer-events:auto;
  animation:fadeIn .18s ease;
}
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
@keyframes slideUp{ from{transform:translateY(24px);opacity:.4} to{transform:translateY(0);opacity:1} }
.modal{
  width:100%; max-width:520px;
  max-height:min(88dvh, 900px);
  display:flex; flex-direction:column;
  background:var(--surface-solid);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:var(--shadow-lg);
  animation:slideUp .24s cubic-bezier(.4,0,.2,1);
  margin-bottom:0;
}
.modal-head{
  flex:0 0 auto;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:16px 16px 12px;
  border-bottom:1px solid var(--border);
}
.modal-head h3{ font-size:17px; font-weight:800; }
.modal-body{ flex:1 1 auto; overflow-y:auto; padding:14px 16px; -webkit-overflow-scrolling:touch; }
.modal-foot{
  flex:0 0 auto; display:flex; gap:10px;
  padding:12px 16px calc(12px + var(--safe-b));
  border-top:1px solid var(--border);
  background:var(--surface-solid);
  border-radius:0 0 var(--r-xl) var(--r-xl);
}
.modal-foot .btn{ flex:1 1 0; }

/* Toast */
#toast-root{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(var(--tabbar-h) + var(--safe-b) + 18px);
  z-index:200; display:flex; flex-direction:column; gap:8px;
  align-items:center; pointer-events:none; width:max-content; max-width:88vw;
}
.toast{
  background:rgba(31,41,55,.94); color:#fff;
  padding:10px 16px; border-radius:12px;
  font-size:14px; font-weight:600;
  box-shadow:var(--shadow-lg);
  animation:toastIn .22s ease;
}
.toast.ok{ background:rgba(15,157,88,.95); }
.toast.err{ background:rgba(220,38,38,.95); }
@keyframes toastIn{ from{transform:translateY(10px);opacity:0} to{transform:translateY(0);opacity:1} }

/* ==========================================================================
   点餐页（手机竖屏：上 2/3 菜品滚动区 + 下 1/3 固定结算面板）
   ========================================================================== */
.order-body{
  flex:1 1 auto; min-height:0;
  display:flex; flex-direction:column;
  overflow:hidden;
}
.order-dishes{
  flex:2 1 0; min-height:0;
  display:flex; flex-direction:column;
  overflow:hidden;
}
.order-dishes-scroll{
  flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:2px 2px 8px;
}
.order-checkout{
  flex:1 1 0; min-height:0;
  display:flex; flex-direction:column;
  background:var(--surface-strong);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  border-top-left-radius:var(--r-xl);
  border-top-right-radius:var(--r-xl);
  box-shadow:var(--shadow-up);
  border-top:1px solid rgba(255,255,255,.7);
  padding:10px 12px 0;
  overflow:hidden;
}

/* 分类横滑 */
.cat-bar{
  flex:0 0 auto;
  display:flex; gap:6px; overflow-x:auto;
  padding:2px 0 10px;
  scrollbar-width:none;
}
.cat-bar::-webkit-scrollbar{ display:none; }
.cat-chip{
  flex:0 0 auto; min-height:36px; padding:0 14px;
  border-radius:99px;
  background:var(--surface-solid);
  border:1.5px solid var(--border);
  color:var(--muted);
  font-size:13px; font-weight:700;
  display:inline-flex; align-items:center;
}
.cat-chip.active{
  background:var(--grad); color:#fff; border-color:transparent;
  box-shadow:0 3px 8px rgba(255,106,0,.26);
}
.dish-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.dish-card{
  background:var(--surface);
  -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
  border:1px solid rgba(255,255,255,.6);
  border-radius:var(--r-md);
  box-shadow:var(--shadow);
  overflow:hidden;
  display:flex; flex-direction:column;
  transition:transform .14s;
  position:relative;
}
.dish-card:active{ transform:scale(.98); }
.dish-card.off{ opacity:.55; }
.dish-thumb{
  position:relative; width:100%; aspect-ratio:4/3;
  background:linear-gradient(135deg,#FFF1E0,#FFE2C6);
  display:flex;align-items:center;justify-content:center;
  color:var(--primary-hi); font-weight:800; font-size:20px;
  overflow:hidden;
}
.dish-thumb img{ width:100%; height:100%; object-fit:cover; }
.dish-badge-off{
  position:absolute; inset:0; display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.72); color:var(--muted); font-size:13px; font-weight:800;
}
.dish-info{ padding:9px 10px 10px; flex:1 1 auto; display:flex; flex-direction:column; gap:4px; }
.dish-name{ font-size:14px; font-weight:800; line-height:1.25; }
.dish-price{ font-size:13px; font-weight:800; color:var(--primary); font-variant-numeric:tabular-nums; }
.dish-spec-mini{ font-size:11px; color:var(--muted); }

/* 结算面板内部 */
.ck-head{ flex:0 0 auto; display:flex; gap:8px; align-items:center; }
.ck-head .num-wrap{ flex:1 1 0; min-width:0; }
.ck-num{
  display:flex; align-items:center; gap:6px;
  background:var(--surface-solid);
  border:1.5px solid var(--border);
  border-radius:12px; padding:0 6px; height:46px;
}
.ck-num label{ font-size:12px; color:var(--muted); font-weight:700; flex:0 0 auto; padding-left:6px; }
.ck-num input{
  flex:1 1 auto; min-width:0; width:100%;
  border:none; background:transparent; height:44px;
  font-size:16px; font-weight:800; text-align:center;
  font-variant-numeric:tabular-nums;
  -moz-appearance:textfield;
}
.ck-num input::-webkit-outer-spin-button,
.ck-num input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.ck-num .step{
  width:34px;height:34px;flex:0 0 auto;border-radius:9px;
  background:var(--primary-soft); color:var(--primary-hi);
  font-size:18px; font-weight:800; line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.ck-num .step:active{ background:var(--primary-soft-2); }

.ck-cart{
  flex:1 1 auto; min-height:0; overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  margin:8px 0 6px;
  border-top:1px dashed var(--border);
  border-bottom:1px dashed var(--border);
  padding:4px 0;
}
.ck-item{ display:flex; align-items:flex-start; gap:8px; padding:7px 0; }
.ck-item .ck-i-main{ flex:1 1 auto; min-width:0; }
.ck-item .ck-i-name{ font-size:13.5px; font-weight:800; line-height:1.3; }
.ck-item .ck-i-meta{ font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.35; }
.ck-item .ck-i-amt{ font-weight:800; font-size:13.5px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.qty-ctl{ display:flex; align-items:center; gap:2px; flex:0 0 auto; }
.qty-ctl button{
  width:28px;height:28px;border-radius:8px;
  background:var(--primary-soft); color:var(--primary-hi);
  font-size:16px;font-weight:800;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.qty-ctl .q{ min-width:22px; text-align:center; font-weight:800; font-size:14px; font-variant-numeric:tabular-nums; }

.ck-foot{
  flex:0 0 auto;
  padding-bottom:calc(8px + var(--safe-b));
}
.ck-total-row{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:8px;
}
.ck-total-row .lbl{ font-size:13px; color:var(--muted); font-weight:700; }
.ck-total-row .val{ font-size:26px; font-weight:900; color:var(--primary); font-variant-numeric:tabular-nums; letter-spacing:.5px; }

/* ==========================================================================
   台桌管理
   ========================================================================== */
/* 手机 3 列 → 平板 4~5 列 → 电脑 6~8 列 */
.table-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}
.table-card{
  position:relative;
  min-height:88px;                       /* 触摸友好 */
  border-radius:16px;
  padding:10px 6px 8px;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:2px; text-align:center;
  background:var(--surface);
  -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
  border:1.5px solid var(--border);
  box-shadow:var(--shadow);
  transition:transform .12s, box-shadow .18s, border-color .18s;
  overflow:hidden;
}
.table-card:active{ transform:scale(.96); }
.tc-num{ font-size:20px; font-weight:900; color:var(--text); line-height:1.1; }
.tc-state{ font-size:11.5px; font-weight:700; color:var(--muted); }
.tc-amt{ font-size:12.5px; font-weight:800; color:var(--primary); font-variant-numeric:tabular-nums; margin-top:1px; }

/* 使用中：橘色边框高亮 */
.table-card.status-using{
  border-color:var(--primary);
  background:linear-gradient(180deg, var(--primary-soft) 0%, var(--surface) 62%);
  box-shadow:0 4px 14px rgba(255,106,0,.18);
}
.table-card.status-using .tc-num{ color:var(--primary-hi); }
.table-card.status-using .tc-state{ color:var(--primary-hi); }

/* 待付款：浅红边框警示 */
.table-card.status-pending{
  border-color:var(--danger);
  background:linear-gradient(180deg, var(--danger-soft) 0%, var(--surface) 62%);
  box-shadow:0 4px 14px rgba(220,38,38,.14);
}
.table-card.status-pending .tc-num{ color:var(--danger); }
.table-card.status-pending .tc-state{ color:var(--danger); }
.table-card.status-pending .tc-amt{ color:var(--danger); }

/* 外卖独立大卡片 */
.ta-card{
  width:100%;
  min-height:96px;
  padding:0;
  align-items:stretch;
  border-color:var(--primary);
  background:var(--surface);
  box-shadow:0 6px 18px rgba(255,106,0,.16);
}
.ta-head{
  width:100%;
  display:flex; align-items:center; justify-content:space-between;
  padding:9px 14px;
  background:var(--grad);
  color:#fff;
}
.ta-badge{
  font-size:11px; font-weight:800;
  padding:3px 9px; border-radius:99px;
  background:rgba(255,255,255,.26);
}
.ta-body{
  flex:1 1 auto;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:12px 14px 14px;
  gap:2px;
}
.ta-card.status-using .tc-state{ color:var(--primary); font-weight:800; }
.ta-card.status-pending .tc-state{ color:var(--danger); font-weight:800; }

/* 断点：平板 4~5，电脑 6~8 */
@media (min-width:820px){
  .table-grid{ grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
  .table-card{ min-height:104px; padding:14px 8px 12px; }
  .tc-num{ font-size:26px; }
  .tc-state{ font-size:13px; }
  .tc-amt{ font-size:14px; }
  .ta-card{ min-height:112px; }
}
@media (min-width:1100px){ .table-grid{ grid-template-columns:repeat(5,minmax(0,1fr)); } }
@media (min-width:1400px){ .table-grid{ grid-template-columns:repeat(6,minmax(0,1fr)); } }
@media (min-width:1700px){ .table-grid{ grid-template-columns:repeat(7,minmax(0,1fr)); } }
@media (min-width:2000px){ .table-grid{ grid-template-columns:repeat(8,minmax(0,1fr)); } }

/* 单号小字（订单列表 / 小票 / PDF 通用） */
.order-no{
  display:inline-block;
  font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size:12px; font-weight:800; letter-spacing:.4px;
  padding:2px 7px; border-radius:6px;
  background:var(--primary-soft); color:var(--primary-hi);
  white-space:nowrap;
}

/* ==========================================================================
   菜单管理
   ========================================================================== */
.menu-item-row{
  display:flex; gap:10px; align-items:center;
  padding:10px; border-radius:var(--r-md);
  background:var(--surface-solid);
  border:1px solid var(--border);
  margin-bottom:8px;
}
.menu-thumb{
  width:56px;height:56px;flex:0 0 auto;border-radius:11px;overflow:hidden;
  background:linear-gradient(135deg,#FFF1E0,#FFE2C6);
  display:flex;align-items:center;justify-content:center;
  color:var(--primary-hi);font-weight:800;font-size:17px;
}
.menu-thumb img{ width:100%;height:100%;object-fit:cover; }
.spec-row{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.spec-row .input{ flex:1 1 auto; }
.spec-row .input:nth-child(2){ max-width:118px; }
.chip-wrap{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 10px;border-radius:99px;
  background:var(--surface-solid);
  border:1.5px solid var(--border);
  font-size:13px;font-weight:700;color:var(--text);
  min-height:38px;
}
.chip.on{ background:var(--primary-soft); border-color:var(--primary); color:var(--primary-hi); }
.chip.x{ background:var(--danger-soft); border-color:var(--danger-line); color:var(--danger); }
.chip .x-btn{ font-weight:900; opacity:.6; }

/* 搜索 */
.search-bar{ position:relative; margin-bottom:10px; flex:0 0 auto; }
.search-bar .input{ padding-left:38px; }
.search-bar .ico{
  position:absolute; left:12px; top:50%; transform:translateY(-50%);
  color:var(--faint); pointer-events:none;
}
.search-bar .ico svg{ width:18px;height:18px; }

/* 日历 */
.cal-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.cal-head b{ font-size:16px; font-weight:800; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal-dow{ text-align:center; font-size:11px; color:var(--faint); font-weight:700; padding-bottom:4px; }
.cal-cell{
  aspect-ratio:1/1; border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:var(--text);
  background:var(--surface-solid);
  border:1.5px solid transparent;
  position:relative;
}
.cal-cell.blank{ background:transparent; }
.cal-cell.today{ border-color:var(--primary); color:var(--primary); }
.cal-cell.has-data{ background:var(--primary-soft); color:var(--primary-hi); }
.cal-cell.sel{ background:var(--grad); color:#fff; box-shadow:0 3px 8px rgba(255,106,0,.3); }
.cal-dot{
  position:absolute; bottom:4px; width:4px;height:4px;border-radius:50%;
  background:var(--primary);
}
.cal-cell.sel .cal-dot{ background:#fff; }

/* PDF 档案 */
.pdf-item{
  display:flex; align-items:center; gap:10px;
  padding:11px; border-radius:var(--r-md);
  background:var(--surface-solid); border:1px solid var(--border);
  margin-bottom:8px;
}
.pdf-ico{
  width:40px;height:40px;flex:0 0 auto;border-radius:10px;
  background:var(--danger-soft); color:var(--danger);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:900;
}
.pdf-actions{ display:flex; gap:6px; flex:0 0 auto; }
.pdf-actions .btn{ min-height:36px; padding:0 10px; font-size:12.5px; }

/* 设置项 */
.set-row{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 0; border-bottom:1px solid var(--border);
}
.set-row:last-child{ border-bottom:none; }
.set-row .t{ font-size:14.5px; font-weight:700; }
.set-row .d{ font-size:12px; color:var(--muted); margin-top:2px; }
.theme-swatches{ display:flex; gap:10px; flex-wrap:wrap; }
.swatch{
  width:52px;height:52px;border-radius:14px;
  border:3px solid transparent; position:relative;
  box-shadow:var(--shadow);
}
.swatch.on{ border-color:var(--text); }
.swatch span{
  position:absolute; bottom:-18px; left:50%; transform:translateX(-50%);
  font-size:11px; color:var(--muted); white-space:nowrap; font-weight:600;
}

/* ==========================================================================
   平板 / 大屏
   ========================================================================== */
@media (min-width:820px){
  :root{ --topbar-h:66px; }
  #tabbar{ display:none; }
  #sidenav{
    transform:translateX(0);
    box-shadow:none;
    border-right:1px solid rgba(255,255,255,.16);
  }
  #nav-backdrop{ display:none; }
  #btn-menu-toggle, #btn-menu-close{ display:none; }
  #app-shell{ padding-left:var(--side-w); }
  #topbar{ margin-left:0; }
  .page{
    padding:18px 22px 26px;
    padding-left:calc(22px + var(--safe-l));
    padding-right:calc(22px + var(--safe-r));
  }
  .page-title h1{ font-size:24px; }
  .btn{ min-height:56px; font-size:15.5px; }
  .btn-sm{ min-height:42px; font-size:13.5px; }
  .input,.select{ min-height:56px; font-size:15.5px; }
  .select{ background-position:calc(100% - 18px) 25px, calc(100% - 13px) 25px; }
  .cat-chip{ min-height:42px; font-size:14px; }
  .stat-grid{ grid-template-columns:repeat(4,1fr); gap:14px; }
  .stat .v{ font-size:26px; }
  .dish-grid{ grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; }
  .card{ padding:18px; margin-bottom:14px; }
  .modal-mask{ align-items:center; }
  .modal{ border-radius:var(--r-xl); max-height:86dvh; }
  .modal-foot{ padding-bottom:12px; }
  #toast-root{ bottom:calc(22px + var(--safe-b)); }

  /* 平板点餐：左右多列，不受 2/3 + 1/3 约束 */
  .order-body{ flex-direction:row; gap:16px; }
  .order-dishes{
    flex:1 1 auto; min-height:0;
  }
  .order-checkout{
    flex:0 0 380px; width:380px;
    border-radius:var(--r-xl);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:var(--shadow);
    padding:14px;
  }
  .order-checkout .ck-foot{ padding-bottom:0; }
  .ck-total-row .val{ font-size:32px; }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start; }
  .two-col > .card{ margin-bottom:0; }
}
@media (min-width:1180px){
  .dish-grid{ grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); }
  .order-checkout{ flex:0 0 420px; width:420px; }
}

/* 横屏手机：放宽点餐面板 */
@media (max-width:819px) and (orientation:landscape){
  .order-dishes{ flex:1 1 0; }
  .order-checkout{ flex:1 1 0; }
  .dish-grid{ grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
}

/* 打印兜底（浏览器通用打印）—— 不污染屏幕样式 */
#print-root{ display:none; }
@media print{
  body *{ visibility:hidden !important; }
  #print-root, #print-root *{ visibility:visible !important; }
  #print-root{ display:block; position:absolute; left:0; top:0; width:58mm; }
  @page{ margin:2mm; size:58mm auto; }
}

/* 启动屏 */
#boot-screen{
  position:fixed; inset:0; z-index:300;
  background:var(--grad);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  color:#fff;
  transition:opacity .3s;
}
#boot-screen.hide{ opacity:0; pointer-events:none; }
.boot-logo{
  width:74px;height:74px;border-radius:22px;
  background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;
  font-size:34px;font-weight:800;
  animation:pulse 1.4s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
.boot-text{ font-size:14px; opacity:.92; font-weight:600; }

/* 无障碍：减少动效 */
@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}

/* ============ 10-db.js ============ */
/* 10-db.js · IndexedDB 封装
   仓库：menu / orders / ledger / addons / photos / pdfArchives / kv
         carts（台桌 & 外卖进行中购物车）/ counters（单号计数器）
         locks（工位软锁，跨会话互斥） */
(function (G) {
  'use strict';

  var DB_NAME = 'pos-cashier-db';
  var DB_VERSION = 3;

  var STORES = {
    menu:        { keyPath: 'id', auto: true, indexes: [['category','category','unique:false']] },
    orders:      { keyPath: 'id', auto: true, indexes: [['date','date','unique:false'], ['createTime','createTime','unique:false']] },
    ledger:      { keyPath: 'id', auto: true, indexes: [['date','date','unique:false'], ['type','type','unique:false']] },
    addons:      { keyPath: 'id', auto: true, indexes: [['kind','kind','unique:false']] },
    photos:      { keyPath: 'id', auto: true },
    pdfArchives: { keyPath: 'pdfId', auto: true, indexes: [['createTime','createTime','unique:false'], ['label','label','unique:false']] },
    kv:          { keyPath: 'k' },
    carts:       { keyPath: 'slotId' },
    counters:    { keyPath: 'k' },
    locks:       { keyPath: 'slotId' }
  };

  var _db = null;

  function open() {
    if (_db) return Promise.resolve(_db);
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function (e) {
        var db = e.target.result;
        Object.keys(STORES).forEach(function (name) {
          if (db.objectStoreNames.contains(name)) return;
          var def = STORES[name];
          var store = db.createObjectStore(name, { keyPath: def.keyPath });
          if (def.indexes) {
            def.indexes.forEach(function (ix) {
              store.createIndex(ix[0], ix[1], { unique: ix[2] === 'unique:true' });
            });
          }
        });
      };
      req.onsuccess = function (e) { _db = e.target.result; resolve(_db); };
      req.onerror = function (e) { reject(e.target.error); };
    });
  }

  function tx(names, mode) {
    return open().then(function (db) {
      return db.transaction(names, mode || 'readonly');
    });
  }

  function reqAsPromise(req) {
    return new Promise(function (resolve, reject) {
      req.onsuccess = function (e) { resolve(e.target.result); };
      req.onerror = function (e) { reject(e.target.error); };
    });
  }

  function getAll(store) {
    return tx([store]).then(function (t) {
      return reqAsPromise(t.objectStore(store).getAll());
    });
  }

  function get(store, key) {
    return tx([store]).then(function (t) {
      return reqAsPromise(t.objectStore(store).get(key));
    });
  }

  function put(store, val) {
    return tx([store], 'readwrite').then(function (t) {
      return reqAsPromise(t.objectStore(store).put(val));
    });
  }

  function add(store, val) {
    return tx([store], 'readwrite').then(function (t) {
      return reqAsPromise(t.objectStore(store).add(val));
    });
  }

  function del(store, key) {
    return tx([store], 'readwrite').then(function (t) {
      return reqAsPromise(t.objectStore(store).delete(key));
    });
  }

  function clear(store) {
    return tx([store], 'readwrite').then(function (t) {
      return reqAsPromise(t.objectStore(store).clear());
    });
  }

  function getByIndex(store, indexName, value) {
    return tx([store]).then(function (t) {
      return reqAsPromise(t.objectStore(store).index(indexName).getAll(value));
    });
  }

  function getAllInRange(store, indexName, range) {
    return tx([store]).then(function (t) {
      return reqAsPromise(t.objectStore(store).index(indexName).getAll(range));
    });
  }

  /* kv 辅助 */
  function kvGet(k) {
    return get('kv', k).then(function (r) { return r ? r.v : null; });
  }
  function kvSet(k, v) {
    return put('kv', { k: k, v: v });
  }
  function kvDel(k) { return del('kv', k); }

  G.DB = {
    open: open,
    getAll: getAll,
    get: get,
    put: put,
    add: add,
    del: del,
    clear: clear,
    getByIndex: getByIndex,
    getAllInRange: getAllInRange,
    kvGet: kvGet,
    kvSet: kvSet,
    kvDel: kvDel,
    STORES: STORES,
    DB_NAME: DB_NAME
  };
})(window);

/* ============ 25-flow.js ============ */
/* 25-flow.js · 下单 / 结账 共用流程
   点餐页与结账页都走这里，保证单号生成、历史写入、购物车清空、打印行为一致。 */
(function (G) {
  'use strict';
  var U = G.U;

  /* 生成单号（堂食 DI / 外卖 TA） */
  function nextOrderNo(kind) {
    return kind === 'takeaway' ? G.App.seq.nextTakeaway() : G.App.seq.nextDineIn();
  }

  /* 购物车 → 历史订单记录（不落单号前不写库） */
  function buildOrder(cart, orderNo) {
    var total = 0;
    (cart.items || []).forEach(function (l) { total += +l.subtotal || 0; });
    total = Math.round(total * 100) / 100;
    var now = new Date();
    return {
      orderNo: orderNo,
      kind: cart.kind || 'dinein',
      date: U.todayKey(now),
      createTime: now.toISOString(),
      table: cart.kind === 'takeaway' ? null : (cart.table || 0),
      pax: cart.kind === 'takeaway' ? 0 : (cart.pax || 1),
      payMethod: cart.payMethod || 'CASH',
      items: (cart.items || []).map(function (l) {
        return {
          menuId: l.menuId, name: l.name, specId: l.specId, specName: l.specName,
          unitPrice: l.unitPrice, qty: l.qty,
          addons: l.addons || [], excludes: l.excludes || [],
          photoId: l.photoId || '', subtotal: l.subtotal
        };
      }),
      total: total,
      paid: true
    };
  }

  /* 确保购物车已分配单号（已分配则沿用，不重复消耗计数） */
  function ensureOrderNo(cart) {
    if (cart.orderNo) return Promise.resolve(cart.orderNo);
    return nextOrderNo(cart.kind).then(function (no) {
      cart.orderNo = no;
      return no;
    });
  }

  /* 结账：取/生成单号 → 写历史 → 清空购物车 →（可选）打印 */
  function checkout(cart, opts) {
    opts = opts || {};
    if (!cart || !cart.items || cart.items.length === 0) {
      return Promise.reject(new Error('购物车为空，无法结账'));
    }
    return ensureOrderNo(cart).then(function (no) {
      var order = buildOrder(cart, no);
      return G.App.orders.save(order).then(function () {
        return G.App.carts.clear(cart.slotId).then(function () { return order; });
      });
    }).then(function (order) {
      if (opts.print !== false && G.App.cfg.get('autoPrint')) {
        return G.Print.print(order).then(function () { return order; },
                             function () { return order; });
      }
      return order;
    });
  }

  /* 下单待付：生成单号（若还没有）→ 状态置 pending，不写历史 */
  function placeOrder(cart) {
    if (!cart || !cart.items || cart.items.length === 0) {
      return Promise.reject(new Error('购物车为空'));
    }
    return ensureOrderNo(cart).then(function (no) {
      cart.status = 'pending';
      return G.App.carts.save(cart).then(function () { return no; });
    });
  }

  /* ---- 工位锁心跳 ----
     锁 TTL 只有 30 秒。点一桌菜往往要几分钟，只在进页面抢一次锁的话，
     30 秒后锁就过期了，别的会话会以为这桌没人操作 → 边界规则 3 形同虚设。
     这里每 10 秒续一次期；离开本页（路由变化 / 关闭标签页）自动停表。
     返回 stop() 供调用方在切换工位时手动停表。 */
  function holdLock(slotId) {
    if (!slotId) return function () {};
    G.App.carts.acquireLock(slotId);
    var timer = setInterval(function () { G.App.carts.touchLock(slotId); }, 10000);
    var stopped = false;
    function stop() {
      if (stopped) return;
      stopped = true;
      clearInterval(timer);
      window.removeEventListener('hashchange', stop);
      window.removeEventListener('pagehide', stop);
    }
    window.addEventListener('hashchange', stop);
    window.addEventListener('pagehide', stop);
    return stop;
  }

  /* 打印某张历史订单（手动重打） */
  function reprint(order) {
    return G.Print.print(order);
  }

  /* 显示用：桌号 / 外卖 标签 */
  function slotLabel(order) {
    if (order.kind === 'takeaway') return '外卖';
    return '桌 ' + (order.table || '-') + ' 号';
  }

  G.Flow = {
    nextOrderNo: nextOrderNo,
    ensureOrderNo: ensureOrderNo,
    buildOrder: buildOrder,
    checkout: checkout,
    placeOrder: placeOrder,
    reprint: reprint,
    slotLabel: slotLabel,
    holdLock: holdLock
  };
})(window);

      drawTable(ctx, MARGIN, hotY + 50, PAGE_W - MARGIN * 2, hotRows, [PAGE_W * 0.50, PAGE_W * 0.15, PAGE_W * 0.35].map(function (v) { return v - MARGIN * 2; }));
    }

    // 页脚
    ctx.fillStyle = '#9CA3AF';
    ctx.font = '500 20px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textBaseline = 'bottom';
    ctx.textAlign = 'right';
    ctx.fillText('由 离线点餐收银 PWA 生成 · ' + U.formatDate(new Date()), PAGE_W - MARGIN, PAGE_H - MARGIN);
    ctx.textAlign = 'left';

    pages.push(c);

    // 后续分页：订单明细
    if (orders.length) {
      return renderOrderPages(orders, photos, pages);
    }
    return Promise.resolve(pages);
  }

  function renderOrderPages(orders, photos, pages) {
    return new Promise(function (resolve) {
      if (!orders.length) { resolve(pages); return; }
      var perPage = 6;
      var c, ctx, cy, col, drawn;
      function newPage() {
        c = newCanvas(); ctx = c.getContext('2d');
        ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, PAGE_W, PAGE_H);
        drawHeader(ctx, '营业报告', U.formatDateCN(new Date()) + ' · 订单明细');
        cy = MARGIN + 180; col = 0; drawn = 0;
      }
      function flushPage() {
        if (!c) return;
        ctx.fillStyle = '#9CA3AF';
        ctx.font = '500 20px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.textBaseline = 'bottom';
        ctx.textAlign = 'right';
        ctx.fillText('由 离线点餐收银 PWA 生成 · ' + U.formatDate(new Date()), PAGE_W - MARGIN, PAGE_H - MARGIN);
        ctx.textAlign = 'left';
        pages.push(c);
      }
      newPage();
      var cardW = (PAGE_W - MARGIN * 2 - 24) / 2;
      var cardH = 220;
      orders.forEach(function (order, i) {
        if (drawn > 0 && drawn % perPage === 0) {
          flushPage();
          newPage();
        }
        var x = MARGIN + col * (cardW + 24);
        var firstImg = null;
        if (order.items && order.items.length) {
          for (var j = 0; j < order.items.length; j++) {
            var pid = order.items[j].photoId;
            if (pid && photos[pid]) { firstImg = photos[pid]; break; }
          }
        }
        drawOrderCard(ctx, x, cy, cardW, cardH, order, firstImg);
        drawn++; col++;
        if (col === 2) { col = 0; cy += cardH + 24; }
      });
      if (c) flushPage();
      resolve(pages);
    });
  }

  function computeStats(orders, ledger) {
    var gross = 0, cashTotal = 0;
    var payBreakdown = {};
    var itemAgg = {};
    orders.forEach(function (o) {
      gross += +o.total || 0;
      cashTotal += +o.total || 0; // 实际收银
      payBreakdown[o.payMethod] = payBreakdown[o.payMethod] || { n: 0, amount: 0 };
      payBreakdown[o.payMethod].n++;
      payBreakdown[o.payMethod].amount += +o.total || 0;
      o.items.forEach(function (it) {
        var key = it.name + (it.specName ? '(' + it.specName + ')' : '');
        itemAgg[key] = itemAgg[key] || { name: it.name, spec: it.specName, qty: 0, amount: 0 };
        itemAgg[key].qty += +it.qty || 0;
        itemAgg[key].amount += +it.subtotal || 0;
      });
    });
    var expense = 0, otherIncome = 0;
    ledger.forEach(function (l) {
      if (l.type === 'expense') expense += +l.amount || 0;
      else if (l.type === 'income' && !l.fromOrder) otherIncome += +l.amount || 0;
    });
    var topItems = Object.values(itemAgg).sort(function (a, b) { return b.qty - a.qty || b.amount - a.amount; });
    return {
      orderCount: orders.length,
      gross: gross,
      cashTotal: cashTotal,
      expense: expense,
      otherIncome: otherIncome,
      net: gross + otherIncome - expense,
      payBreakdown: payBreakdown,
      topItems: topItems
    };
  }

  /* ====== 对外 API ====== */
  function generateReport(opts) {
    return buildReport(opts).then(function (canvases) {
      // 全部 canvas 编码为 JPEG
      var jpegs = canvases.map(function (c) {
        // 同步：toDataURL → binary；不阻塞
        var dataURL = c.toDataURL('image/jpeg', 0.86);
        var bin = atob(dataURL.split(',')[1]);
        var arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return arr;
      });
      var blob = pdfFromJPEGPages(jpegs);
      return blob;
    });
  }

  function generateAndArchive(opts) {
    // 预加载菜品图片为 HTMLImageElement（用于嵌入 PDF）
    var photoMap = {};
    var seen = {};
    var loads = [];
    (opts.orders || []).forEach(function (o) {
      o.items.forEach(function (it) {
        if (it.photoId && !seen[it.photoId]) {
          seen[it.photoId] = true;
          loads.push(G.App.photos.get(it.photoId).then(function (p) {
            if (!p) return null;
            return loadImage(p.blob).then(function (img) { photoMap[p.id] = img; });
          }).catch(function () {}));
        }
      });
    });
    return Promise.all(loads).then(function () {
      opts.photos = photoMap;
      return generateReport(opts);
    }).then(function (blob) {
      var fileName = (opts.fileName || ('营业报告-' + U.todayKey() + '-' + Date.now().toString(36).toUpperCase())) + '.pdf';
      return G.App.pdf.save({
        label: opts.label || U.todayKey(),
        scope: opts.scope || 'daily',
        fileName: fileName,
        pdfBlob: blob
      }).then(function () { return { blob: blob, fileName: fileName }; });
    });
  }

  /* 预览 PDF（在新窗口打开 Blob URL） */
  function preview(blob) {
    var url = URL.createObjectURL(blob);
    var w = window.open(url, '_blank');
    if (!w) U.toast('浏览器拦截了弹窗，请允许弹窗后重试', 'err');
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
    return !!w;
  }

  G.PDF = {
    generate: generateReport,
    generateAndArchive: generateAndArchive,
    preview: preview,
    computeStats: computeStats,
    // 仅供测试
    __test_pdfFromJPEGPages: pdfFromJPEGPages
  };
})(window);

        row.querySelector('[data-act="inc-p"]').addEventListener('click', function () { c.pax = U.clamp((c.pax || 1) + 1, 1, 10); row.querySelector('#in-pax').value = c.pax; persist(); });
        var inP = row.querySelector('#in-pax');

    function persist() {

    function doCheckout() {

        }).catch(function (e) { U.toast('结账失败：' + e.message, 'err'); });

    function doHold() {
      var c = state.cart;

    function showResult(order, gotoTable) {

        '<div class="modal-mask"><div class="modal" style="max-width:420px;">' +

              '<div style="font-weight:900;font-size:20px;letter-spacing:1px;">' + U.escapeHTML(order.orderNo) + '</div>' +
              '<div style="color:var(--muted);font-size:13px;margin-top:4px;">' +
                (order.kind === 'takeaway' ? '外卖' : '桌 ' + order.table + ' 号') +
                '  ·  合计 RM ' + U.formatMoneyPlain(order.total) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="modal-foot">' +
            '<button class="btn btn-gray" data-act="print">打印小票</button>' +

    /* ---------------- 购物车渲染 ---------------- */
    function cartTotal() {
      var t = 0;
      (state.cart && state.cart.items || []).forEach(function (l) { t += +l.subtotal || 0; });
      return Math.round(t * 100) / 100;
    }

    function renderCart() {
      var c = checkout.querySelector('#ck-cart');
      if (!c || !state.cart) return;
      var items = state.cart.items || [];
      c.innerHTML = '';
      if (items.length === 0) {
        c.appendChild(U.el('div', { style: 'text-align:center;color:var(--faint);padding:24px 0;font-size:13px;' }, '还没选菜 ↑'));
        return;
      }
      items.forEach(function (line, idx) {
        var row = U.el('div', { class: 'ck-item' });
        var meta = [];
        if (line.specName) meta.push(line.specName);
        if (line.addons && line.addons.length) meta.push('+' + line.addons.map(function (a) { return a.name; }).join('/'));
        if (line.excludes && line.excludes.length) meta.push('-' + line.excludes.map(function (e) { return e.name; }).join('/'));
        row.innerHTML =
          '<div class="ck-i-main">' +
            '<div class="ck-i-name">' + U.escapeHTML(line.name) + '</div>' +
            '<div class="ck-i-meta">' + U.escapeHTML(meta.join(' · ')) + '</div>' +
          '</div>' +
          '<div class="qty-ctl">' +
            '<button data-act="dec">−</button>' +
            '<span class="q">' + line.qty + '</span>' +
            '<button data-act="inc">+</button>' +
          '</div>' +
          '<div class="ck-i-amt" style="margin-left:8px;">RM ' + U.formatMoneyPlain(line.subtotal) + '</div>';
        row.querySelector('[data-act="dec"]').addEventListener('click', function () {
          line.qty--;
          if (line.qty <= 0) items.splice(idx, 1);
          else recomputeLine(line);
          refreshTotals(); persist();
        });
        row.querySelector('[data-act="inc"]').addEventListener('click', function () {
          line.qty++; recomputeLine(line); refreshTotals(); persist();
        });
        c.appendChild(row);
      });
    }

    function recomputeLine(line) {
      var addonSum = 0;
      (line.addons || []).forEach(function (a) { addonSum += +a.price || 0; });
      line.unitPrice = (line._basePrice || 0) + addonSum;
      line.subtotal = Math.round(line.unitPrice * line.qty * 100) / 100;
    }

    function refreshTotals() {
      var total = cartTotal();
      var el = checkout.querySelector('#ck-total');
      if (el) el.textContent = 'RM ' + U.formatMoneyPlain(total);

    function loadMenu() {

        state.menuItems = res[0] || [];
        state.addons = res[1] || [];
        var seen = {}; state.catList = [{ id: '__ALL__', name: '全部' }];
        state.menuItems.forEach(function (m) {
          var k = m.category || '默认';
          if (!seen[k]) { seen[k] = true; state.catList.push({ id: k, name: k }); }

        renderDishes();

          if (m.photoId && !photoMap[m.photoId]) {
            G.App.photos.get(m.photoId).then(function (p) { if (p) photoMap[m.photoId] = p; }).catch(function () {});
          }
        });
      });
    }

    function renderCatBar() {
      catBar.innerHTML = '';
      state.catList.forEach(function (c) {
        var b = U.el('button', { class: 'cat-chip' + (c.id === state.category ? ' active' : '') }, c.name);
        b.addEventListener('click', function () { state.category = c.id; renderCatBar(); renderDishes(); });
        catBar.appendChild(b);
      });
    }

    function renderDishes() {
      scroll.innerHTML = '';
      var q = (state.search || '').trim().toLowerCase();
      var list = state.menuItems.filter(function (m) {
        if (m.available === false) return false;
        if (state.category !== '__ALL__' && (m.category || '默认') !== state.category) return false;
        if (q && !((m.name || '').toLowerCase().indexOf(q) >= 0)) return false;
        return true;
      });
      if (list.length === 0) {
        scroll.appendChild(U.el('div', { class: 'empty', style: 'padding:30px 0;' }, [
          U.el('div', { class: 'em' }, '🍽️'), U.el('p', null, '没有匹配的菜品')
        ]));
        return;
      }
      var grid = U.el('div', { class: 'dish-grid' });
      list.forEach(function (m) {
        var card = U.el('div', { class: 'dish-card' });
        var firstSpec = (m.specs && m.specs[0]) || { name: '标准', price: m.price || 0 };
        var ph = m.photoId ? photoMap[m.photoId] : null;
        var thumb = U.el('div', { class: 'dish-thumb' });
        if (ph) thumb.innerHTML = '<img src="' + URL.createObjectURL(ph.blob) + '" alt="">';
        else thumb.textContent = (m.name || '?').slice(0, 1);
        card.appendChild(thumb);
        var info = U.el('div', { class: 'dish-info' });
        info.innerHTML =
          '<div class="dish-name">' + U.escapeHTML(m.name) + '</div>' +
          '<div class="dish-price">RM ' + U.formatMoneyPlain(firstSpec.price) + '</div>' +
          (m.specs && m.specs.length > 1 ? '<div class="dish-spec-mini">' + m.specs.length + ' 种规格</div>' : '');
        card.appendChild(info);
        card.addEventListener('click', function () { openSpecModal(m); });
        grid.appendChild(card);
      });
      scroll.appendChild(grid);
    }

    function openSpecModal(menu) {
      if (!menu.specs || menu.specs.length === 0) {
        menu.specs = [{ id: U.uid(), name: '标准', price: +menu.price || 0 }];
      }
      var selSpec = menu.specs[0];
      var selAddons = [], selExcludes = [];
      var extras = state.addons.filter(function (a) { return a.kind === 'extra'; });
      var ings = state.addons.filter(function (a) { return a.kind === 'ingredient'; });

      var html =
        '<div class="modal-mask"><div class="modal" style="max-width:520px;">' +
          '<div class="modal-head"><h3>' + U.escapeHTML(menu.name) + '</h3><button class="icon-btn" data-act="x" aria-label="关闭">' +
            '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>' +
          '</button></div>' +
          '<div class="modal-body">' +
            (menu.photoId && photoMap[menu.photoId] ? '<div style="width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;margin-bottom:10px;background:linear-gradient(135deg,#FFF1E0,#FFE2C6);"><img src="' + URL.createObjectURL(photoMap[menu.photoId].blob) + '" style="width:100%;height:100%;object-fit:cover;"></div>' : '') +
            '<div class="field"><label>选择规格（必选）</label><div class="chip-wrap" id="spec-wrap">' +
              menu.specs.map(function (s, i) {
                return '<button class="chip' + (i === 0 ? ' on' : '') + '" data-spec="' + s.id + '">' + U.escapeHTML(s.name) + '  RM ' + U.formatMoneyPlain(s.price) + '</button>';
              }).join('') +
            '</div></div>' +
            '<div class="field"><label>小料 / 加料</label><div class="chip-wrap" id="add-wrap">' +
              (extras.length ? extras.map(function (a) {
                return '<button class="chip" data-addon="' + a.id + '">' + U.escapeHTML(a.name) + (a.price > 0 ? '  +RM ' + U.formatMoneyPlain(a.price) : '  免费') + '</button>';
              }).join('') : '<div style="color:var(--faint);font-size:13px;">未配置小料</div>') +
            '</div></div>' +
            '<div class="field"><label>不要的配料</label><div class="chip-wrap" id="exc-wrap">' +
              (ings.length ? ings.map(function (a) {
                return '<button class="chip" data-exc="' + a.id + '">不要 ' + U.escapeHTML(a.name) + '</button>';
              }).join('') : '<div style="color:var(--faint);font-size:13px;">未配置可去配料</div>') +
            '</div></div>' +
          '</div>' +
          '<div class="modal-foot">' +
            '<button class="btn btn-gray" data-act="cancel">取消</button>' +
            '<button class="btn" data-act="ok">加入订单</button>' +
          '</div>' +
        '</div></div>';
      var mask = U.openModal(html);
      var specW = mask.querySelector('#spec-wrap');
      specW.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-spec]'); if (!b) return;
        specW.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        selSpec = menu.specs.find(function (s) { return s.id === b.getAttribute('data-spec'); }) || selSpec;
      });
      var addW = mask.querySelector('#add-wrap');
      addW.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-addon]'); if (!b) return;
        var id = b.getAttribute('data-addon');
        var a = state.addons.find(function (x) { return x.id === id; }); if (!a) return;
        var i = selAddons.findIndex(function (x) { return x.id === id; });
        if (i >= 0) { selAddons.splice(i, 1); b.classList.remove('on'); }
        else { selAddons.push(a); b.classList.add('on'); }
      });
      var excW = mask.querySelector('#exc-wrap');
      excW.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-exc]'); if (!b) return;
        var id = b.getAttribute('data-exc');
        var a = state.addons.find(function (x) { return x.id === id; }); if (!a) return;
        var i = selExcludes.findIndex(function (x) { return x.id === id; });
        if (i >= 0) { selExcludes.splice(i, 1); b.classList.remove('x'); }
        else { selExcludes.push(a); b.classList.add('x'); }
      });
      mask.addEventListener('click', function (e) {
        if (e.target === mask || e.target.closest('[data-act="cancel"]') || e.target.closest('[data-act="x"]')) U.closeAllModals();
      });
      mask.querySelector('[data-act="ok"]').addEventListener('click', function () {
        if (!selSpec) { U.toast('请先选择规格', 'err'); return; }
        addToCart(menu, selSpec, selAddons, selExcludes);
        U.closeAllModals();
      });
    }

    function addToCart(menu, spec, addons, excludes) {
      var c = state.cart;
      if (!c.items) c.items = [];
      var key = menu.id + '|' + spec.id + '|' + (addons || []).map(function (a) { return a.id; }).sort().join(',') + '|' + (excludes || []).map(function (e) { return e.id; }).sort().join(',');
      var line = c.items.find(function (l) { return l._key === key; });
      if (line) { line.qty++; recomputeLine(line); }
      else {
        line = {
          _key: key, menuId: menu.id, name: menu.name, photoId: menu.photoId || '',
          specId: spec.id, specName: spec.name, _basePrice: +spec.price || 0,
          unitPrice: +spec.price || 0,
          addons: (addons || []).map(function (a) { return { id: a.id, name: a.name, price: a.price || 0 }; }),
          excludes: (excludes || []).map(function (e) { return { id: e.id, name: e.name }; }),
          qty: 1, subtotal: +spec.price || 0
        };
        recomputeLine(line);
        c.items.push(line);
      }
      if (c.status === 'idle') c.status = 'using';
      U.toast('已加入 ' + menu.name + (spec.name !== '标准' ? '(' + spec.name + ')' : ''));
      refreshTotals();
      persist();
    }

    /* ---------------- 绑定 ---------------- */
    head.querySelector('#btn-mode').addEventListener('click', openModePicker);
    head.querySelector('#btn-back-tables').addEventListener('click', function () { G.Router.go('#/tables'); });
    head.querySelector('#btn-clear-cart').addEventListener('click', function () {
      var c = state.cart;
      if (!c || !c.items || c.items.length === 0) return;
      U.confirm({ title: '清空本单？', message: '当前 ' + c.items.length + ' 项将被清空' }).then(function (ok) {
        if (!ok) return;
        var slot = c.slotId, kind = c.kind, tbl = c.table;
        // 整条记录删掉：留着空壳会占着工位，还白搭一个已分配的单号
        G.App.carts.clear(slot).then(function () {
          state.cart = G.App.carts.empty(slot, kind, tbl);
          return G.App.carts.acquireLock(slot);   // clear 会一并解锁，这里重新占位
        }).then(function () {
          paintMode(); buildCheckout(); refreshTotals();
        });
      });
    });
    searchBar.querySelector('#ord-search').addEventListener('input', U.debounce(function (e) {
      state.search = e.target.value || ''; renderDishes();
    }, 100));

    loadCart(function () { loadMenu(); });
  }

  G.Views = G.Views || {};
  G.Views.order = { render: render };
})(window);

(function (G) {

  function render(root) {
    var state = { date: U.todayKey(), pay: '__ALL__', q: '' };

    function refresh() {
      wrap.innerHTML = '';
      var head = U.el('div', { class: 'page-title' }, [
        U.el('div', null, [
          U.el('h1', null, '收银记录'),
          U.el('div', { class: 'sub' }, '按日期查看订单 · 可重打小票')

      inDate.addEventListener('change', function () { state.date = inDate.value || U.todayKey(); refresh(); });
      fr.appendChild(inDate);
      var sel = U.el('select', { class: 'select' });
      [['__ALL__', '全部支付方式'], ['CASH', 'CASH 现金'], ['Bank', 'Bank 银行转账'], ['Tng', 'Tng E-Wallet'], ['Boost', 'Boost Pay'], ['Shopee', 'Shopee Pay'], ['Grab', 'Grab Pay']]
        .forEach(function (p) { var o = U.el('option', { value: p[0] }, p[1]); if (p[0] === state.pay) o.setAttribute('selected', 'selected'); sel.appendChild(o); });
      sel.addEventListener('change', function () { state.pay = sel.value; refresh(); });
      fr.appendChild(sel);
      filt.appendChild(fr);
      var inQ = U.el('input', { class: 'input', placeholder: '搜订单号 / 桌号 / 菜品…', value: state.q });
      inQ.addEventListener('input', U.debounce(function (e) { state.q = e.target.value; renderList(); }, 120));
      filt.appendChild(inQ);
      wrap.appendChild(filt);

      var list = U.el('div', { id: 'cashier-list' });
      wrap.appendChild(list);

      renderList();
    }

    function renderList() {
      var list = wrap.querySelector('#cashier-list');
      list.innerHTML = '';
      G.App.orders.list({ date: state.date }).then(function (orders) {
        // 过滤支付方式
        if (state.pay !== '__ALL__') orders = orders.filter(function (o) { return o.payMethod.indexOf(state.pay) === 0; });
        var q = (state.q || '').trim().toLowerCase();
        if (q) {
          orders = orders.filter(function (o) {
            if ((o.orderNo || '').toLowerCase().indexOf(q) >= 0) return true;
            if (String(o.table).indexOf(q) >= 0) return true;
            if (o.items.some(function (it) { return (it.name || '').toLowerCase().indexOf(q) >= 0; })) return true;
            return false;
          });
        }
        if (orders.length === 0) {
          list.appendChild(U.el('div', { class: 'card' }, [
            U.el('div', { class: 'empty' }, [
              U.el('div', { class: 'em' }, '🧾'),
              U.el('p', null, '该日期暂无收银记录')
            ])
          ]));
          return;
        }
        // 汇总
        var total = 0, n = orders.length;
        orders.forEach(function (o) { total += +o.total || 0; });
        total = Math.round(total * 100) / 100;
        var sum = U.el('div', { class: 'card', style: 'background:var(--grad);color:#fff;display:flex;justify-content:space-between;align-items:center;border:none;' });
        sum.innerHTML =

/* ============ 63-views-ledger.js ============ */
/* 63-views-ledger.js · 收支记账 */
(function (G) {
  'use strict';
  var U = G.U;

  var EXP_CATS = ['食材采购', '水电燃气', '房租', '人工', '物料', '维修', '其他支出'];
  var INC_CATS = ['其他收入', '政府补贴', '退款收回', '营业外'];

  function render(root) {
    var state = { date: U.todayKey(), type: '__ALL__' };
    var wrap = U.el('div', { class: 'page page-scroll' });

    function refresh() {
      wrap.innerHTML = '';
      var head = U.el('div', { class: 'page-title' }, [
        U.el('div', null, [
          U.el('h1', null, '收支记账'),
          U.el('div', { class: 'sub' }, '记录营业外收入与日常支出')
        ]),
        U.el('div', null, [
          U.el('button', { class: 'btn', onclick: openAdd.bind(null, 'income') }, '+ 收入'),
          U.el('button', { class: 'btn btn-ghost', style: 'margin-left:6px;', onclick: openAdd.bind(null, 'expense') }, '+ 支出')
        ])
      ]);
      wrap.appendChild(head);

      // 过滤
      var filt = U.el('div', { class: 'card' });
      var r = U.el('div', { style: 'display:grid;grid-template-columns:1fr 1fr;gap:10px;' });
      var inDate = U.el('input', { class: 'input', type: 'date', value: state.date });
      inDate.addEventListener('change', function () { state.date = inDate.value || U.todayKey(); renderList(); });
      r.appendChild(inDate);
      var seg = U.el('div', { class: 'seg' });
      [['__ALL__', '全部'], ['income', '收入'], ['expense', '支出']].forEach(function (p) {
        var b = U.el('button', { class: state.type === p[0] ? 'active' : '' }, p[1]);
        b.addEventListener('click', function () { state.type = p[0]; refresh(); });
        seg.appendChild(b);
      });
      r.appendChild(seg);
      filt.appendChild(r);
      wrap.appendChild(filt);

      // 汇总
      var sum = U.el('div', { class: 'stat-grid' });
      wrap.appendChild(sum);

      var list = U.el('div');
      wrap.appendChild(list);
      renderList();

      function renderList() {
        sum.innerHTML = '';
        G.App.ledger.list({ date: state.date }).then(function (rows) {
          var inc = 0, exp = 0, incN = 0, expN = 0;
          rows.forEach(function (r) { if (r.type === 'income') { inc += +r.amount || 0; incN++; } else { exp += +r.amount || 0; expN++; } });
          sum.appendChild(makeStat('今日收入', 'RM ' + U.formatMoneyPlain(inc), '#0F9D58', incN + ' 笔'));
          sum.appendChild(makeStat('今日支出', 'RM ' + U.formatMoneyPlain(exp), '#DC2626', expN + ' 笔'));
          sum.appendChild(makeStat('今日净流', 'RM ' + U.formatMoneyPlain(inc - exp), (inc - exp) >= 0 ? '#0F9D58' : '#DC2626'));
          sum.appendChild(makeStat('合计笔数', (incN + expN) + ' 笔', '#1F2937'));

          list.innerHTML = '';
          var filtered = rows.slice();
          if (state.type !== '__ALL__') filtered = filtered.filter(function (r) { return r.type === state.type; });
          if (filtered.length === 0) {
            list.appendChild(U.el('div', { class: 'card' }, [
              U.el('div', { class: 'empty' }, [
                U.el('div', { class: 'em' }, '💰'),
                U.el('p', null, '该日期暂无记录')
              ])
            ]));
            return;
          }
          var card = U.el('div', { class: 'card' });
          filtered.forEach(function (it) {
            var row = U.el('div', { class: 'row' });
            row.innerHTML =
              '<div class="grow">' +
                '<div class="t">' + U.escapeHTML(it.category || '其他') + '  <span class="tag ' + (it.type === 'income' ? 'ok' : 'danger') + '">' + (it.type === 'income' ? '收入' : '支出') + '</span></div>' +
                '<div class="s">' + (it.createTime || '').slice(0, 16).replace('T', ' ') + (it.note ? '  ·  ' + U.escapeHTML(it.note) : '') + '</div>' +
              '</div>' +
              '<div class="amt ' + (it.type === 'income' ? 'amount-in' : 'amount-out') + '">' + (it.type === 'income' ? '+' : '-') + ' RM ' + U.formatMoneyPlain(it.amount) + '</div>';
            var btn = U.el('button', { class: 'icon-btn', html: '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>' });
            btn.addEventListener('click', function () {
              U.confirm({ title: '删除该记录？', message: '将永久删除此条流水', danger: true }).then(function (ok) {
                if (!ok) return;
                G.App.ledger.del(it.id).then(function () { renderList(); });
              });
            });
            row.appendChild(btn);
            card.appendChild(row);
          });
          list.appendChild(card);
        });
      }
    }

    function makeStat(k, v, c, sub) {
      var n = U.el('div', { class: 'stat' });
      n.innerHTML = '<div class="k">' + U.escapeHTML(k) + '</div><div class="v" style="color:' + c + ';">' + v + '</div>' + (sub ? '<div style="font-size:12px;color:var(--muted);margin-top:3px;">' + sub + '</div>' : '');
      return n;
    }

    function openAdd(type) {
      var cats = type === 'income' ? INC_CATS : EXP_CATS;
      var html =
        '<div class="modal-mask"><div class="modal" style="max-width:480px;">' +
          '<div class="modal-head"><h3>记一笔' + (type === 'income' ? '收入' : '支出') + '</h3><button class="icon-btn" data-act="x" aria-label="关闭">' +
            '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>' +
          '</button></div>' +
          '<div class="modal-body">' +
            '<div class="field"><label>日期</label><input class="input" type="date" id="ld-date" value="' + U.todayKey() + '"></div>' +
            '<div class="field"><label>分类</label><select class="select" id="ld-cat">' + cats.map(function (c) { return '<option>' + U.escapeHTML(c) + '</option>'; }).join('') + '</select></div>' +
            '<div class="field"><label>金额（RM）</label><input class="input input-money" type="number" step="0.01" min="0" id="ld-amt" placeholder="0.00"></div>' +
            '<div class="field"><label>备注（可选）</label><textarea class="textarea" id="ld-note" rows="2" placeholder="例如：水电 7 月"></textarea></div>' +
          '</div>' +
          '<div class="modal-foot">' +
            '<button class="btn btn-gray" data-act="cancel">取消</button>' +
            '<button class="btn" data-act="ok">保存</button>' +
          '</div>' +
        '</div></div>';
      var m = U.openModal(html);
      setTimeout(function () { m.querySelector('#ld-amt').focus(); }, 60);
      m.addEventListener('click', function (e) {
        if (e.target.closest('[data-act="cancel"]') || e.target.closest('[data-act="x"]')) U.closeAllModals();
        if (e.target.closest('[data-act="ok"]')) {
          var date = m.querySelector('#ld-date').value || U.todayKey();
          var cat = m.querySelector('#ld-cat').value;
          var amt = +m.querySelector('#ld-amt').value || 0;
          var note = m.querySelector('#ld-note').value || '';
          if (amt <= 0) { U.toast('请输入金额', 'err'); return; }
          G.App.ledger.save({ type: type, date: date, category: cat, amount: amt, note: note }).then(function () {
            U.closeAllModals();
            refresh();
            U.toast('已保存', 'ok');
          });
        }
      });
    }

    root.appendChild(wrap);
    refresh();
  }

  G.Views = G.Views || {};
  G.Views.ledger = { render: render };
})(window);

/* 64-views-calendar.js · 日历回看 */
(function (G) {
  'use strict';
  var U = G.U;

  function render(root) {
    var state = { cur: new Date(), sel: U.todayKey() };
    var wrap = U.el('div', { class: 'page page-scroll' });

    function refresh() {
      wrap.innerHTML = '';
      var head = U.el('div', { class: 'page-title' }, [
        U.el('div', null, [
          U.el('h1', null, '日历回看'),
          U.el('div', { class: 'sub' }, '点选日期查看当日订单与流水')
        ])
      ]);
      wrap.appendChild(head);

      var card = U.el('div', { class: 'card' });
      var chead = U.el('div', { class: 'cal-head' });
      var prev = U.el('button', { class: 'icon-btn', html: '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' });
      var next = U.el('button', { class: 'icon-btn', html: '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' });
      var title = U.el('b', null, '');
      var todayBtn = U.el('button', { class: 'btn btn-soft btn-sm' }, '今天');
      chead.appendChild(prev); chead.appendChild(title); chead.appendChild(next);
      chead.appendChild(todayBtn);
      card.appendChild(chead);

      var grid = U.el('div', { class: 'cal-grid' });
      ['日', '一', '二', '三', '四', '五', '六'].forEach(function (d) {
        grid.appendChild(U.el('div', { class: 'cal-dow' }, d));
      });
      var body = U.el('div', { style: 'display:contents;' });
      grid.appendChild(body);
      card.appendChild(grid);
      wrap.appendChild(card);

      // 数据：取当月涉及的订单/流水 → 标记 dot
      G.App.orders.list({ from: monthFirst(state.cur), to: monthLast(state.cur) }).then(function (orders) {
        var daysWith = {};
        orders.forEach(function (o) { daysWith[o.date] = (daysWith[o.date] || 0) + 1; });
        drawCal(body, daysWith);
      });

      prev.addEventListener('click', function () { state.cur = new Date(state.cur.getFullYear(), state.cur.getMonth() - 1, 1); refresh(); });
      next.addEventListener('click', function () { state.cur = new Date(state.cur.getFullYear(), state.cur.getMonth() + 1, 1); refresh(); });
      todayBtn.addEventListener('click', function () { state.cur = new Date(); state.sel = U.todayKey(); refresh(); renderDetail(); });

      title.textContent = state.cur.getFullYear() + ' 年 ' + (state.cur.getMonth() + 1) + ' 月';

      // 当日详情
      var detail = U.el('div', { id: 'cal-detail' });
      wrap.appendChild(detail);
      renderDetail();
    }

    function monthFirst(d) { return U.todayKey(new Date(d.getFullYear(), d.getMonth(), 1)); }
    function monthLast(d) { return U.todayKey(new Date(d.getFullYear(), d.getMonth() + 1, 0)); }

    function drawCal(body, daysWith) {
      body.innerHTML = '';
      var y = state.cur.getFullYear(), m = state.cur.getMonth();
      var first = new Date(y, m, 1);
      var lead = first.getDay();
      var last = new Date(y, m + 1, 0).getDate();
      var todayK = U.todayKey();
      for (var i = 0; i < lead; i++) body.appendChild(U.el('div', { class: 'cal-cell blank' }));
      for (var d = 1; d <= last; d++) {
        var dk = y + '-' + (m < 9 ? '0' : '') + (m + 1) + '-' + (d < 10 ? '0' : '') + d;
        var cell = U.el('div', { class: 'cal-cell' + (dk === todayK ? ' today' : '') + (daysWith[dk] ? ' has-data' : '') + (dk === state.sel ? ' sel' : '') });
        cell.appendChild(document.createTextNode(d));
        if (daysWith[dk]) cell.appendChild(U.el('div', { class: 'cal-dot' }));
        cell.addEventListener('click', function () { state.sel = dk; refresh(); });
        body.appendChild(cell);
      }
    }

    function renderDetail() {
      var d = wrap.querySelector('#cal-detail');
      if (!d) return;
      d.innerHTML = '';
      var dt = U.parseKey(state.sel);
      var title = U.el('div', { class: 'page-title' }, [
        U.el('div', null, [
          U.el('h1', { style: 'font-size:18px;' }, state.sel),
          U.el('div', { class: 'sub' }, U.weekdayCN[dt.getDay()])
        ])
      ]);
      d.appendChild(title);

      // 导出 PDF
      var ops = U.el('div', { class: 'card', style: 'display:flex;gap:8px;flex-wrap:wrap;align-items:center;' });
      var label = U.el('div', { style: 'flex:1 1 auto;font-size:14px;font-weight:700;' }, '导出该日营业 PDF 报告');
      var btnPDF = U.el('button', { class: 'btn' }, '生成并归档 PDF');
      btnPDF.addEventListener('click', function () {
        btnPDF.disabled = true; btnPDF.textContent = '生成中…';
        Promise.all([G.App.orders.list({ date: state.sel }), G.App.ledger.list({ date: state.sel })]).then(function (res) {
          return G.PDF.generateAndArchive({
            orders: res[0] || [], ledger: res[1] || [],
            label: state.sel, scope: 'daily',
            fileName: '营业报告-' + state.sel,
            title: '营业报告', subtitle: state.sel + ' ' + U.weekdayCN[dt.getDay()]
          });
        }).then(function (r) {
          btnPDF.disabled = false; btnPDF.textContent = '生成并归档 PDF';
          U.toast('已归档：' + r.fileName, 'ok');
          // 同时下载一份
          G.PDF.preview(r.blob);
        }).catch(function (e) { btnPDF.disabled = false; btnPDF.textContent = '生成并归档 PDF'; U.toast('生成失败：' + e.message, 'err'); });
      });
      ops.appendChild(label);
      ops.appendChild(btnPDF);
      d.appendChild(ops);

      // 订单
      var oc = U.el('div', { class: 'card' });
      oc.innerHTML = '<div class="card-title">当日订单</div>';
      G.App.orders.list({ date: state.sel }).then(function (orders) {
        var total = 0; orders.forEach(function (o) { total += +o.total || 0; });
        var sum = U.el('div', { style: 'display:flex;justify-content:space-between;align-items:center;background:var(--grad);color:#fff;padding:10px 12px;border-radius:12px;margin-bottom:8px;' });
        sum.innerHTML = '<span style="font-size:12px;opacity:.92;font-weight:600;">合计</span><b style="font-size:18px;">' + orders.length + ' 单  ·  RM ' + U.formatMoneyPlain(total) + '</b>';
        oc.appendChild(sum);
        if (orders.length === 0) {
          oc.appendChild(U.el('div', { class: 'empty', style: 'padding:20px 0;' }, [
            U.el('div', { class: 'em' }, '📭'),
            U.el('p', null, '该日无订单')
          ]));
        } else {
          orders.forEach(function (o) {
            var row = U.el('div', { class: 'row' });
            row.innerHTML =
              '<div class="grow">' +
                '<div class="t" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">' +
                  '<span class="order-no">' + U.escapeHTML(o.orderNo || '-') + '</span>' +
                  '<span>' + (o.kind === 'takeaway' ? '外卖' : ('桌 ' + o.table + ' 号  ·  ' + o.pax + ' 人')) + '</span>' +
                '</div>' +
                '<div class="s">' + (o.createTime || '').slice(11, 16) + '  ·  ' + U.escapeHTML(o.payMethod) + '  ·  ' + o.items.length + ' 项</div>' +
              '</div>' +
              '<div class="amt amount-in">RM ' + U.formatMoneyPlain(o.total) + '</div>';
            oc.appendChild(row);
          });
        }
        d.appendChild(oc);
      });

      // 流水
      var lc = U.el('div', { class: 'card' });
      lc.innerHTML = '<div class="card-title">当日流水</div>';
      G.App.ledger.list({ date: state.sel }).then(function (rows) {
        if (rows.length === 0) {
          lc.appendChild(U.el('div', { class: 'empty', style: 'padding:14px 0;' }, [U.el('p', null, '该日无流水')]));
        } else {
          rows.forEach(function (it) {
            var row = U.el('div', { class: 'row' });
            row.innerHTML =
              '<div class="grow">' +
                '<div class="t">' + U.escapeHTML(it.category) + '  <span class="tag ' + (it.type === 'income' ? 'ok' : 'danger') + '">' + (it.type === 'income' ? '收入' : '支出') + '</span></div>' +
                (it.note ? '<div class="s">' + U.escapeHTML(it.note) + '</div>' : '') +
              '</div>' +
              '<div class="amt ' + (it.type === 'income' ? 'amount-in' : 'amount-out') + '">' + (it.type === 'income' ? '+' : '-') + ' RM ' + U.formatMoneyPlain(it.amount) + '</div>';
            lc.appendChild(row);
          });
        }
        d.appendChild(lc);
      });
    }

    root.appendChild(wrap);
    refresh();
  }

  G.Views = G.Views || {};
  G.Views.calendar = { render: render };
})(window);

    function renderPDF() {
      var c1 = U.el('div', { class: 'card' });
      c1.innerHTML = '<div class="card-title">批量生成 PDF 报告</div>';
      var p1 = U.el('div', { style: 'font-size:13px;color:var(--muted);margin-bottom:10px;' }, '按月生成营业报告（已归档到本地数据库，可随时预览/下载）');
      c1.appendChild(p1);
      var row = U.el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;align-items:center;' });
      var inMonth = U.el('input', { class: 'input', type: 'month', value: U.todayKey().slice(0, 7), style: 'max-width:170px;' });
      var btn = U.el('button', { class: 'btn' }, '生成本月 PDF 并归档');
      btn.addEventListener('click', function () {
