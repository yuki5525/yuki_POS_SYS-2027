      foot.appendChild(tip);
      checkout.appendChild(foot);

      // 事件
      if (c.kind !== 'takeaway') {
        var maxT = +G.App.cfg.get('tableCount') || 50;
        row.querySelector('[data-act="dec-t"]').addEventListener('click', function () {
          c.table = U.clamp((c.table || 1) - 1, 1, maxT);
          // 换桌 = 换 slot
          switchSlot(G.App.carts.tableSlotId(c.table));
        });
        row.querySelector('[data-act="inc-t"]').addEventListener('click', function () {
          c.table = U.clamp((c.table || 1) + 1, 1, maxT);
          switchSlot(G.App.carts.tableSlotId(c.table));
        });
        var inT = row.querySelector('#in-table');
        inT.addEventListener('change', function () {
          c.table = U.clamp(+inT.value || 1, 1, maxT);
          switchSlot(G.App.carts.tableSlotId(c.table));
        });
        row.querySelector('[data-act="dec-p"]').addEventListener('click', function () { c.pax = U.clamp((c.pax || 1) - 1, 1, 10); row.querySelector('#in-pax').value = c.pax; persist(); });
        row.querySelector('[data-act="inc-p"]').addEventListener('click', function () { c.pax = U.clamp((c.pax || 1) + 1, 1, 10); row.querySelector('#in-pax').value = c.pax; persist(); });
        var inP = row.querySelector('#in-pax');
        inP.addEventListener('change', function () { c.pax = U.clamp(+inP.value || 1, 1, 10); inP.value = c.pax; persist(); });
      }
      sel.addEventListener('change', function () { c.payMethod = sel.value; persist(); });
      btnSubmit.addEventListener('click', function () { doCheckout(); });
      btnHold.addEventListener('click', function () { doHold(); });
    }

    function persist() {
      if (!state.cart) return;
      G.App.carts.save(state.cart).catch(function () {});
    }

    /* 点餐页直接收款：跟结账页共用同一个收款计算器（PayCalc），
       收银员要录实收、看找零，不能只弹个"确认吗"。 */
    function doCheckout() {
      var c = state.cart;
      if (!c || !c.items || c.items.length === 0) { U.toast('购物车为空', 'err'); return; }
      var due = Math.round(cartTotal() * 100) / 100;    // 抹平浮点误差，跟 Flow 里口径一致
      G.PayCalc.prompt({
        title: '收款',
        subtitle: (c.kind === 'takeaway' ? '📦 外带订单' : ('堂食 · 桌 ' + c.table + ' 号')) +
                  '  ·  共 ' + c.items.length + ' 项  ·  ' + U.escapeHTML(c.payMethod || 'CASH'),
        due: due,
        // 电子支付不用敲实收，组件会按应付自动填好，点确认就能走
        payMethod: c.payMethod || 'CASH',
        okText: '确认收款'
      }).then(function (r) {
        if (!r) return;                       // 取消
        G.Flow.checkout(c, { paid: r.paid, print: false }).then(function (order) {
          U.toast('已收款：' + order.orderNo, 'ok');
          showResult(order, true);
        }).catch(function (e) { U.toast('结账失败：' + e.message, 'err'); });
      });
    }

    function doHold() {
      var c = state.cart;
      if (!c || !c.items || c.items.length === 0) { U.toast('购物车为空', 'err'); return; }
      G.Flow.placeOrder(c).then(function (no) {
        U.toast('已下单待付款 · ' + no, 'ok');
        G.Router.go('#/tables');
      }).catch(function (e) { U.toast(e.message, 'err'); });
    }

    function showResult(order, gotoTable) {
      var html =
        '<div class="modal-mask"><div class="modal" style="max-width:420px;">' +
          '<div class="modal-head"><h3>收款成功</h3></div>' +
          '<div class="modal-body">' +
            '<div style="text-align:center;padding:8px 0;">' +
              '<div style="font-size:36px;margin-bottom:6px;">✅</div>' +
              '<div style="font-weight:900;font-size:20px;letter-spacing:1px;">' + U.escapeHTML(order.orderNo) + '</div>' +
              '<div style="color:var(--muted);font-size:13px;margin-top:4px;">' +
                (order.kind === 'takeaway' ? '外带' : '桌 ' + order.table + ' 号') +
                '  ·  合计 RM ' + U.formatMoneyPlain(order.total) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="modal-foot">' +
            '<button class="btn btn-gray" data-act="print">打印小票</button>' +
            '<button class="btn" data-act="done">返回台桌</button>' +
          '</div>' +
        '</div></div>';
      var m = U.openModal(html);
      m.addEventListener('click', function (e) {
        if (e.target.closest('[data-act="print"]')) {
          G.Print.print(order).catch(function (err) { U.toast('打印失败：' + err.message, 'err'); });
        } else if (e.target.closest('[data-act="done"]')) {
          U.closeAllModals();
          if (gotoTable) G.Router.go('#/tables');
        }
      });
    }

    /* ---------------- 购物车渲染 ---------------- */
    function cartTotal() {
      var t = 0;
      (state.cart && state.cart.items || []).forEach(function (l) { t += +l.subtotal || 0; });
      return Math.round(t * 100) / 100;
    }

    function renderCart() {
      var c = checkout.querySelector('#ck-cart');
      if (!c || !state.cart) return;
      var items = state.cart.items || [];
      c.innerHTML = '';
      if (items.length === 0) {
        c.appendChild(U.el('div', { style: 'text-align:center;color:var(--faint);padding:24px 0;font-size:13px;' }, '还没选菜 ↑'));
        return;
      }
      items.forEach(function (line, idx) {
        var row = U.el('div', { class: 'ck-item' });
        var meta = [];
        if (line.specName) meta.push(line.specName);
        if (line.stapleName) {
          meta.push('主食:' + line.stapleName + (+line.staplePriceAdd > 0 ? ' +' + U.formatMoneyPlain(line.staplePriceAdd) : ''));
        }
        if (line.addons && line.addons.length) meta.push('+' + line.addons.map(function (a) { return a.name; }).join('/'));
        if (line.excludes && line.excludes.length) meta.push('-' + line.excludes.map(function (e) { return e.name; }).join('/'));
        row.innerHTML =
          '<div class="ck-i-main">' +
            '<div class="ck-i-name">' + U.escapeHTML(line.name) + '</div>' +
            '<div class="ck-i-meta">' + U.escapeHTML(meta.join(' · ')) + '</div>' +
          '</div>' +
          '<div class="qty-ctl">' +
            '<button data-act="dec">−</button>' +
            '<span class="q">' + line.qty + '</span>' +
            '<button data-act="inc">+</button>' +
          '</div>' +
          '<div class="ck-i-amt" style="margin-left:8px;">RM ' + U.formatMoneyPlain(line.subtotal) + '</div>';
        row.querySelector('[data-act="dec"]').addEventListener('click', function () {
          line.qty--;
          if (line.qty <= 0) items.splice(idx, 1);
          else recomputeLine(line);
          refreshTotals(); persist();
        });
        row.querySelector('[data-act="inc"]').addEventListener('click', function () {
          line.qty++; recomputeLine(line); refreshTotals(); persist();
        });
        c.appendChild(row);
      });
    }

    function recomputeLine(line) {
      var addonSum = 0;
      (line.addons || []).forEach(function (a) { addonSum += +a.price || 0; });
      // 旧购物车行没有 staplePriceAdd，+undefined || 0 得 0，金额不变
      line.unitPrice = (line._basePrice || 0) + (+line.staplePriceAdd || 0) + addonSum;
      line.subtotal = Math.round(line.unitPrice * line.qty * 100) / 100;
    }

    function refreshTotals() {
      var total = cartTotal();
      var el = checkout.querySelector('#ck-total');
      if (el) el.textContent = 'RM ' + U.formatMoneyPlain(total);
      paintMode();
      renderCart();
    }

    /* ---------------- 菜单 ---------------- */
    function loadMenu() {
      /* 顶栏切了营业模式，这里要跟着重画。
         只订阅一次（biz 模块里新的订阅会顶掉旧的），页面重新渲染时覆盖即可。 */
      if (G.App.biz) G.App.biz.onChange('view', function () { renderDishes(); });

      Promise.all([G.App.menu.list(), G.App.addons.list(), G.Cats.loadTree()]).then(function (res) {
        state.menuItems = res[0] || [];
        state.addons = res[1] || [];
        state.tree = G.Cats.prune(res[2] || []);
        pickBranch();
        renderCatBar();
        renderDishes();
        state.menuItems.forEach(function (m) {
          if (m.photoId && !photoMap[m.photoId]) {
            G.App.photos.get(m.photoId).then(function (p) { if (p) photoMap[m.photoId] = p; }).catch(function () {});
          }
        });
      });
    }

    /* ---------------- 四层分类标签 ----------------
       裁剪规则统一走 G.Cats.prune：停用的分支、整组菜品都下架的分支，
       在点餐页整条隐藏，不留空标签。
       每一层都可以停在「全部」上看整组的菜 —— 不强制一路点到最深一层。 */
    function onSale(m) { return G.Cats.onSale(m); }

    /* 营业模式过滤：菜上标了 businessTags 就只在那些档出现；
       一个都没标 = 全时段都卖（漏标是「照常卖」，不是「消失了」）。
       顶栏切档后 biz.onChange 会回调 renderDishes()，这里立刻跟着变。 */
    function inBiz(m) {
      return G.App.biz ? G.App.biz.inMode(m, G.App.biz.mode()) : true;
    }

    function findCat(id) {
      if (id === ALL) return null;
      return state.tree.filter(function (c) { return c.cat.categoryId === id; })[0] || null;
    }
    function findSub(c, id) {
      if (id === ALL || !c) return null;
      return c.subs.filter(function (s) { return s.sub.subId === id; })[0] || null;
    }
    function findThird(s, id) {
      if (id === ALL || !s) return null;
      return s.thirds.filter(function (t) { return t.third.thirdId === id; })[0] || null;
    }
    function findFourth(t, id) {
      if (id === ALL || !t) return null;
      return (t.fourths || []).filter(function (f) { return f.fourth.fourthId === id; })[0] || null;
    }

    /* 某一层往下的所有菜：本层直属的 + 更深层级挂的，用于「全部」 */
    function dishesUnderCat(c) {
      var out = (c.dishes || []).slice();
      c.subs.forEach(function (s) { out = out.concat(dishesUnderSub(s)); });
      return out;
    }
    function dishesUnderSub(s) {
      var out = (s.dishes || []).slice();
      s.thirds.forEach(function (t) { out = out.concat(dishesUnderThird(t)); });
      return out;
    }
    function dishesUnderThird(t) {
      var out = (t.dishes || []).slice();
      (t.fourths || []).forEach(function (f) { out = out.concat(f.dishes || []); });
      return out;
    }

    /* 选中项失效时（改分类 / 停用 / 删掉）退回「全部」，绝不替用户硬选一个 */
    /* 选中项失效（改分类 / 停用 / 删掉）时退回「全部」，绝不替用户硬选一个。
       例外：这一层只剩一个可选项时自动选上 —— 没得选就无所谓"替用户决定"，
       顺带把下一层标签展开出来。用户自己点过「全部」的层不会被改写。
       第四级不自动选：它是可选项，默认停在「全部」才会把三级直属的菜也带出来。 */
    function pickBranch() {
      if (state.selCat !== ALL && !findCat(state.selCat)) state.selCat = ALL;
      if (state.selCat === ALL && state.tree.length === 1) state.selCat = state.tree[0].cat.categoryId;
      var c = findCat(state.selCat);
      if (!c) { state.selSub = ALL; state.selThird = ALL; state.selFourth = ALL; return; }

      if (state.selSub !== ALL && !findSub(c, state.selSub)) state.selSub = ALL;
      if (state.selSub === ALL && c.subs.length === 1) state.selSub = c.subs[0].sub.subId;
      var s = findSub(c, state.selSub);
      if (!s) { state.selThird = ALL; state.selFourth = ALL; return; }

      if (state.selThird !== ALL && !findThird(s, state.selThird)) state.selThird = ALL;
      if (state.selThird === ALL && s.thirds.length === 1) state.selThird = s.thirds[0].third.thirdId;
      var t = findThird(s, state.selThird);
      if (!t) { state.selFourth = ALL; return; }

      if (state.selFourth !== ALL && !findFourth(t, state.selFourth)) state.selFourth = ALL;
    }

    /* 当前选中的分组：返回这一组要显示的菜（已按上架过滤） */
    function pickDishes() {
      var c = findCat(state.selCat);
      if (!c) {
        // 一级就是「全部」或没选：整棵树
        var all = [];
        state.tree.forEach(function (x) { all = all.concat(dishesUnderCat(x)); });
        return all;
      }
      var s = findSub(c, state.selSub);
      if (!s) return dishesUnderCat(c);
      var t = findThird(s, state.selThird);
      if (!t) return dishesUnderSub(s);
      var f = findFourth(t, state.selFourth);
      if (!f) return dishesUnderThird(t);
      return (f.dishes || []).slice();
    }

    /* 单个标签 */
    function chip(label, on, onClick) {
      var b = U.el('button', { class: 'cat-chip' + (on ? ' active' : '') }, label);
      b.addEventListener('click', onClick);
      return b;
    }
    /* 一层标签；选项多于 1 个时才给「全部」，点它等于看这一层下面所有菜 */
    function tabRow(level, items, sel, onPick) {
      var row = U.el('div', { class: 'tab-row lv' + level });
      /* 什么时候给「全部」这一格：
         多个可选项时必须有；当前正停在「全部」时要保留高亮；
         第四级哪怕只有一项也要给 —— 选进去之后还得有退路回到上一层的全部菜。 */
      if (items.length > 1 || sel === ALL || level === 4) {
        row.appendChild(chip('全部', sel === ALL, function () { onPick(ALL); }));
      }
      items.forEach(function (it) {
        row.appendChild(chip(it.name, it.id === sel, function () { onPick(it.id); }));
      });
      return row;
    }

    function renderCatBar() {
      catBar.innerHTML = '';
      if (!state.tree.length) return;      // 没有可用分支：菜品区会给出提示
      catBar.appendChild(tabRow(1, state.tree.map(function (c) {
        return { id: c.cat.categoryId, name: c.cat.name };
      }), state.selCat, function (id) {
        state.selCat = id; state.selSub = ALL; state.selThird = ALL; state.selFourth = ALL;
        pickBranch(); renderCatBar(); renderDishes();
      }));

      var c = findCat(state.selCat);
      if (!c) return;
      catBar.appendChild(tabRow(2, c.subs.map(function (s) {
        return { id: s.sub.subId, name: s.sub.name };
      }), state.selSub, function (id) {
        state.selSub = id; state.selThird = ALL; state.selFourth = ALL;
        pickBranch(); renderCatBar(); renderDishes();
      }));

      var s = findSub(c, state.selSub);
      if (!s) return;
      catBar.appendChild(tabRow(3, s.thirds.map(function (t) {
        return { id: t.third.thirdId, name: t.third.name };
      }), state.selThird, function (id) {
        state.selThird = id; state.selFourth = ALL;
        pickBranch(); renderCatBar(); renderDishes();
      }));

      var t = findThird(s, state.selThird);
      if (!t) return;
      var fs = t.fourths || [];
      if (!fs.length) return;              // 该三级下没建四级：菜直接挂在三级上
      catBar.appendChild(tabRow(4, fs.map(function (f) {
        return { id: f.fourth.fourthId, name: f.fourth.name };
      }), state.selFourth, function (id) {
        state.selFourth = id;
        pickBranch(); renderCatBar(); renderDishes();
      }));
    }

    function renderDishes() {
      scroll.innerHTML = '';
      var q = (state.search || '').trim().toLowerCase();
      var list;
      if (q) {
        // 搜索：跨全部分类找菜名
        list = state.menuItems.filter(function (m) {
          return onSale(m) && inBiz(m) && (m.name || '').toLowerCase().indexOf(q) >= 0;
        });
      } else {
        list = pickDishes().filter(function (m) { return onSale(m) && inBiz(m); });
      }
      /* 空列表要分三种情况说清楚：没建分类、当前档真没菜、纯粹搜不到。
         「当前档没菜」最容易让人以为系统坏了，所以单独给一句能照做的提示。 */
      if (list.length === 0) {
        var bizMode = G.App.biz ? G.App.biz.mode() : '';
        var msg = !state.tree.length
                ? '还没可用的分类与上架菜品，请到菜单管理先建分类、加菜'
                : (bizMode ? '「' + bizMode + '」时段没有可点的菜 —— 到菜单管理给菜打上「' + bizMode + '」标签，或在顶栏切到别的档'
                           : '没有匹配的菜品');
        scroll.appendChild(U.el('div', { class: 'empty', style: 'padding:30px 0;' }, [
          U.el('div', { class: 'em' }, '🍽️'), U.el('p', null, msg)
        ]));
        return;
      }
      var grid = U.el('div', { class: 'dish-grid' });
      list.forEach(function (m) {
        /* 沽清（sellOut）跟「下架」是两回事：
             下架 = 菜单里整个不出现（onSale 管）
             沽清 = 今天卖完了，菜还在列表里，但要置灰、点不动
           置灰而不是隐藏，是因为沽清是临时的 —— 一小时后货到了还得马上点回来。 */
        var sold = !!m.sellOut;
        var card = U.el('div', { class: 'dish-card' + (sold ? ' is-soldout' : '') });
        var firstSpec = (m.specs && m.specs[0]) || { name: '标准', price: m.price || 0 };
        var ph = m.photoId ? photoMap[m.photoId] : null;
        var thumb = U.el('div', { class: 'dish-thumb' });
        if (ph) thumb.innerHTML = '<img src="' + URL.createObjectURL(ph.blob) + '" alt="">';
        else thumb.textContent = (m.name || '?').slice(0, 1);
        if (sold) thumb.appendChild(U.el('span', { class: 'dish-soldout-tag' }, '已售罄'));
        card.appendChild(thumb);
        var info = U.el('div', { class: 'dish-info' });
        info.innerHTML =
          '<div class="dish-name">' + U.escapeHTML(m.name) + '</div>' +
          '<div class="dish-price">RM ' + U.formatMoneyPlain(firstSpec.price) + '</div>' +
          (sold ? '<div class="dish-spec-mini sold">沽清中 · 老板可在菜单管理恢复</div>'
                : (m.specs && m.specs.length > 1 ? '<div class="dish-spec-mini">' + m.specs.length + ' 种规格</div>' : ''));
        card.appendChild(info);
        if (sold) {
          card.addEventListener('click', function () {
            U.toast(m.name + ' 已售罄，如需恢复请让老板到菜单管理取消沽清', 'err');
          });
        } else {
          card.addEventListener('click', function () { openSpecModal(m); });
        }
        grid.appendChild(card);
      });
      scroll.appendChild(grid);
    }

    function openSpecModal(menu) {
      if (!menu.specs || menu.specs.length === 0) {
        menu.specs = [{ id: U.uid(), name: '标准', price: +menu.price || 0 }];
      }
      var selSpec = menu.specs[0];
      var selAddons = [], selExcludes = [];
      var extras = state.addons.filter(function (a) { return a.kind === 'extra'; });
      var ings = state.addons.filter(function (a) { return a.kind === 'ingredient'; });
      // 主食：没开启时 stapleOpts 为空数组，下面的板块整块不渲染
      var stapleOpts = U.stapleOptions(menu);
      var selStaple = stapleOpts[0] || null;

      /* 实时单价 = 菜品基础价（规格价）+ 主食替换加价 + 所有加料加价。
         主食、规格、加料三者任一变化都会重算，下面的 paintPrice 负责刷新显示。 */
      function curUnit() {
        var ad = 0;
        selAddons.forEach(function (a) { ad += +a.price || 0; });
        return Math.round(((+selSpec.price || 0) + (selStaple ? +selStaple.priceAdd || 0 : 0) + ad) * 100) / 100;
      }
      function paintPrice() {
        var box = mask.querySelector('#live-price');
        if (!box) return;
        var base = +selSpec.price || 0;
        var stAdd = selStaple ? (+selStaple.priceAdd || 0) : 0;
        var adSum = 0;
        selAddons.forEach(function (a) { adSum += +a.price || 0; });
        var parts = ['基础 RM ' + U.formatMoneyPlain(base)];
        if (stAdd > 0) parts.push('主食 +' + U.formatMoneyPlain(stAdd));
        if (adSum > 0) parts.push('加料 +' + U.formatMoneyPlain(adSum));
        box.innerHTML =
          '<div class="st-price"><span>本条单价</span>' +
          '<b>RM ' + U.formatMoneyPlain(curUnit()) + '</b>' +
          '<em>' + U.escapeHTML(parts.join('  ·  ')) + '</em></div>';
      }

      var stapleBlock = stapleOpts.length
        ? '<div class="field"><label>选择主食（必选）</label><div class="chip-wrap" id="staple-wrap">' +
            stapleOpts.map(function (o, i) {
              return '<button class="chip' + (i === 0 ? ' on' : '') + '" data-staple="' + i + '">' +
                     U.escapeHTML(o.name) + '（' + (i === 0 ? '默认 ' : '') +
                     '+' + U.formatMoneyPlain(+o.priceAdd || 0) + '）</button>';
            }).join('') +
          '</div></div>'
        : '';

      var html =
        '<div class="modal-mask"><div class="modal" style="max-width:520px;">' +
          '<div class="modal-head"><h3>' + U.escapeHTML(menu.name) + '</h3><button class="icon-btn" data-act="x" aria-label="关闭">' +
            '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>' +
          '</button></div>' +
          '<div class="modal-body">' +

                  '<div style="font-size:12px;color:var(--muted);font-weight:800;margin-bottom:6px;">历史退款记录</div>' +

      function calcAuto() {
        var s = 0;
        rows.forEach(function (r) {
          var q = picks[r.key] || 0;
          s += (r.subtotal / (r.qty || 1)) * q;
        });
        return Math.round(s * 100) / 100;
      }
      function paintQty(rowEl, r) {
        var q = picks[r.key] || 0;
        rowEl.querySelector('[data-qty]').textContent = q;
        rowEl.querySelector('[data-act="dec"]').disabled = q <= 0;
        rowEl.querySelector('[data-act="inc"]').disabled = q >= r.left;
        if (!amountDirty) inAmt.value = calcAuto().toFixed(2);

        if (!rowEl) return;

          paintQty(rowEl, r);
        });
        rowEl.querySelector('[data-act="inc"]').addEventListener('click', function () {
          picks[r.key] = Math.min(r.left, (picks[r.key] || 0) + 1);
          paintQty(rowEl, r);
        });
        paintQty(rowEl, r);
      });
      inAmt.addEventListener('input', function () { amountDirty = true; });

      m.querySelectorAll('.rf-mode').forEach(function (b) {
        b.addEventListener('click', function () {
          mode = b.getAttribute('data-mode');
          m.querySelectorAll('.rf-mode').forEach(function (x) { x.classList.remove('on'); });

          boxFull.style.display = mode === 'full' ? '' : 'none';

      });

      m.addEventListener('click', function (e) {
        if (e.target === m || e.target.closest('[data-act="x"]') || e.target.closest('[data-act="close"]')) {
          U.closeAllModals(); return;
        }

        var histEl = e.target.closest('[data-rid]');

          var rid = histEl.getAttribute('data-rid');

            okText: '撤销退款', cancelText: '算了', danger: true

            if (!ok) return;

              U.toast('已撤销该笔退款', 'ok');
              U.closeAllModals(); refresh();

          });
          return;
        }

        if (!e.target.closest('[data-act="ok"]')) return;

        var opts = { reason: inReason.value, type: mode };
        if (mode === 'partial') {
          var amt = +inAmt.value || 0;
          if (amt <= 0) { U.toast('请填写退款金额', 'err'); return; }
          if (amt > remain + 0.0001) {
            U.toast('退款金额超出可退余额 RM ' + U.formatMoneyPlain(remain), 'err'); return;
          }
          opts.amount = amt;
          opts.items = rows.filter(function (r) { return (picks[r.key] || 0) > 0; }).map(function (r) {
            var q = picks[r.key];
            return { key: r.key, name: r.name, specName: r.specName, qty: q,
                     amount: Math.round((r.subtotal / (r.qty || 1)) * q * 100) / 100 };
          });
          if (opts.items.length === 0) { U.toast('请选择要退的菜品', 'err'); return; }
        }

        U.confirm({
          title: '确认退款 RM ' + U.formatMoneyPlain(mode === 'full' ? remain : opts.amount) + '？',
          message: '订单 ' + (order.orderNo || '-') + ' 将标记为' +
                   (mode === 'full' ? '「已全额退款」' : '「部分退款」') +
                   '，营业额自动扣减。退款不会反扣库存。',
          okText: '确认退款', cancelText: '取消', danger: true
        }).then(function (ok) {
          if (!ok) return;
          G.Flow.refund(order, opts).then(function () {
            U.toast('退款成功，营业额已扣减', 'ok');
            U.closeAllModals(); refresh();
          }).catch(function (err) { U.toast(err.message, 'err'); });
        });
      });
    }

    root.appendChild(wrap);
    refresh();
  }

  G.Views = G.Views || {};
  G.Views.cashier = { render: render };
})(window);

/* 63-views-ledger.js · 收支记账 */
(function (G) {

  var INC_CATS = ['其他收入', '政府补贴', '退款收回', '营业外'];

  /* 周 / 月区间：周一算一周的第一天（date 是 YYYY-MM-DD，字典序即时间序） */
  function weekRange(d) {
    var base = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var wd = (base.getDay() + 6) % 7;            // 周日 0 → 周一 0
    var s = new Date(base); s.setDate(base.getDate() - wd);
    var e = new Date(s); e.setDate(s.getDate() + 6);
    return { from: U.todayKey(s), to: U.todayKey(e) };
  }
  function monthRange(d) {
    var s = new Date(d.getFullYear(), d.getMonth(), 1);
    var e = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    return { from: U.todayKey(s), to: U.todayKey(e) };
  }
  /* 2026-08-25 → 8/25 */
  function shortDate(key) {

  }
  /* 营业额（_turnover）算进收入，但单独立账：
     卡片副标题要能一眼看出「这笔收入里多少是卖出来的、多少是手动记的」 */
  function statOf(rows) {
    var inc = 0, exp = 0, incN = 0, expN = 0, tv = 0, tvN = 0;
    rows.forEach(function (r) {
      if (r.type === 'income') {
        inc += +r.amount || 0; incN++;
        if (r._turnover) { tv += +r.amount || 0; tvN++; }
      } else { exp += +r.amount || 0; expN++; }
    });
    return {
      inc: inc, exp: exp, net: inc - exp, n: incN + expN,
      incN: incN, expN: expN,
      tv: tv, tvN: tvN, otherN: incN - tvN
    };
  }
  function inRange(rows, from, to) {
    return rows.filter(function (r) { return !!r.date && r.date >= from && r.date <= to; });
  }

  function render(root) {
    var state = { date: U.todayKey(), type: '__ALL__' };
    var wrap = U.el('div', { class: 'page page-scroll' });
    /* refresh() 每次重绘都会生成新的闭包，这里存最新的那个给自动刷新用 */
    var renderList = function () {};

    function refresh() {
      wrap.innerHTML = '';
      var head = U.el('div', { class: 'page-title' }, [
        U.el('div', null, [
          U.el('h1', null, '收支记账'),

      r.appendChild(inDate);
      var seg = U.el('div', { class: 'seg' });
      [['__ALL__', '全部'], ['income', '收入'], ['expense', '支出']].forEach(function (p) {

      /* 三组统计：今日 / 本周 / 本月，各 4 张卡（收入 · 支出 · 净流 · 笔数） */

        var box = U.el('div', { style: 'margin-bottom:10px;' });

        box.appendChild(t);
        var grid = U.el('div', { class: 'stat-grid' });

        grid.appendChild(makeStat(prefix + '净流', 'RM ' + U.thousand(st.net), st.net >= 0 ? '#0F9D58' : '#DC2626',
          '营业额 RM ' + U.thousand(st.tv)));
        grid.appendChild(makeStat(prefix + countLabel, st.n + ' 笔', '#1F2937'));
        box.appendChild(grid);

      }

      function drawList() {
        sum.innerHTML = '';
        var d = U.parseKey(state.date) || new Date();
        var wk = weekRange(d), mo = monthRange(d);
        /* 一次把三个区间都覆盖到（周可能跨月，所以取并集），剩下的在本地筛 */
        var lo = wk.from < mo.from ? wk.from : mo.from;
        var hi = wk.to > mo.to ? wk.to : mo.to;
        G.App.ledger.listWith({ from: lo, to: hi }).then(function (rows) {
          var dayRows = rows.filter(function (r) { return r.date === state.date; });
          var stDay = statOf(dayRows);
          var stWk = statOf(inRange(rows, wk.from, wk.to));
          var stMo = statOf(inRange(rows, mo.from, mo.to));

          sum.appendChild(statBlock('今日',
            U.formatDate(d) + ' ' + U.weekdayCN[d.getDay()], stDay, '合计笔数'));
          sum.appendChild(statBlock('本周',
            shortDate(wk.from) + ' - ' + shortDate(wk.to), stWk, '合计笔数'));
          sum.appendChild(statBlock('本月',
            d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月', stMo, '总笔数'));

          list.innerHTML = '';
          /* 挂着说明：营业额是只读的，免得用户以为是自己漏记了 */
          list.appendChild(U.el('div', { class: 'lv-note' },
            '营业额随订单实时汇总（只读），要调整请到「收银」里删单。'));

              '</div>' +

            var btn = U.el('button', { class: 'icon-btn', html: '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>' });
            btn.addEventListener('click', function () {
              U.confirm({ title: '删除该记录？', message: '将永久删除此条流水', danger: true }).then(function (ok) {
                if (!ok) return;

    function makeStat(k, v, c, sub) {
      var n = U.el('div', { class: 'stat' });
      n.innerHTML = '<div class="k">' + U.escapeHTML(k) + '</div><div class="v" style="color:' + c + ';">' + v + '</div>' + (sub ? '<div style="font-size:12px;color:var(--muted);margin-top:3px;">' + sub + '</div>' : '');

            '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>' +

          '</div>' +

    var timer = setInterval(function () {
      if (!wrap.isConnected) { stop(); return; }

    }, 4000);
    function onVis() {
      if (!wrap.isConnected) { stop(); return; }
      if (!document.hidden) renderList();
    }
    document.addEventListener('visibilitychange', onVis);
    function stop() {
      clearInterval(timer);
      document.removeEventListener('visibilitychange', onVis);
    }
  }

  G.Views.ledger = { render: render };

            '<div class="modal-head"><h3>批量改归属</h3></div>' +
            '<div class="modal-body">' +
              '<p style="font-size:13px;color:var(--muted);margin-bottom:10px;">' +
                '把当前筛选下的 <b>' + targets.length + '</b> 道菜迁移到：</p>' +
              '<div class="field"><label>目标分类（四级里任选一层）</label>' +
                '<select class="select" id="ba-group">' +
                  groups.map(function (g) {
                    var pad = { sub: '　', third: '　　', fourth: '　　　' }[g.level] || '';
                    return '<option value="' + g.key + '">' + pad + U.escapeHTML(g.name) + '</option>';
                  }).join('') +
                '</select>' +
              '</div>' +
              '<p style="font-size:12px;color:var(--muted);margin-top:8px;">' +
                '选哪一层，这些菜就归到哪一层；更深的两级会被清空。</p>' +
            '</div>' +
            '<div class="modal-foot">' +
              '<button class="btn btn-gray" data-act="cancel">取消</button>' +
              '<button class="btn" data-act="ok">确认迁移</button>' +
            '</div>' +
          '</div></div>';
        var m = U.openModal(html);
        m.addEventListener('click', function (e) {
          if (e.target === m || e.target.closest('[data-act="cancel"]')) { U.closeAllModals(); return; }
          if (e.target.closest('[data-act="ok"]')) {
            var key = m.querySelector('#ba-group').value;
            var g = groups.filter(function (x) { return x.key === key; })[0];
            U.closeAllModals();
            G.App.menu.assign(targets.map(function (x) { return x.id; }),
                              { categoryId: g.catId, subCategoryId: g.subId,
                                thirdCategoryId: g.thirdId, fourthCategoryId: g.fourthId })
              .then(function () { U.toast('已迁移 ' + targets.length + ' 道菜', 'ok'); refresh(); });
          }
        });
      });
    }

    /* ============ 分类管理 ============ */
    function renderCats() {

        var btnNew = U.el('button', { class: 'btn' }, '+ 新增一级分类');
        if (editable) {
          btnNew.addEventListener('click', function () {
            G.Cats.create('cat').then(function (ok) { if (ok) { U.toast('已新增', 'ok'); refresh(); } });
          });
        } else lockBtn(btnNew);
        ops.appendChild(btnNew);
        ops.appendChild(U.el('span', { class: 'hint' }, '四级都可增改删 · 拖动行可排序 · 有子级或挂菜品时禁止删除'));
        wrap.appendChild(ops);

            '<li>先建一级分类，如：面类 / 饭类 / 粥类</li>' +
            '<li>在一级下建二级，如：汤面 / 拌面</li>' +
            '<li>在二级下建三级，如：细汤面 / 粗汤面</li>' +

            '<li>二 / 三 / 四级都是可选的：菜挂在哪一级，就算哪一级的</li>' +
            '<li>回到「菜品管理」新增菜品，选到哪一级就归到哪一级</li>' +
            '<li>点餐页四层标签各带「全部」，想看哪层就看哪层</li>' +
          '</ol>';
        wrap.appendChild(help);
      });
    }

    /* ============ 菜品编辑弹窗 ============ */
    function openMenuEdit(menu, onSaved) {
      loadTree(function () {
        menu = menu || { name: '', price: 0, specs: [], available: true };
        var tempPhotoBlob = null, tempPhotoId = menu.photoId || '';

        var html =
          '<div class="modal-mask"><div class="modal" style="max-width:560px;">' +
            '<div class="modal-head"><h3>' + (menu.id ? '编辑菜品' : '新增菜品') + '</h3>' +
              '<button class="icon-btn" data-act="x" aria-label="关闭">' +
                '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>' +
              '</button></div>' +
            '<div class="modal-body">' +
              '<div class="field"><label>菜品名</label><input class="input" id="m-name" value="' + U.escapeHTML(menu.name) + '"></div>' +
              '<div class="field"><label>归属分类（选到哪一级就归到哪一级，二 / 三 / 四级可留空）</label>' +

                  '<select class="select" id="m-cat"></select>' +

                  '<select class="select" id="m-third"></select>' +

                '</div>' +

              '<div class="field"><label>规格（多种大小独立定价）</label><div id="m-specs"></div>' +

              /* ---- 沽清售罄 ---- */
              '<div class="field">' +
                '<div class="switch" id="m-sellout">' +
                  '<div><div class="sw-label">标记沽清售罄</div>' +
                    '<div class="sw-desc">开启后，点餐页这道菜会置灰并显示「已售罄」，点不动；菜品仍留在菜单里，随时可关掉恢复</div></div>' +
                  '<div class="sw-track"></div>' +
                '</div>' +
              '</div>' +
              /* ---- 营业模式（早餐 / 午餐 / 晚餐） ---- */
              '<div class="field">' +
                '<label>营业模式（可多选）</label>' +
                '<div class="biz-tag-pick" id="m-biz-tags"></div>' +
                '<div style="font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5;">' +
                  '一个都不选 = 全时段都卖。勾了哪档，这道菜就只在那些档出现。' +
                '</div>' +
              '</div>' +
              /* ---- 主食替换选项 ---- */
              '<div class="field staple-field"><label>主食替换选项</label>' +
                '<div class="switch" id="m-staple-on">' +
                  '<div><div class="sw-label">启用主食替换</div>' +
                    '<div class="sw-desc">开启后，点这道菜时先选主食（如粿条换粗面），可逐个设加价</div></div>' +
                  '<div class="sw-track"></div>' +
                '</div>' +
                '<div id="m-staple-body" style="display:none;">' +
                  '<div style="margin-top:8px;">' +
                    '<div style="font-size:12px;color:var(--muted);margin-bottom:4px;">默认主食名称</div>' +
                    '<input class="input" id="m-staple-default" placeholder="例：粿条">' +
                  '</div>' +
                  '<div style="margin-top:10px;">' +
                    '<div style="font-size:12px;color:var(--muted);margin-bottom:4px;">' +
                      '可替换主食列表（拖左侧把手排序，或用 ▲▼；至少保留 1 条）</div>' +
                    '<div id="m-staple-list"></div>' +
                    '<button class="btn btn-soft btn-sm" id="m-add-staple">+ 添加主食</button>' +
                  '</div>' +
                '</div>' +
              '</div>' +
              '<div class="field"><label>菜品实拍照片（可选，用于 PDF 报告）</label>' +
                '<div style="display:flex;gap:10px;align-items:center;">' +
                  '<div id="m-thumb" style="width:80px;height:80px;border-radius:12px;background:linear-gradient(135deg,#FFF1E0,#FFE2C6);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--primary);overflow:hidden;"></div>' +
                  '<div style="flex:1 1 auto;">' +
                    '<input type="file" accept="image/*" id="m-file" style="display:none;">' +
                    '<button class="btn btn-ghost btn-sm" id="m-pick">选择 / 拍照</button>' +
                    '<button class="btn btn-danger btn-sm" id="m-del-photo" style="margin-left:6px;">移除</button>' +
                  '</div>' +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="modal-foot">' +
              '<button class="btn btn-gray" data-act="cancel">取消</button>' +
              '<button class="btn" data-act="ok">保存</button>' +
            '</div>' +
          '</div></div>';
        var m = U.openModal(html);

        /* ---- 四级联动 ----
           每层都留「（不细分）」：停在二级，菜就归二级，不用硬点到第四级。
           上层一变，下层全部回到「不细分」—— 不替用户猜。 */
        var selCat = m.querySelector('#m-cat');
        var selSub = m.querySelector('#m-sub');
        var selThird = m.querySelector('#m-third');
        var selFourth = m.querySelector('#m-fourth');
        var NO_SPLIT = '<option value="">（不细分）</option>';

        function fillSelect(el, items, want) {
          el.innerHTML = NO_SPLIT + items.map(function (it) {
            return '<option value="' + it.id + '">' + U.escapeHTML(it.name) + '</option>';
          }).join('');
          el.disabled = items.length === 0;
          el.value = (want && items.some(function (it) { return it.id === want; })) ? want : '';
        }
        function curCat() { return findCat(selCat.value); }
        function curSub() { return findSub(curCat(), selSub.value); }
        function curThird() { return findThird(curSub(), selThird.value); }

        function fillCats() {
          selCat.innerHTML = tree.map(function (c) {
            return '<option value="' + c.cat.categoryId + '">' + U.escapeHTML(c.cat.name) + '</option>';
          }).join('');
          selCat.disabled = tree.length === 0;
          var want = menu.categoryId || (tree[0] && tree[0].cat.categoryId);
          if (want) selCat.value = want;
          fillSubs();
        }
        function fillSubs() {
          var c = curCat();
          fillSelect(selSub, (c ? c.subs : []).map(function (s) {
            return { id: s.sub.subId, name: s.sub.name };
          }), menu.subCategoryId);
          fillThirds();
        }
        function fillThirds() {
          var s = curSub();
          fillSelect(selThird, (s ? s.thirds : []).map(function (t) {
            return { id: t.third.thirdId, name: t.third.name };
          }), menu.thirdCategoryId);
          fillFourths();
        }
        function fillFourths() {
          var t = curThird();
          fillSelect(selFourth, (t ? t.fourths : []).map(function (f) {
            return { id: f.fourth.fourthId, name: f.fourth.name };
          }), menu.fourthCategoryId);
        }
        selCat.addEventListener('change', fillSubs);
        selSub.addEventListener('change', fillThirds);
        selThird.addEventListener('change', fillFourths);
        fillCats();

        /* ---- 规格 ---- */
        var specsDiv = m.querySelector('#m-specs');
        function addSpecRow(s) {
          s = s || { id: U.uid(), name: '', price: 0 };
          var r = U.el('div', { class: 'spec-row' });
          r.innerHTML =
            '<input class="input" placeholder="规格名（如：大份）" value="' + U.escapeHTML(s.name) + '">' +
            '<input class="input input-money" type="number" step="0.01" min="0" placeholder="价格" value="' + (s.price || 0) + '">' +
            '<button class="icon-btn" aria-label="删除">' +
              '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>' +
            '</button>';
          r.querySelector('button').addEventListener('click', function () { r.remove(); });
          specsDiv.appendChild(r);
        }
        (menu.specs && menu.specs.length ? menu.specs : [{ name: '标准', price: menu.price || 0 }]).forEach(addSpecRow);
        m.querySelector('#m-add-spec').addEventListener('click', function () { addSpecRow(); });

        /* ---- 沽清售罄开关 ---- */
        var sellOutOn = m.querySelector('#m-sellout');
        if (menu.sellOut) sellOutOn.classList.add('on');
        sellOutOn.addEventListener('click', function () { sellOutOn.classList.toggle('on'); });

        /* ---- 营业模式多选 ----
           可勾的项来自 biz 模块的档位列表，不是写死的 —— 老板在设置页
           增删档位后这里跟着变。勾中的顺序按档位列表走，不按勾选先后。 */
        var bizBox = m.querySelector('#m-biz-tags');
        var bizTags = (G.App.biz ? G.App.biz.tags() : []) || [];
        var bizSel = (menu.businessTags || []).filter(function (t) { return bizTags.indexOf(t) >= 0; });
        if (!bizTags.length) {
          bizBox.innerHTML = '<div style="font-size:12px;color:var(--muted);">' +
            '还没设置营业模式，到「设置」里加档位后这里就能选</div>';
        } else {
          bizTags.forEach(function (t) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'biz-tag' + (bizSel.indexOf(t) >= 0 ? ' on' : '');
            b.textContent = t;
            b.setAttribute('data-tag', t);
            b.addEventListener('click', function () {
              b.classList.toggle('on');
            });
            bizBox.appendChild(b);
          });
        }

        /* ---- 主食替换选项 ----
           旧菜品没有这三个字段，读出来是 undefined → 开关默认关、列表为空，
           点餐弹窗完全不渲染主食区，原有行为不受影响（兼容老数据）。 */
        var stapleOn = m.querySelector('#m-staple-on');
        var stapleBody = m.querySelector('#m-staple-body');
        var stapleListDiv = m.querySelector('#m-staple-list');
        if (menu.enableStapleReplace) stapleOn.classList.add('on');
        m.querySelector('#m-staple-default').value = menu.defaultStaple || '';

        function stapleRowCount() { return stapleListDiv.querySelectorAll('.staple-row').length; }
        /* 至少留 1 条：只剩一条时删不掉，避免列表被清空 */
        function syncStapleBtns() {
          var rows = stapleListDiv.querySelectorAll('.staple-row');
          rows.forEach(function (r, i) {
            r.querySelector('[data-act="del"]').disabled = rows.length <= 1;
            r.querySelector('[data-act="up"]').disabled = i === 0;
            r.querySelector('[data-act="down"]').disabled = i === rows.length - 1;
          });
        }
        function addStapleRow(s) {
          s = s || { name: '', priceAdd: 0 };
          var r = U.el('div', { class: 'staple-row' });
          r.draggable = true;
          r.innerHTML =
            '<span class="st-handle" title="按住拖动排序">⋮⋮</span>' +
            '<input class="input st-name" placeholder="主食名（如：粗面）" value="' + U.escapeHTML(s.name) + '">' +
            '<input class="input input-money" type="number" step="0.01" min="0" placeholder="加价" value="' + (+s.priceAdd || 0) + '">' +
            '<button class="icon-btn st-mv" data-act="up" aria-label="上移">▲</button>' +
            '<button class="icon-btn st-mv" data-act="down" aria-label="下移">▼</button>' +
            '<button class="icon-btn" data-act="del" aria-label="删除">' +
              '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>' +
            '</button>';
          r.querySelector('[data-act="del"]').addEventListener('click', function () {
            if (stapleRowCount() <= 1) { U.toast('至少保留 1 个主食选项', 'err'); return; }
            r.remove(); syncStapleBtns();
          });
          r.querySelector('[data-act="up"]').addEventListener('click', function () {
            if (r.previousElementSibling) stapleListDiv.insertBefore(r, r.previousElementSibling);
            syncStapleBtns();
          });
          r.querySelector('[data-act="down"]').addEventListener('click', function () {
            if (r.nextElementSibling) stapleListDiv.insertBefore(r.nextElementSibling, r);
            syncStapleBtns();
          });
          /* HTML5 拖拽在触屏上不触发，所以还给了 ▲▼ —— 平板上也能排序 */
          r.addEventListener('dragstart', function (e) {
            r.classList.add('dragging');
            if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', ''); }
          });
          r.addEventListener('dragend', function () { r.classList.remove('dragging'); syncStapleBtns(); });
          stapleListDiv.appendChild(r);
          syncStapleBtns();
        }
        (menu.stapleList && menu.stapleList.length ? menu.stapleList : []).forEach(addStapleRow);
        m.querySelector('#m-add-staple').addEventListener('click', function () { addStapleRow(); });

        function syncStapleOn() {
          stapleBody.style.display = stapleOn.classList.contains('on') ? '' : 'none';
        }
        stapleOn.addEventListener('click', function () {
          var was = stapleOn.classList.contains('on');
          stapleOn.classList.toggle('on');
          syncStapleOn();
          // 首次开启且列表还是空的，直接给一行，省得再点一次「添加主食」
          if (!was && stapleOn.classList.contains('on') && stapleRowCount() === 0) addStapleRow();
        });
        syncStapleOn();

        /* 拖拽排序：算出鼠标落在哪一行中线之上，就插到那行前面 */
        stapleListDiv.addEventListener('dragover', function (e) {
          e.preventDefault();
          var dr = stapleListDiv.querySelector('.dragging');
          if (!dr) return;
          var after = null, best = -Infinity;
          stapleListDiv.querySelectorAll('.staple-row:not(.dragging)').forEach(function (row) {
            var box = row.getBoundingClientRect();
            var off = e.clientY - box.top - box.height / 2;
            if (off < 0 && off > best) { best = off; after = row; }
          });
          if (after == null) stapleListDiv.appendChild(dr);
          else stapleListDiv.insertBefore(dr, after);
        });

        /* ---- 图片 ---- */
        var thumb = m.querySelector('#m-thumb');
        function paintThumb() {
          if (tempPhotoBlob) {
            thumb.innerHTML = '<img src="' + URL.createObjectURL(tempPhotoBlob) + '" style="width:100%;height:100%;object-fit:cover;">';
          } else if (tempPhotoId && photoMap[tempPhotoId]) {
            thumb.innerHTML = '<img src="' + URL.createObjectURL(photoMap[tempPhotoId].blob) + '" style="width:100%;height:100%;object-fit:cover;">';
          } else {
            thumb.textContent = (m.querySelector('#m-name').value || '?').slice(0, 1);
          }
        }
        paintThumb();
        m.querySelector('#m-pick').addEventListener('click', function () { m.querySelector('#m-file').click(); });
        m.querySelector('#m-file').addEventListener('change', function (e) {
          var f = e.target.files && e.target.files[0];
          if (!f) return;
          tempPhotoBlob = f; paintThumb();
        });
        m.querySelector('#m-del-photo').addEventListener('click', function () {
          tempPhotoBlob = null; tempPhotoId = ''; paintThumb();
        });

        /* ---- 保存 ---- */
        m.addEventListener('click', function (e) {
          if (e.target === m || e.target.closest('[data-act="cancel"]') || e.target.closest('[data-act="x"]')) { U.closeAllModals(); return; }
          if (!e.target.closest('[data-act="ok"]')) return;
          var name = m.querySelector('#m-name').value.trim();
          if (!name) { U.toast('请填写菜名', 'err'); return; }
          if (!selCat.value) { U.toast('请先到「分类管理」建好一级分类', 'err'); return; }
          var specs = [];
          specsDiv.querySelectorAll('.spec-row').forEach(function (r) {
            var ins = r.querySelectorAll('input');
            var n = ins[0].value.trim();
            var p = +ins[1].value || 0;
            if (n) specs.push({ id: U.uid(), name: n, price: p });
          });
          if (specs.length === 0) { U.toast('请至少添加一种规格', 'err'); return; }
          /* 主食配置：关着的时候也把值存下来，重新打开不用重填一遍 */
          var enableStaple = stapleOn.classList.contains('on');
          var defStaple = m.querySelector('#m-staple-default').value.trim();
          var stapleRows = [];
          stapleListDiv.querySelectorAll('.staple-row').forEach(function (r) {
            var ins = r.querySelectorAll('input');
            var sn = ins[0].value.trim();
            var sp = +ins[1].value || 0;
            // 加价不允许为负，否则单价会低于菜品基础价
            if (sn) stapleRows.push({ name: sn, priceAdd: Math.max(0, Math.round(sp * 100) / 100) });
          });
          if (enableStaple) {
            if (!defStaple) { U.toast('启用主食替换后，请填写默认主食名称', 'err'); return; }
            if (stapleRows.length === 0) { U.toast('请至少添加 1 个主食选项', 'err'); return; }
          }
          // 档位勾选顺序按档位列表走：今天勾晚餐再勾早餐，存的也是「早餐, 晚餐」
          var bizPicked = [];
          bizTags.forEach(function (t) {
            var b = bizBox.querySelector('[data-tag="' + t.replace(/"/g, '\\"') + '"]');
            if (b && b.classList.contains('on')) bizPicked.push(t);
          });
          var rec = Object.assign({}, menu, {
            name: name,
            sellOut: sellOutOn.classList.contains('on'),
            businessTags: bizPicked,
            enableStapleReplace: enableStaple,
            defaultStaple: defStaple,
            stapleList: stapleRows,
            categoryId: selCat.value,
            subCategoryId: selSub.value || '',
            thirdCategoryId: selThird.value || '',
            fourthCategoryId: selFourth.value || '',
            specs: specs,
            price: specs[0].price
          });
          var save = function (photoId) {
            rec.photoId = photoId;
            G.App.menu.save(rec).then(function () {
              U.closeAllModals();
              U.toast('已保存', 'ok');
              onSaved && onSaved();
            });
          };
          if (tempPhotoBlob) G.App.photos.save(tempPhotoBlob, name + '.jpg').then(function (p) { save(p.id); });
          else save(tempPhotoId);
        });
      });
    }

    /* ============ 配料库 ============ */
    function renderAddons() {
      G.App.addons.list().then(function (rows) {
        var ops = U.el('div', { class: 'card', style: 'display:flex;gap:8px;align-items:center;' });

/* 67-views-tables.js · 台桌管理页
   外带独立大卡片（置顶优先） + 堂食桌台自适应网格

   台桌三态（配色）：
     空闲 idle   → 灰
     占用 using  → 橙（点餐中，购物车里有菜）
     已结账 paid → 绿（刚结完账，还没清台）
   挂单 pending 不是第四种颜色：挂单的购物车还在，那桌确实还占着，所以仍是橙，
   只是在卡片右上角多挂一个「挂单」角标，并在顶部栏给出挂单总数入口。

   状态迁移：点餐加菜 → using；结账 → paid（留壳记账，不删）；
             清台 / 全部重置 → idle（真删记录）。 */
(function (G) {
  'use strict';
  var U = G.U;

  var STATE_TEXT = { idle: '空闲', using: '使用中', paid: '已结账' };

  function render(root) {
    var wrap = U.el('div', { class: 'page page-scroll' });
    root.appendChild(wrap);

    var locked = {};          // slotId → true（被其他会话占用）

    function refresh() {
      // 重绘会清空子节点，滚动位置会归零；先存后还，避免翻到 50 桌时被弹回顶部
      var keepScroll = wrap.scrollTop;
      wrap.innerHTML = '';

      // ===== 顶部橘色毛玻璃栏目 =====
      var head = U.el('div', { class: 'bar-orange', style: 'display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex:0 0 auto;' });
      head.innerHTML =
        '<div>' +
          '<div style="font-size:12px;opacity:.92;font-weight:600;">台桌管理</div>' +
          '<div style="font-size:19px;font-weight:800;margin-top:2px;" id="tbl-sub">读取中…</div>' +

/* 69-views-staff.js · 员工工位账号管理（仅老板可见）
   员工 = 一个工位账号，只存「名字 + 是否启用 + 建号时间」，不存密码：
   登录员工身份由老板在顶栏直接切换，只有切回老板才要输老板密码。
   老板是系统内置账号，没有记录、删不掉，只能改密码。
   老板密码只以哈希形式落在本机（PBKDF2-SHA256 + 随机盐），不存明文。
   停用 / 改名 / 删除都不会回头去改历史订单里的操作员名字。 */
(function (G) {
  'use strict';
  var U = G.U;

  function fmtWhen(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return U.formatDate(d) + ' ' + U.formatHM(d);
  }

  /* 通用小表单弹窗：title + 若干输入项 + 取消 / 确定。
     submit 返回 Promise，抛错就把错误显示在弹窗里（弹窗不关，方便改）。 */
  function askForm(opt) {
    return new Promise(function (resolve) {
      var body = opt.fields.map(function (f, i) {
        return '<div class="field"><label>' + U.escapeHTML(f.label) + '</label>' +
          '<input class="input" id="sf-' + f.key + '" type="' + (f.type || 'text') + '"' +
          ' placeholder="' + U.escapeHTML(f.placeholder || '') + '"' +
          ' value="' + U.escapeHTML(f.value || '') + '"' +
          ((f.autofocus || (i === 0 && !opt.fields.some(function (x) { return x.autofocus; }))) ? ' data-focus="1"' : '') +
          '></div>';
      }).join('');

      var html =
        '<div class="modal-mask"><div class="modal" style="max-width:380px;">' +
          '<div class="modal-head"><h3>' + U.escapeHTML(opt.title) + '</h3>' +
            '<button class="icon-btn" data-act="x" aria-label="关闭">' +
              '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>' +
            '</button></div>' +
          '<div class="modal-body">' + body +
            (opt.note ? '<p style="font-size:12px;color:var(--muted);line-height:1.6;margin-top:2px;">' + U.escapeHTML(opt.note) + '</p>' : '') +
            '<div id="sf-err" style="display:none;color:var(--danger);font-size:13px;margin-top:8px;line-height:1.5;"></div>' +
          '</div>' +
          '<div class="modal-foot">' +
            '<button class="btn btn-gray" data-act="cancel">取消</button>' +
            '<button class="btn" data-act="ok">' + U.escapeHTML(opt.okText || '保存') + '</button>' +
          '</div>' +
        '</div></div>';

      var m = U.openModal(html);
      var okBtn = m.querySelector('[data-act="ok"]');

      function read() {
        var vals = {};
        opt.fields.forEach(function (f) {
          var el = m.querySelector('#sf-' + f.key);
          vals[f.key] = el ? el.value : '';
        });
        return vals;
      }
      function showErr(msg) {
        var e = m.querySelector('#sf-err');
        if (!e) return;
        e.textContent = msg || '';
        e.style.display = msg ? '' : 'none';
      }
      setTimeout(function () {
        var f = m.querySelector('[data-focus="1"]') || m.querySelector('.input');
        if (f) { f.focus(); try { f.select(); } catch (x) {} }
      }, 90);

      function close(v) { U.closeAllModals(); resolve(v); }

      m.addEventListener('click', function (e) {
        if (e.target.classList && e.target.classList.contains('modal-mask') ||
            e.target.closest('[data-act="x"]') || e.target.closest('[data-act="cancel"]')) {
          close(null); return;
        }
        if (!e.target.closest('[data-act="ok"]')) return;
        var v = read();
        if (opt.validate) {
          var msg = opt.validate(v);
          if (msg) { showErr(msg); return; }
        }
        if (okBtn) { okBtn.disabled = true; okBtn.textContent = '处理中…'; }
        showErr('');
        Promise.resolve(opt.submit ? opt.submit(v) : v).then(function (res) {
          close(res === false ? false : (res || v));
        }).catch(function (err) {
          if (okBtn) { okBtn.disabled = false; okBtn.textContent = opt.okText || '保存'; }
          showErr((err && err.message) ? err.message : '保存失败，请重试');
        });
      });
      m.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (okBtn) okBtn.click(); }
      });
    });
  }

                 (s.name || '未命名') + '」会原样保留，不会被清空。',

    function openBossPwd() {
      var has = G.App.operator.hasPassword();
      var fields = [];
      if (has) {
        fields.push({ key: 'old', label: '当前老板密码', type: 'password', placeholder: '请输入现在的密码', autofocus: true });
      }
      fields.push({ key: 'n1', label: '新密码', type: 'password', placeholder: '至少 4 位', autofocus: !has });
      fields.push({ key: 'n2', label: '再输一次新密码', type: 'password', placeholder: '防止打错' });

      askForm({
        title: has ? '修改老板密码' : '设置老板密码',
        fields: fields,
        note: '密码只以哈希形式存在本机（PBKDF2-SHA256 + 随机盐），不存明文、不上传。' +
              '忘了没有找回入口，只能清掉浏览器数据重来。',
        okText: has ? '确认修改' : '设置密码',
        validate: function (v) {
          if (has && !v.old) return '请输入当前密码';
          if (!v.n1) return '请输入新密码';
          if (String(v.n1).length < 4) return '新密码至少 4 位';
          if (v.n1 !== v.n2) return '两次输入的新密码不一致';
          if (has && v.old === v.n1) return '新密码不能和当前密码一样';
          return '';
        },
        submit: function (v) {
          var pre = has
            ? G.App.operator.verifyPassword(v.old).then(function (ok) {
                if (!ok) throw new Error('当前密码不对，改不了');
                return true;
              })
            : Promise.resolve(true);
          return pre.then(function () {
            return G.App.operator.setPassword(v.n1);
          }).then(function () { return true; });
        }
      }).then(function (r) {
        if (!r) return;
        U.toast('老板密码已更新', 'ok');
        refresh();
      });
    }

    /* ---------- 渲染 ---------- */
    function refresh() {
      wrap.innerHTML = '';
      wrap.appendChild(head());
      if (!editable) { wrap.appendChild(deniedCard()); return; }
      G.App.staff.list().then(function (list) {
        rows = list || [];
        wrap.innerHTML = '';
        wrap.appendChild(head());
        wrap.appendChild(staffCard());
        wrap.appendChild(bossCard());
        wrap.appendChild(tipCard());
      }).catch(function (e) {
        wrap.appendChild(U.el('div', { class: 'card' },
          '读员工名单失败：' + (e && e.message ? e.message : e)));
      });
    }

    root.appendChild(wrap);
    refresh();
  }

  G.Views = G.Views || {};
  G.Views.staff = { render: render };
})(window);


/* ============ 70-views-inventory.js ============ */
/* 70-views-inventory.js · 进出货库存页
   四个页签：库存汇总 / 进货入库 / 出库记录 / 报损记录。
   员工模式：整页只读 —— 新增、编辑、删除、导出按钮一律不渲染（数据层还有一道闸）。 */
(function (G) {
  'use strict';

  var TABS = [
    { id: 'summary', text: '库存汇总' },
    { id: 'in', text: '进货入库' },

    { id: 'loss', text: '报损记录' }

  var TAB_TEXT = { summary: '库存汇总', in: '进货', out: '出库', loss: '报损' };

  function inv() { return G.App.inv; }
  function canEdit() { return G.App.inv.canEdit(); }
  function canExport() { return G.App.operator.can('invExport'); }
  function isStaff() { return !canEdit(); }

  /* ---------- 小工具 ---------- */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dayStart(s) { return s ? new Date(s + 'T00:00:00').getTime() : null; }
  function dayEnd(s) { return s ? new Date(s + 'T23:59:59.999').getTime() : null; }
  function toLocalInput(ms) {
    var d = new Date(ms == null ? Date.now() : ms);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
           'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function fromLocalInput(s) {
    var m = new Date(s);
    return isNaN(m.getTime()) ? Date.now() : m.getTime();
  }
  function qtyText(n) { return String(Math.round((+n || 0) * 10000) / 10000); }
  function stamp(ms) { var d = new Date(ms); return U.formatDate(d) + ' ' + U.formatHM(d); }

  /* blob → <img>，加载完立刻释放 URL（每次都是新 URL，不会复用失效的） */
  function imgEl(blob, cls) {
    var u = URL.createObjectURL(blob);
    var img = U.el('img', { class: cls, src: u, alt: '' });
    img.addEventListener('load', function () { URL.revokeObjectURL(u); });
    img.addEventListener('error', function () { URL.revokeObjectURL(u); });
    return img;
  }

  /* 通用弹窗：返回 mask，自己管关闭 */
  function openBox(title, build, footBtns) {
    var root = document.getElementById('modal-root');
    var mask = U.el('div', { class: 'modal-mask' });
    var modal = U.el('div', { class: 'modal' });
    var head = U.el('div', { class: 'modal-head' }, [
      U.el('h3', null, title),
      U.el('button', { class: 'icon-btn', html: '&times;' }, [])
    ]);
    head.querySelector('button').addEventListener('click', function () { mask.remove(); });
    modal.appendChild(head);
    var body = U.el('div', { class: 'modal-body' });
    modal.appendChild(body);
    var foot = U.el('div', { class: 'modal-foot' });
    var btnClose = U.el('button', { class: 'btn btn-gray', style: 'flex:1 1 0;' }, '关闭');
    btnClose.addEventListener('click', function () { mask.remove(); });
    (footBtns || []).forEach(function (b) { foot.appendChild(b); });
    foot.appendChild(btnClose);
    modal.appendChild(foot);
    mask.appendChild(modal);
    mask.addEventListener('click', function (e) { if (e.target === mask) mask.remove(); });
    root.appendChild(mask);
    build(body, function () { mask.remove(); });
    return mask;
  }

  /* 单位选择：预设 9 项 + 自定义，两者互斥 */
  function unitPicker(initial) {
    var sel = U.el('select', { class: 'select' });
    var custom = U.el('input', {
      class: 'input', placeholder: '自定义单位，如 箱 / 盒 / 托',
      style: 'display:none;margin-top:8px;'
    });
    var box = U.el('div', null, [sel, custom]);
    var preset = inv().UNITS.slice();
    preset.forEach(function (u) { sel.appendChild(U.el('option', { value: u }, u)); });
    sel.appendChild(U.el('option', { value: '__CUSTOM__' }, '自定义…'));

    function value() {
      return sel.value === '__CUSTOM__' ? (custom.value || '').trim() : sel.value;
    }
    function set(v) {
      v = (v || '').trim();
      if (preset.indexOf(v) >= 0) {
        sel.value = v; custom.value = ''; custom.style.display = 'none';
      } else if (v) {
        sel.value = '__CUSTOM__'; custom.value = v; custom.style.display = '';
      } else {
        sel.value = preset[0]; custom.value = ''; custom.style.display = 'none';
      }
    }
    sel.addEventListener('change', function () {
      if (sel.value === '__CUSTOM__') { custom.style.display = ''; custom.focus(); }
      else { custom.value = ''; custom.style.display = 'none'; }
    });
    custom.addEventListener('input', function () { sel.value = '__CUSTOM__'; });
    set(initial);
    return { el: box, value: value, set: set };
  }

  /* 下拉 + 自定义输入的通用组合（供应商用） */
  function comboPicker(options, initial, placeholder) {
    var sel = U.el('select', { class: 'select' });
    var custom = U.el('input', { class: 'input', placeholder: placeholder || '自定义', style: 'display:none;margin-top:8px;' });
    var box = U.el('div', null, [sel, custom]);
    function fill(list) {
      var keep = sel.value;
      sel.innerHTML = '';
      (list || []).forEach(function (o) { sel.appendChild(U.el('option', { value: o }, o)); });
      sel.appendChild(U.el('option', { value: '' }, '（不填）'));
      sel.appendChild(U.el('option', { value: '__CUSTOM__' }, '自定义…'));
      sel.value = (list || []).indexOf(keep) >= 0 ? keep : (keep === '' ? '' : '__CUSTOM__');
    }
    function value() { return sel.value === '__CUSTOM__' ? (custom.value || '').trim() : sel.value; }
    function set(v) {
      v = (v || '').trim();
      if (!v) { sel.value = ''; custom.value = ''; custom.style.display = 'none'; return; }
      var has = [].some.call(sel.options, function (o) { return o.value === v; });
      if (has) { sel.value = v; custom.value = ''; custom.style.display = 'none'; }
      else { sel.value = '__CUSTOM__'; custom.value = v; custom.style.display = ''; }
    }
    sel.addEventListener('change', function () {
      if (sel.value === '__CUSTOM__') { custom.style.display = ''; custom.focus(); }
      else { custom.value = ''; custom.style.display = 'none'; }
    });
    custom.addEventListener('input', function () { sel.value = '__CUSTOM__'; });
    fill(options);
    set(initial);
    return { el: box, value: value, set: set, fill: fill, select: sel };
  }

  /* ---------- 主页面 ---------- */

      var card = U.el('div', { class: 'card inv-row' + (r.low ? ' low' : '') + (r.current < 0 ? ' neg' : '') });

      var top = U.el('div', { style: 'display:flex;justify-content:space-between;gap:10px;align-items:flex-start;' });
      var nameBox = U.el('div', null, [
        U.el('div', { style: 'font-size:15px;font-weight:800;' }, U.escapeHTML(r.itemName)),
        U.el('div', { style: 'margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;' }, [
          U.el('span', { class: 'tag gray' }, U.escapeHTML(r.unit || '未设单位')),
          r.convOn ? U.el('span', { class: 'tag' }, '换算合成') : null,
          r.threshold != null ? U.el('span', { class: 'tag warn' }, '阈值 ' + qtyText(r.threshold)) : null
        ])
      ]);
      var cur = U.el('div', { style: 'text-align:right;flex:0 0 auto;' });
      cur.innerHTML =
        '<div class="inv-cur' + (r.current < 0 ? ' neg' : (r.low ? ' low' : '')) + '">' + qtyText(r.current) + '</div>' +
        '<div style="font-size:11px;color:var(--muted);font-weight:700;">当前库存</div>';
      top.appendChild(nameBox);
      top.appendChild(cur);
      card.appendChild(top);

      var nums = U.el('div', { class: 'inv-nums' });
      [['进货', r.inQty, 'in'], ['出库', r.outQty, 'out'], ['报损', r.lossQty, 'loss']].forEach(function (p) {
        nums.appendChild(U.el('div', { class: 'inv-num' }, [
          U.el('div', { class: 'k' }, p[0]),
          U.el('div', { class: 'v' }, qtyText(p[1]))
        ]));
      });
      nums.appendChild(U.el('div', { class: 'inv-num' }, [
        U.el('div', { class: 'k' }, '进货金额'),
        U.el('div', { class: 'v' }, 'RM ' + U.formatMoneyPlain(r.amountIn))
      ]));
      card.appendChild(nums);

      var ops = U.el('div', { class: 'inv-ops' });
      var btnHis = U.el('button', { class: 'btn btn-soft btn-sm' }, '历史明细');
      btnHis.addEventListener('click', function (e) { e.stopPropagation(); openHistory(r.itemName); });
      ops.appendChild(btnHis);
      if (canEdit()) {
        var btnTh = U.el('button', { class: 'btn btn-soft btn-sm' }, '安全阈值');
        btnTh.addEventListener('click', function (e) { e.stopPropagation(); openThreshold(r); });
        var btnCv = U.el('button', { class: 'btn btn-soft btn-sm' }, '单位换算');
        btnCv.addEventListener('click', function (e) { e.stopPropagation(); openConv(r.itemName); });
        ops.appendChild(btnTh);
        ops.appendChild(btnCv);
      }
      card.appendChild(ops);

      card.addEventListener('click', function () { openHistory(r.itemName); });
