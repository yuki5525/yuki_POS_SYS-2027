        var from = ym + '-01', to = ym + '-' + new Date(+ym.split('-')[0], +ym.split('-')[1], 0).getDate().toString().padStart(2, '0');
        btn.disabled = true; btn.textContent = '生成中…';
        Promise.all([G.App.orders.list({ from: from, to: to }), G.App.ledger.list()]).then(function (res) {
          var led = (res[1] || []).filter(function (l) { return l.date >= from && l.date <= to; });
          return G.PDF.generateAndArchive({
            orders: res[0] || [], ledger: led,

      G.App.pdf.list().then(function (arr) {
        c2.querySelector('#pdf-count').textContent = arr.length + ' 份';
        list.innerHTML = '';
        if (arr.length === 0) list.appendChild(U.el('div', { class: 'empty' }, [U.el('p', null, '还没有 PDF 档案')]));
        arr.forEach(function (it) {
          var row = U.el('div', { class: 'pdf-item' });
          row.innerHTML =
            '<div class="pdf-ico">PDF</div>' +
            '<div class="grow">' +
              '<div class="t">' + U.escapeHTML(it.fileName) + '</div>' +
              '<div class="s">' + U.escapeHTML(it.label) + '  ·  ' + (it.createTime || '').slice(0, 16).replace('T', ' ') + '  ·  ' + U.bytes(it.size || (it.pdfBlob ? it.pdfBlob.size : 0)) + '</div>' +
            '</div>' +
            '<div class="pdf-actions">' +
              '<button class="btn btn-soft btn-sm" data-act="pre">预览</button>' +
              '<button class="btn btn-ghost btn-sm" data-act="dl">下载</button>' +
              '<button class="btn btn-danger btn-sm" data-act="del">删除</button>' +
            '</div>';
          row.querySelector('[data-act="pre"]').addEventListener('click', function () { G.PDF.preview(it.pdfBlob); });
          row.querySelector('[data-act="dl"]').addEventListener('click', function () { U.download(it.fileName, it.pdfBlob); });
          row.querySelector('[data-act="del"]').addEventListener('click', function () {
            U.confirm({ title: '删除该 PDF？', message: it.fileName, danger: true }).then(function (ok) {
              if (!ok) return;
              G.App.pdf.del(it.pdfId).then(refresh);
            });
          });
          list.appendChild(row);
        });
      });
    }

    function renderBackup() {
      var c1 = U.el('div', { class: 'card' });
      c1.innerHTML = '<div class="card-title">JSON 备份导出</div>';
      c1.appendChild(U.el('p', { style: 'font-size:13px;color:var(--muted);margin-bottom:10px;' }, '导出菜单、配料、订单、收支的全量数据为 JSON 文件（不含 PDF 二进制）。'));
      var btn = U.el('button', { class: 'btn' }, '导出 JSON 备份');
      btn.addEventListener('click', function () {
        G.App.io.exportJSON().then(function (obj) {
          var txt = JSON.stringify(obj, null, 2);
          U.download('点餐收银-备份-' + U.todayKey() + '.json', new Blob([txt], { type: 'application/json' }));
          U.toast('已导出', 'ok');
        });
      });
      c1.appendChild(btn);
      wrap.appendChild(c1);

      var c2 = U.el('div', { class: 'card' });
      c2.innerHTML = '<div class="card-title">JSON 导入恢复</div>';
      c2.appendChild(U.el('p', { style: 'font-size:13px;color:var(--muted);margin-bottom:10px;' }, '⚠️ 导入会清空当前业务数据并覆盖，请先备份当前数据再导入。'));
      var inF = U.el('input', { type: 'file', accept: 'application/json', style: 'display:none;' });
      var btn2 = U.el('button', { class: 'btn btn-ghost' }, '选择 JSON 文件并恢复');
      btn2.addEventListener('click', function () { inF.click(); });
      inF.addEventListener('change', function (e) {
        var f = e.target.files && e.target.files[0]; if (!f) return;
        U.readFile(f, 'text').then(function (txt) {
          var obj; try { obj = JSON.parse(txt); } catch (err) { U.toast('JSON 解析失败', 'err'); return; }
          U.confirm({ title: '确认导入？', message: '将覆盖现有菜单、订单、收支、配料数据' }).then(function (ok) {
            if (!ok) return;
            G.App.io.importJSON(obj).then(function () {
              U.toast('导入成功', 'ok');
              setTimeout(function () { location.reload(); }, 400);
            }).catch(function (e) { U.toast('导入失败：' + e.message, 'err'); });
          });
        });
      });
      c2.appendChild(btn2); c2.appendChild(inF);
      wrap.appendChild(c2);

      var c3 = U.el('div', { class: 'card' });
      c3.innerHTML = '<div class="card-title">危险操作</div>';
      var ops = U.el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;' });
      var btnClrOrders = U.el('button', { class: 'btn btn-danger' }, '清空所有订单');
      btnClrOrders.addEventListener('click', function () {
        U.confirm({ title: '清空所有订单？', message: '所有历史订单将永久删除', danger: true, okText: '永久删除' }).then(function (ok) {
          if (!ok) return;
          G.App.orders.clearAll().then(function () { U.toast('已清空', 'ok'); });
        });
      });
      ops.appendChild(btnClrOrders);
      c3.appendChild(ops);
      wrap.appendChild(c3);
    }

    root.appendChild(wrap);
    refresh();
  }

  G.Views = G.Views || {};
  G.Views.settings = { render: render };
})(window);


/* ============ 67-views-tables.js ============ */
/* 67-views-tables.js · 台桌管理页
   外卖独立大卡片（置顶优先） + 堂食桌台自适应网格
   状态：空闲 idle / 使用中 using / 待付款 pending
   桌号数量来自 cfg.tableCount，改配置即可扩充，本文件不含硬编码上限。 */
(function (G) {
  'use strict';
  var U = G.U;

  var STATE_TEXT = { idle: '空闲', using: '使用中', pending: '待付款' };

  function render(root) {
    var wrap = U.el('div', { class: 'page page-scroll' });
    root.appendChild(wrap);

    var locked = {};          // slotId → true（被其他会话占用）

    function refresh() {
      // 重绘会清空子节点，滚动位置会归零；先存后还，避免翻到 50 桌时被弹回顶部
      var keepScroll = wrap.scrollTop;
      wrap.innerHTML = '';

      // ===== 顶部橘色毛玻璃栏目 =====
      var head = U.el('div', { class: 'bar-orange', style: 'display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex:0 0 auto;' });
      head.innerHTML =
        '<div>' +
          '<div style="font-size:12px;opacity:.92;font-weight:600;">台桌管理</div>' +
          '<div style="font-size:19px;font-weight:800;margin-top:2px;" id="tbl-sub">读取中…</div>' +
        '</div>' +
        '<div style="display:flex;gap:6px;">' +
          '<button class="btn btn-sm" id="btn-reset" style="background:rgba(255,255,255,.22);">全部重置</button>' +
          '<button class="btn btn-sm" id="btn-refresh" style="background:#fff;color:#FF7A00;">刷新</button>' +
        '</div>';
      wrap.appendChild(head);

      // ===== 外卖工位（置顶，优先级最高） =====
      var taBox = U.el('div', { id: 'ta-box' });
      wrap.appendChild(taBox);

      // ===== 堂食桌台 =====
      var secHead = U.el('div', { class: 'card-title', style: 'margin:14px 0 10px;font-size:15px;' }, '堂食桌台');
      var grid = U.el('div', { class: 'table-grid' });
      wrap.appendChild(secHead);
      wrap.appendChild(grid);

      Promise.all([
        G.App.carts.list(),
        G.App.carts.lockedSlots(),
        G.App.carts.purgeLocks()
      ]).then(function (res) {
        var carts = res[0] || [];
        locked = res[1] || {};
        var map = {};
        carts.forEach(function (c) { map[c.slotId] = c; });

        var n = tableCount();
        var busy = carts.filter(function (c) { return c.items && c.items.length; }).length;
        var sub = wrap.querySelector('#tbl-sub');
        if (sub) sub.textContent = '共 ' + n + ' 桌 · 使用中 ' + busy + ' 桌';

        renderTakeaway(map[G.App.carts.takeawayId]);
        renderGrid(map, n);
        wrap.scrollTop = keepScroll;
      });

      wrap.querySelector('#btn-reset').addEventListener('click', onReset);
      wrap.querySelector('#btn-refresh').addEventListener('click', function () {
        refresh(); U.toast('已刷新', 'ok');
      });
    }

    /* ---------- 自动刷新 ----------
       点餐页 / 结账页改动的是同一份 IndexedDB，本页靠轮询感知：
         - 每 6 秒一次；页面在后台时跳过，省电；
         - 有弹窗打开时不重绘，避免把用户正操作的弹窗下面的 DOM 换掉；
         - 切回前台立即刷新一次。 */
    var pollTimer = null;
    function onVis() { if (!document.hidden) refresh(); }
    function startAutoRefresh() {
      stopAutoRefresh();
      pollTimer = setInterval(function () {
        if (document.hidden) return;
        if (document.querySelector('#modal-root .modal-mask')) return;
        refresh();
      }, 6000);
      document.addEventListener('visibilitychange', onVis);
    }
    function stopAutoRefresh() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      document.removeEventListener('visibilitychange', onVis);
    }
    // once:true —— 页面每渲染一次就挂一对监听，不摘掉会一直堆积
    window.addEventListener('hashchange', stopAutoRefresh, { once: true });
    window.addEventListener('pagehide', stopAutoRefresh, { once: true });

    function tableCount() { return +G.App.cfg.get('tableCount') || 50; }

    function statusOf(cart) {
      if (!cart || !cart.items || !cart.items.length) return 'idle';
      return cart.status === 'pending' ? 'pending' : 'using';
    }

    /* 被其他会话占用时先拦一道，避免两个会话同时改同一份购物车 */
    function guard(slotId, label, then) {
      if (!locked[slotId]) { then(); return; }
      U.confirm({
        title: label + '正被其他会话操作',
        message: '另一个标签页 / 设备正在操作' + label + '，同时下单可能造成数据错乱。建议先在那边完成结账再操作。',
        okText: '仍要进入', cancelText: '返回', danger: true
      }).then(function (ok) { if (ok) then(); });
    }

    /* ---------- 外卖大卡片 ---------- */
    function renderTakeaway(cart) {
      var box = wrap.querySelector('#ta-box');
      if (!box) return;
      box.innerHTML = '';

      var slotId = G.App.carts.takeawayId;
      var status = statusOf(cart);
      var total = cartTotal(cart);
      var isLocked = !!locked[slotId];

      var card = U.el('div', { class: 'table-card ta-card status-' + status, style: 'width:100%;' });
      card.innerHTML =
        '<div class="ta-head">' +
          '<span style="font-size:13px;font-weight:800;">📦 外卖订单</span>' +
          '<span class="ta-badge">' + STATE_TEXT[status] + (isLocked ? ' 🔒' : '') + '</span>' +
        '</div>' +
        '<div class="ta-body">' +
          '<div class="tc-num" style="font-size:16px;">外卖工位</div>' +
          '<div class="tc-state">' + (status === 'idle' ? '暂无进行中订单' : ('当前 RM ' + U.formatMoneyPlain(total))) + '</div>' +
          (cart && cart.orderNo ? '<div style="margin-top:4px;"><span class="order-no">' + U.escapeHTML(cart.orderNo) + '</span></div>' : '') +
        '</div>';

      card.addEventListener('click', function () {
        if (status === 'idle') {
          guard(slotId, '外卖工位', function () { G.Router.go('#/order?slot=' + slotId); });
        } else if (status === 'pending') {
          guard(slotId, '外卖工位', function () { openPendingModal(cart, '外卖'); });
        } else {
          guard(slotId, '外卖工位', function () { openBusyModal(cart, '外卖'); });
        }
      });
      box.appendChild(card);
    }

    /* ---------- 堂食网格 ---------- */
    function renderGrid(map, n) {
      var grid = wrap.querySelector('.table-grid');
      if (!grid) return;
      grid.innerHTML = '';

      for (var t = 1; t <= n; t++) {
        (function (tbl) {
          var slotId = G.App.carts.tableSlotId(tbl);
          var cart = map[slotId];
          var status = statusOf(cart);
          var total = cartTotal(cart);
          var label = '桌 ' + tbl + ' 号';

          var card = U.el('div', { class: 'table-card status-' + status });
          card.innerHTML =
            (locked[slotId] ? '<span class="tc-lock" title="其他会话正在操作">🔒</span>' : '') +
            '<div class="tc-num">' + tbl + '</div>' +
            '<div class="tc-state">' + STATE_TEXT[status] + '</div>' +
            (status !== 'idle' ? '<div class="tc-amt">RM ' + U.formatMoneyPlain(total) + '</div>' : '');

          card.addEventListener('click', function () {
            if (status === 'idle') {
              guard(slotId, label, function () { G.Router.go('#/order?slot=' + slotId); });
            } else if (status === 'pending') {
              guard(slotId, label, function () { openPendingModal(cart, label); });
            } else {
              guard(slotId, label, function () { openBusyModal(cart, label); });
            }
          });

          grid.appendChild(card);
        })(t);
      }
    }

    /* ---------- 弹窗 ---------- */
    function openBusyModal(cart, label) {
      var total = cartTotal(cart);
      var html =
        '<div class="modal-mask"><div class="modal" style="max-width:400px;">' +
          '<div class="modal-head"><h3>' + U.escapeHTML(label) + '</h3>' +
            '<button class="icon-btn" data-act="x" aria-label="关闭">' +
              '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>' +
            '</button></div>' +
          '<div class="modal-body">' +
            '<div style="text-align:center;padding:6px 0 2px;">' +
              (cart.orderNo ? '<div style="margin-bottom:10px;"><span class="order-no">' + U.escapeHTML(cart.orderNo) + '</span></div>' : '') +
              '<div style="font-size:13px;color:var(--muted);font-weight:600;">当前消费</div>' +
              '<div style="font-size:30px;font-weight:900;color:var(--primary);margin-top:4px;">RM ' + U.formatMoneyPlain(total) + '</div>' +
              '<div style="font-size:12px;color:var(--muted);margin-top:4px;">' + cart.items.length + ' 项菜品</div>' +
            '</div>' +
          '</div>' +
          '<div class="modal-foot">' +
            '<button class="btn btn-gray" data-act="close">关闭弹窗</button>' +
            '<button class="btn btn-ghost" data-act="more">继续点餐</button>' +
            '<button class="btn" data-act="pay">去结账</button>' +
          '</div>' +
        '</div></div>';
      bind(html, cart);
    }

    function openPendingModal(cart, label) {
      var total = cartTotal(cart);
      var html =
        '<div class="modal-mask"><div class="modal" style="max-width:400px;">' +
          '<div class="modal-head"><h3>' + U.escapeHTML(label) + ' · 待付款</h3>' +
            '<button class="icon-btn" data-act="x" aria-label="关闭">' +
              '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>' +
            '</button></div>' +
          '<div class="modal-body">' +
            '<div style="background:var(--danger-soft);border:1px solid var(--danger-line);color:var(--danger);padding:10px 12px;border-radius:12px;font-size:13px;font-weight:700;margin-bottom:12px;">' +
              '该单已下单，尚未完成付款，请优先收款。' +
            '</div>' +
            '<div style="text-align:center;padding:2px 0;">' +
              '<div style="margin-bottom:10px;"><span class="order-no" style="background:#FEE2E2;color:var(--danger);">' + U.escapeHTML(cart.orderNo || '未分配单号') + '</span></div>' +
              '<div style="font-size:13px;color:var(--muted);font-weight:600;">应收金额</div>' +
              '<div style="font-size:34px;font-weight:900;color:var(--danger);margin-top:4px;">RM ' + U.formatMoneyPlain(total) + '</div>' +
              '<div style="font-size:12px;color:var(--muted);margin-top:4px;">' + cart.items.length + ' 项菜品 · ' + U.escapeHTML(cart.payMethod || 'CASH') + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="modal-foot">' +
            '<button class="btn btn-gray" data-act="close">关闭弹窗</button>' +
            '<button class="btn btn-ghost" data-act="more">继续点餐</button>' +
            '<button class="btn" data-act="pay">确认收款</button>' +
          '</div>' +
        '</div></div>';
      bind(html, cart);
    }

    function bind(html, cart) {
      var m = U.openModal(html);
      m.addEventListener('click', function (e) {
        if (e.target === m || e.target.closest('[data-act="x"]') || e.target.closest('[data-act="close"]')) {
          U.closeAllModals(); return;
        }
        if (e.target.closest('[data-act="more"]')) {
          U.closeAllModals();
          G.Router.go('#/order?slot=' + cart.slotId);
          return;
        }
        if (e.target.closest('[data-act="pay"]')) {
          U.closeAllModals();
          G.Router.go('#/checkout?slot=' + cart.slotId);
        }
      });
    }

    function onReset() {
      U.confirm({
        title: '重置全部桌台与外卖？',
        message: '警告：确定要重置全部桌台与外卖？所有未结账购物车将会清空，历史订单不会删除。',
        okText: '确认重置', cancelText: '取消', danger: true
      }).then(function (ok) {
        if (!ok) return;
        G.App.carts.clearAll().then(function () {
          U.toast('已重置全部桌台与外卖', 'ok');
          refresh();
        });
      });
    }

    function cartTotal(c) {
      var t = 0;
      ((c && c.items) || []).forEach(function (l) { t += +l.subtotal || 0; });
      return Math.round(t * 100) / 100;
    }

    refresh();
    // 轮询必须显式启动：需求要求「点餐页改桌号 / 结账完成后，台桌页自动刷新，不用手动点」
    startAutoRefresh();
  }

  G.Views = G.Views || {};
  G.Views.tables = { render: render };
})(window);


/* ============ 68-views-checkout.js ============ */
/* 68-views-checkout.js · 结账页
   从台桌页 / 点餐页带入 slot，展示账单，确认后：
   生成单号（DI / TA）→ 写历史 → 清空购物车 → 打印小票 → 返回台桌 */
(function (G) {
  'use strict';
  var U = G.U;

  var PAY_METHODS = ['CASH 现金', 'Bank 银行转账', 'Tng E-Wallet', 'Boost Pay', 'Shopee Pay', 'Grab Pay'];

  function render(root, params) {
    params = params || {};
    var slotId = params.slot || G.App.carts.tableSlotId(G.App.cfg.get('defaultTable') || 1);
    var wrap = U.el('div', { class: 'page page-scroll' });
    root.appendChild(wrap);

    // 结账期间也要占着工位：否则收银员在点钞时，别的会话能把这桌当成空闲抢进去
    G.Flow.holdLock(slotId);

    G.App.carts.get(slotId).then(function (cart) {
      draw(cart);
    });

    function draw(cart) {
      wrap.innerHTML = '';
      var isTA = cart.kind === 'takeaway';
      var total = 0; (cart.items || []).forEach(function (l) { total += +l.subtotal || 0; });
      total = Math.round(total * 100) / 100;

      // 顶部橘色栏目
      var head = U.el('div', { class: 'bar-orange', style: 'display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex:0 0 auto;' });
      head.innerHTML =
        '<div>' +
          '<div style="font-size:12px;opacity:.92;font-weight:600;">结账收银</div>' +
          '<div style="font-size:19px;font-weight:800;margin-top:2px;">' +
            (isTA ? '📦 外卖订单' : ('堂食 · 桌 ' + (cart.table || '-') + ' 号')) +
          '</div>' +
        '</div>' +
        '<div style="display:flex;gap:6px;">' +
          '<button class="btn btn-sm" id="btn-back" style="background:rgba(255,255,255,.22);">返回台桌</button>' +
        '</div>';
      wrap.appendChild(head);

      if (!cart.items || cart.items.length === 0) {
        var empty = U.el('div', { class: 'card' });
        empty.innerHTML = '<div class="empty">' +
          '<div class="em">🧾</div>' +
          '<p>该' + (isTA ? '外卖' : '桌台') + '当前没有待结账菜品</p>' +
          '</div>';
        var b = U.el('button', { class: 'btn btn-block', style: 'margin-top:10px;' }, '返回台桌');
        b.addEventListener('click', function () { G.Router.go('#/tables'); });
        empty.appendChild(b);
        wrap.appendChild(empty);
        wrap.querySelector('#btn-back').addEventListener('click', function () { G.Router.go('#/tables'); });
        return;
      }

      // 桌台 / 人数 / 支付
      var info = U.el('div', { class: 'card' });
      if (!isTA) {
        var r1 = U.el('div', { style: 'display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;' });
        r1.innerHTML =
          '<div><label style="font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px;">桌号</label>' +
            '<input class="input" id="in-table" type="number" min="1" max="' + (+G.App.cfg.get('tableCount') || 50) + '" value="' + (cart.table || 1) + '"></div>' +
          '<div><label style="font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px;">人数</label>' +
            '<input class="input" id="in-pax" type="number" min="1" max="10" value="' + (cart.pax || 2) + '"></div>';
        info.appendChild(r1);
      }
      var payWrap = U.el('div');
      payWrap.innerHTML = '<label style="font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px;">支付方式</label>';
      var sel = U.el('select', { class: 'select' });
      PAY_METHODS.forEach(function (m) {
        var v = m.split(' ')[0];
        var o = U.el('option', { value: v }, m);
        if (v === (cart.payMethod || 'CASH')) o.setAttribute('selected', 'selected');
        sel.appendChild(o);
      });
      payWrap.appendChild(sel);
      info.appendChild(payWrap);
      wrap.appendChild(info);

      // 账单
      var bill = U.el('div', { class: 'card' });
      bill.innerHTML = '<div class="card-title">消费明细 <span class="hint">' + cart.items.length + ' 项</span></div>';
      cart.items.forEach(function (it) {
        var meta = [];
        if (it.specName) meta.push(it.specName);
        if (it.addons && it.addons.length) meta.push('+' + it.addons.map(function (a) { return a.name; }).join('/'));
        if (it.excludes && it.excludes.length) meta.push('-' + it.excludes.map(function (e) { return e.name; }).join('/'));
        var row = U.el('div', { class: 'row' });
        row.innerHTML =
          '<div class="grow">' +
            '<div class="t">' + U.escapeHTML(it.name) + '</div>' +
            '<div class="s">' + U.formatMoneyPlain(it.unitPrice) + ' × ' + it.qty +
              (meta.length ? '  ·  ' + U.escapeHTML(meta.join(' · ')) : '') + '</div>' +
          '</div>' +
          '<div class="amt">RM ' + U.formatMoneyPlain(it.subtotal) + '</div>';
        bill.appendChild(row);
      });
      var tr = U.el('div', { style: 'display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);margin-top:8px;padding-top:12px;' });
      tr.innerHTML = '<span style="font-size:14px;font-weight:700;color:var(--muted);">合计</span>' +
        '<span style="font-size:30px;font-weight:900;color:var(--primary);">RM ' + U.formatMoneyPlain(total) + '</span>';
      bill.appendChild(tr);
      wrap.appendChild(bill);

      // 操作
      var ops = U.el('div', { class: 'card', style: 'display:flex;gap:10px;flex-wrap:wrap;' });
      var btnMore = U.el('button', { class: 'btn btn-ghost', style: 'flex:1 1 130px;' }, '返回加菜');
      var btnPay = U.el('button', { class: 'btn', style: 'flex:2 1 200px;' }, '确认结账并打印小票');
      ops.appendChild(btnMore);
      ops.appendChild(btnPay);
      wrap.appendChild(ops);

      var tip = U.el('div', { style: 'font-size:12px;color:var(--muted);text-align:center;padding:6px 0 4px;' });
      tip.textContent = isTA ? '结账后生成外卖单号 TAxxx' : '结账后生成堂食单号 DI xxx';
      wrap.appendChild(tip);

      // 事件
      wrap.querySelector('#btn-back').addEventListener('click', function () { G.Router.go('#/tables'); });
      btnMore.addEventListener('click', function () { G.Router.go('#/order?slot=' + slotId); });
      sel.addEventListener('change', function () {
        cart.payMethod = sel.value;
        G.App.carts.save(cart);
      });
      if (!isTA) {
        var inT = wrap.querySelector('#in-table');
        var inP = wrap.querySelector('#in-pax');
        inT.addEventListener('change', function () {
          var v = U.clamp(+inT.value || 1, 1, +G.App.cfg.get('tableCount') || 50);
          // 换桌：把当前购物车迁移到新桌
          if (v === cart.table) return;
          U.confirm({ title: '转移到桌 ' + v + '？', message: '这张单的菜品将从桌 ' + cart.table + ' 转移到桌 ' + v + '。' }).then(function (ok) {
            if (!ok) { inT.value = cart.table; return; }
            var oldSlot = cart.slotId;
            G.App.carts.clear(oldSlot).then(function () {
              cart.slotId = G.App.carts.tableSlotId(v);
              cart.table = v;
              return G.App.carts.save(cart);
            }).then(function () { G.Router.go('#/checkout?slot=' + cart.slotId); });
          });
        });
        inP.addEventListener('change', function () {
          cart.pax = U.clamp(+inP.value || 1, 1, 10);
          inP.value = cart.pax;
          G.App.carts.save(cart);
        });
      }

      btnPay.addEventListener('click', function () {
        btnPay.disabled = true; btnPay.textContent = '处理中…';
        G.Flow.checkout(cart).then(function (order) {
          U.toast('结账完成 · ' + order.orderNo, 'ok');
          // 打印（未开自动打印时，结账页总是出小票）
          if (!G.App.cfg.get('autoPrint')) {
            return G.Print.print(order).then(function () { return order; }, function () { return order; });
          }
          return order;
        }).then(function (order) {
          showDone(order);
        }).catch(function (e) {
          btnPay.disabled = false; btnPay.textContent = '确认结账并打印小票';
          U.toast('结账失败：' + e.message, 'err');
        });
      });
    }

    function showDone(order) {
      var isTA = order.kind === 'takeaway';
      var html =
        '<div class="modal-mask"><div class="modal" style="max-width:400px;">' +
          '<div class="modal-head"><h3>结账完成</h3></div>' +
          '<div class="modal-body">' +
            '<div style="text-align:center;padding:6px 0;">' +
              '<div style="font-size:38px;margin-bottom:4px;">✅</div>' +
              '<div style="font-size:24px;font-weight:900;color:var(--primary);letter-spacing:1px;">' + U.escapeHTML(order.orderNo) + '</div>' +
              '<div style="font-size:13px;color:var(--muted);margin-top:6px;">' +
                (isTA ? '📦 外卖订单' : ('堂食 · 桌 ' + order.table + ' 号')) +
                '  ·  ' + U.escapeHTML(order.payMethod) +
              '</div>' +
              '<div style="font-size:30px;font-weight:900;margin-top:10px;">RM ' + U.formatMoneyPlain(order.total) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="modal-foot">' +
            '<button class="btn btn-ghost" data-act="reprint">重打小票</button>' +
            '<button class="btn" data-act="back">返回台桌</button>' +
          '</div>' +
        '</div></div>';
      var m = U.openModal(html);
      m.addEventListener('click', function (e) {
        if (e.target.closest('[data-act="reprint"]')) {
          G.Flow.reprint(order).then(function () { U.toast('已重发小票', 'ok'); },
                                    function (err) { U.toast('打印失败：' + err.message, 'err'); });
          return;
        }
        if (e.target.closest('[data-act="back"]')) {
          U.closeAllModals();
          G.Router.go('#/tables');
        }
      });
    }
  }

  G.Views = G.Views || {};
  G.Views.checkout = { render: render };
})(window);


/* ============ 99-app.js ============ */
/* 99-app.js · 路由、引导、顶部时钟、导航 */
(function (G) {
  'use strict';
  var U = G.U;

  var ROUTES = [
    { id: 'home',     hash: '#/home',     title: '工作台',     icon: '<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a2 2 0 01-2 2h-4v-7H9v7H5a2 2 0 01-2-2V11z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>' },
    { id: 'tables',   hash: '#/tables',   title: '台桌',       icon: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M3 10h18M9 10v9M15 10v9" stroke="currentColor" stroke-width="2" fill="none"/></svg>' },
    { id: 'order',    hash: '#/order',    title: '点餐',       icon: '<svg viewBox="0 0 24 24"><path d="M3 6h18l-2 12H5L3 6zm5 0a4 4 0 018 0" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' },
    { id: 'cashier',  hash: '#/cashier',  title: '收银',       icon: '<svg viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h10M4 18h16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>' },
    { id: 'ledger',   hash: '#/ledger',   title: '记账',       icon: '<svg viewBox="0 0 24 24"><path d="M4 7h16v12H4z M8 7v12 M16 11h-4 M16 15h-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>' },
    { id: 'calendar', hash: '#/calendar', title: '日历',       icon: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M3 9h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>' },
    { id: 'menu',     hash: '#/menu',     title: '菜单',       icon: '<svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z M4 9h16 M8 5v14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>' },
    { id: 'settings', hash: '#/settings', title: '设置',       icon: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.5-2-3.4-2.4 1a7 7 0 00-2-1.2l-.4-2.6h-4l-.4 2.6a7 7 0 00-2 1.2l-2.4-1-2 3.4 2 1.5A7 7 0 005 12a7 7 0 00.1 1.2l-2 1.5 2 3.4 2.4-1a7 7 0 002 1.2l.4 2.6h4l.4-2.6a7 7 0 002-1.2l2.4 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>' }
  ];

  /* 解析 #/xxx?a=b&c=d → { id, params } */
  function parseHash(hash) {
    var h = String(hash || '').replace(/^#\/?/, '');
    var qi = h.indexOf('?');
    var id = qi >= 0 ? h.slice(0, qi) : h;
    var params = {};
    if (qi >= 0) {
      h.slice(qi + 1).split('&').forEach(function (kv) {
        if (!kv) return;
        var p = kv.split('=');
        params[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
      });
    }
    return { id: id || 'home', params: params };
  }

  function buildNav() {
    var list = document.getElementById('nav-list');
    list.innerHTML = '';
    ROUTES.forEach(function (r) {
      var li = U.el('li');
      var a = U.el('a', { href: r.hash, 'data-route': r.id, html: r.icon + '<span>' + r.title + '</span>' });
      a.addEventListener('click', function (e) {
        e.preventDefault(); G.Router.go(r.hash);
      });
      li.appendChild(a);
      list.appendChild(li);
    });
    var tabbar = document.getElementById('tabbar');
    tabbar.innerHTML = '';
    // 手机 tab 取前 5 个
    ROUTES.slice(0, 5).forEach(function (r) {
      var b = U.el('button', { class: 'tab', 'data-route': r.id, html: r.icon + '<span>' + r.title + '</span>' });
      b.addEventListener('click', function () { G.Router.go(r.hash); });
      tabbar.appendChild(b);
    });
  }

  function highlight(cur) {
    U.qsa('[data-route]').forEach(function (n) {
      var match = n.getAttribute('data-route') === cur;
      n.classList.toggle('active', match);
    });
  }

  function navTo(hash) {
    var parsed = parseHash(hash);
    var id = parsed.id;
    // checkout 不在导航里，但是合法路由
    var valid = ROUTES.some(function (r) { return r.id === id; }) || id === 'checkout';
    if (!valid) id = ROUTES[0].id;
    highlight(id);
    var root = document.getElementById('view-root');
    root.innerHTML = '';
    var view = (G.Views && G.Views[id]) || G.Views.home;
    try { view.render(root, parsed.params); }
    catch (e) { console.error(e); U.toast('页面加载失败：' + e.message, 'err'); }
  }

  G.Router = {
    go: function (h) {
      if (location.hash === h) {
        // 强制刷新
        navTo(h);
      } else {
        location.hash = h;
      }
      // 关闭侧边栏
      document.getElementById('sidenav').classList.remove('open');
      document.getElementById('nav-backdrop').classList.remove('show');
    }
  };

  /* 顶部全局时钟 */
  var _clockTimer = null;
  function tickClock() {
    var tEl = document.getElementById('clock-time');
    var dEl = document.getElementById('clock-date');
    var gEl = document.getElementById('clock-greet');
    if (!tEl) return;
    var d = new Date();
    tEl.textContent = U.formatTime(d);
    dEl.textContent = U.formatDate(d) + ' ' + U.weekdayCN[d.getDay()];
    gEl.textContent = U.greeting(d) + '，小二在岗';
  }
  function startClock() {
    tickClock();
    if (_clockTimer) clearInterval(_clockTimer);
    _clockTimer = setInterval(tickClock, 1000);
  }

  function bindGlobal() {
    document.getElementById('btn-menu-toggle').addEventListener('click', function () {
      document.getElementById('sidenav').classList.add('open');
      document.getElementById('nav-backdrop').classList.add('show');
    });
    document.getElementById('btn-menu-close').addEventListener('click', closeNav);
    document.getElementById('nav-backdrop').addEventListener('click', closeNav);
    function closeNav() {
      document.getElementById('sidenav').classList.remove('open');
      document.getElementById('nav-backdrop').classList.remove('show');
    }
    document.getElementById('btn-quick-settings').addEventListener('click', function () {
      closeNav(); G.Router.go('#/settings');
    });
    // 网络状态
    function syncNet() {
      var s = document.getElementById('net-status');
      s.textContent = navigator.onLine ? '在线' : '离线可用';
      s.className = 'pill-status' + (navigator.onLine ? '' : ' warn');
    }
    window.addEventListener('online', syncNet);
    window.addEventListener('offline', syncNet);
    syncNet();
  }

  function registerSW() {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'http:' && location.protocol !== 'https:' && location.host !== 'localhost') return;
    navigator.serviceWorker.register('service-worker.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            U.toast('新版本已就绪，重启后生效', 'ok');
          }
        });
      });
    }).catch(function () { /* 失败不致命 */ });
  }

  function boot() {
    G.App.cfg.load();
    G.Theme.apply();
    buildNav();
    bindGlobal();
    startClock();

    // 种子数据
    G.App.seedIfEmpty().then(function () { /* ready */ });

    // 首次打开：根据 hash 决定
    if (!location.hash) location.hash = '#/home';
    window.addEventListener('hashchange', function () { navTo(location.hash); });
    navTo(location.hash);

    // 关闭启动屏
    setTimeout(function () {
      var bs = document.getElementById('boot-screen');
      if (bs) { bs.classList.add('hide'); setTimeout(function () { bs.remove(); }, 320); }
    }, 220);

    // SW
    registerSW();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);

</script>
