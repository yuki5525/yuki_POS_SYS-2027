      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);        // version needed
      lv.setUint16(6, 0x0800, true);    // flags：UTF-8 文件名
      lv.setUint16(8, 0, true);         // 方法：stored
      lv.setUint16(10, DOS_TIME, true);
      lv.setUint16(12, DOS_DATE, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, data.length, true);
      lv.setUint32(22, data.length, true);
      lv.setUint16(26, nb.length, true);
      lv.setUint16(28, 0, true);        // extra len
      lh.set(nb, 30);
      chunks.push(lh, data);

      var ch = new Uint8Array(46 + nb.length), cv = new DataView(ch.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);        // version made by
      cv.setUint16(6, 20, true);        // version needed
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, DOS_TIME, true);
      cv.setUint16(14, DOS_DATE, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, data.length, true);
      cv.setUint32(24, data.length, true);
      cv.setUint16(28, nb.length, true);
      cv.setUint16(30, 0, true);        // extra
      cv.setUint16(32, 0, true);        // comment
      cv.setUint16(34, 0, true);        // disk start
      cv.setUint16(36, 0, true);        // internal attrs
      cv.setUint32(38, 0, true);        // external attrs
      cv.setUint32(42, offset, true);
      ch.set(nb, 46);
      central.push(ch);

      offset += lh.length + data.length;
    });

    var cdSize = 0;
    for (i = 0; i < central.length; i++) cdSize += central[i].length;

    var end = new Uint8Array(22), ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);

    return concat(chunks.concat(central, [end]));

  /* ---------- XML ---------- */
  function esc(s) {

      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

  function colName(i) {          // 0 → A，25 → Z，26 → AA

      var m = (i - 1) % 26;

      i = Math.floor((i - 1) / 26);

  }

  function safeSheetName(name, idx) {
    var s = String(name || ('Sheet' + (idx + 1)));

    if (s.length > 31) s = s.slice(0, 31);

  }

  /* 单元格：裸值 或 { v, s } */
  function cellXML(ref, cell) {
    var v = cell, s = 0;
    if (cell && typeof cell === 'object' && !Array.isArray(cell)) { v = cell.v; s = cell.s || 0; }
    var attr = ' r="' + ref + '"' + (s ? ' s="' + s + '"' : '');
    if (v == null || v === '') return '<c' + attr + '/>';
    if (typeof v === 'number' && isFinite(v)) return '<c' + attr + '><v>' + v + '</v></c>';

    var maxCol = 1, maxRow = rows.length || 1;

    out.push('<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">');
    out.push('<dimension ref="A1:' + colName(Math.max(maxCol - 1, cols.length - 1, 0)) + maxRow + '"/>');
    out.push('<sheetViews><sheetView workbookViewId="0">' +
             '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>' +

      out.push('<cols>');
      for (c = 0; c < cols.length; c++) {

    for (r = 0; r < rows.length; r++) {

    '</fonts>' +
    '<fills count="3">' +
      '<fill><patternFill patternType="none"/></fill>' +
      '<fill><patternFill patternType="gray125"/></fill>' +
      '<fill><patternFill patternType="solid"><fgColor rgb="FFFFF2CC"/><bgColor indexed="64"/></patternFill></fill>' +
    '</fills>' +
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +

    '<cellXfs count="3">' +

                'Target="worksheets/sheet' + (i + 1) + '.xml"/>');

      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +

      '</Types>';

      '<Relationship Id="rId1" Type="' +
      'http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" ' +
      'Target="xl/workbook.xml"/></Relationships>';

      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheets>' + sheetsXML + '</sheets></workbook>';

      { name: '[Content_Types].xml', data: utf8(contentTypes) },
      { name: '_rels/.rels', data: utf8(rootRels) },

/* ============ 29-inv.js ============ */
/* 29-inv.js · 进出货库存数据层
   三张单据表合一：inventory 一条记录就是一个单据，type = in 进货 / out 出库 / loss 报损。
   库存永远是算出来的，不落库 —— 进货 − 出库 − 报损，删掉任何一张单据，
   汇总立刻跟着变，不用维护两份数据。

   单一口径：
     · 汇总行按「货品名 + 单位」分组；配了换算的货品，按基准单位合成一行。
     · 换算只影响统计，绝不改写原始单据里的数量和单位。
     · 照片跟单据同生共死，删单据连带删照片。 */
(function (G) {
  'use strict';

  var U = G.U, DB = G.DB;

  /* 预设 9 个单位。自定义单位和预设是互斥的两套：
     选了下拉里的预设，自定义输入框就清空；填了自定义，下拉就回到「自定义」。 */
  var UNITS = ['公斤 Kg', '克 g', '支 Pieces', '瓶 Bottle', '罐 Tong',
               '包 Bag', '捆 a bundle', '条 pieces', '粒 grain'];

  var TYPE_TEXT = { in: '进货', out: '出库', loss: '报损' };
  var TYPES = ['in', 'out', 'loss'];

  function round4(n) { return Math.round((+n || 0) * 10000) / 10000; }
  function round2(n) { return Math.round((+n || 0) * 100) / 100; }
  function norm(s) { return String(s == null ? '' : s).trim(); }

  /* 汇总行的键。没配换算时按「名+单位」分组，配了换算时整合成「名」。 */
  function keyOf(name, unit) { return norm(name) + '|@|' + norm(unit); }

  /* ---------- 权限闸门：员工只读 ---------- */
  function canEdit() { return G.App.operator.can('invEdit'); }
  function guardEdit() {
    if (canEdit()) return true;
    U.toast('员工模式只能查看进出货，不能新增 / 修改 / 删除', 'err');
    return false;
  }

  /* ================= 配置：单位 / 阈值 / 换算（invConfig） ================= */

  function cfgGet(k, fallback) {
    return DB.get('invConfig', k).then(function (r) {
      return (r && r.v != null) ? r.v : fallback;
    });
  }
  function cfgSet(k, v) { return DB.put('invConfig', { k: k, v: v }); }
  function cfgDel(k) { return DB.del('invConfig', k); }

  /* 自定义单位：预设之外自己加的，和预设列表拼在一起展示 */
  function listUnits() {
    return cfgGet('customUnits', []).then(function (extra) {
      var seen = {}, out = [];
      UNITS.forEach(function (u) { seen[u] = 1; out.push(u); });
      (extra || []).forEach(function (u) {
        u = norm(u);
        if (u && !seen[u]) { seen[u] = 1; out.push(u); }
      });
      return out;
    });
  }
  function addUnit(name) {
    name = norm(name);
    if (!name) return Promise.resolve(false);
    return cfgGet('customUnits', []).then(function (extra) {
      extra = extra || [];
      if (extra.indexOf(name) >= 0 || UNITS.indexOf(name) >= 0) return false;
      extra.push(name);
      return cfgSet('customUnits', extra).then(function () { return true; });
    });
  }
  function delUnit(name) {
    return cfgGet('customUnits', []).then(function (extra) {
      extra = (extra || []).filter(function (u) { return u !== name; });
      return cfgSet('customUnits', extra);
    });
  }

  /* 安全阈值：{ '<汇总行键>': 数字 }。库存 ≤ 阈值就告警 */
  function allThresholds() { return cfgGet('thresholds', {}); }
  function getThreshold(key) {
    return allThresholds().then(function (m) { return (m && m[key] != null) ? +m[key] : null; });
  }
  function setThreshold(key, qty) {
    return allThresholds().then(function (m) {
      m = m || {};
      if (qty == null || qty === '' || isNaN(+qty)) delete m[key];
      else m[key] = +qty;
      return cfgSet('thresholds', m);
    });
  }

  /* 单位换算：{ '<货品名>': { base: '公斤 Kg', rates: { '公斤 Kg': 1, '克 g': 0.001 } } }
     只在统计时按 rates 折算成基准单位，原始单据一字不改。 */
  function allConv() { return cfgGet('conversions', {}); }
  function getConv(name) {
    return allConv().then(function (m) { return (m && m[name]) || null; });
  }
  function setConv(name, base, rates) {
    return allConv().then(function (m) {
      m = m || {};
      if (!base || !rates) delete m[name];
      else m[name] = { base: base, rates: rates };
      return cfgSet('conversions', m);
    });
  }
  function delConv(name) { return setConv(name, null, null); }

  /* ================= 供应商档案（supplier） ================= */

  function listSuppliers() {
    return DB.getAll('supplier').then(function (arr) {
      arr.sort(function (a, b) { return norm(a.name).localeCompare(norm(b.name), 'zh'); });
      return arr;
    });
  }
  function supplierNames() {
    return listSuppliers().then(function (arr) {
      return arr.filter(function (s) { return s.active !== false; })
                .map(function (s) { return norm(s.name); })
                .filter(Boolean);
    });
  }
  function saveSupplier(s) {
    if (!canEdit()) { U.toast('员工模式不能改供应商档案', 'err'); return Promise.resolve(null); }
    s = s || {};
    s.name = norm(s.name);
    if (!s.name) return Promise.resolve(null);
    if (!s.id) s.id = U.uid();
    s.phone = norm(s.phone); s.contact = norm(s.contact); s.note = norm(s.note);
    if (s.active == null) s.active = true;
    return DB.put('supplier', s).then(function () { return s.id; });
  }
  function delSupplier(id) {
    if (!guardEdit()) return Promise.resolve(null);
    return DB.del('supplier', id);
  }

  /* ================= 单据（inventory） ================= */

  function listRecords() {
    return DB.getAll('inventory').then(function (arr) {
      arr.sort(function (a, b) { return (+b.time || 0) - (+a.time || 0); });
      return arr;
    });
  }

  /* 筛选：type / from / to（毫秒）/ keyword（货品名、人员、供应商、备注、单号） */
  function filterRecords(arr, opt) {
    opt = opt || {};
    var kw = norm(opt.keyword).toLowerCase();
    return arr.filter(function (r) {
      if (opt.type && r.type !== opt.type) return false;
      if (opt.from != null && (+r.time || 0) < +opt.from) return false;
      if (opt.to != null && (+r.time || 0) > +opt.to) return false;
      if (kw) {
        var hay = [r.itemName, r.unit, r.buyer, r.receiver, r.taker, r.supplier,
                   r.note, r.no].map(norm).join(' ').toLowerCase();
        if (hay.indexOf(kw) < 0) return false;
      }
      return true;
    });
  }

  /* 时间倒序的列表，带筛选 */
  function query(opt) {
    return listRecords().then(function (arr) { return filterRecords(arr, opt); });
  }

  function getRecord(id) { return DB.get('inventory', id); }

  /* 金额：数量 × 单价 自动算，传了 amount 就以传的为准（允许微调） */
  function calcAmount(rec) {
    if (rec.type !== 'in') return round2(rec.amount);
    if (rec.amount != null && rec.amount !== '' && !isNaN(+rec.amount)) return round2(rec.amount);
    var q = +rec.qty || 0, p = +rec.price || 0;
    return round2(q * p);
  }

  function normalize(rec) {
    rec.itemName = norm(rec.itemName);
    rec.unit = norm(rec.unit);
    rec.qty = +rec.qty || 0;
    if (rec.type === 'in') {
      rec.price = rec.price === '' || rec.price == null || isNaN(+rec.price) ? null : round2(rec.price);
      rec.amount = calcAmount(rec);
      rec.buyer = norm(rec.buyer); rec.receiver = norm(rec.receiver); rec.supplier = norm(rec.supplier);
    } else {
      rec.price = null; rec.amount = 0;
      rec.taker = norm(rec.taker);
    }
    rec.note = norm(rec.note);
    if (!rec.time) rec.time = Date.now();
    rec.time = +rec.time;
    rec.dateKey = U.formatDate(new Date(rec.time));
    if (!rec.photos || !Array.isArray(rec.photos)) rec.photos = [];
    return rec;
  }

  function saveRecord(rec) {
    if (!guardEdit()) return Promise.resolve(null);
    if (!rec.itemName || !norm(rec.itemName)) { U.toast('货品名不能为空', 'err'); return Promise.resolve(null); }
    if (!rec.qty || +rec.qty === 0) { U.toast('数量不能为 0', 'err'); return Promise.resolve(null); }
    normalize(rec);
    if (!rec.id) rec.id = U.uid();
    if (!rec.no) rec.no = docNo(rec.type, rec.time);
    return DB.put('inventory', rec).then(function () { return rec.id; });
  }

  var NO_PREFIX = { in: 'IN', out: 'OUT', loss: 'LOSS' };
  function docNo(type, time) {
    var d = new Date(time || Date.now());
    var s = U.formatDate(d).replace(/\//g, '');   // DDMMYYYY
    return (NO_PREFIX[type] || 'INV') + '-' + s + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
  }

  /* 删单据 → 连带删它名下的所有照片，不留孤儿文件 */
  function delRecord(id) {
    if (!guardEdit()) return Promise.resolve(null);
    return delPhotosOf(id).then(function () { return DB.del('inventory', id); });
  }

  function delByType(type) {
    if (!guardEdit()) return Promise.resolve(0);
    return listRecords().then(function (arr) {
      var ids = arr.filter(function (r) { return r.type === type; })
                   .map(function (r) { return r.id; });
      return ids.reduce(function (p, id) {
        return p.then(function () { return delRecord(id); });
      }, Promise.resolve()).then(function () { return ids.length; });
    });
  }

  /* ================= 单据照片（inventoryPhotos） ================= */

  function listPhotos(inventoryId) {
    return DB.getByIndex('inventoryPhotos', 'inventoryId', inventoryId);
  }
  function getPhoto(id) { return DB.get('inventoryPhotos', id); }

  function addPhotos(inventoryId, files) {
    return getRecord(inventoryId).then(function (rec) {
      if (!rec) return 0;
      var ids = [];
      return (files || []).reduce(function (p, f) {
        return p.then(function () {
          var id = U.uid();
          return DB.put('inventoryPhotos', {
            id: id, inventoryId: inventoryId,
            blob: f.blob, name: norm(f.name), createdAt: Date.now()
          }).then(function () { ids.push(id); });
        });
      }, Promise.resolve()).then(function () {
        rec.photos = (rec.photos || []).concat(ids);
        return DB.put('inventory', rec).then(function () { return ids.length; });
      });
    });
  }

  function delPhoto(id) {
    if (!guardEdit()) return Promise.resolve(null);
    return DB.get('inventoryPhotos', id).then(function (p) {
      if (!p) return null;
      return DB.del('inventoryPhotos', id).then(function () {
        return getRecord(p.inventoryId).then(function (rec) {
          if (!rec) return id;
          rec.photos = (rec.photos || []).filter(function (x) { return x !== id; });
          return DB.put('inventory', rec).then(function () { return id; });
        });
      });
    });
  }

  function delPhotosOf(inventoryId) {
    return listPhotos(inventoryId).then(function (arr) {
      return arr.reduce(function (p, ph) {
        return p.then(function () { return DB.del('inventoryPhotos', ph.id); });
      }, Promise.resolve()).then(function () { return arr.length; });
    });
  }

  /* ================= 库存汇总 ================= */

  /* 返回 [{ key, itemName, unit, inQty, outQty, lossQty, current,
             amountIn, count, lastTime, threshold, low, convOn, baseUnit }]
     convOn = true 表示这一行是换算合成出来的（unit 是基准单位） */
  function stockSummary() {
    return Promise.all([listRecords(), allThresholds(), allConv()]).then(function (r) {
      var recs = r[0], th = r[1] || {}, conv = r[2] || {};
      var map = {}, order = [];

      recs.forEach(function (rec) {
        var name = norm(rec.itemName);
        if (!name) return;
        var unit = norm(rec.unit);
        var c = conv[name];
        var rowKey, rowUnit, factor, convOn = false;

        if (c && c.base && c.rates) {
          if (unit === c.base) { factor = 1; }
          else if (c.rates[unit] != null) { factor = +c.rates[unit] || 0; }
          else { factor = null; }
          if (factor != null) { rowKey = name; rowUnit = c.base; convOn = true; }
        }
        if (factor == null) { rowKey = keyOf(name, unit); rowUnit = unit; factor = 1; }

        var row = map[rowKey];
        if (!row) {
          row = map[rowKey] = {
            key: rowKey, itemName: name, unit: rowUnit,
            inQty: 0, outQty: 0, lossQty: 0, current: 0,
            amountIn: 0, count: 0, lastTime: 0,
            threshold: null, low: false, convOn: convOn, baseUnit: convOn ? rowUnit : unit,
            units: {}
          };
          order.push(rowKey);
        }
        var q = (+rec.qty || 0) * factor;
        if (rec.type === 'in') { row.inQty += q; row.amountIn += (+rec.amount || 0); }
        else if (rec.type === 'out') row.outQty += q;
        else if (rec.type === 'loss') row.lossQty += q;
        row.count += 1;
        row.units[unit] = true;
        if ((+rec.time || 0) > row.lastTime) row.lastTime = +rec.time || 0;
      });

      var rows = order.map(function (k) {
        var row = map[k];
        row.inQty = round4(row.inQty);
        row.outQty = round4(row.outQty);
        row.lossQty = round4(row.lossQty);
        row.current = round4(row.inQty - row.outQty - row.lossQty);
        row.amountIn = round2(row.amountIn);
        row.threshold = (th[k] != null) ? +th[k] : null;
        row.low = row.threshold != null && row.current <= row.threshold;
        return row;
      });

      /* 不足的排前面，其余按货品名 */
      rows.sort(function (a, b) {
        if (a.low !== b.low) return a.low ? -1 : 1;
        return a.itemName.localeCompare(b.itemName, 'zh') ||
               a.unit.localeCompare(b.unit, 'zh');
      });
      return rows;
    });
  }

  function lowCount() {
    return stockSummary().then(function (rows) {
      return rows.filter(function (r) { return r.low; }).length;
    });
  }

  /* 点汇总行 → 这个货品的历史明细（不看单位，同名全列出） */
  function itemHistory(itemName) {
    var name = norm(itemName);
    return listRecords().then(function (arr) {
      return arr.filter(function (r) { return norm(r.itemName) === name; });
    });
  }

  /* 某货品在单据里出现过的单位，给换算配置做候选 */
  function unitsUsed(itemName) {
    return itemHistory(itemName).then(function (arr) {
      var seen = {}, out = [];
      arr.forEach(function (r) {
        var u = norm(r.unit);
        if (u && !seen[u]) { seen[u] = 1; out.push(u); }
      });
      return out;
    });
  }

  /* ================= 顶部统计 ================= */
  function stats(opt) {
    return query(opt).then(function (arr) {
      var s = { inCount: 0, outCount: 0, lossCount: 0, inQty: 0, outQty: 0, lossQty: 0, inAmount: 0 };
      arr.forEach(function (r) {
        var q = +r.qty || 0;
        if (r.type === 'in') { s.inCount++; s.inQty += q; s.inAmount += (+r.amount || 0); }
        else if (r.type === 'out') { s.outCount++; s.outQty += q; }
        else if (r.type === 'loss') { s.lossCount++; s.lossQty += q; }
      });
      s.inQty = round4(s.inQty); s.outQty = round4(s.outQty); s.lossQty = round4(s.lossQty);
      s.inAmount = round2(s.inAmount);
      return s;
    });
  }

  /* ================= 导出 ================= */

  function summarySheet() {
    return stockSummary().then(function (rows) {
      var out = [G.XLSX.head(['货品名', '单位', '进货合计', '出库合计', '报损合计', '当前库存',
                              '安全阈值', '进货金额(RM)', '最后变动'])];
      rows.forEach(function (r) {
        var last = r.lastTime ? U.formatDate(new Date(r.lastTime)) : '';
        out.push([r.itemName, r.unit, r.inQty, r.outQty, r.lossQty,
                  { v: r.current, s: (r.current < 0 || r.low) ? 2 : 0 },
                  r.threshold == null ? '' : r.threshold,
                  r.amountIn, last]);
      });
      return { name: '库存汇总', cols: [22, 14, 12, 12, 12, 12, 12, 14, 14], rows: out };
    });
  }

  function recordSheet(type, opt) {
    return query(Object.assign({}, opt, { type: type })).then(function (arr) {
      var isIn = type === 'in';
      var headRow = isIn
        ? ['单号', '时间', '货品名', '单位', '数量', '单价(RM)', '金额(RM)', '进货人', '收货人', '供应商', '备注']
        : ['单号', '时间', '货品名', '单位', '数量', (type === 'out' ? '领用人' : '报损人'), '备注'];
      var out = [G.XLSX.head(headRow)];
      arr.forEach(function (r) {
        var tm = r.time ? (U.formatDate(new Date(r.time)) + ' ' + U.formatHM(new Date(r.time))) : '';
        var base = [r.no || '', tm, r.itemName, r.unit, +r.qty || 0];
        out.push(isIn
          ? base.concat([r.price == null ? '' : r.price, +r.amount || 0,
                         r.buyer || '', r.receiver || '', r.supplier || '', r.note || ''])
          : base.concat([r.taker || '', r.note || '']));
      });
      return { name: TYPE_TEXT[type] + '记录',
               cols: isIn ? [20, 20, 20, 12, 10, 10, 12, 12, 12, 18, 24]
                          : [20, 20, 20, 12, 10, 12, 24],
               rows: out };
    });
  }

  /* ================= 挂载 ================= */

  G.App.inv = {
    UNITS: UNITS, TYPES: TYPES, TYPE_TEXT: TYPE_TEXT,
    units: listUnits, addUnit: addUnit, delUnit: delUnit,
    thresholds: { all: allThresholds, get: getThreshold, set: setThreshold },
    conv: { all: allConv, get: getConv, set: setConv, del: delConv, used: unitsUsed },
    query: query, list: listRecords, get: getRecord, save: saveRecord,
    del: delRecord, delByType: delByType, docNo: docNo, calcAmount: calcAmount,
    photos: { list: listPhotos, get: getPhoto, add: addPhotos, del: delPhoto, delOf: delPhotosOf },
    summary: stockSummary, lowCount: lowCount, history: itemHistory, stats: stats,
    sheets: { summary: summarySheet, records: recordSheet },
    canEdit: canEdit,
    keyOf: keyOf, round4: round4
  };

  G.App.supplier = {
    list: listSuppliers, names: supplierNames, save: saveSupplier, del: delSupplier
  };
})(window);


/* ============ 31-biz.js ============ */
/* 31-biz.js · 营业模式（早餐 / 午餐 / 晚餐 …）
   一道菜用 businessTags 标自己属于哪些时段；顶栏切当前模式，点餐页只出该时段的菜。

   三条设计决定：
   1) 订单要存 businessMode 快照。菜单上的 tags 以后会改，
      历史报表得知道「这张单当时算早餐还是晚餐」，不能拿今天的配置去倒推。
   2) 菜没标任何 tags = 全时段都卖。这样老板配模式时不用回头把几百道菜一个个标一遍，
      只对真正分时段的那几道菜打标即可 —— 漏标是「照常卖」，不是「消失了」。
   3) 某个时刻不属于任何已配置的时段时，返回「不限」而不是「没菜」。
      宁可多卖，也不能让收银员在换档的十分钟里点不出菜。

   员工可以切当前模式（晚上老板走了得能切到晚餐），
   但改模式列表与时间段走 cfg.set，被 settings 闸门挡住，只有老板能动。 */
(function (G) {
  'use strict';
  var U = G.U;

  var K_TAGS = 'bizTags';     // string[]  模式名，顺序即列表顺序
  var K_HOURS = 'bizHours';   // { 模式名: { from:'06:00', to:'11:00' } }  自动切换用
  var K_MODE = 'bizMode';     // 'auto' | 具体模式名

  var DEFAULT_TAGS = ['早餐', '午餐', '晚餐'];
  var DEFAULT_HOURS = {
    '早餐': { from: '06:00', to: '11:00' },
    '午餐': { from: '11:00', to: '15:00' },
    '晚餐': { from: '15:00', to: '22:00' }
  };

  function pad2(n) { return (+n < 10 ? '0' : '') + (+n); }

  /* cfg 里存的是 JSON，取出来可能是别人（老版本 / 手工改）写进去的怪东西，
     一律过一遍清洗，别让脏数据传到 UI 上再炸。 */
  function tags() {
    var v = G.App.cfg.get(K_TAGS);
    if (!Array.isArray(v)) v = DEFAULT_TAGS;
    var out = [], seen = {};
    v.forEach(function (t) {
      t = String(t || '').trim();
      if (!t || seen[t]) return;
      seen[t] = 1; out.push(t);
    });
    return out;
  }

  function hours() {
    var v = G.App.cfg.get(K_HOURS);
    if (!v || typeof v !== 'object') v = DEFAULT_HOURS;
    var out = {};
    Object.keys(v).forEach(function (k) {
      var r = v[k] || {};
      var f = String(r.from || '').trim(), t = String(r.to || '').trim();
      if (!/^[0-9]{2}:[0-9]{2}$/.test(f) || !/^[0-9]{2}:[0-9]{2}$/.test(t)) return;
      out[k] = { from: f, to: t };
    });
    return out;
  }

  /* 时间点落在 [from, to) 内？from > to 表示跨午夜（如 22:00–02:00）。 */
  function covers(from, to, t) {
    if (from <= to) return t >= from && t < to;
    return t >= from || t < to;
  }

  /* 某个时刻该算哪一档。一个都对不上就返回 ''（= 不限，全部菜照卖）。 */
  function modeAt(d) {
    var hhmm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    var h = hours();
    var ts = tags();
    for (var i = 0; i < ts.length; i++) {
      var r = h[ts[i]];
      if (!r) continue;
      if (covers(r.from, r.to, hhmm)) return ts[i];
    }
    return '';
  }

  function isAuto() {
    var m = G.App.cfg.get(K_MODE);
    return m == null || m === 'auto';
  }

  /* 当前模式。三种取值：
       cfg = 'auto' → 按时间段自动判
       cfg = ''     → 手选「全时段」（不筛选，全部菜照卖）
       cfg = 档名    → 手选那一档
     手选的档若已被老板从列表里删掉，退回自动。 */
  function current() {
    var m = G.App.cfg.get(K_MODE);
    if (m == null || m === 'auto') return modeAt(new Date());
    if (m === '') return '';
    return tags().indexOf(m) >= 0 ? m : modeAt(new Date());
  }

  /* 切当前模式：'auto' / ''（全时段）/ 具体档名。员工也能切（属于营业操作）。 */
  function setMode(v) {
    var s = String(v == null ? 'auto' : v);
    if (s !== 'auto' && s !== '' && tags().indexOf(s) < 0) return G.App.cfg.get(K_MODE);
    G.App.cfg.setRaw(K_MODE, s);
    emit();
    return s;
  }

  /* 模式变了要通知两处：顶栏胶囊重刷标签、当前页重画（点餐页得立刻换掉菜）。

    G.App.cfg.set(K_TAGS, out);

    G.App.menu.list().then(function (list) {
      var jobs = [];
      list.forEach(function (m) {
        if (!m.businessTags || m.businessTags.indexOf(tag) < 0) return;
        m.businessTags = m.businessTags.filter(function (t) { return t !== tag; });

    if (i < 0) return list;
    if (list.indexOf(to) >= 0) { U.toast('已经有叫「' + to + '」的档位了', 'err'); return list; }

    list[i] = to;
    var h = hours();
    if (h[from]) { h[to] = h[from]; delete h[from]; }
    var cur = G.App.cfg.get(K_MODE);

    G.App.cfg.set(K_TAGS, list);   // 闸门在 cfg.set 里：员工改不动
    G.App.cfg.set(K_HOURS, h);
    if (cur === from) G.App.cfg.setRaw(K_MODE, to);

    renameTagInMenu(from, to);
    emit();
    return list;
  }

  function renameTagInMenu(from, to) {
    G.App.menu.list().then(function (list) {
      var jobs = [];
      list.forEach(function (m) {
        if (!m.businessTags || m.businessTags.indexOf(from) < 0) return;
        m.businessTags = m.businessTags.map(function (t) { return t === from ? to : t; });
        jobs.push(G.App.menu.save(m));
      });
      return Promise.all(jobs);
    }).catch(function () { /* 改不干净也不阻断 */ });
  }

  function saveHours(map) {
    var out = {};
    var ts = tags();
    Object.keys(map || {}).forEach(function (k) {
      if (ts.indexOf(k) < 0) return;          // 只收在列表里的档
      var r = map[k] || {};
      var f = String(r.from || '').trim(), t = String(r.to || '').trim();
      if (!/^[0-9]{2}:[0-9]{2}$/.test(f) || !/^[0-9]{2}:[0-9]{2}$/.test(t)) return;
      out[k] = { from: f, to: t };

    return G.App.cfg.set(K_HOURS, out);
  }

  /* 一道菜在给定模式下卖不卖。mode 为空 = 不限，全卖。 */
  function inMode(m, mode) {
    if (!mode) return true;
    var t = m && m.businessTags;
    if (!t || !t.length) return true;
    return t.indexOf(mode) >= 0;
  }

  function menuFor(list, mode) {
    return (list || []).filter(function (m) { return inMode(m, mode); });
  }

  /* 顶栏显示用：'午餐 · 自动' / '晚餐 · 手选' / '全时段 · 自动' / '全时段' */
  function label() {
    var m = current();
    if (!m) return isAuto() ? '全时段 · 自动' : '全时段';
    return m + (isAuto() ? ' · 自动' : ' · 手选');
  }

  /* 保存模式列表 / 时间段之后也要通知：
     删掉当前手选的档会让顶栏标签失效，点餐页也得跟着重画。 */
  function saveTagsEmit(arr) {
    var r = saveTags(arr);
    emit();
    return r;
  }
  function saveHoursEmit(map) {
    var r = saveHours(map);
    emit();
    return r;
  }

  G.App.biz = {
    tags: tags, saveTags: saveTagsEmit, renameTag: renameTag,
    hours: hours, saveHours: saveHoursEmit,
    auto: isAuto, mode: current, setMode: setMode, modeAt: modeAt,
    label: label,
    inMode: inMode, menuFor: menuFor,
    onChange: onChange, emit: emit,
    DEFAULT_TAGS: DEFAULT_TAGS, DEFAULT_HOURS: DEFAULT_HOURS
  };
})(window);

/* 40-print.js · 三模式小票打印

    CHINESE_OFF: [FS, 0x2E],                                 // FS .
    ALIGN_L:     [ESC, 0x61, 0x00],
    ALIGN_C:     [ESC, 0x61, 0x01],
    ALIGN_R:     [ESC, 0x61, 0x02],
    BOLD_ON:     [ESC, 0x45, 0x01],
    BOLD_OFF:    [ESC, 0x45, 0x00],
    SIZE_1:      [GS, 0x21, 0x00],                           // 1× 宽高
    SIZE_2W:     [GS, 0x21, 0x10],                           // 2× 宽
    SIZE_2H:     [GS, 0x21, 0x01],                           // 2× 高
    SIZE_2:      [GS, 0x21, 0x11],                           // 2× 宽高
    SIZE_3:      [GS, 0x21, 0x22],                           // 3× 宽高

   *  GB18030 / GBK 编码器（懒构建反查表）

  function shopLines(cfg) {

    lines.push([].concat(ESCPOS.ALIGN_L, encodeForPrinter(padDots('实收', 32, 'RM ' + U.formatMoneyPlain(paid))), ESCPOS.LF));
    lines.push([].concat(ESCPOS.ALIGN_L, ESCPOS.BOLD_ON,

                         encodeForPrinter(pad('支付', 6) + order.payMethod),

      return _usbDevice.claimInterface(iface.interfaceNumber);
    }).then(function () {
      var ep = _usbInterface.alternate.endpoints.find(function (e) { return e.direction === 'out'; });

/* 50-pdf.js · 营业报告 PDF 生成（Canvas 渲染 + 手写极简 PDF 写入器）

  /* ====== 画布参数（A4 纵向，150dpi） ====== */

  var PT_W = 595, PT_H = 842;        // PDF 点（A4）
  var MARGIN = 60;

  /* ====== 极简 PDF 写入器（JPEG 图像，每页一张图） ====== */
  function pdfFromJPEGPages(jpegPages) {
    // jpegPages: Array<Uint8Array>
    var objs = [];     // 1-based index; index 0 reserved
    function addObj(content) {
      objs.push(content);
      return objs.length; // 1-based
    }

    // 1: Catalog
    var catalog = addObj('<< /Type /Catalog /Pages 2 0 R >>');
    // 2: Pages（先占位，稍后填 kids / count）
    var pagesId = addObj(null);
    // 3..n: 每页 Page + Contents + Image
    var pageIds = [];
    jpegPages.forEach(function (jpegBytes) {
      var imageId = addObj({ kind: 'image', bytes: jpegBytes });
      var contentId = addObj({ kind: 'stream',
        data: 'q\n' + PT_W + ' 0 0 ' + PT_H + ' 0 0 cm\n' +
              '/Img' + imageId + ' Do\nQ\n' });
      var pageId = addObj(null); // 待回填
      pageIds.push({ pageId: pageId, contentId: contentId, imageId: imageId });
    });

    // 回填 Pages
    var kids = pageIds.map(function (p) { return p.pageId + ' 0 R'; }).join(' ');
    objs[pagesId - 1] = '<< /Type /Pages /Kids [' + kids + '] /Count ' + pageIds.length + ' >>';

    // 回填 Page 对象
    pageIds.forEach(function (p) {
      objs[p.pageId - 1] =
        '<< /Type /Page /Parent ' + pagesId + ' 0 R ' +
        '/MediaBox [0 0 ' + PT_W + ' ' + PT_H + '] ' +
        '/Resources << /XObject << /Img' + p.imageId + ' ' + p.imageId + ' 0 R >> /ProcSet [/PDF /ImageC] >> ' +
        '/Contents ' + p.contentId + ' 0 R >>';
    });

    // 拼接 PDF
    var enc = new TextEncoder();
    var header = enc.encode('%PDF-1.4\n%\xC2\xA0\xC2\xA0\xC2\xA0\xC2\xA0\n');
    var chunks = [header];
    var offsets = [0]; // object 0 offset (0)
    var pos = header.length;
    for (var i = 0; i < objs.length; i++) {
      offsets.push(pos);
      var obj = objs[i];
      if (obj && typeof obj === 'object' && obj.kind === 'image') {
        // 图像对象
        var head = enc.encode((i + 1) + ' 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + PAGE_W + ' /Height ' + PAGE_H +
                              ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + obj.bytes.length + ' >>\nstream\n');
        chunks.push(head);
        chunks.push(obj.bytes);
        chunks.push(enc.encode('\nendstream\nendobj\n'));
        pos += head.length + obj.bytes.length + ('\nendstream\nendobj\n').length;
      } else if (obj && typeof obj === 'object' && obj.kind === 'stream') {
        var data = enc.encode(obj.data);
        var sh = enc.encode((i + 1) + ' 0 obj\n<< /Length ' + data.length + ' >>\nstream\n');
        chunks.push(sh);
        chunks.push(data);
        chunks.push(enc.encode('\nendstream\nendobj\n'));
        pos += sh.length + data.length + ('\nendstream\nendobj\n').length;
      } else if (typeof obj === 'string') {

        chunks.push(b);
        pos += b.length;
      } else if (obj == null) {
        var b2 = enc.encode((i + 1) + ' 0 obj\n<<>>\nendobj\n');
        chunks.push(b2);
        pos += b2.length;

    var xrefParts = [enc.encode('xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n')];
    for (var k = 1; k <= objs.length; k++) {
      xrefParts.push(enc.encode(('0000000000' + offsets[k]).slice(-10) + ' 00000 n \n'));

    var trailer = enc.encode('trailer\n<< /Size ' + (objs.length + 1) + ' /Root ' + catalog + ' 0 R >>\nstartxref\n' + xrefOffset + '\n%%EOF\n');

        var text = String(row[i] == null ? '' : row[i]);
        var cw = colWidths[i];
        var max = (cw - 22) / 13;   // 估算可容纳字符数（按 22px）
        if (ctx.measureText(text).width > cw - 22) {
          while (text.length > 1 && ctx.measureText(text + '…').width > cw - 22) {
            text = text.slice(0, -1);
          }
          if (text !== String(row[i])) text += '…';
        }
        var isAmount = (i === colWidths.length - 1 && !isHeader);
        if (isAmount) {
          ctx.textAlign = 'right';
          ctx.fillStyle = isHeader ? '#B45309' : '#1F2937';
          ctx.font = (isHeader ? '700 ' : '700 ') + '22px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
          ctx.fillText(text, x + cw - 14, ry + rowH / 2);
          ctx.textAlign = 'left';
        } else {
          ctx.fillText(text, cx, ry + rowH / 2);
        }
        cx += cw;
      }
    });
    return y + rows.length * rowH;
  }

  function wrapText(ctx, text, maxWidth) {
    var lines = [], line = '';
    var chars = String(text || '').split('');
    for (var i = 0; i < chars.length; i++) {
      var test = line + chars[i];
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line); line = chars[i];
      } else { line = test; }
      if (lines.length > 3) break; // 最多 3 行
    }
    if (line) lines.push(line);
    return lines;
  }

  function drawOrderCard(ctx, x, y, w, h, order, firstImg) {
    roundedRect(ctx, x, y, w, h, 14, '#FFFFFF', '#E5E7EB');
    ctx.fillStyle = '#1F2937';
    ctx.font = '700 26px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textBaseline = 'top';
    var timeStr = (order.createTime || '').slice(11, 16);
    var isTA = order.kind === 'takeaway';
    var headText = (order.orderNo || '-') + '  ·  ' + (isTA ? '外带' : ('桌 ' + order.table + ' 号  ·  ' + order.pax + ' 人'));
    ctx.fillText(headText, x + 18, y + 14);
    // 头部金额显示净额（原价 − 已退）：PDF 上每一处钱都跟账本口径一致
    var backTop = G.App.orders.refundedOf(order);
    ctx.fillStyle = backTop > 0 ? '#DC2626' : '#FF7A00';
    ctx.font = '700 26px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    var totalText = 'RM ' + U.formatMoneyPlain(G.App.orders.netOf(order));
    var tw = ctx.measureText(totalText).width;
    ctx.fillText(totalText, x + w - tw - 18, y + 14);
    ctx.fillStyle = '#6B7280';
    ctx.font = '500 20px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    var metaLine = timeStr + '  ·  ' + (order.payMethod || '');
    // 营业模式（老订单没这个字段，就当没开过分时段，不显示）
    if (order.businessMode) metaLine += '  ·  ' + order.businessMode;
    metaLine += '  ·  操作员 ' + G.App.operator.labelOf(order);
    ctx.fillText(metaLine, x + 18, y + 50);
    // 实收 / 找零（应付 = 合计）
    if (order.paid != null || order.change != null) {
      var due = order.due != null ? order.due : order.total;
      ctx.fillStyle = '#9CA3AF';
      ctx.font = '500 17px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillText('应付 ' + U.formatMoneyPlain(due) +
                   '  实收 ' + U.formatMoneyPlain(order.paid != null ? order.paid : due) +
                   '  找零 ' + U.formatMoneyPlain(order.change != null ? order.change : 0), x + 18, y + 74);
      ctx.fillStyle = '#1F2937';
    }

    /* 退款明细：这块是后来加的，画在金额下方、菜品上方。
       退过钱的单必须能在 PDF 上看到退了多少、为什么退 —— 月底对账时
       只看到一个「净营业额」是没法交代的。 */
    var hasRefund = (order.refundRecords || []).length > 0;
    var refundH = 0;
    if (hasRefund) {
      var back = G.App.orders.refundedOf(order);
      var ry = y + 96;
      ctx.fillStyle = '#FEF2F2';
      roundedRect(ctx, x + 14, ry, w - 28, 26 + (order.refundRecords.length) * 24, 8, '#FEF2F2', '#FECACA');
      ctx.fillStyle = '#DC2626';
      ctx.font = '700 18px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.textBaseline = 'top';
      ctx.fillText((order.refundType === 'full' ? '已全额退款' : '部分退款') +
                   ' − RM ' + U.formatMoneyPlain(back) +
                   '   净收 RM ' + U.formatMoneyPlain(G.App.orders.netOf(order)),
                   x + 26, ry + 5);
      var ly2 = ry + 26;
      ctx.font = '500 16px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      (order.refundRecords || []).forEach(function (r) {
        var txt = '· ' + (r.time || '').slice(0, 16).replace('T', ' ') +
                  ' ' + (r.type === 'full' ? '整单' : '部分') +
                  ' − RM ' + U.formatMoneyPlain(r.amount) +
                  (r.operatorName ? ' · ' + r.operatorName : '') +
                  (r.reason ? ' · ' + r.reason : '');
        ctx.fillText(wrapText(ctx, txt, w - 52)[0], x + 26, ly2);
        ly2 += 24;
      });
      refundH = 30 + (order.refundRecords.length) * 24;
    }

    // 左侧菜品列表
    var listX = x + 18, listW = w - 36;
    if (firstImg) listW = w - 130; // 留出右侧图片位
    var ly = y + 96 + refundH;
    ctx.fillStyle = '#1F2937';
    ctx.font = '500 22px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    order.items.forEach(function (it) {
      var nm = it.name + (it.specName ? '(' + it.specName + ')' : '');
      var lines = wrapText(ctx, nm, listW);
      lines.forEach(function (ln) {
        ctx.fillText(ln, listX, ly);
        ly += 26;
      });
      ctx.fillStyle = '#6B7280';
      var sub = U.formatMoneyPlain(it.unitPrice) + ' × ' + it.qty;
      if (U.stapleText(it)) sub += '  ' + U.stapleText(it);
      if (it.addons && it.addons.length) sub += '  +' + it.addons.map(function (a) { return a.name; }).join('/');
      if (it.excludes && it.excludes.length) sub += '  -' + it.excludes.map(function (e) { return e.name; }).join('/');
      ctx.fillText(sub, listX, ly);
      ctx.fillStyle = '#1F2937';
      ly += 28;
    });
    // 右侧菜品实拍
    if (firstImg) {
      var ix = x + w - 110, iy = y + 14, iw = 92, ih = 92;
      drawImage(ctx, firstImg, ix, iy, iw, ih);
      ctx.fillStyle = '#9CA3AF';
      ctx.font = '500 16px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      var firstName = (order.items[0] && order.items[0].name) || '';
      ctx.fillText(firstName.length > 6 ? firstName.slice(0, 5) + '…' : firstName, ix + iw / 2, iy + ih + 20);
      ctx.textAlign = 'left';
    }
  }

  function drawImage(ctx, img, x, y, w, h) {
    // 居中裁剪
    var iw = img.width, ih = img.height;
    var ir = iw / ih, r = w / h;
    var sx, sy, sw, sh;
    if (ir > r) { sh = ih; sw = ih * r; sx = (iw - sw) / 2; sy = 0; }
    else { sw = iw; sh = iw / r; sx = 0; sy = (ih - sh) / 2; }
    ctx.save();
    roundedRect(ctx, x, y, w, h, 10, '#FFF1E0', null);
    ctx.clip();
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
    ctx.restore();
  }

  function loadImage(blob) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function (e) { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }

  /* ====== 报告生成（每日 / 时段） ====== */
  function buildReport(opts) {
    opts = opts || {};
    var orders = opts.orders || [];
    var ledger = opts.ledger || [];
    var title = opts.title || '营业报告';
    var subtitle = opts.subtitle || U.formatDateCN(new Date());

    // 统计四宫格

    drawStatBox(ctx, bx, by, bw, bh, '订单数', stats.orderCount + ' 单', '#FF7A00');
    drawStatBox(ctx, bx + bw + 30, by, bw, bh, '营业收入', 'RM ' + U.formatMoneyPlain(stats.gross), '#FF7A00');
    drawStatBox(ctx, bx, by + bh + 20, bw, bh, '实际收银', 'RM ' + U.formatMoneyPlain(stats.cashTotal), '#0F9D58');
    drawStatBox(ctx, bx + bw + 30, by + bh + 20, bw, bh, '净利润（含其他收支）', 'RM ' + U.formatMoneyPlain(stats.net), '#1F2937');

    // 支付方式构成
    var payY = by + bh * 2 + 60;
    ctx.fillStyle = '#1F2937';
    ctx.font = '800 32px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textBaseline = 'top';
    ctx.fillText('支付方式构成', MARGIN, payY);
    var payRows = [['支付方式', '笔数', '金额']];
    Object.keys(stats.payBreakdown).forEach(function (k) {
      payRows.push([k, stats.payBreakdown[k].n + ' 单', 'RM ' + U.formatMoneyPlain(stats.payBreakdown[k].amount)]);
    });
    if (payRows.length === 1) payRows.push(['暂无数据', '-', '-']);
    drawTable(ctx, MARGIN, payY + 50, PAGE_W - MARGIN * 2, payRows, [PAGE_W * 0.42, PAGE_W * 0.18, PAGE_W * 0.40].map(function (v) { return v - MARGIN * 2; }));

    // 畅销菜品
    var hotY = payY + 50 + payRows.length * 52 + 40;
    if (hotY < PAGE_H - 180) {
      ctx.fillStyle = '#1F2937';
      ctx.font = '800 32px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.textBaseline = 'top';
      ctx.fillText('畅销菜品 TOP 8', MARGIN, hotY);
      var hotRows = [['菜品', '数量', '小计']];
      stats.topItems.slice(0, 8).forEach(function (r) {
        hotRows.push([r.name, r.qty + ' 份', 'RM ' + U.formatMoneyPlain(r.amount)]);
      });
      if (hotRows.length === 1) hotRows.push(['暂无数据', '-', '-']);
      drawTable(ctx, MARGIN, hotY + 50, PAGE_W - MARGIN * 2, hotRows, [PAGE_W * 0.50, PAGE_W * 0.15, PAGE_W * 0.35].map(function (v) { return v - MARGIN * 2; }));
    }

    // 页脚
    ctx.fillStyle = '#9CA3AF';
    ctx.font = '500 20px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textBaseline = 'bottom';
    ctx.textAlign = 'right';
    ctx.fillText('由 离线点餐收银 PWA 生成 · ' + U.formatDate(new Date()), PAGE_W - MARGIN, PAGE_H - MARGIN);
    ctx.textAlign = 'left';

    pages.push(c);

    // 后续分页：订单明细
    if (orders.length) {
      return renderOrderPages(orders, photos, pages);
    }
    return Promise.resolve(pages);
  }

  function renderOrderPages(orders, photos, pages) {
    return new Promise(function (resolve) {
      if (!orders.length) { resolve(pages); return; }
      var perPage = 6;
      var c, ctx, cy, col, drawn;
      function newPage() {
        c = newCanvas(); ctx = c.getContext('2d');
        ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, PAGE_W, PAGE_H);
        drawHeader(ctx, '营业报告', U.formatDateCN(new Date()) + ' · 订单明细');
        cy = MARGIN + 180; col = 0; drawn = 0;
      }
      function flushPage() {
        if (!c) return;
        ctx.fillStyle = '#9CA3AF';
        ctx.font = '500 20px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.textBaseline = 'bottom';
        ctx.textAlign = 'right';
        ctx.fillText('由 离线点餐收银 PWA 生成 · ' + U.formatDate(new Date()), PAGE_W - MARGIN, PAGE_H - MARGIN);
        ctx.textAlign = 'left';
        pages.push(c);
      }
      newPage();
      var cardW = (PAGE_W - MARGIN * 2 - 24) / 2;
      /* 卡片高度不固定：退过款的单要多画一块退款明细，硬按 220 画会把字挤出卡片。
         一行两张卡取其中较高的那个，矮的那张留白，不会错位。 */
      function cardHeightOf(order) {
        var n = (order.refundRecords || []).length;
        return 220 + (n ? 30 + n * 24 : 0);
      }
      function firstImgOf(order) {
        if (!order.items) return null;
        for (var j = 0; j < order.items.length; j++) {
          var pid = order.items[j].photoId;
          if (pid && photos[pid]) return photos[pid];
        }
        return null;
      }
      var i = 0;
      while (i < orders.length) {
        var a = orders[i], b = orders[i + 1];
        var ha = cardHeightOf(a);
        var hb = b ? cardHeightOf(b) : 0;
        // 这一行放不下就翻页（有退款的卡片更高，可能挤不下）
        if (drawn > 0 && (drawn >= perPage || cy + Math.max(ha, hb) + 24 > PAGE_H - MARGIN)) {
          flushPage();
          newPage();
        }
        drawOrderCard(ctx, MARGIN, cy, cardW, ha, a, firstImgOf(a));
        drawn++;
        if (b) {
          drawOrderCard(ctx, MARGIN + cardW + 24, cy, cardW, hb, b, firstImgOf(b));
          drawn++;
        }
        cy += Math.max(ha, hb) + 24;
        i += 2;
      }
      if (c) flushPage();
      resolve(pages);
    });
  }

  function computeStats(orders, ledger) {
    var gross = 0, cashTotal = 0, refundTotal = 0, refundCount = 0;
    var payBreakdown = {};
    var itemAgg = {};
    orders.forEach(function (o) {
      /* 营业额一律按净额算（原价 − 已退）：PDF 上写的数必须跟账本、收银页一致，
         否则三处三个数，对账时谁也说不清哪个是真的。 */
      var net = G.App.orders.netOf(o);
      var back = G.App.orders.refundedOf(o);
      if (back > 0) { refundTotal += back; refundCount++; }
      gross += net;
      cashTotal += net;          // 实际收银
      payBreakdown[o.payMethod] = payBreakdown[o.payMethod] || { n: 0, amount: 0 };
      payBreakdown[o.payMethod].n++;
      payBreakdown[o.payMethod].amount += net;
      o.items.forEach(function (it) {
        var key = it.name + (it.specName ? '(' + it.specName + ')' : '');
        itemAgg[key] = itemAgg[key] || { name: it.name, spec: it.specName, qty: 0, amount: 0 };
        itemAgg[key].qty += +it.qty || 0;
        itemAgg[key].amount += +it.subtotal || 0;
      });
    });
    var expense = 0, otherIncome = 0;
    ledger.forEach(function (l) {
      if (l.type === 'expense') expense += +l.amount || 0;
      else if (l.type === 'income' && !l.fromOrder) otherIncome += +l.amount || 0;
    });
    var topItems = Object.values(itemAgg).sort(function (a, b) { return b.qty - a.qty || b.amount - a.amount; });
    return {
      orderCount: orders.length,
      gross: gross,
      cashTotal: cashTotal,
      refundTotal: Math.round(refundTotal * 100) / 100,
      refundCount: refundCount,
      expense: expense,
      otherIncome: otherIncome,
      net: gross + otherIncome - expense,
      payBreakdown: payBreakdown,
      topItems: topItems
    };
  }

  /* ====== 对外 API ====== */
  function generateReport(opts) {
    return buildReport(opts).then(function (canvases) {
      // 全部 canvas 编码为 JPEG
      var jpegs = canvases.map(function (c) {
        // 同步：toDataURL → binary；不阻塞
        var dataURL = c.toDataURL('image/jpeg', 0.86);
        var bin = atob(dataURL.split(',')[1]);
        var arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return arr;
      });
      var blob = pdfFromJPEGPages(jpegs);
      return blob;
    });
  }

  function generateAndArchive(opts) {
    // 预加载菜品图片为 HTMLImageElement（用于嵌入 PDF）
    var photoMap = {};
    var seen = {};
    var loads = [];
    (opts.orders || []).forEach(function (o) {
      o.items.forEach(function (it) {
        if (it.photoId && !seen[it.photoId]) {
          seen[it.photoId] = true;
          loads.push(G.App.photos.get(it.photoId).then(function (p) {
            if (!p) return null;
            return loadImage(p.blob).then(function (img) { photoMap[p.id] = img; });
          }).catch(function () {}));
        }
      });
    });
    return Promise.all(loads).then(function () {
      opts.photos = photoMap;
      return generateReport(opts);
    }).then(function (blob) {
      var fileName = (opts.fileName || ('营业报告-' + U.todayKey() + '-' + Date.now().toString(36).toUpperCase())) + '.pdf';
      return G.App.pdf.save({
        label: opts.label || U.todayKey(),
        scope: opts.scope || 'daily',
        fileName: fileName,
        pdfBlob: blob
      }).then(function () { return { blob: blob, fileName: fileName }; });
    });
  }

  /* 预览 PDF（在新窗口打开 Blob URL） */
  function preview(blob) {
    var url = URL.createObjectURL(blob);
    var w = window.open(url, '_blank');
    if (!w) U.toast('浏览器拦截了弹窗，请允许弹窗后重试', 'err');
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
    return !!w;
  }

  /* 一叠 canvas → PDF Blob（JPEG 0.86 编码） */
  function pagesToBlob(canvases) {
    var jpegs = canvases.map(function (c) {
      var dataURL = c.toDataURL('image/jpeg', 0.86);
      var bin = atob(dataURL.split(',')[1]);
      var arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    });
    return pdfFromJPEGPages(jpegs);
  }

  G.PDF = {
    generate: generateReport,
    generateAndArchive: generateAndArchive,
    preview: preview,
    computeStats: computeStats,
    /* 绘图原语开放给别的模块（进出货单据 PDF / 营业日报）复用，
       免得每加一个报表就把 canvas 排版代码再抄一遍。 */
    kit: {
      PAGE_W: PAGE_W, PAGE_H: PAGE_H, MARGIN: MARGIN,
      newCanvas: newCanvas, drawHeader: drawHeader, drawStatBox: drawStatBox,
      drawTable: drawTable, roundedRect: roundedRect, wrapText: wrapText,
      loadImage: loadImage, pagesToBlob: pagesToBlob,
      archive: function (blob, fileName, label, scope) {
        return G.App.pdf.save({
          label: label, scope: scope || 'inventory',
          fileName: fileName, pdfBlob: blob
        }).then(function () { return { blob: blob, fileName: fileName }; });
      }
    },
    // 仅供测试
    __test_pdfFromJPEGPages: pdfFromJPEGPages
  };
})(window);


/* ============ 51-inv-pdf.js ============ */
/* 51-inv-pdf.js · 进出货 / 库存 PDF
   复用 50-pdf.js 的绘图原语，只负责排自己的版面：
     第 1 页起：库存汇总表（负数标红、低于阈值标黄）
     接着：单据明细表（进货 / 出库 / 报损）
     进货可选附带照片页
   注意 PDF 里的颜色：负数用红、告警用橙底，跟页面保持同一套语义。 */
(function (G) {
  'use strict';
  var U = G.U;

  var FONT = '-apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif';

  function K() { return G.PDF.kit; }
  function PAGE_W() { return K().PAGE_W; }
  function MARGIN() { return K().MARGIN; }
  function CONTENT_W() { return K().PAGE_W - K().MARGIN * 2; }
  function BOTTOM() { return K().PAGE_H - K().MARGIN - 40; }   // 留白给页脚

  function newPage(title, subtitle) {
    var c = K().newCanvas(), ctx = c.getContext('2d');
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, K().PAGE_W, K().PAGE_H);
    K().drawHeader(ctx, title, subtitle);
    ctx.textBaseline = 'top';
    return { canvas: c, ctx: ctx, y: K().MARGIN + 175 };
  }

  function footer(pg) {
    var ctx = pg.ctx;
    ctx.fillStyle = '#9CA3AF';
    ctx.font = '500 20px ' + FONT;
    ctx.textBaseline = 'bottom';
    ctx.textAlign = 'right';
    ctx.fillText('由 离线点餐收银 PWA 生成 · ' + U.formatDate(new Date()),
                 K().PAGE_W - K().MARGIN, K().PAGE_H - K().MARGIN);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
  }

  function section(ctx, y, text) {
    ctx.fillStyle = '#1F2937';
    ctx.font = '800 28px ' + FONT;
    ctx.textBaseline = 'top';
    ctx.fillText(text, MARGIN(), y);
    return y + 46;
  }

  /* 表格分页：每页最多 perPage 条数据，跨页自动补表头。
     startPg 可以传入一页已经画了别的内容（比如统计块）的纸，接着往下排。 */
  function drawPagedTable(pages, title, subtitle, head, rows, colW, perPage, startPg) {
    var pg = startPg || null;
    var buf = [head];

    function ensure(needRows) {
      if (pg && pg.y + (needRows + 1) * 52 <= BOTTOM()) return;
      if (pg) { footer(pg); pages.push(pg.canvas); }
      pg = newPage(title, subtitle);
    }
    function emit() {
      K().drawTable(pg.ctx, MARGIN(), pg.y, CONTENT_W(), buf, colW);
      pg.y += buf.length * 52 + 30;
      buf = [head];
    }

    for (var i = 0; i < rows.length; i++) {
      ensure(buf.length + 1);
      buf.push(rows[i]);
      if (buf.length > perPage) emit();
    }
    if (!pg) pg = newPage(title, subtitle);
    if (buf.length > 1) { ensure(buf.length + 1); emit(); }
    footer(pg);
    pages.push(pg.canvas);
  }

  /* ---------- 库存汇总页 ---------- */
  function summaryPages(rows, title, subtitle) {
    var pg = newPage(title, subtitle);

    var low = rows.filter(function (r) { return r.low; }).length;
    var neg = rows.filter(function (r) { return r.current < 0; }).length;

    var bw = (CONTENT_W() - 24) / 2, bh = 118;
    K().drawStatBox(pg.ctx, MARGIN(), pg.y, bw, bh, '货品种类', rows.length + ' 项', '#1F2937');
    K().drawStatBox(pg.ctx, MARGIN() + bw + 24, pg.y, bw, bh, '库存不足', low + ' 项',
                    low ? '#DC2626' : '#0F9D58');
    pg.y += bh + 20;
    K().drawStatBox(pg.ctx, MARGIN(), pg.y, bw, bh, '负库存', neg + ' 项',
                    neg ? '#DC2626' : '#1F2937');
    K().drawStatBox(pg.ctx, MARGIN() + bw + 24, pg.y, bw, bh, '进货总金额',
                    'RM ' + U.formatMoneyPlain(rows.reduce(function (s, r) { return s + r.amountIn; }, 0)), '#FF7A00');
    pg.y += bh + 40;

    pg.y = section(pg.ctx, pg.y, '库存汇总');

    var head = ['货品名', '单位', '进货', '出库', '报损', '当前库存', '阈值'];
    var colW = [300, 150, 120, 120, 120, 150, 160];
    var body = rows.map(function (r) {
      var cur = String(r.current);
      if (r.current < 0) cur = cur + ' ⚠';
      else if (r.low) cur = cur + ' 低';
      return [r.itemName, r.unit, String(r.inQty), String(r.outQty), String(r.lossQty),
              cur, r.threshold == null ? '-' : String(r.threshold)];
    });
    if (!body.length) body.push(['暂无数据', '-', '-', '-', '-', '-', '-']);

    var pages = [];
    drawPagedTable(pages, title, subtitle, head, body, colW, 22, pg);
    return pages;
  }

  /* ---------- 单据明细页 ---------- */
  function recordPages(records, type, title, subtitle) {
    var pages = [];
    if (!records.length) return pages;
    var head, colW, rows;

    if (type === 'in') {
      head = ['时间', '货品名', '数量', '单价', '金额', '进货人', '收货人', '供应商'];
      colW = [180, 210, 110, 110, 130, 110, 110, 160];
      rows = records.map(function (r) {
        var d = new Date(r.time);
        return [U.formatDate(d) + ' ' + U.formatHM(d), r.itemName,
                r.qty + ' ' + (r.unit || ''),
                r.price == null ? '-' : U.formatMoneyPlain(r.price),
                U.formatMoneyPlain(r.amount),
                r.buyer || '-', r.receiver || '-', r.supplier || '-'];
      });
    } else {
      head = ['时间', '货品名', '数量', type === 'out' ? '领用人' : '报损人', '备注'];
      colW = [200, 240, 150, 170, 360];
      rows = records.map(function (r) {
        var d = new Date(r.time);
        return [U.formatDate(d) + ' ' + U.formatHM(d), r.itemName,
                r.qty + ' ' + (r.unit || ''), r.taker || '-', r.note || '-'];
      });
    }
    drawPagedTable(pages, title, subtitle, head, rows, colW, 24);
    return pages;
  }

  /* ---------- 照片页 ---------- */
  function photoPages(records, photoMap, title, subtitle) {
    var pages = [];
    var items = [];
    records.forEach(function (r) {
      (r.photos || []).slice(0, 3).forEach(function (pid) {
        if (photoMap[pid]) items.push({ rec: r, img: photoMap[pid] });
      });
    });
    if (!items.length) return Promise.resolve(pages);

    var COLS = 3, gap = 24;
    var cw = (CONTENT_W() - gap * (COLS - 1)) / COLS;
    var cellH = 330, imgH = 230;
    var perPage = COLS * 4;

    var pg = null, i = 0;
    while (i < items.length) {
      pg = newPage(title, subtitle);
      pg.y = section(pg.ctx, pg.y, '进货照片');
      var n = 0;
      while (n < perPage && i < items.length) {
        var col = n % COLS, row = Math.floor(n / COLS);
        var x = MARGIN() + col * (cw + gap);
        var y = pg.y + row * (cellH + 20);
        var it = items[i];

        K().roundedRect(pg.ctx, x, y, cw, cellH, 12, '#FFFFFF', '#E5E7EB');
        // 图：裁中间填满
        var iw = it.img.width, ih = it.img.height;
        var scale = Math.max((cw - 16) / iw, imgH / ih);
        var sw = (cw - 16) / scale, sh = imgH / scale;
        var sx = (iw - sw) / 2, sy = (ih - sh) / 2;
        pg.ctx.save();
        K().roundedRect(pg.ctx, x + 8, y + 8, cw - 16, imgH, 8, null, null);
        pg.ctx.clip();
        pg.ctx.drawImage(it.img, sx, sy, sw, sh, x + 8, y + 8, cw - 16, imgH);
        pg.ctx.restore();

        pg.ctx.fillStyle = '#1F2937';
        pg.ctx.font = '700 21px ' + FONT;
        pg.ctx.textBaseline = 'top';
        var lines = K().wrapText(pg.ctx, it.rec.itemName + '  ' + it.rec.qty + ' ' + (it.rec.unit || ''), cw - 24);
        lines.slice(0, 2).forEach(function (ln, k) {
          pg.ctx.fillText(ln, x + 12, y + imgH + 18 + k * 26);
        });
        pg.ctx.fillStyle = '#6B7280';
        pg.ctx.font = '500 18px ' + FONT;
        var d = new Date(it.rec.time);
        pg.ctx.fillText(U.formatDate(d) + ' ' + U.formatHM(d) +
                        (it.rec.supplier ? '  ·  ' + it.rec.supplier : ''),
                        x + 12, y + imgH + 18 + Math.min(lines.length, 2) * 26 + 2);
        n++; i++;
      }
      footer(pg);
      pages.push(pg.canvas);
    }
    return Promise.resolve(pages);
  }

  /* ---------- 入口 ---------- */
  /* opts: { title, subtitle, summary, records: { in:[], out:[], loss:[] }, withPhotos } */
  function build(opts) {
    opts = opts || {};
    var title = opts.title || '进出货库存报告';
    var subtitle = opts.subtitle || U.formatDate(new Date());
    var pages = [];

    if (opts.summary) pages = pages.concat(summaryPages(opts.summary, title, subtitle));
    ['in', 'out', 'loss'].forEach(function (t) {
      var arr = (opts.records || {})[t];
      if (!arr || !arr.length) return;
      pages = pages.concat(recordPages(arr, t, title, subtitle));
    });
    if (!pages.length) {
      var pg = newPage(title, subtitle);
      pg.ctx.fillStyle = '#9CA3AF';
      pg.ctx.font = '600 28px ' + FONT;
      pg.ctx.textAlign = 'center';
      pg.ctx.fillText('该条件下没有数据', K().PAGE_W / 2, 400);
      pg.ctx.textAlign = 'left';
      footer(pg);
      pages.push(pg.canvas);
    }

    if (!opts.withPhotos) return Promise.resolve(K().pagesToBlob(pages));

    var inRecs = (opts.records || {}).in || [];
    var ids = [], seen = {};
    inRecs.forEach(function (r) {
      (r.photos || []).slice(0, 3).forEach(function (pid) {
        if (!seen[pid]) { seen[pid] = 1; ids.push(pid); }
      });
    });
    if (!ids.length) return Promise.resolve(K().pagesToBlob(pages));

    var photoMap = {};
    return ids.reduce(function (p, pid) {
      return p.then(function () {
        return G.App.inv.photos.get(pid).then(function (ph) {
          if (!ph) return null;
          return K().loadImage(ph.blob).then(function (img) { photoMap[pid] = img; });
        }).catch(function () {});
      });
    }, Promise.resolve()).then(function () {
      return photoPages(inRecs, photoMap, title, subtitle);
    }).then(function (pp) {
      return K().pagesToBlob(pages.concat(pp));
    });
  }

  G.InvPDF = { build: build };
})(window);


/* ============ 52-report.js ============ */
/* 52-report.js · 营业日报 / 月报（汇总引擎 + PDF + Excel）
   汇总一律现算，不落中间表 —— 订单改了、删了、退了，报表立刻跟着变。
   跟营业额那套是同一个原则：派生优于物化，不给自己留双写不一致的机会。

   三条口径，改动前先看这里：
   1) 所有钱都用 netOf()（原价 − 已退），不看 total。全退的单净额 0，不计营收。
   2) 菜品销量扣掉已退份数。整单退款不给明细行，所以按「整单 = 全退」处理，
      并跟历次部分退款取 max，避免重复扣。
   3) 营业模式读的是订单上的 businessMode 快照，不是今天的档位配置 ——
      老板把「早餐」改成「早市」之后，老单仍然算在「早餐」头上，这才是真实历史。 */
(function (G) {
  'use strict';
  var U = G.U;

  function money(n) { return Math.round((+n || 0) * 100) / 100; }
  function keyOf(it) { return (it.name || '?') + '|' + (it.specName || ''); }

  /* ---------- 汇总 ---------- */
  function summarize(orders) {
    orders = orders || [];
    var gross = 0, back = 0, net = 0, nRefundOrders = 0;
    var pay = {};      // 支付方式 → { count, amount }
    var items = {};    // '菜名|规格' → { name, spec, qty, refundQty, amount }
    var modes = {};    // 营业模式 → { count, gross, back, net }
    var days = {};     // YYYY-MM-DD → { count, net }

    orders.forEach(function (o) {
      var t = +o.total || 0;
      var r = G.App.orders.refundedOf(o);
      var n = G.App.orders.netOf(o);
      gross += t; back += r; net += n;
      if ((o.refundRecords || []).length) nRefundOrders++;

      var pm = o.payMethod || 'CASH';
      if (!pay[pm]) pay[pm] = { method: pm, count: 0, amount: 0 };
      pay[pm].count++;
      pay[pm].amount += n;

      var mk = o.businessMode || '';
      if (!modes[mk]) modes[mk] = { mode: mk, count: 0, gross: 0, back: 0, net: 0 };
      modes[mk].count++;
      modes[mk].gross += t;
      modes[mk].back += r;
      modes[mk].net += n;

      var dk = o.date || (o.createTime || '').slice(0, 10) || '未知';
      if (!days[dk]) days[dk] = { date: dk, count: 0, net: 0 };
      days[dk].count++;
      days[dk].net += n;

      (o.items || []).forEach(function (it) {
        var k = keyOf(it);
        if (!items[k]) {
          items[k] = { name: it.name || '?', spec: it.specName || '', qty: 0, refundQty: 0, amount: 0 };
        }
        items[k].qty += +it.qty || 0;
        items[k].amount += +it.subtotal || 0;
      });

      /* 退掉的份数从销量里扣回去。
         部分退款给明细行（key = 'L'+行号，指向 order.items[i]）；
         整单退款不给明细行，所以按「这一单全退」处理，并跟已扣的取 max
         —— 先部分退 2 份再整单退时，不会把那 2 份扣两遍。 */
      (o.refundRecords || []).forEach(function (rr) {
        if (!rr) return;
        if (rr.type === 'full') {
          (o.items || []).forEach(function (it) {
            var e = items[keyOf(it)];
            if (e) e.refundQty = Math.max(e.refundQty, +it.qty || 0);
          });
          return;
        }
        ((rr.items) || []).forEach(function (rit) {
          var m = /^L([0-9]+)$/.exec(String(rit.key || ''));
          if (!m) return;
          var it = (o.items || [])[+m[1]];
          if (!it) return;
          var e = items[keyOf(it)];
          if (e) e.refundQty += +rit.qty || 0;
        });
      });
    });

    var payList = Object.keys(pay).map(function (k) {
      return { method: k, count: pay[k].count, amount: money(pay[k].amount) };
    }).sort(function (a, b) { return b.amount - a.amount || b.count - a.count; });

    var itemList = Object.keys(items).map(function (k) {
      var e = items[k];
      return {
        name: e.name, spec: e.spec,
        qty: e.qty, refundQty: e.refundQty,
        soldQty: Math.max(0, e.qty - e.refundQty),
        amount: money(e.amount)
      };
    }).sort(function (a, b) { return b.soldQty - a.soldQty || b.amount - a.amount; });

    var modeList = Object.keys(modes).map(function (k) {
      var e = modes[k];
      return { mode: k, count: e.count, gross: money(e.gross), back: money(e.back), net: money(e.net) };
    }).sort(function (a, b) { return b.net - a.net; });

    var dayList = Object.keys(days).map(function (k) {
      return { date: k, count: days[k].count, net: money(days[k].net) };
    }).sort(function (a, b) { return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });

    return {
      count: orders.length,
      gross: money(gross),
      refunded: money(back),
      net: money(net),
      avg: orders.length ? money(net / orders.length) : 0,
      nRefundOrders: nRefundOrders,
      payList: payList,
      itemList: itemList,
      modeList: modeList,
      dayList: dayList
    };
  }

  /* ---------- 过滤 ----------
     mode: '' = 全部；'__none__' = 没记档（老单 / 关着分时段时的单）；其余 = 具体档名 */
  function filterByMode(orders, mode) {
    if (!mode) return orders || [];
    var want = mode === '__none__' ? '' : mode;
    return (orders || []).filter(function (o) { return (o.businessMode || '') === want; });
  }

  /* 报表页下拉里能选的档：全部 + 各档 + 未记档 */
  function modeOptions() {
    var out = [{ value: '', label: '全部模式' }];
    (G.App.biz ? G.App.biz.tags() : []).forEach(function (t) {
      out.push({ value: t, label: t });
    });
    out.push({ value: '__none__', label: '未记档（老单）' });
    return out;
  }

  function modeLabel(mode) {
    if (!mode) return '全部模式';
    if (mode === '__none__') return '未记档';
    return mode;
  }

  /* ---------- 日期区间 ----------
     'YYYY-MM-DD' 是本地日历日，不用 UTC —— 马来西亚晚上 11 点结账的单
     按 UTC 会落到第二天去，日报就对不上了。 */
  function pad2(n) { return (+n < 10 ? '0' : '') + (+n); }
  function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

  function rangeOf(kind, from, to) {
    var d = new Date();
    var f, t;
    if (kind === 'today') { f = t = ymd(d); }
    else if (kind === 'yesterday') { d.setDate(d.getDate() - 1); f = t = ymd(d); }
    else if (kind === 'week') {
      // 周一算一周的起点
      var wd = (d.getDay() + 6) % 7;
      var a = new Date(d); a.setDate(d.getDate() - wd);
      var b = new Date(a); b.setDate(a.getDate() + 6);
      f = ymd(a); t = ymd(b);
    } else if (kind === 'month') {
      f = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-01';
      t = d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' +
          pad2(new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate());
    } else if (kind === 'lastMonth') {
      var pm = new Date(d.getFullYear(), d.getMonth() - 1, 1);
      f = pm.getFullYear() + '-' + pad2(pm.getMonth() + 1) + '-01';
      t = pm.getFullYear() + '-' + pad2(pm.getMonth() + 1) + '-' +
          pad2(new Date(pm.getFullYear(), pm.getMonth() + 1, 0).getDate());
    } else {
      f = from || ymd(d);
      t = to || f;
      if (f > t) { var x = f; f = t; t = x; }
    }
    return { from: f, to: t };
  }

  /* ---------- Excel ---------- */
  function sheets(stats, meta) {
    meta = meta || {};
    var title = (meta.title || '营业报表') + '　' + (meta.rangeText || '') +
                '　·　' + modeLabel(meta.mode || '');

    var s1 = {
      name: '总览',
      cols: [26, 20],
      rows: [

        ['订单数', stats.count],
        ['营业额（原价）', stats.gross],
        ['已退款', stats.refunded],
        ['净营业额', stats.net],
        ['客单价', stats.avg],
        ['含退款的订单数', stats.nRefundOrders],
        ['', ''],
        [{ v: '营业模式', s: 1 }, { v: '净营业额', s: 1 }]
      ]
    };
    stats.modeList.forEach(function (m) {
      s1.rows.push([modeLabel(m.mode), m.net]);
    });

    var s2 = {

      rows: [[{ v: '支付方式', s: 1 }, { v: '订单数', s: 1 }, { v: '净额 RM', s: 1 }]]
    };
    stats.payList.forEach(function (p) {

    var s3 = {
      name: '菜品销量',

      rows: [[{ v: '菜名', s: 1 }, { v: '规格', s: 1 }, { v: '卖出份数', s: 1 },
              { v: '退款份数', s: 1 }, { v: '下单金额 RM', s: 1 }]]
    };
    stats.itemList.forEach(function (it) {
      s3.rows.push([it.name, it.spec || '标准', it.soldQty, it.refundQty, it.amount]);
    });
    if (!stats.itemList.length) s3.rows.push(['暂无数据', '-', 0, 0, 0]);

    var s4 = {
      name: '营业模式分布',
      cols: [20, 14, 18, 16, 18],
      rows: [[{ v: '营业模式', s: 1 }, { v: '订单数', s: 1 }, { v: '原价 RM', s: 1 },
              { v: '已退 RM', s: 1 }, { v: '净额 RM', s: 1 }]]
    };
    stats.modeList.forEach(function (m) {
      s4.rows.push([modeLabel(m.mode), m.count, m.gross, m.back, m.net]);
    });
    if (!stats.modeList.length) s4.rows.push(['暂无数据', 0, 0, 0, 0]);

    var s5 = {
      name: '每日趋势',
      cols: [18, 14, 18],
      rows: [[{ v: '日期', s: 1 }, { v: '订单数', s: 1 }, { v: '净额 RM', s: 1 }]]
    };
    stats.dayList.forEach(function (d) {

    if (!stats.dayList.length) s5.rows.push(['暂无数据', 0, 0]);

    // 标题行下面插一行空行，别让表头贴着标题

  }

  /* ---------- PDF ----------
     复用 50-pdf.js 的绘图原语，跟进出货 PDF 同一套排版骨架。 */
  var FONT = '-apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif';
  function K() { return G.PDF.kit; }
  function MARGIN() { return K().MARGIN; }
  function CONTENT_W() { return K().PAGE_W - K().MARGIN * 2; }
  function BOTTOM() { return K().PAGE_H - K().MARGIN - 40; }

  function newPage(title, subtitle) {
    var c = K().newCanvas(), ctx = c.getContext('2d');
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, K().PAGE_W, K().PAGE_H);
    K().drawHeader(ctx, title, subtitle);
    ctx.textBaseline = 'top';
    return { canvas: c, ctx: ctx, y: K().MARGIN + 175 };
  }
  function footer(pg) {
    var ctx = pg.ctx;
    ctx.fillStyle = '#9CA3AF';
    ctx.font = '500 20px ' + FONT;
    ctx.textBaseline = 'bottom';
    ctx.textAlign = 'right';
    ctx.fillText('由 离线点餐收银 PWA 生成 · ' + U.formatDate(new Date()),
                 K().PAGE_W - MARGIN(), K().PAGE_H - MARGIN());
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
  }
  function section(ctx, y, text) {
    ctx.fillStyle = '#1F2937';
    ctx.font = '800 28px ' + FONT;
    ctx.textBaseline = 'top';
    ctx.fillText(text, MARGIN(), y);

  }

  /* 表格分页：跨页自动补表头。startPg 可传入已画了统计块的纸接着排。 */
  function drawPagedTable(pages, title, subtitle, head, rows, colW, perPage, startPg) {
    var pg = startPg || null;
    var buf = [head];
    function ensure(n) {
      if (pg && pg.y + (n + 1) * 52 <= BOTTOM()) return;
      if (pg) { footer(pg); pages.push(pg.canvas); }
      pg = newPage(title, subtitle);
    }
    function emit() {
      K().drawTable(pg.ctx, MARGIN(), pg.y, CONTENT_W(), buf, colW);
      pg.y += buf.length * 52 + 30;
      buf = [head];
    }
    for (var i = 0; i < rows.length; i++) {
      ensure(buf.length + 1);
      buf.push(rows[i]);
      if (buf.length > perPage) emit();
    }
    if (!pg) pg = newPage(title, subtitle);
    if (buf.length > 1) { ensure(buf.length + 1); emit(); }
    footer(pg);
    pages.push(pg.canvas);
  }

  /* opts: { stats, title, subtitle, rangeText, mode, shopName } */
  function buildPDF(opts) {
    opts = opts || {};
    var s = opts.stats || summarize([]);
    var title = opts.title || '营业报表';
    var subtitle = [opts.shopName, opts.rangeText, modeLabel(opts.mode || '')]
      .filter(Boolean).join('　·　') || U.formatDate(new Date());

    K().drawStatBox(pg.ctx, MARGIN(), pg.y, bw, bh, '净营业额', 'RM ' + U.formatMoneyPlain(s.net), '#FF7A00');

    pg.y += bh + 20;
    K().drawStatBox(pg.ctx, MARGIN(), pg.y, bw, bh, '客单价', 'RM ' + U.formatMoneyPlain(s.avg), '#1F2937');
    K().drawStatBox(pg.ctx, MARGIN() + bw + 24, pg.y, bw, bh, '已退款',
                    'RM ' + U.formatMoneyPlain(s.refunded), s.refunded > 0 ? '#DC2626' : '#0F9D58');
    pg.y += bh + 20;
    K().drawStatBox(pg.ctx, MARGIN(), pg.y, bw, bh, '营业额（原价）', 'RM ' + U.formatMoneyPlain(s.gross), '#1F2937');
    K().drawStatBox(pg.ctx, MARGIN() + bw + 24, pg.y, bw, bh, '含退款订单', s.nRefundOrders + ' 单',
                    s.nRefundOrders ? '#DC2626' : '#1F2937');
    pg.y += bh + 40;

    var pages = [];

    // 营业模式分布
    if (s.modeList.length) {
      pg.y = section(pg.ctx, pg.y, '营业模式分布');
      var mh = ['营业模式', '订单数', '原价 RM', '已退 RM', '净额 RM'];
      var mw = [220, 160, 200, 200, 240];
      var mb = s.modeList.map(function (m) {
        return [modeLabel(m.mode), String(m.count), U.formatMoneyPlain(m.gross),
                U.formatMoneyPlain(m.back), U.formatMoneyPlain(m.net)];
      });
      drawPagedTable(pages, title, subtitle, mh, mb, mw, 22, pg);
      pg = null;   // 上面已经收尾进 pages 了，后面的表另起新页
    } else {
      footer(pg); pages.push(pg.canvas); pg = null;
    }

    // 支付方式
    if (s.payList.length) {
      drawPagedTable(pages, title, subtitle,
        ['支付方式', '订单数', '净额 RM'],
        s.payList.map(function (p) {
          return [p.method, String(p.count), U.formatMoneyPlain(p.amount)];
        }),
        [320, 220, 300], 22);
    }

    // 菜品销量榜（只取前 30，再往后 PDF 上也没人看）
    if (s.itemList.length) {
      drawPagedTable(pages, title, subtitle,
        ['菜名', '规格', '卖出份数', '退份', '下单金额 RM'],
        s.itemList.slice(0, 30).map(function (it) {
          return [it.name, it.spec || '标准', String(it.soldQty),
                  String(it.refundQty), U.formatMoneyPlain(it.amount)];
        }),
        [280, 190, 160, 130, 220], 22);
    }

    // 每日趋势（跨天才画，单日报表没必要）
    if (s.dayList.length > 1) {
      drawPagedTable(pages, title, subtitle,
        ['日期', '订单数', '净额 RM'],
        s.dayList.map(function (d) {
          return [d.date, String(d.count), U.formatMoneyPlain(d.net)];
        }),
        [320, 220, 300], 24);
    }

    if (!pages.length) {
      var p0 = newPage(title, subtitle);
      p0.ctx.fillStyle = '#9CA3AF';
      p0.ctx.font = '600 28px ' + FONT;
      p0.ctx.textAlign = 'center';
      p0.ctx.fillText('该条件下没有数据', K().PAGE_W / 2, 400);
      p0.ctx.textAlign = 'left';
      footer(p0);
      pages.push(p0.canvas);
    }
    return Promise.resolve(K().pagesToBlob(pages));
  }

  G.Report = {
    summarize: summarize,
    filterByMode: filterByMode,
    modeOptions: modeOptions,
    modeLabel: modeLabel,
    rangeOf: rangeOf,

  };
})(window);

      var tip = U.el('div', { style: 'font-size:11px;color:var(--muted);text-align:center;margin-top:6px;' });
