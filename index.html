  /* 按 kind 取删除前检查函数与删除函数。
     四个层级都有删除入口，但下面还挂着东西时会被挡下，
     提示里写明要先处理的是哪一层、多少个。 */
  function tryDelete(kind, id, name) {
    return G.App.cats.checkDelete(kind, id).then(function (res) {
      if (!res.ok) {
        U.toast('无法删除「' + name + '」：' + res.why + '。', 'err');
        return false;
      }
      return U.confirm({
        title: '删除' + LEVEL_NAME[kind] + '分类？',
        message: '确定删除「' + name + '」？该操作不可撤销。',
        okText: '删除', danger: true
      }).then(function (ok) {
        if (!ok) return false;
        return DEL_FN[kind](id).then(function () { return true; });
      });
    });
  }

  /* 名称编辑弹窗 */
  function rename(kind, node) {
    return U.prompt({
      title: '重命名', label: '分类名称', value: node.name, placeholder: '例如：汤面'
    }).then(function (v) {
      if (v == null) return false;
      v = String(v).trim();
      if (!v) { U.toast('名称不能为空', 'err'); return false; }
      node.name = v;
      return SAVE_FN[kind](node).then(function () { return true; });
    });
  }

  /* 新增分类：一级无需父级；二级绑一级；三级绑二级；四级绑三级 */
  function create(kind, parent) {
    return U.prompt({
      title: '新增' + LEVEL_NAME[kind] + '分类',
      label: '名称',
      placeholder: kind === 'cat' ? '例如：面类' : (kind === 'sub' ? '例如：汤面' : (kind === 'third' ? '例如：细汤面' : '例如：微辣'))
    }).then(function (v) {
      if (v == null) return false;
      v = String(v).trim();
      if (!v) { U.toast('名称不能为空', 'err'); return false; }
      if (kind === 'cat') return G.App.cats.save({ name: v, isActive: true }).then(function () { return true; });
      var payload = { name: v, isActive: true };
      payload[PARENT_FIELD[kind]] = parent;
      return SAVE_FN[kind](payload).then(function () { return true; });
    });
  }

  function toggle(node, kind) {
    node.isActive = !node.isActive;
    return SAVE_FN[kind](node);
  }

  /* ------------------------------------------------------------
   * 渲染分类树（可编辑版，用于菜单管理页）
   * opts: { editable, onChanged, container }
   * ---------------------------------------------------------- */
  function renderTree(container, tree, opts) {
    opts = opts || {};
    container.innerHTML = '';
    if (!tree.length) {
      container.appendChild(U.el('div', { class: 'empty' }, [
        U.el('div', { class: 'em' }, '🗂️'),
        U.el('p', null, '还没有分类，先新增一个一级分类')
      ]));
      return;
    }
    tree.forEach(function (c, ci) {
      container.appendChild(row('cat', c.cat, 0, {
        count: countText(c),
        canAdd: true, addLabel: '+二级',
        up: ci > 0, down: ci < tree.length - 1
      }));
      (c.subs || []).forEach(function (s, si) {
        container.appendChild(row('sub', s.sub, 1, {
          count: countText(s),
          canAdd: true, addLabel: '+三级',
          up: si > 0, down: si < c.subs.length - 1
        }));
        (s.thirds || []).forEach(function (t, ti) {
          container.appendChild(row('third', t.third, 2, {
            count: countText(t),
            canAdd: true, addLabel: '+四级（可选）',
            up: ti > 0, down: ti < s.thirds.length - 1
          }));
          (t.fourths || []).forEach(function (f, fi) {
            container.appendChild(row('fourth', f.fourth, 3, {
              count: countText(f),
              canAdd: false,
              up: fi > 0, down: fi < t.fourths.length - 1
            }));
          });
        });
      });
    });

    /* 统计文案：下级数量 + 本层直属菜数 */
    function countText(node) {
      var parts = [];
      var kids = node.subs || node.thirds || node.fourths;
      if (kids) parts.push(kids.length + ' 个下级');
      var d = node.dishes || [];
      if (d.length) parts.push(d.length + ' 道菜');
      return parts.join(' · ') || '空';
    }

    function row(kind, node, level, cfg) {
      var id = node[ID_KEY[kind]];
      var r = U.el('div', { class: 'cat-row lv' + level + (node.isActive ? '' : ' off'), 'data-kind': kind, 'data-id': id });
      r.innerHTML =
        '<span class="cr-grip" title="拖动排序">⋮⋮</span>' +
        '<span class="cr-dot lv' + level + '"></span>' +
        '<span class="cr-lv">' + LEVEL_NAME[kind] + '</span>' +
        '<span class="cr-nm">' + U.escapeHTML(node.name) + '</span>' +
        (node.isActive ? '' : '<span class="tag">已停用</span>') +
        '<span class="cr-cnt">' + U.escapeHTML(cfg.count || '') + '</span>';
      var acts = U.el('div', { class: 'cr-acts' });
      if (opts.editable) {
        if (cfg.up) acts.appendChild(mini('↑', 'up', '上移'));
        if (cfg.down) acts.appendChild(mini('↓', 'down', '下移'));
        acts.appendChild(mini('改名', 'edit', '重命名'));
        acts.appendChild(mini(node.isActive ? '停用' : '启用', 'toggle', '点餐页显示 / 隐藏'));
        if (cfg.canAdd) acts.appendChild(mini(cfg.addLabel, 'add', '新增下级分类'));
        acts.appendChild(mini('删除', 'del', '删除' + LEVEL_NAME[kind] + '分类', true));
      } else {
        acts.appendChild(U.el('span', { class: 'cr-locked' }, '🔒 员工只读'));
      }
      r.appendChild(acts);
      if (opts.editable) r.setAttribute('draggable', 'true');
      return r;

      function mini(label, act, title, danger) {
        return U.el('button', { class: 'btn-mini' + (danger ? ' danger' : ''), 'data-act': act, title: title }, label);
      }
    }

    if (!opts.editable) return;

    /* 事件委托：整棵树只挂一份监听 */
    container.onclick = function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      var rowEl = e.target.closest('.cat-row');
      if (!rowEl) return;
      var kind = rowEl.getAttribute('data-kind');
      var id = rowEl.getAttribute('data-id');
      var node = findNode(tree, kind, id);
      if (!node) return;
      var act = b.getAttribute('data-act');

      if (act === 'up' || act === 'down') {
        move(kind, tree, id, act === 'up' ? -1 : 1).then(function (ok) { if (ok) opts.onChanged && opts.onChanged(); });
      } else if (act === 'edit') {
        rename(kind, node).then(function (ok) { if (ok) opts.onChanged && opts.onChanged(); });
      } else if (act === 'toggle') {
        toggle(node, kind).then(function () { opts.onChanged && opts.onChanged(); });
      } else if (act === 'add') {
        var childKind = kind === 'cat' ? 'sub' : (kind === 'sub' ? 'third' : 'fourth');
        create(childKind, id).then(function (ok) { if (ok) opts.onChanged && opts.onChanged(); });
      } else if (act === 'del') {
        tryDelete(kind, id, node.name).then(function (ok) { if (ok) opts.onChanged && opts.onChanged(); });
      }
    };

    /* HTML5 拖拽排序（桌面端）；同层级之间才允许换位置 */
    var dragRow = null;
    container.ondragstart = function (e) {
      var rowEl = e.target.closest('.cat-row');
      if (!rowEl) return;
      dragRow = rowEl;
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', rowEl.getAttribute('data-id')); } catch (err) {}
      rowEl.classList.add('dragging');
    };
    container.ondragover = function (e) {
      if (!dragRow) return;
      var over = e.target.closest('.cat-row');
      if (!over || over === dragRow) return;
      if (over.getAttribute('data-kind') !== dragRow.getAttribute('data-kind')) return;  // 跨层不允许
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      var box = over.getBoundingClientRect();
      var after = (e.clientY - box.top) > box.height / 2;
      container.insertBefore(dragRow, after ? over.nextSibling : over);
    };
    container.ondragend = function () {
      if (!dragRow) return;
      dragRow.classList.remove('dragging');
      var kind = dragRow.getAttribute('data-kind');
      var ids = U.qsa('.cat-row[data-kind="' + kind + '"]', container)
        .map(function (x) { return x.getAttribute('data-id'); });
      dragRow = null;
      commitDrag(kind, ids, tree).then(function (ok) { if (ok) opts.onChanged && opts.onChanged(); });
    };
  }

  /* 拖拽结束后：只把「同一父级下的同一层」按 DOM 新顺序写回 sort */
  function commitDrag(kind, ids, tree) {
    var jobs = [];
    if (kind === 'cat') {
      var list = ids.map(function (id) {
        return tree.filter(function (x) { return x.cat.categoryId === id; })[0];
      }).filter(Boolean).map(function (x) { return x.cat; });
      if (list.length === tree.length && list.length > 1) jobs.push(persistOrder(list, SAVE_FN.cat));
    } else if (kind === 'sub') {
      tree.forEach(function (c) {
        var own = ids.map(function (id) {
          return c.subs.filter(function (s) { return s.sub.subId === id; })[0];
        }).filter(Boolean).map(function (x) { return x.sub; });
        if (own.length === c.subs.length && own.length > 1) jobs.push(persistOrder(own, SAVE_FN.sub));
      });
    } else if (kind === 'third') {
      tree.forEach(function (c) {
        c.subs.forEach(function (s) {
          var own = ids.map(function (id) {
            return s.thirds.filter(function (t) { return t.third.thirdId === id; })[0];
          }).filter(Boolean).map(function (x) { return x.third; });
          if (own.length === s.thirds.length && own.length > 1) jobs.push(persistOrder(own, SAVE_FN.third));
        });
      });
    } else {
      tree.forEach(function (c) {
        c.subs.forEach(function (s) {
          s.thirds.forEach(function (t) {
            var own = ids.map(function (id) {
              return t.fourths.filter(function (f) { return f.fourth.fourthId === id; })[0];
            }).filter(Boolean).map(function (x) { return x.fourth; });
            if (own.length === t.fourths.length && own.length > 1) jobs.push(persistOrder(own, SAVE_FN.fourth));
          });
        });
      });
    }
    if (!jobs.length) return Promise.resolve(false);
    return Promise.all(jobs).then(function () { return true; });
  }

  function findNode(tree, kind, id) {
    var out = null;
    tree.forEach(function (c) {
      if (kind === 'cat' && c.cat.categoryId === id) out = c.cat;
      (c.subs || []).forEach(function (s) {
        if (kind === 'sub' && s.sub.subId === id) out = s.sub;
        (s.thirds || []).forEach(function (t) {
          if (kind === 'third' && t.third.thirdId === id) out = t.third;
          (t.fourths || []).forEach(function (f) {
            if (kind === 'fourth' && f.fourth.fourthId === id) out = f.fourth;
          });
        });
      });
    });
    return out;
  }

  G.Cats = {
    loadTree: loadTree,
    prune: prune,
    onSale: onSale,
    renderTree: renderTree,
    create: create,
    rename: rename,
    tryDelete: tryDelete,
    move: move,
    siblingsOf: siblingsOf,
    findNode: findNode,
    KINDS: KINDS,
    ID_KEY: ID_KEY,
    LEVEL_NAME: LEVEL_NAME,
    CHILD_NAME: CHILD_NAME
  };
})(window);


/* ============ 27-paycalc.js ============ */
/* 27-paycalc.js · 收款计算器（共用组件）
   应付 / 实收 / 找零 + 快捷金额 + 数字键盘，一个组件两处用：
     · 结账页（68）把它内嵌在页面卡片里
     · 点餐页（61）点「收款」时把它装进弹窗
   两边共用同一套录入规则（走 Flow.keypad），不会出现"这里能按三位小数、那里只能两位"的分歧。
   应付只能由菜品算出，这里改不了。 */
(function (G) {
  'use strict';
  var U = G.U;

  function money(n) { return Math.round((+n || 0) * 100) / 100; }

  /* 末行让 0 与 . 各占两格，手指更容易点中 */
  var KEYS = [
    ['7', '8', '9', 'back'],
    ['4', '5', '6', 'clear'],
    ['1', '2', '3', '00'],
    [['0', 2], ['.', 2]]
  ];

  /* opts: { due: number, onChange: function(state) }
     state = { due, paid, change, paidStr, insufficient }
     返回 { el, state, paint, setDue, pushKey, paid, change, insufficient, reset } */
  function create(opts) {
    opts = opts || {};
    var due = money(opts.due || 0);
    var st = { paidStr: '' };

    var el = U.el('div', { class: 'pc-body' });
    el.innerHTML =
      '<div class="co-rows">' +
        '<div class="co-row"><span class="k">应付</span><span class="v" data-f="due">RM 0.00</span></div>' +
        '<div class="co-row"><span class="k">实收</span><span class="v big" data-f="paid">RM 0.00</span></div>' +
        '<div class="co-row change" data-f="chgrow"><span class="k">找零</span><span class="v big" data-f="change">RM 0.00</span></div>' +
      '</div>' +
      '<div class="co-err" data-f="err" style="display:none;">收款不足，金额不能小于应付</div>' +
      '<div class="co-quick" data-f="quick"></div>' +
      '<div class="co-keypad" data-f="keypad"></div>';

    function q(f) { return el.querySelector('[data-f="' + f + '"]'); }

    var api = {
      el: el,
      state: st,
      due: function () { return due; },
      paid: function () { return st.paidStr === '' ? 0 : money(parseFloat(st.paidStr)); },
      change: function () { return money(api.paid() - due); },
      insufficient: function () { return st.paidStr !== '' && api.paid() < due - 0.0001; },
      setDue: function (v) { due = money(v || 0); paint(); },
      pushKey: function (k) { st.paidStr = G.Flow.keypad(st.paidStr, k); paint(); },
      reset: function () { st.paidStr = ''; paint(); },
      paint: paint
    };

    /* 只改文本和状态类，不重建键盘 —— 按数字时不会因为重绘而丢焦点 */
    function paint() {
      var paid = api.paid(), chg = api.change(), bad = api.insufficient();
      q('due').textContent = 'RM ' + U.formatMoneyPlain(due);
      q('paid').textContent = 'RM ' + U.formatMoneyPlain(paid);
      // 还没录实收时别显示负数找零（看着像少收钱）
      q('change').textContent = 'RM ' + U.formatMoneyPlain(st.paidStr === '' ? 0 : chg);
      q('chgrow').classList.toggle('over', chg > 0.0001);
      q('err').style.display = bad ? 'block' : 'none';
      if (opts.onChange) {
        opts.onChange({ due: due, paid: paid, change: chg, paidStr: st.paidStr, insufficient: bad });
      }
    }

    /* 快捷金额：一键填够。+5 / +10 也可能不够付，取 max 兜底 */
    var quick = q('quick');
    [['应付', due], ['+5', due + 5], ['+10', due + 10], ['50', 50], ['100', 100]].forEach(function (item) {
      var b = U.el('button', { class: 'chip' }, item[0]);
      b.addEventListener('click', function () {
        st.paidStr = String(money(Math.max(item[1], due)));
        paint();
      });
      quick.appendChild(b);
    });

    var kp = q('keypad');
    KEYS.forEach(function (row) {
      row.forEach(function (cell) {
        var key = Array.isArray(cell) ? cell[0] : cell;
        var span = Array.isArray(cell) ? cell[1] : 1;
        var label = key === 'back' ? '⌫' : (key === 'clear' ? 'C' : key);
        var b = U.el('button', {
          class: 'co-key' + (key === 'back' || key === 'clear' ? ' fn' : ''),
          'data-key': key
        }, label);
        if (span > 1) b.style.gridColumn = 'span ' + span;
        kp.appendChild(b);
      });
    });
    kp.addEventListener('click', function (e) {
      var b = e.target.closest('[data-key]');
      if (!b) return;
      api.pushKey(b.getAttribute('data-key'));
    });

    paint();
    return api;
  }

  /* 弹窗版：点餐页点「收款」时用。确认后 resolve({paid, change})，取消 resolve(null) */
  function prompt(o) {
    o = o || {};
    return new Promise(function (resolve) {
      var okBtn = null, settled = false;
      var calc = create({
        due: o.due,
        onChange: function (s) { if (okBtn) okBtn.disabled = s.insufficient; }
      });

      var host = U.el('div', { class: 'co-pay' });
      host.appendChild(calc.el);

      var html =
        '<div class="modal-mask"><div class="modal" style="max-width:420px;">' +
          '<div class="modal-head"><h3>' + U.escapeHTML(o.title || '收款') + '</h3>' +
            '<button class="icon-btn" data-act="x" aria-label="关闭">' +
              '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>' +
            '</button></div>' +
          '<div class="modal-body">' +
            (o.subtitle ? '<div class="pc-sub">' + U.escapeHTML(o.subtitle) + '</div>' : '') +
            '<div data-slot="calc"></div>' +
          '</div>' +
          '<div class="modal-foot">' +
            '<button class="btn btn-gray" data-act="cancel">取消</button>' +
            '<button class="btn" data-act="ok">' + U.escapeHTML(o.okText || '确认收款') + '</button>' +
          '</div>' +
        '</div></div>';
      var m = U.openModal(html);
      m.querySelector('[data-slot="calc"]').appendChild(host);
      okBtn = m.querySelector('[data-act="ok"]');

      function done(v) {
        if (settled) return;
        settled = true;
        U.closeAllModals();
        resolve(v);
      }

      m.addEventListener('click', function (e) {
        if (e.target === m || e.target.closest('[data-act="cancel"]') || e.target.closest('[data-act="x"]')) {
          done(null);
          return;
        }
        if (!e.target.closest('[data-act="ok"]')) return;
        if (calc.state.paidStr === '') { U.toast('请先输入实收金额', 'err'); return; }
        if (calc.insufficient()) {
          U.toast('收款不足，金额不能小于应付 RM ' + U.formatMoneyPlain(calc.due()), 'err');
          return;
        }
        done({ paid: calc.paid(), change: calc.change() });
      });
    });
  }

  G.PayCalc = { create: create, prompt: prompt, KEYS: KEYS };
})(window);


/* ============ 40-print.js ============ */
/* 40-print.js · 三模式小票打印
   - WebUSB  有线 58mm 热敏
   - WebBLE  蓝牙热敏（安卓 / 桌面 Chrome）
   - 浏览器  window.print() 兜底
   中文采用 GB18030 编码（GBK 超集），首次使用懒构建反查表，缓存于 window。 */
(function (G) {
  'use strict';

  var U = G.U;

  /* =====================================================
   *  ESC/POS 指令生成
   * ===================================================== */
  var ESC = 0x1B, GS = 0x1D, FS = 0x1C, DLE = 0x10;

  var ESCPOS = {
    INIT:        [ESC, 0x40],                                // ESC @
    CHINESE_ON:  [FS, 0x26],                                 // FS & 开启中文模式
    CHINESE_OFF: [FS, 0x2E],                                 // FS .
    ALIGN_L:     [ESC, 0x61, 0x00],
    ALIGN_C:     [ESC, 0x61, 0x01],
    ALIGN_R:     [ESC, 0x61, 0x02],
    BOLD_ON:     [ESC, 0x45, 0x01],
    BOLD_OFF:    [ESC, 0x45, 0x00],
    SIZE_1:      [GS, 0x21, 0x00],                           // 1× 宽高
    SIZE_2W:     [GS, 0x21, 0x10],                           // 2× 宽
    SIZE_2H:     [GS, 0x21, 0x01],                           // 2× 高
    SIZE_2:      [GS, 0x21, 0x11],                           // 2× 宽高
    SIZE_3:      [GS, 0x21, 0x22],                           // 3× 宽高
    LF:          [0x0A],
    PAPER_CUT:   [GS, 0x56, 0x42, 0x00],                     // 切纸
    FEED_N:      function (n) { return [ESC, 0x4A, n & 0xFF]; },
    LINE_DOTS:   function (n) { return [GS, 0x2F, n & 0xFF]; }
  };

  /* =====================================================
   *  GB18030 / GBK 编码器（懒构建反查表）
   * ===================================================== */
  var _gbkReady = null;       // Promise<Uint8Array map>
  var _gbkDecoder = null;
  function getDecoder() {
    if (_gbkDecoder) return _gbkDecoder;
    try { _gbkDecoder = new TextDecoder('gb18030', { fatal: false }); }
    catch (e) {
      try { _gbkDecoder = new TextDecoder('gbk', { fatal: false }); }
      catch (e2) { _gbkDecoder = new TextDecoder('utf-8'); }
    }
    return _gbkDecoder;
  }

  function buildGbkTable() {
    if (_gbkReady) return _gbkReady;
    _gbkReady = new Promise(function (resolve, reject) {
      try {
        var dec = getDecoder();
        var rev = Object.create(null);
        var lead, trail, bytes, s, ch;
        for (lead = 0x81; lead <= 0xFE; lead++) {
          for (trail = 0x40; trail <= 0xFE; trail++) {
            if (trail === 0x7F) continue;
            bytes = new Uint8Array([lead, trail]);
            s = dec.decode(bytes, { fatal: false });
            if (s && s.length === 1) {
              ch = s.charCodeAt(0);
              if (ch > 0x1F && !(ch in rev)) rev[ch] = [lead, trail];
            }
          }
        }
        // 标记完成
        G.__gbkRev = rev;
        resolve(rev);
      } catch (e) { reject(e); }
    });
    return _gbkReady;
  }

  function ensureGbkReady() {
    if (G.__gbkRev) return Promise.resolve(G.__gbkRev);
    return buildGbkTable();
  }

  function encodeForPrinter(text) {
    // 同步编码（仅在表格就绪后调用；上层需 await ensureGbkReady）
    var rev = G.__gbkRev || {};
    var bytes = [];
    var i = 0, ch, code, b;
    while (i < text.length) {
      ch = text.charAt(i);
      code = text.charCodeAt(i);
      if (code < 0x80) { bytes.push(code); i++; continue; }
      // 中文 / 非常用字符
      if (rev[code]) { bytes.push(rev[code][0], rev[code][1]); }
      else { bytes.push(0x3F); } // '?'
      i++;
    }
    return bytes;
  }

  function flushBytes(arr) {
    return Array.prototype.slice.call(arr);
  }

  /* =====================================================
   *  小票内容构造
   * ===================================================== */
  function pad(text, width) {
    text = String(text == null ? '' : text);
    if (text.length >= width) return text;
    return text + ' '.repeat(width - text.length);
  }
  function padL(text, width) {
    text = String(text == null ? '' : text);
    if (text.length >= width) return text;
    return ' '.repeat(width - text.length) + text;
  }
  function padDots(name, left, right) {
    name = String(name == null ? '' : name);
    if (name.length + right.length + 1 <= left) {
      return name + ' ' + '.'.repeat(left - name.length - right.length - 1) + ' ' + right;
    }
    if (name.length + 1 + right.length > left) {
      // 截断名字
      var avail = left - right.length - 2;
      if (avail < 1) return padL(right, left);
      name = name.slice(0, avail - 1) + '…';
    }
    var dotN = left - name.length - right.length;
    return name + ' ' + (dotN > 0 ? '.'.repeat(dotN) : '') + ' ' + right;
  }

  /* 小票抬头四件套：店铺名称 / 地址 / 电话 / REG NO.
     空值整行不输出 —— 没填的项目不留空白行。 */
  function shopLines(cfg) {
    var out = [cfg.receiptHeader || '点餐收银'];
    if (cfg.shopAddr) out.push(cfg.shopAddr);
    if (cfg.shopPhone) out.push('Tel: ' + cfg.shopPhone);
    if (cfg.shopReg) out.push('REG NO: ' + cfg.shopReg);
    return out;
  }

  function buildReceiptContent(order, cfg, opts) {
    opts = opts || {};
    var lines = [];
    var sep = '--------------------------------';
    var sep2 = '================================';

    // 头部：店名（大号加粗）+ 地址 / 电话 / REG NO.（常规字号）
    var head = shopLines(cfg);
    lines.push([].concat(ESCPOS.ALIGN_C, ESCPOS.SIZE_2, ESCPOS.BOLD_ON,
                         encodeForPrinter(head[0]),
                         ESCPOS.LF,
                         ESCPOS.SIZE_1, ESCPOS.BOLD_OFF));
    head.slice(1).forEach(function (t) {
      lines.push([].concat(ESCPOS.ALIGN_C, encodeForPrinter(t), ESCPOS.LF));
    });
    lines.push([].concat(ESCPOS.ALIGN_C,
                         encodeForPrinter(U.formatDateCN(new Date()) + ' ' + U.formatHM(new Date())),
                         ESCPOS.LF));
    lines.push([].concat(ESCPOS.ALIGN_C, encodeForPrinter('单号：' + (order.orderNo || '-')), ESCPOS.LF));
    lines.push(ESCPOS.LF.slice());

    var isTA = order.kind === 'takeaway';
    // 桌台 / 人数 / 支付
    lines.push([].concat(ESCPOS.ALIGN_L,
                         encodeForPrinter(pad('桌号', 6) + (isTA ? '外带（无固定桌号）' : ('桌 ' + order.table + ' 号'))),
                         ESCPOS.LF));
    if (!isTA) {
      lines.push([].concat(ESCPOS.ALIGN_L,
                           encodeForPrinter(pad('人数', 6) + order.pax + ' 人'),
                           ESCPOS.LF));
    }
    lines.push([].concat(ESCPOS.ALIGN_L,
                         encodeForPrinter(pad('支付', 6) + order.payMethod),
                         ESCPOS.LF));
    lines.push([].concat(ESCPOS.ALIGN_L, encodeForPrinter(sep), ESCPOS.LF));

    // 菜品
    order.items.forEach(function (it) {
      var nm = it.name + (it.specName ? '(' + it.specName + ')' : '');
      var right = 'RM ' + U.formatMoneyPlain(it.subtotal);
      lines.push([].concat(ESCPOS.ALIGN_L, encodeForPrinter(padDots(nm, 32, right)), ESCPOS.LF));
      // 单价 + 数量
      var sub = '  ' + U.formatMoneyPlain(it.unitPrice) + ' x ' + it.qty;
      if (it.addons && it.addons.length) {
        sub += '  +' + it.addons.map(function (a) { return a.name; }).join('/');
      }
      if (it.excludes && it.excludes.length) {
        sub += '  少:' + it.excludes.map(function (e) { return e.name; }).join('/');
      }
      lines.push([].concat(ESCPOS.ALIGN_L, encodeForPrinter(sub), ESCPOS.LF));
    });

    lines.push([].concat(ESCPOS.ALIGN_L, encodeForPrinter(sep), ESCPOS.LF));
    // 应付 / 实收 / 找零（应付永远由菜品算出，实收由收银键盘录入）
    var due = order.due != null ? order.due : order.total;
    var paid = order.paid != null ? order.paid : due;
    var chg = order.change != null ? order.change : Math.max(0, paid - due);
    lines.push([].concat(ESCPOS.ALIGN_L, encodeForPrinter(padDots('应付', 32, 'RM ' + U.formatMoneyPlain(due))), ESCPOS.LF));
    lines.push([].concat(ESCPOS.ALIGN_L, encodeForPrinter(padDots('实收', 32, 'RM ' + U.formatMoneyPlain(paid))), ESCPOS.LF));
    lines.push([].concat(ESCPOS.ALIGN_L, ESCPOS.BOLD_ON,
                         encodeForPrinter(padDots('找零', 32, 'RM ' + U.formatMoneyPlain(chg))),
                         ESCPOS.BOLD_OFF, ESCPOS.LF));
    lines.push([].concat(ESCPOS.ALIGN_L, encodeForPrinter(sep), ESCPOS.LF));
    // 合计
    lines.push([].concat(ESCPOS.ALIGN_C, ESCPOS.SIZE_2, ESCPOS.BOLD_ON,
                         encodeForPrinter('合计：RM ' + U.formatMoneyPlain(order.total)),
                         ESCPOS.LF,
                         ESCPOS.SIZE_1, ESCPOS.BOLD_OFF));
    lines.push([].concat(ESCPOS.LF, ESCPOS.LF));
    // 操作员
    if (order.operator) {
      lines.push([].concat(ESCPOS.ALIGN_L, encodeForPrinter(pad('操作员', 6) + order.operator), ESCPOS.LF));
    }
    lines.push([].concat(ESCPOS.LF, ESCPOS.LF, ESCPOS.LF));
    // 底部备注
    if (cfg.receiptFooter) {
      lines.push([].concat(ESCPOS.ALIGN_C, encodeForPrinter(cfg.receiptFooter), ESCPOS.LF));
    }
    lines.push([].concat(ESCPOS.LF, ESCPOS.LF, ESCPOS.LF));
    lines.push(ESCPOS.PAPER_CUT);

    // 合并成一个 Uint8Array
    var total = 0;
    lines.forEach(function (l) { total += l.length; });
    var out = new Uint8Array(total);
    var off = 0;
    lines.forEach(function (l) { out.set(l, off); off += l.length; });
    return out;
  }

  /* =====================================================
   *  WebUSB 有线打印
   * ===================================================== */
  var _usbDevice = null, _usbInterface = null, _usbEndpointOut = null;

  function usbInit() {
    if (!navigator.usb) return Promise.reject(new Error('当前浏览器不支持 WebUSB，请改用 Chrome / Edge 桌面版'));
    return navigator.usb.getDevices().then(function (list) {
      // 优先返回已经授权过的打印机
      var prn = list.find(function (d) { return /printer|58|80|print/i.test(JSON.stringify(d.productName || '')); }) || list[0];
      if (prn) { _usbDevice = prn; return prn.open(); }
      return navigator.usb.requestDevice({ filters: [] }).then(function (d) {
        _usbDevice = d; return d.open();
      });
    }).then(function () {
      if (_usbDevice.configuration === null) return _usbDevice.selectConfiguration(1);
    }).then(function () {
      var iface = _usbDevice.configuration.interfaces[0];
      _usbInterface = iface;
      return _usbDevice.claimInterface(iface.interfaceNumber);
    }).then(function () {
      var ep = _usbInterface.alternate.endpoints.find(function (e) { return e.direction === 'out'; });
      if (!ep) throw new Error('未找到 USB 输出端点');
      _usbEndpointOut = ep.endpointNumber;
      return true;
    });

    if (!_usbDevice) return Promise.reject(new Error('USB 未连接'));
    // 分片（很多小票机端点包大小 64）
    var chunk = 64, p = 0;
    function sendOne() {
      if (p >= bytes.length) return Promise.resolve();
      var slice = bytes.subarray(p, p + chunk);
      p += chunk;
      return _usbDevice.transferOut(_usbEndpointOut, slice).then(sendOne);
    }
    return sendOne();
  }

   *  Web Bluetooth 打印
   * ===================================================== */
  var _bleDevice = null, _bleWriteChar = null;

  var BLE_TX  = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
  // 备用：通用 0xFF00 系
  var BLE_SVC_FF = '0000ff00-0000-1000-8000-00805f9b34fb';
  var BLE_TX_FF  = '0000ff02-0000-1000-8000-00805f9b34fb';

  function bleInit() {
    if (!navigator.bluetooth) return Promise.reject(new Error('当前浏览器不支持 Web Bluetooth（仅安卓 Chrome / 桌面 Chrome 有效）'));

      acceptAllDevices: true,
      optionalServices: [BLE_SVC, BLE_SVC_FF]

      G.App.cfg.set('bleDeviceId', d.id);
      G.App.cfg.set('bleDeviceName', d.name || '');
      return d.gatt.connect();
    }).then(function (server) {
      // 优先尝试 Nordic UART
      return server.getPrimaryService(BLE_SVC).catch(function () { return server.getPrimaryService(BLE_SVC_FF); });
    }).then(function (svc) {
      // 尝试获取 write characteristic
      return svc.getCharacteristic(BLE_TX).catch(function () { return svc.getCharacteristic(BLE_TX_FF); });
    }).then(function (ch) { _bleWriteChar = ch; return ch; });
  }

  function bleReconnect() {
    if (!navigator.bluetooth || !G.App.cfg.get('bleDeviceId')) return Promise.reject(new Error('尚未保存蓝牙设备'));
    return navigator.bluetooth.getDevices ? navigator.bluetooth.getDevices() : Promise.resolve([]);
  }

  function bleSend(bytes) {
    if (!_bleWriteChar) return Promise.reject(new Error('蓝牙未连接'));
    var chunk = 20, p = 0;
    function step() {
      if (p >= bytes.length) return Promise.resolve();
      var slice = bytes.subarray(p, p + chunk);
      p += chunk;
      if (_bleWriteChar.writeValueWithoutResponse) return _bleWriteChar.writeValueWithoutResponse(slice).then(step);
      return _bleWriteChar.writeValue(slice).then(step);
    }
    return step();
  }

/* ============ 50-pdf.js ============ */
/* 50-pdf.js · 营业报告 PDF 生成（Canvas 渲染 + 手写极简 PDF 写入器）
   不依赖任何外部库；中文由系统字体直接绘制到 Canvas，再以 JPEG 嵌入 PDF。 */
(function (G) {
  'use strict';

  var U = G.U;

  /* ====== 画布参数（A4 纵向，150dpi） ====== */
  var PAGE_W = 1240, PAGE_H = 1754;  // 像素
  var PT_W = 595, PT_H = 842;        // PDF 点（A4）
  var MARGIN = 60;

  /* ====== 极简 PDF 写入器（JPEG 图像，每页一张图） ====== */
  function pdfFromJPEGPages(jpegPages) {
    // jpegPages: Array<Uint8Array>
    var objs = [];     // 1-based index; index 0 reserved
    function addObj(content) {
      objs.push(content);
      return objs.length; // 1-based
    }

    // 1: Catalog
    var catalog = addObj('<< /Type /Catalog /Pages 2 0 R >>');
    // 2: Pages（先占位，稍后填 kids / count）
    var pagesId = addObj(null);
    // 3..n: 每页 Page + Contents + Image
    var pageIds = [];
    jpegPages.forEach(function (jpegBytes) {
      var imageId = addObj({ kind: 'image', bytes: jpegBytes });
      var contentId = addObj({ kind: 'stream',
        data: 'q\n' + PT_W + ' 0 0 ' + PT_H + ' 0 0 cm\n' +
              '/Img' + imageId + ' Do\nQ\n' });
      var pageId = addObj(null); // 待回填
      pageIds.push({ pageId: pageId, contentId: contentId, imageId: imageId });
    });

    // 回填 Pages
    var kids = pageIds.map(function (p) { return p.pageId + ' 0 R'; }).join(' ');
    objs[pagesId - 1] = '<< /Type /Pages /Kids [' + kids + '] /Count ' + pageIds.length + ' >>';

    // 回填 Page 对象
    pageIds.forEach(function (p) {
      objs[p.pageId - 1] =
        '<< /Type /Page /Parent ' + pagesId + ' 0 R ' +
        '/MediaBox [0 0 ' + PT_W + ' ' + PT_H + '] ' +
        '/Resources << /XObject << /Img' + p.imageId + ' ' + p.imageId + ' 0 R >> /ProcSet [/PDF /ImageC] >> ' +
        '/Contents ' + p.contentId + ' 0 R >>';
    });

    // 拼接 PDF
    var enc = new TextEncoder();
    var header = enc.encode('%PDF-1.4\n%\xC2\xA0\xC2\xA0\xC2\xA0\xC2\xA0\n');
    var chunks = [header];
    var offsets = [0]; // object 0 offset (0)
    var pos = header.length;
    for (var i = 0; i < objs.length; i++) {
      offsets.push(pos);
      var obj = objs[i];
      if (obj && typeof obj === 'object' && obj.kind === 'image') {
        // 图像对象
        var head = enc.encode((i + 1) + ' 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + PAGE_W + ' /Height ' + PAGE_H +
                              ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + obj.bytes.length + ' >>\nstream\n');
        chunks.push(head);
        chunks.push(obj.bytes);
        chunks.push(enc.encode('\nendstream\nendobj\n'));
        pos += head.length + obj.bytes.length + ('\nendstream\nendobj\n').length;
      } else if (obj && typeof obj === 'object' && obj.kind === 'stream') {
        var data = enc.encode(obj.data);
        var sh = enc.encode((i + 1) + ' 0 obj\n<< /Length ' + data.length + ' >>\nstream\n');
        chunks.push(sh);
        chunks.push(data);
        chunks.push(enc.encode('\nendstream\nendobj\n'));
        pos += sh.length + data.length + ('\nendstream\nendobj\n').length;
      } else if (typeof obj === 'string') {
        var b = enc.encode((i + 1) + ' 0 obj\n' + obj + '\nendobj\n');
        chunks.push(b);
        pos += b.length;
      } else if (obj == null) {
        var b2 = enc.encode((i + 1) + ' 0 obj\n<<>>\nendobj\n');
        chunks.push(b2);
        pos += b2.length;
      }
    }
    var xrefOffset = pos;
    var xrefParts = [enc.encode('xref\n0 ' + (objs.length + 1) + '\n0000000000 65535 f \n')];
    for (var k = 1; k <= objs.length; k++) {
      xrefParts.push(enc.encode(('0000000000' + offsets[k]).slice(-10) + ' 00000 n \n'));
    }
    var xref = concatBytes(xrefParts);
    var trailer = enc.encode('trailer\n<< /Size ' + (objs.length + 1) + ' /Root ' + catalog + ' 0 R >>\nstartxref\n' + xrefOffset + '\n%%EOF\n');
    chunks.push(xref);
    chunks.push(trailer);
    return new Blob(chunks, { type: 'application/pdf' });
  }

  function concatBytes(arrs) {
    var total = 0; arrs.forEach(function (a) { total += a.length; });

    arrs.forEach(function (a) { out.set(a, p); p += a.length; });
    return out;
  }

  /* ====== Canvas 报告渲染 ====== */
  function newCanvas() {
    var c = document.createElement('canvas');
    c.width = PAGE_W; c.height = PAGE_H;
    return c;

        if (line.excludes && line.excludes.length) meta.push('-' + line.excludes.map(function (e) { return e.name; }).join('/'));

  /* 周 / 月区间：周一算一周的第一天（date 是 YYYY-MM-DD，字典序即时间序） */
  function weekRange(d) {
    var base = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var wd = (base.getDay() + 6) % 7;            // 周日 0 → 周一 0

      G.App.orders.list({ from: monthFirst(state.cur), to: monthLast(state.cur) }).then(function (orders) {
        var daysWith = {};
        orders.forEach(function (o) { daysWith[o.date] = (daysWith[o.date] || 0) + 1; });
        drawCal(body, daysWith);
      });

      prev.addEventListener('click', function () { state.cur = new Date(state.cur.getFullYear(), state.cur.getMonth() - 1, 1); refresh(); });
      next.addEventListener('click', function () { state.cur = new Date(state.cur.getFullYear(), state.cur.getMonth() + 1, 1); refresh(); });
      todayBtn.addEventListener('click', function () { state.cur = new Date(); state.sel = U.todayKey(); refresh(); renderDetail(); });

      title.textContent = state.cur.getFullYear() + ' 年 ' + (state.cur.getMonth() + 1) + ' 月';

      // 当日详情
      var detail = U.el('div', { id: 'cal-detail' });
      wrap.appendChild(detail);
      renderDetail();

    function monthFirst(d) { return U.todayKey(new Date(d.getFullYear(), d.getMonth(), 1)); }
    function monthLast(d) { return U.todayKey(new Date(d.getFullYear(), d.getMonth() + 1, 0)); }

    function drawCal(body, daysWith) {
      body.innerHTML = '';
      var y = state.cur.getFullYear(), m = state.cur.getMonth();
      var first = new Date(y, m, 1);
      var lead = first.getDay();
      var last = new Date(y, m + 1, 0).getDate();
      var todayK = U.todayKey();
      for (var i = 0; i < lead; i++) body.appendChild(U.el('div', { class: 'cal-cell blank' }));
      for (var d = 1; d <= last; d++) {
        var dk = y + '-' + (m < 9 ? '0' : '') + (m + 1) + '-' + (d < 10 ? '0' : '') + d;
        var cell = U.el('div', { class: 'cal-cell' + (dk === todayK ? ' today' : '') + (daysWith[dk] ? ' has-data' : '') + (dk === state.sel ? ' sel' : '') });

        if (daysWith[dk]) cell.appendChild(U.el('div', { class: 'cal-dot' }));
        cell.addEventListener('click', function () { state.sel = dk; refresh(); });
        body.appendChild(cell);

        btnPDF.disabled = true; btnPDF.textContent = '生成中…';
        Promise.all([G.App.orders.list({ date: state.sel }), G.App.ledger.list({ date: state.sel })]).then(function (res) {
          return G.PDF.generateAndArchive({
            orders: res[0] || [], ledger: res[1] || [],
            label: state.sel, scope: 'daily',
            fileName: '营业报告-' + state.sel,

      // 订单
      var oc = U.el('div', { class: 'card' });
      oc.innerHTML = '<div class="card-title">当日订单</div>';
      G.App.orders.list({ date: state.sel }).then(function (orders) {
        var total = 0; orders.forEach(function (o) { total += +o.total || 0; });
        var sum = U.el('div', { style: 'display:flex;justify-content:space-between;align-items:center;background:var(--grad);color:#fff;padding:10px 12px;border-radius:12px;margin-bottom:8px;' });
        sum.innerHTML = '<span style="font-size:12px;opacity:.92;font-weight:600;">合计</span><b style="font-size:18px;">' + orders.length + ' 单  ·  RM ' + U.formatMoneyPlain(total) + '</b>';

          oc.appendChild(U.el('div', { class: 'empty', style: 'padding:20px 0;' }, [

        } else {

    function findSub(c, id) {
      if (!c || !id) return null;
      for (var i = 0; i < c.subs.length; i++) if (c.subs[i].sub.subId === id) return c.subs[i];
      return null;
    }
    function findThird(s, id) {
      if (!s || !id) return null;
      for (var i = 0; i < s.thirds.length; i++) if (s.thirds[i].third.thirdId === id) return s.thirds[i];
      return null;
    }
    function findFourth(t, id) {
      if (!t || !id) return null;
      for (var i = 0; i < t.fourths.length; i++) if (t.fourths[i].fourth.fourthId === id) return t.fourths[i];
      return null;
    }

    /* 四级里每一层都能放菜，所以筛选 / 批量迁移的下拉要把四层节点全列出来。
       key 里的级别用来决定比对哪个 ID 字段（见 matchGroup）。 */
    function flatGroups() {
      var out = [];
      tree.forEach(function (c) {
        var cName = c.cat.name;
        out.push({ key: 'cat:' + c.cat.categoryId, level: 'cat', name: cName,
                   catId: c.cat.categoryId, subId: '', thirdId: '', fourthId: '' });
        c.subs.forEach(function (s) {
          var sName = cName + ' / ' + s.sub.name;
          out.push({ key: 'sub:' + s.sub.subId, level: 'sub', name: sName,
                     catId: c.cat.categoryId, subId: s.sub.subId, thirdId: '', fourthId: '' });
          s.thirds.forEach(function (t) {
            var tName = sName + ' / ' + t.third.name;
            out.push({ key: 'third:' + t.third.thirdId, level: 'third', name: tName,
                       catId: c.cat.categoryId, subId: s.sub.subId, thirdId: t.third.thirdId, fourthId: '' });
            t.fourths.forEach(function (f) {
              out.push({ key: 'fourth:' + f.fourth.fourthId, level: 'fourth',
                         name: tName + ' / ' + f.fourth.name,
                         catId: c.cat.categoryId, subId: s.sub.subId,
                         thirdId: t.third.thirdId, fourthId: f.fourth.fourthId });
            });
          });
        });
      });
      return out;
    }

    /* 菜落在这一层、或它下面更深的层级，都算命中 */
    function matchGroup(m, key) {
      if (!key) return true;
      var p = key.split(':');
      var fld = G.App.cats.ID_KEY[p[0]];
      return !!fld && m[fld] === p[1];
    }

    /* 只拼到菜真正挂着的那一层，没往下细分就不显示后面几级 */
    function pathOfIds(ids) {
      var lv = G.App.cats.deepestLevel(ids);
      if (!lv) return '未归类';
      var c = findCat(ids.categoryId);            if (!c) return '未归类';
      var parts = [c.cat.name];                   if (lv === 'cat') return parts.join(' / ');
      var s = findSub(c, ids.subCategoryId);      if (!s) return parts.join(' / ');
      parts.push(s.sub.name);                     if (lv === 'sub') return parts.join(' / ');
      var t = findThird(s, ids.thirdCategoryId);  if (!t) return parts.join(' / ');
      parts.push(t.third.name);                   if (lv === 'third') return parts.join(' / ');
      var f = findFourth(t, ids.fourthCategoryId); if (!f) return parts.join(' / ');
      parts.push(f.fourth.name);
      return parts.join(' / ');
    }

                : ('RM ' + U.formatMoneyPlain(m.price || 0));
              meta.innerHTML =
                '<div style="font-weight:800;font-size:15px;">' + U.escapeHTML(m.name) +

                '</div>' +

                    : '<svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/><path d="M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>' });
                toggle.addEventListener('click', function () {

                ed.addEventListener('click', function () { openMenuEdit(m, refresh); });
                acts.appendChild(ed);

                var de = U.el('button', { class: 'icon-btn', title: '删除', html: '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>' });
                de.addEventListener('click', function () {

                acts.appendChild(U.el('span', { class: 'cr-locked' }, '🔒'));

            bindDishDrag(list, rows);
          }
          inQ.addEventListener('input', U.debounce(draw, 120));
          draw();

          items.forEach(function (m) {
            if (m.photoId && !photoMap[m.photoId]) {
              G.App.photos.get(m.photoId).then(function (p) { if (p) photoMap[m.photoId] = p; }).catch(function () {});
            }

    /* 菜品拖拽排序：只在同一分组内换位置，落库后重画 */
    function bindDishDrag(list, rows) {
      if (!editable) return;
      var dragEl = null;
      list.ondragstart = function (e) {
        var c = e.target.closest('.dish-row');
        if (!c) return;
        dragEl = c;
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', c.getAttribute('data-id')); } catch (err) {}
        c.classList.add('dragging');
      };
      list.ondragover = function (e) {
        if (!dragEl) return;
        var over = e.target.closest('.dish-row');
        if (!over || over === dragEl) return;
        e.preventDefault();
        var box = over.getBoundingClientRect();
        list.insertBefore(dragEl, (e.clientY - box.top) > box.height / 2 ? over.nextSibling : over);
      };
      list.ondragend = function () {
        if (!dragEl) return;
        dragEl.classList.remove('dragging');
        var order = U.qsa('.dish-row', list).map(function (x) { return x.getAttribute('data-id'); });
        dragEl = null;
        // 跨分组拖拽不生效（分组在弹窗里改），这里只保存同组内顺序
        var byId = {};
        rows.forEach(function (m) { byId[m.id] = m; });
        var jobs = [];
        order.forEach(function (id, i) {
          var m = byId[id];
          if (m && m.sort !== (i + 1) * 10) { m.sort = (i + 1) * 10; jobs.push(G.App.menu.save(m)); }
        });
        Promise.all(jobs).then(function () { if (jobs.length) U.toast('顺序已保存', 'ok'); });
      };
    }

    /* 批量把当前筛选出的菜品迁到另一个分组 —— 四级里任意一层都能当落点 */
    function openBatchAssign() {
      G.App.menu.list().then(function (items) {
        var targets = items.filter(function (m) { return matchGroup(m, filterGroup); });
        if (!targets.length) { U.toast('当前筛选下没有菜品', 'err'); return; }
        var groups = flatGroups();
        if (!groups.length) { U.toast('请先到「分类管理」建好分类', 'err'); return; }
        var html =
          '<div class="modal-mask"><div class="modal" style="max-width:420px;">' +
            '<div class="modal-head"><h3>批量改归属</h3></div>' +
            '<div class="modal-body">' +
              '<p style="font-size:13px;color:var(--muted);margin-bottom:10px;">' +
                '把当前筛选下的 <b>' + targets.length + '</b> 道菜迁移到：</p>' +
              '<div class="field"><label>目标分类（四级里任选一层）</label>' +
                '<select class="select" id="ba-group">' +
                  groups.map(function (g) {
                    var pad = { sub: '　', third: '　　', fourth: '　　　' }[g.level] || '';
                    return '<option value="' + g.key + '">' + pad + U.escapeHTML(g.name) + '</option>';
                  }).join('') +
                '</select>' +
              '</div>' +
              '<p style="font-size:12px;color:var(--muted);margin-top:8px;">' +
                '选哪一层，这些菜就归到哪一层；更深的两级会被清空。</p>' +
            '</div>' +
            '<div class="modal-foot">' +
              '<button class="btn btn-gray" data-act="cancel">取消</button>' +
              '<button class="btn" data-act="ok">确认迁移</button>' +
            '</div>' +
          '</div></div>';
        var m = U.openModal(html);
        m.addEventListener('click', function (e) {
          if (e.target === m || e.target.closest('[data-act="cancel"]')) { U.closeAllModals(); return; }
          if (e.target.closest('[data-act="ok"]')) {
            var key = m.querySelector('#ba-group').value;
            var g = groups.filter(function (x) { return x.key === key; })[0];
            U.closeAllModals();
            G.App.menu.assign(targets.map(function (x) { return x.id; }),
                              { categoryId: g.catId, subCategoryId: g.subId,
                                thirdCategoryId: g.thirdId, fourthCategoryId: g.fourthId })
              .then(function () { U.toast('已迁移 ' + targets.length + ' 道菜', 'ok'); refresh(); });
          }
        });
      });
    }

    /* ============ 菜品编辑弹窗 ============ */
    function openMenuEdit(menu, onSaved) {
      loadTree(function () {
        menu = menu || { name: '', price: 0, specs: [], available: true };
        var tempPhotoBlob = null, tempPhotoId = menu.photoId || '';

        var html =
          '<div class="modal-mask"><div class="modal" style="max-width:560px;">' +
            '<div class="modal-head"><h3>' + (menu.id ? '编辑菜品' : '新增菜品') + '</h3>' +
              '<button class="icon-btn" data-act="x" aria-label="关闭">' +
                '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>' +
              '</button></div>' +
            '<div class="modal-body">' +
              '<div class="field"><label>菜品名</label><input class="input" id="m-name" value="' + U.escapeHTML(menu.name) + '"></div>' +
              '<div class="field"><label>归属分类（选到哪一级就归到哪一级，二 / 三 / 四级可留空）</label>' +
                '<div class="cat-pick">' +
                  '<select class="select" id="m-cat"></select>' +
                  '<select class="select" id="m-sub"></select>' +
                  '<select class="select" id="m-third"></select>' +
                  '<select class="select" id="m-fourth"></select>' +
                '</div>' +
                (tree.length ? '' : '<div style="font-size:12px;color:var(--danger);margin-top:6px;">还没有一级分类，请先到「分类管理」创建</div>') +
              '</div>' +
              '<div class="field"><label>规格（多种大小独立定价）</label><div id="m-specs"></div>' +
                '<button class="btn btn-soft btn-sm" id="m-add-spec">+ 添加规格</button></div>' +
              '<div class="field"><label>菜品实拍照片（可选，用于 PDF 报告）</label>' +
                '<div style="display:flex;gap:10px;align-items:center;">' +
                  '<div id="m-thumb" style="width:80px;height:80px;border-radius:12px;background:linear-gradient(135deg,#FFF1E0,#FFE2C6);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--primary);overflow:hidden;"></div>' +
                  '<div style="flex:1 1 auto;">' +
                    '<input type="file" accept="image/*" id="m-file" style="display:none;">' +
                    '<button class="btn btn-ghost btn-sm" id="m-pick">选择 / 拍照</button>' +
                    '<button class="btn btn-danger btn-sm" id="m-del-photo" style="margin-left:6px;">移除</button>' +
                  '</div>' +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="modal-foot">' +
              '<button class="btn btn-gray" data-act="cancel">取消</button>' +
              '<button class="btn" data-act="ok">保存</button>' +
            '</div>' +
          '</div></div>';
        var m = U.openModal(html);

        /* ---- 四级联动 ----
           每层都留「（不细分）」：停在二级，菜就归二级，不用硬点到第四级。
           上层一变，下层全部回到「不细分」—— 不替用户猜。 */
        var selCat = m.querySelector('#m-cat');
        var selSub = m.querySelector('#m-sub');
        var selThird = m.querySelector('#m-third');
        var selFourth = m.querySelector('#m-fourth');
        var NO_SPLIT = '<option value="">（不细分）</option>';

        function fillSelect(el, items, want) {
          el.innerHTML = NO_SPLIT + items.map(function (it) {
            return '<option value="' + it.id + '">' + U.escapeHTML(it.name) + '</option>';
          }).join('');
          el.disabled = items.length === 0;
          el.value = (want && items.some(function (it) { return it.id === want; })) ? want : '';
        }
        function curCat() { return findCat(selCat.value); }
        function curSub() { return findSub(curCat(), selSub.value); }
        function curThird() { return findThird(curSub(), selThird.value); }

        function fillCats() {
          selCat.innerHTML = tree.map(function (c) {
            return '<option value="' + c.cat.categoryId + '">' + U.escapeHTML(c.cat.name) + '</option>';
          }).join('');
          selCat.disabled = tree.length === 0;
          var want = menu.categoryId || (tree[0] && tree[0].cat.categoryId);
          if (want) selCat.value = want;
          fillSubs();
        }
        function fillSubs() {
          var c = curCat();
          fillSelect(selSub, (c ? c.subs : []).map(function (s) {
            return { id: s.sub.subId, name: s.sub.name };
          }), menu.subCategoryId);
          fillThirds();
        }
        function fillThirds() {
          var s = curSub();
          fillSelect(selThird, (s ? s.thirds : []).map(function (t) {
            return { id: t.third.thirdId, name: t.third.name };
          }), menu.thirdCategoryId);
          fillFourths();
        }
        function fillFourths() {
          var t = curThird();
          fillSelect(selFourth, (t ? t.fourths : []).map(function (f) {
            return { id: f.fourth.fourthId, name: f.fourth.name };
          }), menu.fourthCategoryId);
        }
        selCat.addEventListener('change', fillSubs);
        selSub.addEventListener('change', fillThirds);
        selThird.addEventListener('change', fillFourths);
        fillCats();

        /* ---- 规格 ---- */
        var specsDiv = m.querySelector('#m-specs');
        function addSpecRow(s) {
          s = s || { id: U.uid(), name: '', price: 0 };
          var r = U.el('div', { class: 'spec-row' });
          r.innerHTML =
            '<input class="input" placeholder="规格名（如：大份）" value="' + U.escapeHTML(s.name) + '">' +
            '<input class="input input-money" type="number" step="0.01" min="0" placeholder="价格" value="' + (s.price || 0) + '">' +
            '<button class="icon-btn" aria-label="删除">' +
              '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>' +
            '</button>';
          r.querySelector('button').addEventListener('click', function () { r.remove(); });
          specsDiv.appendChild(r);
        }
        (menu.specs && menu.specs.length ? menu.specs : [{ name: '标准', price: menu.price || 0 }]).forEach(addSpecRow);
        m.querySelector('#m-add-spec').addEventListener('click', function () { addSpecRow(); });

        /* ---- 图片 ---- */
        var thumb = m.querySelector('#m-thumb');
        function paintThumb() {
          if (tempPhotoBlob) {
            thumb.innerHTML = '<img src="' + URL.createObjectURL(tempPhotoBlob) + '" style="width:100%;height:100%;object-fit:cover;">';
          } else if (tempPhotoId && photoMap[tempPhotoId]) {
            thumb.innerHTML = '<img src="' + URL.createObjectURL(photoMap[tempPhotoId].blob) + '" style="width:100%;height:100%;object-fit:cover;">';
          } else {
            thumb.textContent = (m.querySelector('#m-name').value || '?').slice(0, 1);
          }
        }
        paintThumb();
        m.querySelector('#m-pick').addEventListener('click', function () { m.querySelector('#m-file').click(); });
        m.querySelector('#m-file').addEventListener('change', function (e) {
          var f = e.target.files && e.target.files[0];
          if (!f) return;
          tempPhotoBlob = f; paintThumb();
        });
        m.querySelector('#m-del-photo').addEventListener('click', function () {
          tempPhotoBlob = null; tempPhotoId = ''; paintThumb();
        });

        /* ---- 保存 ---- */
        m.addEventListener('click', function (e) {
          if (e.target === m || e.target.closest('[data-act="cancel"]') || e.target.closest('[data-act="x"]')) { U.closeAllModals(); return; }

/* ============ 67-views-tables.js ============ */
/* 67-views-tables.js · 台桌管理页
   外带独立大卡片（置顶优先） + 堂食桌台自适应网格
   状态：空闲 idle / 使用中 using / 待付款 pending
   桌号数量来自 cfg.tableCount，改配置即可扩充，本文件不含硬编码上限。 */
(function (G) {
  'use strict';
  var U = G.U;

  var STATE_TEXT = { idle: '空闲', using: '使用中', pending: '待付款' };

  function render(root) {
    var wrap = U.el('div', { class: 'page page-scroll' });
    root.appendChild(wrap);

    var locked = {};          // slotId → true（被其他会话占用）

    function refresh() {
      // 重绘会清空子节点，滚动位置会归零；先存后还，避免翻到 50 桌时被弹回顶部
      var keepScroll = wrap.scrollTop;
      wrap.innerHTML = '';

      // ===== 顶部橘色毛玻璃栏目 =====
      var head = U.el('div', { class: 'bar-orange', style: 'display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex:0 0 auto;' });
      head.innerHTML =
        '<div>' +
          '<div style="font-size:12px;opacity:.92;font-weight:600;">台桌管理</div>' +
          '<div style="font-size:19px;font-weight:800;margin-top:2px;" id="tbl-sub">读取中…</div>' +
        '</div>' +
        '<div style="display:flex;gap:6px;">' +
          '<button class="btn btn-sm" id="btn-reset" style="background:rgba(255,255,255,.22);">全部重置</button>' +
          '<button class="btn btn-sm" id="btn-refresh" style="background:#fff;color:#FF7A00;">刷新</button>' +
        '</div>';
      wrap.appendChild(head);

      // ===== 外带工位（置顶，优先级最高） =====
      var taBox = U.el('div', { id: 'ta-box' });
      wrap.appendChild(taBox);

      // ===== 堂食桌台 =====
      var secHead = U.el('div', { class: 'card-title', style: 'margin:14px 0 10px;font-size:15px;' }, '堂食桌台');
      var grid = U.el('div', { class: 'table-grid' });
      wrap.appendChild(secHead);
      wrap.appendChild(grid);

      Promise.all([
        G.App.carts.list(),
        G.App.carts.lockedSlots(),
        G.App.carts.purgeLocks()
      ]).then(function (res) {
        var carts = res[0] || [];
        locked = res[1] || {};
        var map = {};
        carts.forEach(function (c) { map[c.slotId] = c; });

        var n = tableCount();
        var busy = carts.filter(function (c) { return c.items && c.items.length; }).length;
        var sub = wrap.querySelector('#tbl-sub');
        if (sub) sub.textContent = '共 ' + n + ' 桌 · 使用中 ' + busy + ' 桌';

        renderTakeaway(map[G.App.carts.takeawayId]);
        renderGrid(map, n);
        wrap.scrollTop = keepScroll;
      });

      // 员工身份：全部重置置灰不可点（高危操作，需切回老板）
      var btnReset = wrap.querySelector('#btn-reset');
      if (!G.App.operator.can('reset')) {
        btnReset.disabled = true;
        btnReset.classList.add('is-locked');
        btnReset.title = '员工模式无此权限，请在右上角切换为老板';
      } else {
        btnReset.addEventListener('click', onReset);
      }
      wrap.querySelector('#btn-refresh').addEventListener('click', function () {
        refresh(); U.toast('已刷新', 'ok');
      });
    }

    /* ---------- 自动刷新 ----------
       点餐页 / 结账页改动的是同一份 IndexedDB，本页靠轮询感知：
         - 每 6 秒一次；页面在后台时跳过，省电；
         - 有弹窗打开时不重绘，避免把用户正操作的弹窗下面的 DOM 换掉；
         - 切回前台立即刷新一次。 */
    var pollTimer = null;
    function onVis() { if (!document.hidden) refresh(); }
    function startAutoRefresh() {
      stopAutoRefresh();
      pollTimer = setInterval(function () {
        if (document.hidden) return;
        if (document.querySelector('#modal-root .modal-mask')) return;
        refresh();
      }, 6000);
      document.addEventListener('visibilitychange', onVis);
    }
    function stopAutoRefresh() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      document.removeEventListener('visibilitychange', onVis);
    }
    // once:true —— 页面每渲染一次就挂一对监听，不摘掉会一直堆积
    window.addEventListener('hashchange', stopAutoRefresh, { once: true });
    window.addEventListener('pagehide', stopAutoRefresh, { once: true });

    function tableCount() { return +G.App.cfg.get('tableCount') || 50; }

    function statusOf(cart) {
      if (!cart || !cart.items || !cart.items.length) return 'idle';
      return cart.status === 'pending' ? 'pending' : 'using';
    }

    /* 被其他会话占用时先拦一道，避免两个会话同时改同一份购物车 */
    function guard(slotId, label, then) {
      if (!locked[slotId]) { then(); return; }
      U.confirm({
        title: label + '正被其他会话操作',
        message: '另一个标签页 / 设备正在操作' + label + '，同时下单可能造成数据错乱。建议先在那边完成结账再操作。',
        okText: '仍要进入', cancelText: '返回', danger: true
      }).then(function (ok) { if (ok) then(); });
    }

    /* ---------- 外带大卡片 ---------- */
    function renderTakeaway(cart) {
      var box = wrap.querySelector('#ta-box');
      if (!box) return;
      box.innerHTML = '';

      var slotId = G.App.carts.takeawayId;
      var status = statusOf(cart);
      var total = cartTotal(cart);
      var isLocked = !!locked[slotId];

      var card = U.el('div', { class: 'table-card ta-card status-' + status, style: 'width:100%;' });
      card.innerHTML =
        '<div class="ta-head">' +
          '<span style="font-size:13px;font-weight:800;">📦 外带订单</span>' +
          '<span class="ta-badge">' + STATE_TEXT[status] + (isLocked ? ' 🔒' : '') + '</span>' +
        '</div>' +
        '<div class="ta-body">' +
          '<div class="tc-num" style="font-size:16px;">外带工位</div>' +
          '<div class="tc-state">' + (status === 'idle' ? '暂无进行中订单' : ('当前 RM ' + U.formatMoneyPlain(total))) + '</div>' +
          (cart && cart.orderNo ? '<div style="margin-top:4px;"><span class="order-no">' + U.escapeHTML(cart.orderNo) + '</span></div>' : '') +
        '</div>';

      card.addEventListener('click', function () {
        if (status === 'idle') {
          guard(slotId, '外带工位', function () { G.Router.go('#/order?slot=' + slotId); });
        } else if (status === 'pending') {
          guard(slotId, '外带工位', function () { openPendingModal(cart, '外带'); });
        } else {
          guard(slotId, '外带工位', function () { openBusyModal(cart, '外带'); });
        }
      });
      box.appendChild(card);
    }

    /* ---------- 堂食网格 ---------- */
    function renderGrid(map, n) {
      var grid = wrap.querySelector('.table-grid');
      if (!grid) return;
      grid.innerHTML = '';

      for (var t = 1; t <= n; t++) {
        (function (tbl) {
          var slotId = G.App.carts.tableSlotId(tbl);
          var cart = map[slotId];
          var status = statusOf(cart);
          var total = cartTotal(cart);
          var label = '桌 ' + tbl + ' 号';

          var card = U.el('div', { class: 'table-card status-' + status });
          card.innerHTML =
            (locked[slotId] ? '<span class="tc-lock" title="其他会话正在操作">🔒</span>' : '') +
            '<div class="tc-num">' + tbl + '</div>' +
            '<div class="tc-state">' + STATE_TEXT[status] + '</div>' +
            (status !== 'idle' ? '<div class="tc-amt">RM ' + U.formatMoneyPlain(total) + '</div>' : '');

          card.addEventListener('click', function () {
            if (status === 'idle') {
              guard(slotId, label, function () { G.Router.go('#/order?slot=' + slotId); });
            } else if (status === 'pending') {
              guard(slotId, label, function () { openPendingModal(cart, label); });
            } else {
              guard(slotId, label, function () { openBusyModal(cart, label); });
            }
          });

          grid.appendChild(card);
        })(t);
      }
    }

    /* ---------- 弹窗 ---------- */
    function openBusyModal(cart, label) {
      var total = cartTotal(cart);
      var html =
        '<div class="modal-mask"><div class="modal" style="max-width:400px;">' +
          '<div class="modal-head"><h3>' + U.escapeHTML(label) + '</h3>' +
            '<button class="icon-btn" data-act="x" aria-label="关闭">' +
              '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>' +
            '</button></div>' +
          '<div class="modal-body">' +
            '<div style="text-align:center;padding:6px 0 2px;">' +
              (cart.orderNo ? '<div style="margin-bottom:10px;"><span class="order-no">' + U.escapeHTML(cart.orderNo) + '</span></div>' : '') +
              '<div style="font-size:13px;color:var(--muted);font-weight:600;">当前消费</div>' +
              '<div style="font-size:30px;font-weight:900;color:var(--primary);margin-top:4px;">RM ' + U.formatMoneyPlain(total) + '</div>' +
              '<div style="font-size:12px;color:var(--muted);margin-top:4px;">' + cart.items.length + ' 项菜品</div>' +
            '</div>' +
          '</div>' +
          '<div class="modal-foot">' +
            '<button class="btn btn-gray" data-act="close">关闭弹窗</button>' +
            '<button class="btn btn-ghost" data-act="more">继续点餐</button>' +
            '<button class="btn" data-act="pay">去结账</button>' +
          '</div>' +
        '</div></div>';
      bind(html, cart);
    }

    function openPendingModal(cart, label) {
      var total = cartTotal(cart);
      var html =
        '<div class="modal-mask"><div class="modal" style="max-width:400px;">' +
          '<div class="modal-head"><h3>' + U.escapeHTML(label) + ' · 待付款</h3>' +
            '<button class="icon-btn" data-act="x" aria-label="关闭">' +
              '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>' +
            '</button></div>' +
          '<div class="modal-body">' +
            '<div style="background:var(--danger-soft);border:1px solid var(--danger-line);color:var(--danger);padding:10px 12px;border-radius:12px;font-size:13px;font-weight:700;margin-bottom:12px;">' +
              '该单已下单，尚未完成付款，请优先收款。' +
            '</div>' +
            '<div style="text-align:center;padding:2px 0;">' +
              '<div style="margin-bottom:10px;"><span class="order-no" style="background:#FEE2E2;color:var(--danger);">' + U.escapeHTML(cart.orderNo || '未分配单号') + '</span></div>' +
              '<div style="font-size:13px;color:var(--muted);font-weight:600;">应收金额</div>' +
              '<div style="font-size:34px;font-weight:900;color:var(--danger);margin-top:4px;">RM ' + U.formatMoneyPlain(total) + '</div>' +
              '<div style="font-size:12px;color:var(--muted);margin-top:4px;">' + cart.items.length + ' 项菜品 · ' + U.escapeHTML(cart.payMethod || 'CASH') + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="modal-foot">' +
            '<button class="btn btn-gray" data-act="close">关闭弹窗</button>' +
            '<button class="btn btn-ghost" data-act="more">继续点餐</button>' +
            '<button class="btn" data-act="pay">确认收款</button>' +
          '</div>' +
        '</div></div>';
      bind(html, cart);
    }

    function bind(html, cart) {
      var m = U.openModal(html);
      m.addEventListener('click', function (e) {
        if (e.target === m || e.target.closest('[data-act="x"]') || e.target.closest('[data-act="close"]')) {
          U.closeAllModals(); return;
        }
        if (e.target.closest('[data-act="more"]')) {
          U.closeAllModals();
          G.Router.go('#/order?slot=' + cart.slotId);
          return;
        }
        if (e.target.closest('[data-act="pay"]')) {
          U.closeAllModals();
          G.Router.go('#/checkout?slot=' + cart.slotId);
        }
      });
    }

    function onReset() {
      // 按钮已置灰，这里再兜一道：避免通过其它入口绕进来
      if (!G.App.operator.can('reset')) { U.toast('员工模式无此权限，请切换为老板', 'err'); return; }

        okText: '确认重置', cancelText: '取消', danger: true

/* ============ 68-views-checkout.js ============ */
/* 68-views-checkout.js · 结账页（内置计算器 + 找零）
   从台桌页 / 点餐页带入 slot：展示来源与单号 → 虚拟键盘录入实收 → 实时算找零 →
   生成正式订单 → 出小票 → 清空购物车 → 返回台桌。
   边界：应付永远由购物车菜品算出，键盘只负责实收；订单落库 due / paid / change 三字段。 */
(function (G) {
  'use strict';
  var U = G.U;

  var PAY_METHODS = ['CASH 现金', 'Bank 银行转账', 'Tng E-Wallet', 'Boost Pay', 'Shopee Pay', 'Grab Pay'];

  function money(n) { return Math.round((+n || 0) * 100) / 100; }

  function render(root, params) {
    params = params || {};
    var slotId = params.slot || G.App.carts.tableSlotId(G.App.cfg.get('defaultTable') || 1);
    var wrap = U.el('div', { class: 'page page-scroll' });
    root.appendChild(wrap);

    // 结账期间也要占着工位：收银员在点钞时，别的会话不能把这桌当空闲抢进去
    G.Flow.holdLock(slotId);

    var state = { cart: null, orderNo: '', calc: null };

    G.App.carts.get(slotId).then(function (cart) {
      state.cart = cart;
      // 单号要先拿到并回写到购物车：页面顶部就要显示「单号 DI 001」，
      // 而且同一张单重进结账页必须沿用同一个号，不能每次都消耗一次计数。
      return G.Flow.ensureOrderNo(cart).then(function (no) {
        state.orderNo = no;
        return G.App.carts.save(cart);
      });
    }).then(function () {
      draw();
    });

    function dueOf() {
      var t = 0;
      ((state.cart && state.cart.items) || []).forEach(function (l) { t += +l.subtotal || 0; });

    // 种子数据 + 分类迁移（老库升级后，无归属的菜品归入「未分类 / 默认子分类 / 默认分组」）
    G.App.seedIfEmpty().then(function () { /* ready */ });
    G.App.cats.ensureDefaults().catch(function () { /* 迁移失败不阻断启动 */ });
    // 身份是异步从 IndexedDB 读的，读回来再刷一次顶栏，避免首帧显示错的身份
    G.App.operator.get().then(paintOperator).catch(function () {});

    // 首次打开：根据 hash 决定
    if (!location.hash) location.hash = '#/home';
    window.addEventListener('hashchange', function () { navTo(location.hash); });
    navTo(location.hash);

    // 关闭启动屏
    setTimeout(function () {
      var bs = document.getElementById('boot-screen');
      if (bs) { bs.classList.add('hide'); setTimeout(function () { bs.remove(); }, 320); }
    }, 220);

    // SW
    registerSW();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);

</script>
</body>
</html>
