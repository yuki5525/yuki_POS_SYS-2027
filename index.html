    /* ---------- 单据列表 ---------- */
    function currentOpt() {
      var o = {};
      if (state.from) o.from = dayStart(state.from);
      if (state.to) o.to = dayEnd(state.to);
      if (state.kw) o.keyword = state.kw;
      return o;
    }

    function renderRecords(type) {
      bodyBox.innerHTML = '';
      var opt = currentOpt();
      opt.type = type;
      inv().query(opt).then(function (arr) {
        if (!arr.length) {
          bodyBox.appendChild(emptyCard('没有符合条件的' + TAB_TEXT[type] + '记录'));
          return;
        }
        /* 汇总条 */
        var tq = 0, amt = 0;
        arr.forEach(function (r) { tq += +r.qty || 0; amt += +r.amount || 0; });
        var sum = U.el('div', { class: 'card', style: 'background:var(--grad);color:#fff;border:none;display:flex;justify-content:space-between;align-items:center;' });
        sum.innerHTML =
          '<div><div style="font-size:12px;opacity:.92;font-weight:600;">' + TAB_TEXT[type] + '合计</div>' +
          '<div style="font-size:24px;font-weight:800;margin-top:2px;">' + arr.length + ' 单</div></div>' +
          '<div style="text-align:right;">' +
            '<div style="font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;">' + qtyText(tq) + '</div>' +
            (type === 'in' ? '<div style="font-size:12px;opacity:.92;font-weight:600;">RM ' + U.formatMoneyPlain(amt) + '</div>' : '') +
          '</div>';
        bodyBox.appendChild(sum);

        arr.forEach(function (r) { bodyBox.appendChild(recordCard(r)); });
      });
    }

    function recordCard(r) {
      var card = U.el('div', { class: 'card inv-rec' });
      var head = U.el('div', { style: 'display:flex;justify-content:space-between;gap:10px;align-items:flex-start;' });
      head.innerHTML =
        '<div style="min-width:0;">' +
          '<div style="font-size:15px;font-weight:800;">' + U.escapeHTML(r.itemName || '-') + '</div>' +
          '<div style="font-size:12px;color:var(--muted);margin-top:3px;">' +
            U.escapeHTML(stamp(r.time)) + '  ·  ' + U.escapeHTML(r.no || '') +
          '</div>' +
        '</div>' +
        '<div style="flex:0 0 auto;text-align:right;">' +
          '<div style="font-size:18px;font-weight:900;font-variant-numeric:tabular-nums;">' +
            qtyText(r.qty) + '</div>' +
          '<div class="tag gray" style="margin-top:3px;">' + U.escapeHTML(r.unit || '未设单位') + '</div>' +
        '</div>';
      card.appendChild(head);

      var meta = U.el('div', { class: 'inv-meta' });
      if (r.type === 'in') {
        if (r.amount) meta.appendChild(metaItem('金额', 'RM ' + U.formatMoneyPlain(r.amount)));
        if (r.price != null) meta.appendChild(metaItem('单价', 'RM ' + U.formatMoneyPlain(r.price)));
        if (r.supplier) meta.appendChild(metaItem('供应商', r.supplier));
        if (r.buyer) meta.appendChild(metaItem('进货人', r.buyer));
        if (r.receiver) meta.appendChild(metaItem('收货人', r.receiver));
      } else {
        if (r.taker) meta.appendChild(metaItem(r.type === 'out' ? '领用人' : '报损人', r.taker));
      }
      if (r.note) meta.appendChild(metaItem('备注', r.note));
      if (meta.children.length) card.appendChild(meta);

      if (r.photos && r.photos.length) {
        var strip = U.el('div', { class: 'inv-strip' });
        r.photos.slice(0, 4).forEach(function (pid) {
          inv().photos.get(pid).then(function (p) {
            if (!p || !strip.isConnected) return;
            strip.appendChild(imgEl(p.blob, 'inv-thumb'));
          });
        });
        if (r.photos.length > 4) {
          strip.appendChild(U.el('div', { class: 'inv-thumb more' }, '+' + (r.photos.length - 4)));
        }
        card.appendChild(strip);
      }

      if (canEdit()) {
        var ops = U.el('div', { style: 'display:flex;gap:8px;justify-content:flex-end;margin-top:10px;' });
        var be = U.el('button', { class: 'btn btn-soft btn-sm' }, '编辑');
        be.addEventListener('click', function (e) { e.stopPropagation(); openForm(r.type, r, function () { renderBody(); }); });
        var bd = U.el('button', { class: 'btn btn-danger btn-sm' }, '删除');
        bd.addEventListener('click', function (e) {
          e.stopPropagation();
          U.confirm({
            title: '删除这张' + TAB_TEXT[r.type] + '单？',
            message: (r.itemName || '') + ' ' + qtyText(r.qty) + ' ' + (r.unit || '') +
                     (r.photos && r.photos.length ? '（含 ' + r.photos.length + ' 张照片）' : '') +
                     '，删除后无法恢复。',
            danger: true, okText: '删除'
          }).then(function (ok) {
            if (!ok) return;
            inv().del(r.id).then(function () { U.toast('已删除', 'ok'); renderBody(); });
          });
        });
        ops.appendChild(be); ops.appendChild(bd);
        card.appendChild(ops);
      }

      card.addEventListener('click', function () { openDetail(r); });
      return card;
    }

    function metaItem(k, v) {
      return U.el('div', { class: 'inv-meta-item' }, [
        U.el('span', { class: 'k' }, k),
        U.el('span', { class: 'v' }, U.escapeHTML(String(v)))
      ]);
    }

    function emptyCard(msg) {
      return U.el('div', { class: 'card' }, [
        U.el('div', { class: 'empty' }, [U.el('div', { class: 'em' }, '📦'), U.el('p', null, msg)])
      ]);
    }

    function renderBody() {
      if (!bodyBox) return;
      if (state.tab === 'summary') renderSummary();
      else renderRecords(state.tab);
    }

    /* ---------- 货品历史 ---------- */
    function openHistory(itemName) {
      inv().history(itemName).then(function (arr) {
        openBox('历史明细 · ' + itemName, function (body) {
          if (!arr.length) { body.appendChild(emptyCard('暂无记录')); return; }
          var s = { in: 0, out: 0, loss: 0 };
          arr.forEach(function (r) { s[r.type] = (s[r.type] || 0) + (+r.qty || 0); });
          var bar = U.el('div', { class: 'card tight', style: 'margin-bottom:12px;' });
          bar.innerHTML =
            '<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;">' +
              '<span>进货 <b style="color:var(--ok)">' + qtyText(s.in || 0) + '</b></span>' +
              '<span>出库 <b>' + qtyText(s.out || 0) + '</b></span>' +
              '<span>报损 <b style="color:var(--danger)">' + qtyText(s.loss || 0) + '</b></span>' +
            '</div>';
          body.appendChild(bar);
          arr.forEach(function (r) {
            var row = U.el('div', { class: 'row' });
            row.innerHTML =
              '<div class="grow">' +
                '<div class="t">' + U.escapeHTML(r.itemName) + ' ' +
                  '<span class="tag ' + (r.type === 'in' ? 'ok' : (r.type === 'loss' ? 'danger' : 'warn')) + '">' +
                  TAB_TEXT[r.type] + '</span></div>' +
                '<div class="s">' + U.escapeHTML(stamp(r.time)) +
                  (r.supplier ? '  ·  ' + U.escapeHTML(r.supplier) : '') +
                  (r.taker ? '  ·  ' + U.escapeHTML(r.taker) : '') + '</div>' +
              '</div>' +
              '<div class="amt">' + qtyText(r.qty) + ' ' + U.escapeHTML(r.unit || '') + '</div>';
            row.addEventListener('click', function () { openDetail(r); });
            body.appendChild(row);
          });
        });
      });
    }

    /* ---------- 安全阈值 ---------- */
    function openThreshold(row) {
      openBox('设置安全阈值', function (body, close) {
        body.appendChild(U.el('div', { class: 'card tight', style: 'margin-bottom:12px;' }, [
          U.el('div', { style: 'font-size:14px;font-weight:800;' }, U.escapeHTML(row.itemName)),
          U.el('div', { style: 'font-size:12px;color:var(--muted);margin-top:3px;' },
               '当前库存 ' + qtyText(row.current) + ' ' + U.escapeHTML(row.unit || '') +
               '，库存 ≤ 阈值时列表标黄并计入顶部告警。留空 = 不告警。')
        ]));
        var inp = U.el('input', { class: 'input', type: 'number', step: 'any', value: row.threshold == null ? '' : String(row.threshold) });
        body.appendChild(U.el('div', { class: 'field' }, [
          U.el('label', null, '安全阈值（' + (row.unit || '') + '）'), inp
        ]));
        var btn = U.el('button', { class: 'btn btn-block' }, '保存');
        btn.addEventListener('click', function () {
          inv().thresholds.set(row.key, inp.value).then(function () {
            U.toast('已保存', 'ok'); close(); renderBody();
          });
        });
        body.appendChild(btn);
      });
    }

    /* ---------- 单位换算 ---------- */
    function openConv(itemName) {
      inv().conv.used(itemName).then(function (used) {
        return inv().conv.get(itemName).then(function (cur) {
          openBox('单位换算 · ' + itemName, function (body, close) {
            if (!used.length) { body.appendChild(emptyCard('这个货品还没有任何单据')); return; }
            body.appendChild(U.el('div', { class: 'card tight', style: 'margin-bottom:12px;font-size:12.5px;color:var(--muted);line-height:1.6;' },
              '填好比例后，库存汇总会按基准单位把不同单位合成一行统计。' +
              '原始单据里的数量和单位不会被改写，随时可以取消换算。'));

            var baseSel = U.el('select', { class: 'select' });
            used.forEach(function (u) { baseSel.appendChild(U.el('option', { value: u }, u)); });
            if (cur && cur.base) baseSel.value = cur.base;
            body.appendChild(U.el('div', { class: 'field' }, [U.el('label', null, '基准单位'), baseSel]));

            var rates = {};
            used.forEach(function (u) {
              var v = (cur && cur.rates && cur.rates[u] != null) ? cur.rates[u] : 1;
              var inp = U.el('input', { class: 'input', type: 'number', step: 'any', value: String(v) });
              rates[u] = inp;
              body.appendChild(U.el('div', { class: 'field' }, [
                U.el('label', null, '1 ' + u + ' = 多少基准单位'), inp
              ]));
            });

            var rowBtns = U.el('div', { style: 'display:flex;gap:10px;' });
            var bs = U.el('button', { class: 'btn', style: 'flex:1 1 0;' }, '保存换算');
            bs.addEventListener('click', function () {
              var r = {};
              used.forEach(function (u) { r[u] = +rates[u].value || 0; });
              inv().conv.set(itemName, baseSel.value, r).then(function () {
                U.toast('换算已生效', 'ok'); close(); renderBody();
              });
            });
            rowBtns.appendChild(bs);
            if (cur) {
              var bc = U.el('button', { class: 'btn btn-danger', style: 'flex:0 0 auto;' }, '取消换算');
              bc.addEventListener('click', function () {
                inv().conv.del(itemName).then(function () {
                  U.toast('已取消换算', 'ok'); close(); renderBody();
                });
              });
              rowBtns.appendChild(bc);
            }
            body.appendChild(rowBtns);
          });
        });
      });
    }

    /* ---------- 单据表单 ---------- */
    function openForm(type, rec, onDone) {
      var editing = !!rec;
      rec = rec || { type: type, time: Date.now(), qty: '', unit: inv().UNITS[0] };
      var newFiles = [];      // { blob, name }
      var removedIds = [];    // 编辑时标记要删的旧照片

      Promise.all([
        inv().list(),
        G.App.supplier.names()
      ]).then(function (res) {
        var all = res[0], supNames = res[1];
        var names = [];
        all.forEach(function (r) {
          var n = (r.itemName || '').trim();
          if (n && names.indexOf(n) < 0) names.push(n);
        });

        openBox((editing ? '编辑' : '新增') + TAB_TEXT[type] + '单', function (body, close) {
          var f = U.el('div');

          /* 货品名 */
          var dl = U.el('datalist', { id: 'inv-names-' + U.uid() });
          names.forEach(function (n) { dl.appendChild(U.el('option', { value: n })); });
          var inName = U.el('input', { class: 'input', list: dl.id, placeholder: '如：白菜 / 鸡腿肉', value: rec.itemName || '' });
          f.appendChild(U.el('div', { class: 'field' }, [U.el('label', null, '货品名 *'), inName, dl]));

          /* 单位 */
          var up = unitPicker(rec.unit);
          f.appendChild(U.el('div', { class: 'field' }, [U.el('label', null, '单位'), up.el]));

          /* 数量 */
          var inQty = U.el('input', { class: 'input', type: 'number', step: 'any', placeholder: '0', value: rec.qty === '' ? '' : String(rec.qty) });
          f.appendChild(U.el('div', { class: 'field' }, [U.el('label', null, '数量 *'), inQty]));

          var inPrice = null, inAmt = null;
          if (type === 'in') {
            var grid = U.el('div', { style: 'display:grid;grid-template-columns:1fr 1fr;gap:10px;' });
            inPrice = U.el('input', { class: 'input', type: 'number', step: 'any', placeholder: '0.00', value: rec.price == null ? '' : String(rec.price) });
            inAmt = U.el('input', { class: 'input', type: 'number', step: 'any', placeholder: '自动计算', value: rec.amount ? String(rec.amount) : '' });
            grid.appendChild(U.el('div', { class: 'field' }, [U.el('label', null, '单价'), inPrice]));
            grid.appendChild(U.el('div', { class: 'field' }, [U.el('label', null, '金额（可改）'), inAmt]));
            f.appendChild(grid);
            var amtTouched = editing && rec.amount != null;
            function recalc() {
              if (amtTouched) return;
              var q = +inQty.value || 0, p = +inPrice.value || 0;
              inAmt.value = (q && p) ? String(Math.round(q * p * 100) / 100) : '';
            }
            inQty.addEventListener('input', recalc);
            inPrice.addEventListener('input', recalc);
            inAmt.addEventListener('input', function () { amtTouched = true; });
          }

          /* 人员 / 供应商 */
          var inBuyer = null, inReceiver = null, sup = null, inTaker = null;
          if (type === 'in') {
            var g2 = U.el('div', { style: 'display:grid;grid-template-columns:1fr 1fr;gap:10px;' });
            inBuyer = U.el('input', { class: 'input', placeholder: '谁去采购的', value: rec.buyer || '' });
            inReceiver = U.el('input', { class: 'input', placeholder: '谁签收的', value: rec.receiver || '' });
            g2.appendChild(U.el('div', { class: 'field' }, [U.el('label', null, '进货人'), inBuyer]));
            g2.appendChild(U.el('div', { class: 'field' }, [U.el('label', null, '收货人'), inReceiver]));
            f.appendChild(g2);

            sup = comboPicker(supNames, rec.supplier || '', '自定义供应商名');
            var supRow = U.el('div', { style: 'display:flex;gap:8px;align-items:flex-end;' });
            supRow.appendChild(U.el('div', { class: 'field', style: 'flex:1 1 auto;margin-bottom:0;' }, [
              U.el('label', null, '供应商'), sup.el
            ]));
            var btnSup = U.el('button', { class: 'btn btn-soft btn-sm', style: 'flex:0 0 auto;margin-bottom:0;' }, '管理');
            btnSup.addEventListener('click', function () {
              openSuppliers(function () {
                G.App.supplier.names().then(function (ns) { sup.fill(ns); });
              });
            });
            supRow.appendChild(btnSup);
            f.appendChild(supRow);
          } else {
            inTaker = U.el('input', { class: 'input', placeholder: type === 'out' ? '谁领用的' : '谁登记的报损', value: rec.taker || '' });
            f.appendChild(U.el('div', { class: 'field' }, [
              U.el('label', null, type === 'out' ? '领用人' : '报损人'), inTaker
            ]));
          }

          /* 时间 */
          var inTime = U.el('input', { class: 'input', type: 'datetime-local', value: toLocalInput(rec.time) });
          f.appendChild(U.el('div', { class: 'field' }, [U.el('label', null, '时间'), inTime]));

          /* 备注 */
          var inNote = U.el('textarea', { class: 'textarea', placeholder: '选填', rows: 2 });
          inNote.value = rec.note || '';
          f.appendChild(U.el('div', { class: 'field' }, [U.el('label', null, '备注'), inNote]));

          /* 照片 */
          var photoBox = U.el('div', { class: 'field' });
          photoBox.appendChild(U.el('label', null, '照片'));
          var grid = U.el('div', { class: 'inv-photos' });
          var btnAdd = U.el('button', { class: 'inv-photo-add' }, '＋ 照片');
          var btnCam = U.el('button', { class: 'inv-photo-add' }, '📷 拍照');
          photoBox.appendChild(grid);
          var pbRow = U.el('div', { style: 'display:flex;gap:8px;margin-top:8px;' });
          pbRow.appendChild(btnAdd); pbRow.appendChild(btnCam);
          photoBox.appendChild(pbRow);
          f.appendChild(photoBox);

          var filePick = U.el('input', { type: 'file', accept: 'image/*', multiple: 'true', style: 'display:none;' });
          var fileCam = U.el('input', { type: 'file', accept: 'image/*', capture: 'environment', style: 'display:none;' });
          f.appendChild(filePick); f.appendChild(fileCam);
          btnAdd.addEventListener('click', function () { filePick.click(); });
          btnCam.addEventListener('click', function () { fileCam.click(); });
          function onFiles(inp) {
            return function () {
              var fs = [].slice.call(inp.files || []);
              fs.forEach(function (file) { newFiles.push({ blob: file, name: file.name || '照片' }); });
              inp.value = '';
              paintPhotos();
            };
          }
          filePick.addEventListener('change', onFiles(filePick));
          fileCam.addEventListener('change', onFiles(fileCam));

          function paintPhotos() {
            grid.innerHTML = '';
            (editing ? (rec.photos || []).filter(function (id) { return removedIds.indexOf(id) < 0; }) : []).forEach(function (pid) {
              inv().photos.get(pid).then(function (p) {
                if (!p || !grid.isConnected) return;
                var cell = U.el('div', { class: 'inv-photo' });
                cell.appendChild(imgEl(p.blob, 'inv-photo-img'));
                var x = U.el('button', { class: 'inv-photo-x' }, '×');
                x.addEventListener('click', function () {
                  removedIds.push(pid); paintPhotos();
                });
                cell.appendChild(x);
                grid.appendChild(cell);
              });
            });
            newFiles.forEach(function (nf, i) {
              var cell = U.el('div', { class: 'inv-photo' });
              cell.appendChild(imgEl(nf.blob, 'inv-photo-img'));
              var x = U.el('button', { class: 'inv-photo-x' }, '×');
              x.addEventListener('click', function () { newFiles.splice(i, 1); paintPhotos(); });
              cell.appendChild(x);
              grid.appendChild(cell);
            });
          }
          paintPhotos();

          body.appendChild(f);

          /* 保存 */
          var btnSave = U.el('button', { class: 'btn btn-block', style: 'margin-top:6px;' }, '保存');
          btnSave.addEventListener('click', function () {
            var payload = {
              id: editing ? rec.id : null,
              type: type,
              itemName: inName.value,
              unit: up.value(),
              qty: inQty.value,
              time: fromLocalInput(inTime.value),
              note: inNote.value
            };
            if (type === 'in') {
              payload.price = inPrice.value;
              payload.amount = inAmt.value;
              payload.buyer = inBuyer.value;
              payload.receiver = inReceiver.value;
              payload.supplier = sup.value();
            } else {
              payload.taker = inTaker.value;
            }
            if (editing) payload.photos = (rec.photos || []).slice();

            inv().save(payload).then(function (id) {
              if (!id) return null;
              var jobs = (removedIds || []).map(function (pid) { return inv().photos.del(pid); });
              return Promise.all(jobs).then(function () { return id; });
            }).then(function (id) {
              if (!id) return;
              if (newFiles.length) return inv().photos.add(id, newFiles).then(function () { return id; });
              return id;
            }).then(function (id) {
              if (!id) return;
              U.toast(editing ? '已保存' : '已新增', 'ok');
              close();
              if (onDone) onDone();
            });
          });
          body.appendChild(btnSave);
        });
      });
    }

    function rangeText() {

      if (!canExport()) { U.toast('员工模式不能导出数据', 'err'); return; }

          confirmExport(sheet.rows.length - 1, '库存汇总').then(function (ok) {

          });
        });
        return;
      }
      var opt = currentOpt();
      inv().sheets.records(state.tab, opt).then(function (sheet) {
        confirmExport(sheet.rows.length - 1, TAB_TEXT[state.tab] + '记录').then(function (ok) {
          if (!ok) return;
          G.XLSX.download(TAB_TEXT[state.tab] + '记录-' + U.todayKey() + '.xlsx', [sheet]);

        });
      });
    }

    function exportPdf() {
      if (!canExport()) { U.toast('员工模式不能导出数据', 'err'); return; }
      var opt = currentOpt();
      var payload = { records: {} };
      var counts = [];

      var jobs = [];
      if (state.tab === 'summary') {
        jobs.push(inv().summary().then(function (rows) { payload.summary = rows; counts.push(rows.length + ' 项汇总'); }));
        ['in', 'out', 'loss'].forEach(function (t) {
          jobs.push(inv().query(Object.assign({}, opt, { type: t })).then(function (arr) {
            if (arr.length) { payload.records[t] = arr; counts.push(TAB_TEXT[t] + ' ' + arr.length + ' 单'); }
          }));
        });
      } else {
        jobs.push(inv().query(Object.assign({}, opt, { type: state.tab })).then(function (arr) {
          payload.records[state.tab] = arr;
          counts.push(TAB_TEXT[state.tab] + ' ' + arr.length + ' 单');
        }));
      }

      Promise.all(jobs).then(function () {
        var total = counts.reduce(function (s, c) { return s + (parseInt(c.replace(/\D/g, ''), 10) || 0); }, 0);
        if (!total) { U.toast('当前条件下没有可导出的记录', 'err'); return; }
        return confirmExport(total, 'PDF').then(function (ok) {
          if (!ok) return;
          payload.title = '进出货库存报告';
          payload.subtitle = U.formatDate(new Date()) + (rangeText() ? '  ·  ' + rangeText() : '  ·  全部');

            U.toast('已导出 PDF', 'ok');
          });

        okText: '导出'
      });

    root.appendChild(wrap);

/* ============ 71-views-report.js ============ */
/* 71-views-report.js · 营业报表页（日报 / 月报）
   汇总逻辑全在 52-report.js，这一页只管：选区间 → 取数 → 画表 → 导出。

   员工能进这一页，但套两层限制，跟收银页一致：
     1) 日期窗口只给最近 7 天（G.App.orders.dateWindow()）
     2) 导出按钮不给（跟菜单修改、数据备份同一个闸门）
   报表里全是钱，让员工随便导出去不合适 —— 但让他看看今天卖了多少是应该的。 */
(function (G) {
  'use strict';
  var U = G.U;

  function render(root) {
    var state = { kind: 'today', from: '', to: '', mode: '', stats: null, loading: false };
    var wrap = U.el('div', { class: 'page page-scroll' });
    root.appendChild(wrap);

    var win = G.App.orders.dateWindow();     // 员工 = { from, to }；老板 = null

    function rangeText() {
      var r = G.Report.rangeOf(state.kind, state.from, state.to);
      return r.from === r.to ? r.from : (r.from + ' ~ ' + r.to);
    }

    /* 区间算出来之后再用窗口夹一道：
       员工选「本月」时，from 会被抬到窗口起点，to 压到窗口终点 ——
       超出的部分静默截断，不给报错（选错区间不是错误，是越权，截断就够了）。 */
    function clampRange(r) {
      if (!win) return r;
      var f = r.from < win.from ? win.from : r.from;
      var t = r.to > win.to ? win.to : r.to;
      if (f > t) f = t = win.to;
      return { from: f, to: t };
    }

    function refresh() {
      wrap.innerHTML = '';

      var head = U.el('div', { class: 'page-title' }, [
        U.el('div', null, [
          U.el('h1', null, '营业报表'),
          U.el('div', { class: 'sub' }, '营业额 · 支付方式 · 菜品销量 · 营业模式')
        ])
      ]);
      wrap.appendChild(head);

      /* ---------- 筛选卡 ---------- */
      var filt = U.el('div', { class: 'card' });
      var segRow = U.el('div', { class: 'seg', style: 'margin-bottom:10px;flex-wrap:wrap;' });
      [['today', '今日'], ['yesterday', '昨日'], ['week', '本周'],
       ['month', '本月'], ['lastMonth', '上月'], ['custom', '自定义']].forEach(function (p) {
        var b = U.el('button', { class: state.kind === p[0] ? 'active' : '', style: 'font-size:13px;' }, p[1]);
        b.addEventListener('click', function () { state.kind = p[0]; refresh(); });
        segRow.appendChild(b);
      });
      filt.appendChild(segRow);

      if (state.kind === 'custom') {
        var cr = U.el('div', { style: 'display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;' });
        var r0 = G.Report.rangeOf('custom', state.from, state.to);
        var inF = U.el('input', { class: 'input', type: 'date', value: r0.from });
        var inT = U.el('input', { class: 'input', type: 'date', value: r0.to });
        if (win) { inF.min = win.from; inF.max = win.to; inT.min = win.from; inT.max = win.to; }
        function apply() {
          state.from = inF.value || r0.from;
          state.to = inT.value || r0.to;
          if (win && (state.from < win.from || state.to > win.to)) {
            U.toast('员工模式只能查看最近 ' + (+G.App.cfg.get('staffHistoryDays') || G.App.orders.STAFF_DAYS) + ' 天', 'err');
            state.from = win.from; state.to = win.to;
          }
          load();
        }
        inF.addEventListener('change', apply);
        inT.addEventListener('change', apply);
        cr.appendChild(inF); cr.appendChild(inT);
        filt.appendChild(cr);
      }

      var sel = U.el('select', { class: 'select' });
      G.Report.modeOptions().forEach(function (o) {
        var op = U.el('option', { value: o.value }, o.label);
        if (o.value === state.mode) op.setAttribute('selected', 'selected');
        sel.appendChild(op);
      });
      sel.addEventListener('change', function () { state.mode = sel.value; load(); });
      filt.appendChild(sel);

      if (win) {
        filt.appendChild(U.el('div', {
          class: 'staff-win-tip',
          style: 'margin-top:10px;background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--warn-hi);' +
                 'padding:9px 12px;border-radius:12px;font-size:12.5px;font-weight:700;'
        }, '员工模式：仅可查看 ' + win.from + ' 至 ' + win.to + '（最近 ' +
           (+G.App.cfg.get('staffHistoryDays') || G.App.orders.STAFF_DAYS) + ' 天），且不能导出。'));
      }
      wrap.appendChild(filt);

      /* ---------- 导出 ---------- */
      var bar = U.el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;' });
      var btnPdf = U.el('button', { class: 'btn btn-soft' }, '导出 PDF');
      var btnXlsx = U.el('button', { class: 'btn btn-soft' }, '导出 Excel');
      var canOut = G.App.operator.can('export');
      if (!canOut) {
        [btnPdf, btnXlsx].forEach(function (b) {
          b.disabled = true;
          b.classList.add('is-locked');
          b.title = '员工模式不能导出数据，请在右上角切换为老板';
        });
      }
      btnPdf.addEventListener('click', exportPdf);
      btnXlsx.addEventListener('click', exportXlsx);
      bar.appendChild(btnPdf); bar.appendChild(btnXlsx);
      wrap.appendChild(bar);

      var body = U.el('div', { id: 'rpt-body' });
      wrap.appendChild(body);

      load();
    }

    function load() {
      var body = wrap.querySelector('#rpt-body');
      if (!body) return;
      body.innerHTML = '<div class="empty"><p>加载中…</p></div>';
      var r = clampRange(G.Report.rangeOf(state.kind, state.from, state.to));
      G.App.orders.list({ from: r.from, to: r.to }).then(function (orders) {
        state.stats = G.Report.summarize(G.Report.filterByMode(orders || [], state.mode));
        state.range = r;
        paint();

        body.innerHTML = '<div class="empty"><p>加载失败：' + U.escapeHTML(e.message || e) + '</p></div>';
      });

    /* ---------- 画表 ---------- */
    function statBox(k, v, color) {

    function paint() {

        '区间 ' + (r.from === r.to ? r.from : r.from + ' ~ ' + r.to) +

      body.appendChild(meta);

      grid.appendChild(statBox('已退款', 'RM ' + U.formatMoneyPlain(s.refunded),

      /* 营业模式分布：只在「全部模式」下有意义，

      });
    }).catch(function (e) {
      U.toast('读员工名单失败：' + (e && e.message ? e.message : e), 'err');
    });
  }

  function onOperatorClick() {
    if (G.App.operator.role() === 'staff') openBossSwitch();
    else openStaffSwitch();
  }

  /* ---------- 首次使用强制设老板密码 ----------
     需求：没设密码就不给操作。这个弹窗没有关闭按钮，点遮罩也不关。 */
  function forceBossPassword() {
    if (G.App.operator.hasPassword()) return;
    var html =
      '<div class="modal-mask"><div class="modal" style="max-width:380px;">' +
        '<div class="modal-head"><h3>先设置老板密码</h3></div>' +
        '<div class="modal-body">' +
          '<p style="font-size:13.5px;line-height:1.7;margin-bottom:12px;">' +
            '老板密码保护员工管理、菜单修改、数据导出，以及从员工切回老板。<br>' +
            '只在本机保存哈希，不保存明文，也找不回来 —— 请记牢。</p>' +
          '<div class="field"><label>老板密码</label>' +
            '<input class="input" id="fp-p1" type="password" placeholder="至少 4 位" autocomplete="new-password"></div>' +
          '<div class="field" style="margin-bottom:0;"><label>再输一次</label>' +
            '<input class="input" id="fp-p2" type="password" placeholder="防止打错" autocomplete="new-password"></div>' +
          '<div id="fp-err" style="display:none;color:var(--danger);font-size:13px;margin-top:8px;line-height:1.5;"></div>' +
        '</div>' +
        '<div class="modal-foot">' +
          '<button class="btn btn-block" data-act="ok">设置并开始使用</button>' +
        '</div>' +
      '</div></div>';
    var m = U.openModal(html);
    var err = m.querySelector('#fp-err');
    var okBtn = m.querySelector('[data-act="ok"]');
    var p1 = m.querySelector('#fp-p1');
    var p2 = m.querySelector('#fp-p2');
    function say(msg) { err.textContent = msg || ''; err.style.display = msg ? '' : 'none'; }
    function go() {
      if (String(p1.value).length < 4) { say('密码至少 4 位'); p1.focus(); return; }
      if (p1.value !== p2.value) { say('两次输入不一致'); p2.focus(); return; }
      okBtn.disabled = true; okBtn.textContent = '设置中…'; say('');
      G.App.operator.setPassword(p1.value).then(function () {
        U.closeAllModals();
        U.toast('老板密码已设置', 'ok');
      }).catch(function (e) {
        okBtn.disabled = false; okBtn.textContent = '设置并开始使用';
        say('设置失败：' + (e && e.message ? e.message : e));
      });
    }
    okBtn.addEventListener('click', go);
    m.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); go(); }
    });
    setTimeout(function () { p1.focus(); }, 130);
  }

  function bindGlobal() {
    var opBtn = document.getElementById('btn-operator');
    if (opBtn) opBtn.addEventListener('click', onOperatorClick);
    paintOperator();

    var bizBtn = document.getElementById('btn-bizmode');
    if (bizBtn) bizBtn.addEventListener('click', openBizModeMenu);
    // 顶栏胶囊常驻监听：设置页改了档位列表 / 时间段，标签也要跟着变
    if (G.App.biz) G.App.biz.onChange('topbar', paintBizMode);
    paintBizMode();

    document.getElementById('btn-menu-toggle').addEventListener('click', function () {
      document.getElementById('sidenav').classList.add('open');
      document.getElementById('nav-backdrop').classList.add('show');
    });
    document.getElementById('btn-menu-close').addEventListener('click', closeNav);
    document.getElementById('nav-backdrop').addEventListener('click', closeNav);
    function closeNav() {
      document.getElementById('sidenav').classList.remove('open');
      document.getElementById('nav-backdrop').classList.remove('show');
    }
    document.getElementById('btn-quick-settings').addEventListener('click', function () {
      closeNav(); G.Router.go('#/settings');
    });
    // 网络状态
    function syncNet() {
      var s = document.getElementById('net-status');
      s.textContent = navigator.onLine ? '在线' : '离线可用';
      s.className = 'pill-status' + (navigator.onLine ? '' : ' warn');
    }
    window.addEventListener('online', syncNet);
    window.addEventListener('offline', syncNet);
    syncNet();
  }

  function registerSW() {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'http:' && location.protocol !== 'https:' && location.host !== 'localhost') return;
    navigator.serviceWorker.register('service-worker.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            U.toast('新版本已就绪，重启后生效', 'ok');
          }
        });
      });
    }).catch(function () { /* 失败不致命 */ });
  }

  function boot() {
    G.App.cfg.load();
    G.Theme.apply();
    buildNav();
    bindGlobal();
    startClock();

    // 种子数据 + 分类迁移（老库升级后，无归属的菜品归入「未分类 / 默认子分类 / 默认分组」）
    G.App.seedIfEmpty().then(function () { /* ready */ });
    G.App.cats.ensureDefaults().catch(function () { /* 迁移失败不阻断启动 */ });
    // 首次打开：根据 hash 决定
    if (!location.hash) location.hash = '#/home';
    window.addEventListener('hashchange', function () { navTo(location.hash); });
    navTo(location.hash);

    // 身份是异步就绪的（要搬旧数据、复查当前员工还在不在），
    // 好了之后重刷顶栏与导航；没设过老板密码的，这里强制弹窗要求设置
    G.App.operator.boot().then(function () {
      paintOperator();
      buildNav();
      var before = parseHash(location.hash).id;
      var after = guardRouteId(before);
      if (after !== before) location.hash = '#/' + after;   // 触发 hashchange 重渲染
      else highlight(after);
      forceBossPassword();
    }).catch(function () { paintOperator(); });

    // 关闭启动屏
    setTimeout(function () {
      var bs = document.getElementById('boot-screen');
      if (bs) { bs.classList.add('hide'); setTimeout(function () { bs.remove(); }, 320); }
    }, 220);

    // SW
    registerSW();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);

</script>
</body>
</html>
