    if (!canOperator('settings')) {
      if (G.U && G.U.toast) G.U.toast('员工模式不能改设置，请切换为老板', 'err');
      return cfg[k];
    }
    return setRaw(k, v);
  }

  /* ============== 业务数据封装 ============== */
  var DB = G.DB;

  function nowISO() { return new Date().toISOString(); }

  /* ---- 菜单 ---- */
  function listMenu() { return DB.getAll('menu').then(function (arr) { arr.sort(function (a,b) { return (a.sort||0) - (b.sort||0) || (a.createdAt||'').localeCompare(b.createdAt||''); }); return arr; }); }
  function getMenu(id) { return DB.get('menu', id); }
  function saveMenu(item) {
    if (!item.id) { item.id = U.uid(); item.createdAt = nowISO(); }
    item.updatedAt = nowISO();
    if (!Array.isArray(item.specs)) item.specs = [];
    if (item.specs.length === 0) {
      item.specs = [{ id: U.uid(), name: '标准', price: +item.price || 0 }];
    }
    return DB.put('menu', item);
  }
  function delMenu(id) { return DB.del('menu', id); }

  /* ---- 配料库（小料 / 可去配料） ---- */
  function listAddons() { return DB.getAll('addons'); }
  function saveAddon(it) {
    if (!it.id) it.id = U.uid();
    if (!['extra', 'ingredient'].indexOf(it.kind) + 1) it.kind = 'extra';
    if (typeof it.price !== 'number') it.price = +it.price || 0;
    it.createdAt = it.createdAt || nowISO();
    return DB.put('addons', it);
  }
  function delAddon(id) { return DB.del('addons', id); }

  /* ================= 一 / 二 / 三 / 四级分类 =================
     层级强绑定：二级依附一级，三级依附二级，四级依附三级，菜品必须归属到四级分类。
     历史订单只存菜品本身快照，不存分类 ID —— 改名 / 移动分组不影响旧小票与 PDF。 */
  var DEFAULT_CAT = { name: '未分类' }, DEFAULT_SUB = { name: '默认子分类' },
      DEFAULT_THIRD = { name: '默认分组' }, DEFAULT_FOURTH = { name: '默认细分组' };

  function bySort(a, b) {
    return (a.sort || 0) - (b.sort || 0) || String(a.name || '').localeCompare(String(b.name || ''), 'zh');
  }
  function listCategories() { return DB.getAll('categories').then(function (a) { a.sort(bySort); return a; }); }
  function listSubCategories() { return DB.getAll('subCategories').then(function (a) { a.sort(bySort); return a; }); }
  function listThirdCategories() { return DB.getAll('thirdCategories').then(function (a) { a.sort(bySort); return a; }); }
  function listFourthCategories() { return DB.getAll('fourthCategories').then(function (a) { a.sort(bySort); return a; }); }

  /* 新建时若未给 sort，按同级当前最大 sort + 10 追加到末尾 */
  function tailSort(store, filterFn) {
    return DB.getAll(store).then(function (arr) {
      var list = (arr || []).filter(filterFn || function () { return true; });
      var max = list.reduce(function (m, x) { return Math.max(m, +x.sort || 0); }, 0);
      return max + 10;
    });
  }
  function saveCategory(it) {
    it.isActive = it.isActive !== false;
    if (it.categoryId && it.sort != null) return DB.put('categories', it);
    if (!it.categoryId) it.categoryId = U.uid();
    return tailSort('categories').then(function (s) {
      it.sort = s;
      return DB.put('categories', it);
    });
  }
  function saveSubCategory(it) {
    it.isActive = it.isActive !== false;
    if (it.subId && it.sort != null) return DB.put('subCategories', it);
    if (!it.subId) it.subId = U.uid();
    return tailSort('subCategories', function (x) { return x.parentCategoryId === it.parentCategoryId; })
      .then(function (s) { it.sort = s; return DB.put('subCategories', it); });
  }
  function saveThirdCategory(it) {
    it.isActive = it.isActive !== false;
    if (it.thirdId && it.sort != null) return DB.put('thirdCategories', it);
    if (!it.thirdId) it.thirdId = U.uid();
    return tailSort('thirdCategories', function (x) { return x.parentSubId === it.parentSubId; })
      .then(function (s) { it.sort = s; return DB.put('thirdCategories', it); });
  }
  function saveFourthCategory(it) {
    it.isActive = it.isActive !== false;
    if (it.fourthId && it.sort != null) return DB.put('fourthCategories', it);
    if (!it.fourthId) it.fourthId = U.uid();
    return tailSort('fourthCategories', function (x) { return x.parentThirdId === it.parentThirdId; })
      .then(function (s) { it.sort = s; return DB.put('fourthCategories', it); });
  }

  /* ============================================================
   * 菜品归属的「最深层级」
   * 二级 / 三级 / 四级都是可选的：菜挂到哪一级，就以哪一级为准。
   * 只有最深层级的那个 ID 决定菜品出现在哪个分组下，不会重复统计。
   * ============================================================ */
  var ID_KEY = { cat: 'categoryId', sub: 'subCategoryId', third: 'thirdCategoryId', fourth: 'fourthCategoryId' };
  function deepestLevel(m) {
    if (m.fourthCategoryId) return 'fourth';
    if (m.thirdCategoryId) return 'third';
    if (m.subCategoryId) return 'sub';
    if (m.categoryId) return 'cat';
    return '';
  }
  /* 直接挂在某个节点下的菜品（只认最深层级，避免上级重复计数） */
  function ownDishes(menu, level, id) {
    return (menu || []).filter(function (m) {
      return deepestLevel(m) === level && m[ID_KEY[level]] === id;
    });
  }

  /* 删除保护：有子节点 / 挂着菜品一律拒绝，并把"要先处理什么"说清楚 */
  function checkDelete(kind, id) {
    var KID = { cat: ['subCategories', 'parentCategoryId', '二级分类'],
                sub: ['thirdCategories', 'parentSubId', '三级分类'],
                third: ['fourthCategories', 'parentThirdId', '四级分类'] }[kind];
    return Promise.all([
      KID ? DB.getAll(KID[0]) : Promise.resolve([]),
      DB.getAll('menu')
    ]).then(function (r) {
      if (KID) {
        var kids = (r[0] || []).filter(function (x) { return x[KID[1]] === id; });
        if (kids.length) return { ok: false, why: '下面还有 ' + kids.length + ' 个' + KID[2] + '，请先删掉或把菜迁走' };
      }
      var dishes = ownDishes(r[1], kind, id);
      if (dishes.length) return { ok: false, why: '下面还直接挂着 ' + dishes.length + ' 个菜品，请先把菜移到别的分组' };
      return { ok: true };
    });
  }
  function delCategory(id) { return DB.del('categories', id); }
  function delSubCategory(id) { return DB.del('subCategories', id); }
  function delThirdCategory(id) { return DB.del('thirdCategories', id); }
  function delFourthCategory(id) { return DB.del('fourthCategories', id); }

  /* 全路径，给菜品列表 / 点餐页展示用（哪一级别没建就跳过那一段） */
  function pathOf(ids) {
    return Promise.all([listCategories(), listSubCategories(), listThirdCategories(), listFourthCategories()])
      .then(function (r) {
        var c = (r[0] || []).find(function (x) { return x.categoryId === ids.categoryId; });
        var s = (r[1] || []).find(function (x) { return x.subId === ids.subCategoryId; });
        var t = (r[2] || []).find(function (x) { return x.thirdId === ids.thirdCategoryId; });
        var f = (r[3] || []).find(function (x) { return x.fourthId === ids.fourthCategoryId; });
        return {
          cat: c, sub: s, third: t, fourth: f,
          text: [c && c.name, s && s.name, t && t.name, f && f.name].filter(Boolean).join(' / ')
        };
      });
  }

  /* 首次使用 / 老库升级：建默认分支，并把无归属的历史菜品挂进去。
     默认只建到三级 —— 第四级是可选的，需要细分时到分类管理里自己加。 */
  function ensureDefaultCategories() {
    return listCategories().then(function (cats) {
      if (cats.length) return ensureDefaultSubs(cats[0]);
      return saveCategory(Object.assign({ categoryId: U.uid(), sort: 10 }, DEFAULT_CAT))
        .then(function () { return listCategories(); })
        .then(function (c2) { return ensureDefaultSubs(c2[0]); });
    }).then(function (third) {
      // 历史菜品兜底归属：连三级都没有的，挂进默认分支
      return DB.getAll('menu').then(function (arr) {
        var jobs = [];
        (arr || []).forEach(function (m) {
          if (m.thirdCategoryId || m.subCategoryId) return;
          m.categoryId = third.catId;
          m.subCategoryId = third.subId;
          m.thirdCategoryId = third.thirdId;
          jobs.push(DB.put('menu', m));
        });
        return Promise.all(jobs);
      });
    });
  }
  function ensureDefaultSubs(cat) {
    return listSubCategories().then(function (subs) {
      var own = subs.filter(function (s) { return s.parentCategoryId === cat.categoryId; });
      if (own.length) return ensureDefaultThirds(own[0], cat);
      return saveSubCategory({ subId: U.uid(), parentCategoryId: cat.categoryId, name: DEFAULT_SUB.name, sort: 10, isActive: true })
        .then(function () { return listSubCategories(); })
        .then(function (s2) { return ensureDefaultThirds(s2.filter(function (s) { return s.parentCategoryId === cat.categoryId; })[0], cat); });
    });
  }
  function ensureDefaultThirds(sub, cat) {
    return listThirdCategories().then(function (ths) {
      var own = ths.filter(function (t) { return t.parentSubId === sub.subId; });
      if (own.length) return { catId: cat.categoryId, subId: sub.subId, thirdId: own[0].thirdId };
      var thirdId = U.uid();
      return saveThirdCategory({ thirdId: thirdId, parentSubId: sub.subId, name: DEFAULT_THIRD.name, sort: 10, isActive: true })
        .then(function () { return { catId: cat.categoryId, subId: sub.subId, thirdId: thirdId }; });
    });
  }

  /* 菜品重排序号：按分类树深度优先的扁平序号 * 1000 + 组内序号，
     让点餐页与后台列表的显示顺序与分类树一致（每一层自己的直属菜也算一组） */
  function reindexDishes() {
    return Promise.all([listCategories(), listSubCategories(), listThirdCategories(),
                        listFourthCategories(), DB.getAll('menu')])
      .then(function (r) {
        var cats = r[0], subs = r[1], ths = r[2], fs = r[3], menu = r[4] || [];
        var gi = 0, jobs = [];
        function group(level, id) {
          var dishes = ownDishes(menu, level, id).slice().sort(bySort);
          dishes.forEach(function (m, i) {
            var v = gi * 1000 + i;
            if (m.sort !== v) { m.sort = v; jobs.push(DB.put('menu', m)); }
          });
          gi++;
        }
        cats.forEach(function (c) {
          group('cat', c.categoryId);
          subs.filter(function (s) { return s.parentCategoryId === c.categoryId; }).forEach(function (s) {
            group('sub', s.subId);
            ths.filter(function (t) { return t.parentSubId === s.subId; }).forEach(function (t) {
              group('third', t.thirdId);
              fs.filter(function (f) { return f.parentThirdId === t.thirdId; }).forEach(function (f) {
                group('fourth', f.fourthId);
              });
            });
          });
        });
        // 没挂到任何分类的孤儿菜品，排到最后
        menu.filter(function (m) { return !deepestLevel(m); }).forEach(function (m, i) {
          var v = gi * 1000 + i;
          if (m.sort !== v) { m.sort = v; jobs.push(DB.put('menu', m)); }
        });
        return Promise.all(jobs);
      });
  }

  /* 批量把菜品重新分配到指定分类（落到哪一级由 ids 里最深的那个决定） */
  function assignDishes(menuIds, ids) {
    return DB.getAll('menu').then(function (arr) {
      var jobs = [];
      (arr || []).forEach(function (m) {
        if (menuIds.indexOf(m.id) < 0) return;
        m.categoryId = ids.categoryId;
        m.subCategoryId = ids.subCategoryId || '';
        m.thirdCategoryId = ids.thirdCategoryId || '';
        // 第四级是可选的：没传就清掉，菜直接挂在三级下
        m.fourthCategoryId = ids.fourthCategoryId || '';
        jobs.push(DB.put('menu', m));
      });
      return Promise.all(jobs).then(reindexDishes);
    });
  }

  /* ---- 订单 ---- */
  function listOrders(opts) {
    opts = opts || {};
    return DB.getAll('orders').then(function (arr) {
      if (opts.date) arr = arr.filter(function (x) { return x.date === opts.date; });
      if (opts.from) arr = arr.filter(function (x) { return x.date >= opts.from; });
      if (opts.to) arr = arr.filter(function (x) { return x.date <= opts.to; });
      arr.sort(function (a, b) { return (b.createTime || '').localeCompare(a.createTime || ''); });
      return arr;
    });
  }
  function getOrder(id) { return DB.get('orders', id); }
  function saveOrder(o) {
    if (!o.id) o.id = U.uid();
    if (!o.createTime) o.createTime = nowISO();
    o.date = o.date || U.todayKey();
    return DB.put('orders', o);
  }
  function delOrder(id) { return DB.del('orders', id); }
  function clearAllOrders() { return DB.clear('orders'); }

  /* ---- 一键清空全部业务数据 ----
     把「清空」收口到这一个函数，别让设置页里各按钮各自 DB.clear：
       1) 权限写在函数里（仅老板），UI 漏拦也清不掉 —— 双保险；
       2) 按勾选项映射成「整块数据」的表集合，一次清空不留半截；
       3) 老板密码 / 角色落在 localStorage（operator 模块），根本不进这些库，
          所以天然动不到；pdfArchives 是派生文档，也不在表里，保留。
     任何一步失败都 reject，Promise 链直接断 —— 不会「订单清了菜单没清」的半残状态。 */
  function wipeBusinessData(sel) {
    if (G.App.operator.role() !== 'boss') {
      return Promise.reject(new Error('仅老板可清空业务数据'));
    }
    var map = {
      orders:    ['orders', 'carts', 'ledger', 'locks'],          // 订单 + 挂单 + 收支流水 + 工位锁
      inventory: ['inventory', 'inventoryPhotos', 'supplier', 'invConfig'], // 进出货整块 + 照片
      menu:      ['menu', 'addons', 'categories', 'subCategories', 'thirdCategories', 'fourthCategories'],
      staff:     ['staff']
    };
    var stores = [];
    (sel || []).forEach(function (k) {
      (map[k] || []).forEach(function (s) { if (stores.indexOf(s) < 0) stores.push(s); });
    });
    if (!stores.length) return Promise.resolve([]);
    var done = [];
    return stores.reduce(function (p, s) {
      return p.then(function () { return DB.clear(s); }).then(function () { done.push(s); });
    }, Promise.resolve()).then(function () { return done; });
  }

  /* ---- 退款 ----
     退款不删单、不改原单金额，只在订单上追加 refundRecords。
     原单金额是「当时真实发生了什么」，退款是「后来又发生了什么」——
     两件事都该留痕，所以营业额由 netOf() 现算，不回头改写 total。 */
  function refundedOf(o) {
    var s = 0;
    ((o && o.refundRecords) || []).forEach(function (r) { s += +r.amount || 0; });
    return Math.round(s * 100) / 100;
  }
  /* 净营业额 = 原价 − 累计已退，永不为负 */
  function netOf(o) {
    var t = +((o && o.total) || 0);
    var n = t - refundedOf(o);
    return Math.round((n > 0 ? n : 0) * 100) / 100;
  }
  function isFullyRefunded(o) { return (o && o.refundRecords || []).length > 0 && netOf(o) <= 0.0001; }
  /* 某菜品还剩多少可退（扣掉历次部分退款里已退的份数） */
  function refundedQtyOf(o, key) {
    var q = 0;
    ((o && o.refundRecords) || []).forEach(function (r) {
      ((r && r.items) || []).forEach(function (it) { if (it.key === key) q += +it.qty || 0; });
    });
    return q;
  }

  /* ---- 员工可见的订单日期窗口 ----
     员工默认只能看最近 7 天；老板不限。返回 { from, to } 或 null（不限）。
     页数限制只在这里定口径，收银页 / 报表页共用，免得各处自己算、算得不一样。 */
  var STAFF_DAYS = 7;
  function orderDateWindow() {
    if (canOperator('viewAllHistory')) return null;
    var days = +get('staffHistoryDays') || STAFF_DAYS;
    var d = new Date();
    d.setDate(d.getDate() - (days - 1));      // 含今天，所以往前推 days-1
    return { from: U.todayKey(d), to: U.todayKey() };
  }
  /* 落在窗口外的最早可见日期，给 <input type="date"> 当 min 用 */
  function orderDateMin() {
    var w = orderDateWindow();
    return w ? w.from : '';
  }

  /* ---- 收支流水 ---- */
  function listLedger(opts) {
    opts = opts || {};
    return DB.getAll('ledger').then(function (arr) {
      if (opts.date) arr = arr.filter(function (x) { return x.date === opts.date; });
      // 区间筛选（周 / 月统计）：date 是 YYYY-MM-DD，字典序即时间序
      if (opts.from) arr = arr.filter(function (x) { return !!x.date && x.date >= opts.from; });
      if (opts.to) arr = arr.filter(function (x) { return !!x.date && x.date <= opts.to; });
      if (opts.type) arr = arr.filter(function (x) { return x.type === opts.type; });
      arr.sort(function (a, b) { return (b.createTime || '').localeCompare(a.createTime || ''); });
      return arr;
    });
  }
  /* ---- 营业额 → 收支 ----
     营业额不抄进 ledger 仓库：抄一份就会出现「收银记录里删了单，账本里流水还留着」
     的双写不一致。改成每次实时由已结账订单拼出来 —— 订单改了、删了，账立刻跟着变。
     _turnover 是只读标记，列表据此不给删除按钮。 */
  function turnoverRows(opts) {
    opts = opts || {};
    // 营业额只可能是收入，筛支出时直接返回空
    if (opts.type && opts.type !== 'income') return Promise.resolve([]);
    return listOrders({ date: opts.date, from: opts.from, to: opts.to }).then(function (orders) {
      return (orders || [])
        // 全退的单净额为 0，不该在账本里留一行 0 元收入占位置
        .filter(function (o) { return !isFullyRefunded(o); })
        .map(function (o) {
          var refunded = refundedOf(o);
          return {
            id: 'TV-' + o.id,
            _turnover: true,
            type: 'income',
            category: '营业额',
            amount: netOf(o),
            refunded: refunded,
            date: o.date,
            createTime: o.createTime,
            orderNo: o.orderNo || '',
            payMethod: o.payMethod || 'CASH',
            note: (o.orderNo || '-') + '  ·  ' +
                  (o.kind === 'takeaway' ? '外带' : ('桌 ' + o.table + ' 号 · ' + o.pax + ' 人')) +
                  '  ·  ' + (o.payMethod || 'CASH') +
                  // 部分退过钱的单要能一眼看出来，否则对账时会对不上数
                  (refunded > 0 ? '  ·  已退 RM ' + U.formatMoneyPlain(refunded) : '')
          };
        });
    });
  }

  /* 账本 + 营业额合流，按时间倒序。记账页的统计与流水统一走这里，
     保证「看统计」和「看流水」用的是同一份数。 */
  function listLedgerWithTurnover(opts) {
    return Promise.all([listLedger(opts), turnoverRows(opts)]).then(function (res) {
      var rows = (res[0] || []).concat(res[1] || []);
      rows.sort(function (a, b) { return (b.createTime || '').localeCompare(a.createTime || ''); });
      return rows;
    });
  }

  function saveLedger(it) {
    if (!it.id) it.id = U.uid();
    if (!it.createTime) it.createTime = nowISO();
    it.date = it.date || U.todayKey();
    it.amount = +it.amount || 0;
    return DB.put('ledger', it);
  }
  function delLedger(id) { return DB.del('ledger', id); }

  /* ================= 台桌 / 外带 进行中购物车 =================
     slotId 规则：
       堂食  → 'T' + 桌号补零（T01 .. T50，随 tableCount 扩展）
       外带  → 'TAKEAWAY'
     每个 slot 同时只允许一组购物车。 */
  var TAKEAWAY_SLOT = 'TAKEAWAY';
  function tableSlotId(t) { return 'T' + String(+t).padStart(2, '0'); }

  function emptyCart(slotId, kind, table) {
    return {
      slotId: slotId,
      kind: kind,                 // 'dinein' | 'takeaway'
      table: (kind === 'dinein' ? +table : null),
      items: [],
      // idle 空闲（灰） | using 占用（橙） | paid 已结账（绿） | pending 挂单
      status: 'idle',
      total: 0,
      pax: 2,
      payMethod: get('defaultPay') || 'CASH',
      updatedAt: nowISO()
    };
  }

  function getCart(slotId) {
    return DB.get('carts', slotId).then(function (c) {
      if (c) return c;
      // 惰性创建一个空壳（不落库，避免数据库塞满空记录）
      var isTA = slotId === TAKEAWAY_SLOT;
      return emptyCart(slotId, isTA ? 'takeaway' : 'dinein', isTA ? null : +slotId.slice(1));
    });
  }
  function saveCart(cart) {
    cart.updatedAt = nowISO();
    cart.total = (cart.items || []).reduce(function (s, it) { return s + (+it.subtotal || 0); }, 0);
    cart.total = Math.round(cart.total * 100) / 100;
    /* 状态机（三态）：
         空车        → idle（灰）
         有菜        → using（橙），不管之前是 idle 还是已结账
         结账后留壳  → paid（绿），items 被清空但 status 已被显式设成 paid，不能被这里改回 idle
       挂单 pending 由 placeOrder 显式设置，购物车还在，这里不动它。 */
    if (!cart.items || cart.items.length === 0) {
      if (cart.status !== 'paid') cart.status = 'idle';
    } else if (cart.status !== 'pending') {
      cart.status = 'using';
    }
    return DB.put('carts', cart);
  }
  /* 结账后把台桌翻成「已结账绿」：不删记录（删了台桌页就看不到这一桌刚结过账），
     只清空菜品并记下这单的号、金额、时间。重置台桌时才真正删掉。 */
  function markPaid(slotId, order, fallback) {
    return DB.get('carts', slotId).then(function (cart) {
      if (!cart) {
        /* 购物车可能还没落过库（比如刚建好就一路点到结账）；
           查不到就用传入的这份造壳，否则这桌结完账翻不成绿色，
           台桌页会把它显示成「空闲」，服务员以为还能再开一次台。 */
        if (!fallback) return null;
        cart = fallback;
      }
      cart.items = [];
      cart.status = 'paid';
      cart.paidAt = order.createTime || nowISO();
      cart.paidOrderNo = order.orderNo || '';
      cart.paidTotal = order.total || 0;
      cart.paidMethod = order.payMethod || '';
      cart.paidBy = order.operatorName || '';
      cart.orderNo = '';                    // 单号已归档到订单里，别再挂着
      cart.total = 0;
      cart.updatedAt = nowISO();
      return DB.put('carts', cart).then(function () { return releaseLock(slotId); });
    });
  }
  /* 清空购物车时一并解锁，否则结账后 30 秒内会被误判为「其他会话操作中」 */
  function clearCart(slotId) {
    return DB.del('carts', slotId).then(function () { return releaseLock(slotId); });
  }
  function listCarts() { return DB.getAll('carts'); }
  function clearAllCarts() {
    return DB.clear('carts').then(function () { return clearAllLocks(); });
  }

  /* ================= 工位软锁（跨会话互斥） =================
     锁单独存 locks 仓库，不塞进 carts：
       - 空闲桌的购物车是惰性空壳、不落库，锁必须能独立存在；
       - 避免锁字段把空购物车写进库里，污染数据。
     规则：同一个 slot 同一时间只允许一个会话持有；
           超过 LOCK_TTL 未续期视为已释放（防死锁）。 */
  var SESSION_ID = U.uid();
  var LOCK_TTL = 30000;

  function lockHeldByOther(rec) {
    if (!rec) return false;
    if (rec.sid === SESSION_ID) return false;          // 自己持有
    return (Date.now() - (rec.ts || 0)) < LOCK_TTL;    // 别人持有且未过期
  }

  /* 抢占锁：Promise<boolean>，true=拿到，false=被别的会话占用 */
  function acquireLock(slotId) {
    return DB.get('locks', slotId).then(function (rec) {
      if (lockHeldByOther(rec)) return false;
      return DB.put('locks', { slotId: slotId, sid: SESSION_ID, ts: Date.now() })
               .then(function () { return true; })
               .catch(function () { return true; });   // 写失败不阻断使用
    }).catch(function () { return true; });
  }

  /* 释放锁：只释放自己持有的，避免误删别人的锁 */
  function releaseLock(slotId) {
    if (!slotId) return Promise.resolve(false);
    return DB.get('locks', slotId).then(function (rec) {
      if (!rec || rec.sid !== SESSION_ID) return false;
      return DB.del('locks', slotId).then(function () { return true; });
    }).catch(function () { return false; });
  }

  /* 续期：仍在本会话操作就刷新时间戳 */
  function touchLock(slotId) {
    if (!slotId) return Promise.resolve(false);
    return DB.get('locks', slotId).then(function (rec) {
      if (!rec || rec.sid !== SESSION_ID) return false;
      return DB.put('locks', { slotId: slotId, sid: SESSION_ID, ts: Date.now() })
               .then(function () { return true; });
    }).catch(function () { return false; });
  }

  /* 查锁（给台桌页显示占用提示用） */
  function peekLock(slotId) {
    return DB.get('locks', slotId).then(function (rec) {
      return lockHeldByOther(rec);
    }).catch(function () { return false; });
  }
  /* 批量查锁：给台桌页一次拿到所有「被别的会话占用」的工位，避免逐桌查询 */
  function lockedSlots() {
    return DB.getAll('locks').then(function (recs) {
      var out = {}, now = Date.now();
      (recs || []).forEach(function (r) {
        if (r.sid === SESSION_ID) return;                 // 自己持有的不算占用
        if ((now - (r.ts || 0)) < LOCK_TTL) out[r.slotId] = true;
      });
      return out;
    }).catch(function () { return {}; });
  }
  function clearAllLocks() { return DB.clear('locks').catch(function () {}); }
  /* 清掉已过期的锁记录：过期锁已不具互斥效力，留着只会让 locks 仓库越积越多 */
  function purgeLocks() {
    return DB.getAll('locks').then(function (recs) {
      var now = Date.now();
      var jobs = (recs || []).filter(function (r) { return (now - (r.ts || 0)) >= LOCK_TTL; })
        .map(function (r) { return DB.del('locks', r.slotId); });
      return Promise.all(jobs);
    }).catch(function () { return null; });
  }

  /* ================= 单号计数器 =================
     堂食 DI：DI 001 → DI 9999，累计不按天重置，满 9999 后回 DI 001
     外带 TA：TA001 起，每个自然日重置 */
  function fmtDI(n) { return 'DI ' + String(n).padStart(3, '0'); }
  function fmtTA(n) { return 'TA' + String(n).padStart(3, '0'); }

  function peekDI() {
    return DB.get('counters', 'dineInSeq').then(function (r) { return r ? r.v : 0; });
  }
  function nextDineInNo() {
    // 原子式：读取 → +1 → 写回 → 返回格式化单号
    return DB.get('counters', 'dineInSeq').then(function (r) {
      var cur = r ? r.v : 0;
      var next = cur + 1;
      if (next > 9999) next = 1;            // 到上限回环
      return DB.put('counters', { k: 'dineInSeq', v: next }).then(function () { return fmtDI(next); });
    });
  }
  function nextTakeawayNo() {
    var today = U.todayKey();
    return DB.get('counters', 'takeawaySeq').then(function (r) {
      var n = 1, d = today;
      if (r && r.date === today) { n = (r.v || 0) + 1; d = r.date; }
      return DB.put('counters', { k: 'takeawaySeq', v: n, date: d }).then(function () { return fmtTA(n); });
    });
  }
  function getCounters() {
    return Promise.all([DB.get('counters', 'dineInSeq'), DB.get('counters', 'takeawaySeq')])
      .then(function (r) {
        return {
          dineInSeq: r[0] ? r[0].v : 0,
          takeawayDate: r[1] ? r[1].date : '',
          takeawaySeq: r[1] ? r[1].v : 0
        };
      });
  }
  function setCounters(c) {
    var jobs = [];
    if (c && typeof c.dineInSeq === 'number') jobs.push(DB.put('counters', { k: 'dineInSeq', v: c.dineInSeq }));
    if (c && typeof c.takeawaySeq === 'number') jobs.push(DB.put('counters', { k: 'takeawaySeq', v: c.takeawaySeq, date: c.takeawayDate || U.todayKey() }));
    return Promise.all(jobs);
  }

  /* ---- 图片 ---- */
  function savePhoto(blob, name) {
    return DB.add('photos', { id: U.uid(), blob: blob, name: name || '', createdAt: nowISO() });
  }
  function getPhoto(id) { return DB.get('photos', id); }
  function delPhoto(id) { return DB.del('photos', id); }

  /* ---- PDF 档案 ---- */
  function listPDFs() {
    return DB.getAll('pdfArchives').then(function (arr) {
      arr.sort(function (a, b) { return (b.createTime || '').localeCompare(a.createTime || ''); });
      return arr;
    });
  }
  function savePDF(rec) {
    if (!rec.pdfId) rec.pdfId = U.uid();
    if (!rec.createTime) rec.createTime = nowISO();
    if (!rec.size && rec.pdfBlob) rec.size = rec.pdfBlob.size;
    return DB.put('pdfArchives', rec);
  }
  function getPDF(id) { return DB.get('pdfArchives', id); }
  function delPDF(id) { return DB.del('pdfArchives', id); }
  function clearPDFs() { return DB.clear('pdfArchives'); }

  /* ---- JSON 全量导入导出 ----
     v5 起备份里带员工名单（staff）。
     订单行是原样写入的，导入过程不会去改写 operatorRole / operatorName，
     也就是「覆盖员工配置，但不改动历史订单的记录内容」。 */
  function exportJSON() {
    return Promise.all([
      DB.getAll('menu'), DB.getAll('orders'), DB.getAll('ledger'),
      DB.getAll('addons'), DB.getAll('carts'), getCounters(),
      DB.getAll('categories'), DB.getAll('subCategories'), DB.getAll('thirdCategories'),
      DB.getAll('fourthCategories'), DB.getAll('staff'),
      DB.getAll('inventory'), DB.getAll('inventoryPhotos'),
      DB.getAll('supplier'), DB.getAll('invConfig')
    ]).then(function (res) {
      return {
        app: 'pos-cashier',
        version: 6,
        exportedAt: nowISO(),
        menu: res[0], orders: res[1], ledger: res[2], addons: res[3],
        carts: res[4],
        counters: res[5],
        categories: res[6], subCategories: res[7], thirdCategories: res[8],
        fourthCategories: res[9],
        staff: res[10],
        inventory: res[11], inventoryPhotos: res[12],
        supplier: res[13], invConfig: res[14],
        // 只留作档案：导入时不恢复，免得一份备份就能把员工身份提权成老板
        operator: { role: roleNow(), staffId: staffIdNow(), name: operatorName() }
      };
    });
  }
  function importJSON(obj) {
    if (!obj || obj.app !== 'pos-cashier') throw new Error('文件格式不符（不是本应用备份）');
    var jobs = [];
    var allStores = ['menu','orders','ledger','addons','carts',
                     'categories','subCategories','thirdCategories','fourthCategories'];
    allStores.forEach(function (k) {
      jobs.push(DB.clear(k));
      (obj[k] || []).forEach(function (row) { jobs.push(DB.put(k, row)); });
    });
    // 进出货：v6 起备份里才带这四张表。老备份没有 → 一条都不写，
    // 但既然是「全量恢复」，库里现有的进出货数据也要跟着清干净，不能新旧混着。
    ['inventory', 'inventoryPhotos', 'supplier', 'invConfig'].forEach(function (k) {
      jobs.push(DB.clear(k));
      (obj[k] || []).forEach(function (row) { jobs.push(DB.put(k, row)); });
    });
    // 员工名单：v4 及以前的老备份没有 staff 字段，导入时不能把现有名单清掉
    if (Array.isArray(obj.staff)) {
      jobs.push(DB.clear('staff'));
      obj.staff.forEach(function (row) { jobs.push(DB.put('staff', row)); });
    }
    // 锁是会话态，导入后一律作废
    jobs.push(DB.clear('locks'));
    return Promise.all(jobs).then(function () {
      // 恢复单号计数（兼容旧版备份：无 counters 字段则不改动）
      if (obj.counters) setCounters(obj.counters);
      // 当前登录角色不从备份恢复（身份只作档案，导入不改权限）；
      // 但要复查原本登录的那个员工还在不在，被删了/停用了就退回老板
      return ensureValidRole().then(loadStaffName);
    });
  }

  /* 种子数据（首次使用） */
  function seedIfEmpty() {
    return listAddons().then(function (a) {
      if (a.length) return null;
      return Promise.all([
        saveAddon({ name: '加蛋', price: 1.5, kind: 'extra' }),
        saveAddon({ name: '加芝士', price: 2, kind: 'extra' }),
        saveAddon({ name: '加辣', price: 0, kind: 'extra' }),
        saveAddon({ name: '不加辣', price: 0, kind: 'ingredient' }),
        saveAddon({ name: '不加香菜', price: 0, kind: 'ingredient' }),
        saveAddon({ name: '不加葱', price: 0, kind: 'ingredient' })
      ]);
    });
  }

  /* ================= 老板密码（只存哈希，绝不存明文） =================
     PBKDF2-SHA256 + 每次随机盐：同一个密码存两次得到的串不一样，
     拿到哈希也没法用彩虹表反查明文。
     存储格式：pbkdf2$<迭代次数>$<盐 base64>$<哈希 base64>
     迭代次数写进串里，以后想加档不用改解析逻辑。 */
  var PBKDF2_ITER = 100000;
  var LS_HASH = 'bossPasswordHash';
  var LS_ROLE = 'currentRole';
  var LS_STAFF = 'currentStaffId';

  function bytesToB64(buf) {
    var b = new Uint8Array(buf), out = '';
    for (var i = 0; i < b.length; i++) out += String.fromCharCode(b[i]);
    return btoa(out);
  }
  function b64ToBytes(str) {
    var raw = atob(str), b = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) b[i] = raw.charCodeAt(i);
    return b;
  }
  function strToBytes(str) {
    var b = new Uint8Array(str.length);
    for (var i = 0; i < str.length; i++) b[i] = str.charCodeAt(i) & 0xff;
    return b;
  }
  /* 恒定时间比较：逐字节异或累积，不因第一个不同字符就提前返回，
     避免把「密码前几位对不对」这种信息漏给计时攻击。本地场景其实用不上，
     但这是密码校验该有的样子。 */
  function safeEqual(a, b) {
    if (a.length !== b.length) return false;
    var d = 0;
    for (var i = 0; i < a.length; i++) d |= a.charCodeAt(i) ^ b.charCodeAt(i);
    return d === 0;
  }
  function randomBytes(n) {
    var b = new Uint8Array(n);
    if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(b);
    else for (var i = 0; i < n; i++) b[i] = Math.floor(Math.random() * 256);
    return b;
  }

  /* ---- 纯 JS SHA-256：只在非安全上下文（file:// 打开）下兜底 ---- */
  var SHA_K = [
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
  ];
  function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }
  function sha256Bytes(msg) {
    var H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
             0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    var ml = msg.length;
    var total = Math.ceil((ml + 9) / 64) * 64;
    var buf = new Uint8Array(total);
    buf.set(msg);
    buf[ml] = 0x80;
    var bits = ml * 8;
    // 大端：高字节在前。写反了所有非空输入都会算错
    buf[total - 4] = (bits >>> 24) & 0xff;
    buf[total - 3] = (bits >>> 16) & 0xff;
    buf[total - 2] = (bits >>> 8) & 0xff;
    buf[total - 1] = (bits >>> 0) & 0xff;
    var w = new Int32Array(64);
    for (var off = 0; off < total; off += 64) {
      var i;
      for (i = 0; i < 16; i++) {
        w[i] = (buf[off + i * 4] << 24) | (buf[off + i * 4 + 1] << 16) |
               (buf[off + i * 4 + 2] << 8) | buf[off + i * 4 + 3];
      }
      for (i = 16; i < 64; i++) {
        var s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
        var s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
      }
      var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (i = 0; i < 64; i++) {
        var S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
        var ch = (e & f) ^ (~e & g);
        var t1 = (h + S1 + ch + SHA_K[i] + w[i]) | 0;
        var S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
        var maj = (a & b) ^ (a & c) ^ (b & c);
        var t2 = (S0 + maj) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0;
        d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
      H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
    }
    var out = new Uint8Array(32);
    for (i = 0; i < 8; i++) {
      out[i * 4] = (H[i] >>> 24) & 0xff;
      out[i * 4 + 1] = (H[i] >>> 16) & 0xff;
      out[i * 4 + 2] = (H[i] >>> 8) & 0xff;
      out[i * 4 + 3] = H[i] & 0xff;
    }
    return out;
  }

  /* crypto.subtle 只在 HTTPS / localhost 下有。file:// 直接打开时用兜底实现，
     轮数降一档（纯 JS 太慢），但仍然是哈希、仍然不存明文。 */
  function cryptoOK() {
    return !!(window.crypto && window.crypto.subtle && window.crypto.subtle.deriveBits);
  }

  function derivePBKDF2(pwd, salt, iter) {
    if (!window.TextEncoder) return Promise.reject(new Error('缺少 TextEncoder'));
    return window.crypto.subtle.importKey('raw', new TextEncoder().encode(pwd),
      'PBKDF2', false, ['deriveBits']).then(function (key) {
      return window.crypto.subtle.deriveBits(
        { name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' }, key, 256);
    }).then(function (bits) { return new Uint8Array(bits); });
  }

  /* 兜底派生：salt 和口令拼起来反复 SHA-256。比 PBKDF2 弱，但不存明文这条底线守住了。 */
  var FALLBACK_ITER = 20000;
  function deriveFallback(pwd, salt, iter) {
    var acc = new Uint8Array(salt.length + pwd.length);
    acc.set(salt, 0);
    var pb = strToBytes(pwd);
    acc.set(pb, salt.length);
    var cur = sha256Bytes(acc);
    for (var i = 1; i < iter; i++) {
      var mix = new Uint8Array(cur.length + salt.length);
      mix.set(cur, 0); mix.set(salt, cur.length);
      cur = sha256Bytes(mix);
    }
    return Promise.resolve(cur);
  }

  function derive(pwd, salt, iter, useCrypto) {
    return useCrypto ? derivePBKDF2(pwd, salt, iter) : deriveFallback(pwd, salt, iter);
  }

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) {
    try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }
    catch (e) { /* 隐私模式下写不了，忽略 */ }
  }

  /* 生成一条密码记录串。salt 为空表示重新生成随机盐（设置新密码时用）。 */
  function makePasswordRecord(pwd) {
    var useCrypto = cryptoOK();
    var iter = useCrypto ? PBKDF2_ITER : FALLBACK_ITER;
    var salt = randomBytes(16);
    return derive(pwd, salt, iter, useCrypto).then(function (hash) {
      return (useCrypto ? 'pbkdf2' : 'fallback') + '$' + iter + '$' +
             bytesToB64(salt) + '$' + bytesToB64(hash);
    });
  }

  /* 校验：从记录串里取出盐和轮数，按同样的参数再算一遍比对。
     串里写死了用哪种算法，所以从 file:// 切到 HTTPS 也能验通过（不会互相打架）。 */
  function verifyPasswordRecord(pwd, rec) {
    if (!rec) return Promise.resolve(false);
    var parts = String(rec).split('$');
    if (parts.length !== 4) return Promise.resolve(false);
    var algo = parts[0], iter = +parts[1] || 0;
    if (iter <= 0) return Promise.resolve(false);
    var salt, want;
    try { salt = b64ToBytes(parts[2]); want = parts[3]; }
    catch (e) { return Promise.resolve(false); }
    // 记录是 pbkdf2 但当前环境没有 Web Crypto → 没法复算，直接判失败而不是放行
    if (algo === 'pbkdf2' && !cryptoOK()) return Promise.resolve(false);
    return derive(pwd, salt, iter, algo === 'pbkdf2').then(function (hash) {
      return safeEqual(bytesToB64(hash), want);
    }).catch(function () { return false; });
  }

  function hasBossPassword() { return !!lsGet(LS_HASH); }
  function setBossPassword(pwd) {
    return makePasswordRecord(pwd).then(function (rec) { lsSet(LS_HASH, rec); return true; });
  }
  function verifyBossPassword(pwd) { return verifyPasswordRecord(pwd, lsGet(LS_HASH)); }

  /* ================= 角色与权限（老板 / 员工工位） =================
     老板一个、密码保护；员工多个、在 staff 仓库里，可增删改停用。
     「当前是谁」这个轻量状态按需求放 localStorage（刷新 / 重开都保留），
     员工名单本身是业务数据，放 IndexedDB。
     权限只有一个判据：员工模式下 STAFF_BLOCKED 里列出的动作一律拒绝。 */
  var OPERATOR_KEY = 'operator';      // 旧版身份存在 kv 的这个键下
  var curStaffName = '';              // 内存缓存当前员工名，避免每次渲染都查库

  function roleNow() { return lsGet(LS_ROLE) === 'staff' ? 'staff' : 'boss'; }
  function staffIdNow() { return lsGet(LS_STAFF) || null; }
  function applyRole(role, staffId) {
    lsSet(LS_ROLE, role === 'staff' ? 'staff' : 'boss');
    lsSet(LS_STAFF, role === 'staff' ? (staffId || null) : null);
    if (role !== 'staff') curStaffName = '';
  }

  /* ---------- 员工名单 ---------- */
  function listStaff() {
    return DB.getAll('staff').then(function (rows) {
      return (rows || []).slice().sort(function (a, b) {
        return String(a.createTime || '').localeCompare(String(b.createTime || ''));
      });
    });
  }
  function getStaff(id) { return DB.get('staff', id); }
  function saveStaff(s) {
    s = s || {};
    if (!s.id) s.id = U.uid();
    s.name = String(s.name || '').trim();
    s.active = s.active !== false;
    s.createTime = s.createTime || nowISO();
    return DB.put('staff', s);
  }
  function delStaff(id) { return DB.del('staff', id); }
  /* 停用的员工不给选 —— 需求：被禁用员工无法登录 */
  function listActiveStaff() {
    return listStaff().then(function (rows) {
      return rows.filter(function (s) { return s.active !== false; });
    });
  }

  /* ---------- 当前员工名 ---------- */
  function loadStaffName() {
    var id = staffIdNow();
    if (!id) { curStaffName = ''; return Promise.resolve(''); }
    return DB.get('staff', id).then(function (s) {
      curStaffName = s ? (s.name || '') : '';
      return curStaffName;
    }).catch(function () { curStaffName = ''; return ''; });
  }
  function operatorName() {
    return roleNow() === 'boss' ? '老板' : (curStaffName || '员工');
  }

  /* 当前员工若已被删除或停用，自动退回老板模式。
     不处理的话顶栏会一直挂着一个已经不存在的人，而且权限判断跟着错。 */
  function ensureValidRole() {
    if (roleNow() !== 'staff') return Promise.resolve();
    var id = staffIdNow();
    if (!id) return Promise.resolve();
    return DB.get('staff', id).then(function (s) {
      if (!s || s.active === false) applyRole('boss', null);
    }).catch(function () {});
  }

  /* 旧版把身份存在 IndexedDB 的 kv（值 '老板' / '员工'），新版挪到 localStorage。
     老用户升级后要接着用，所以发现 localStorage 没记录、库里有旧值时搬一次。
     旧系统没有具体员工，'员工' 落成「员工模式但没选人」，界面会提示选一个。 */
  function migrateOperator() {
    if (lsGet(LS_ROLE)) return Promise.resolve();
    return DB.get('kv', OPERATOR_KEY).then(function (r) {
      var old = r && r.role;
      if (!old) return;
      applyRole(old === '员工' || old === 'staff' ? 'staff' : 'boss', null);
    }).catch(function () {});
  }

  function switchBoss() { applyRole('boss', null); return Promise.resolve(); }
  function switchStaff(id) {
    return DB.get('staff', id).then(function (s) {
      if (!s) throw new Error('员工不存在');
      if (s.active === false) throw new Error('该员工已停用');
      applyRole('staff', id);
      curStaffName = s.name || '';
      return s;
    });
  }

  /* 旧 API：外部老代码还在用，保留语义（直接设置角色，不校验密码）。
     导入流程已不再调用它 —— 备份里的身份只存档，不用来改当前权限。 */
  function getOperator() { return Promise.resolve(operatorName()); }
  function setOperator(role) {
    if (role && typeof role === 'object') role = role.role;
    applyRole(role === '员工' || role === 'staff' ? 'staff' : 'boss', null);
    return Promise.resolve();
  }

  /* 单据上「操作员：xxx」取哪个名字：
     新订单有 operatorName；老订单只有一个 operator 字符串，照用（不去改老数据）；
     两个都没有才显示「未知」。 */
  function orderOperatorLabel(o) {
    if (!o) return '未知';
    if (o.operatorName) return String(o.operatorName);
    if (o.operator) return String(o.operator);
    return '未知';
  }

  /* 员工禁用的动作。没列出的（点餐 / 开台 / 结账 / 打印 / 今日订单 / PDF 导出）一律放行，
     这样以后加新页面，默认安全还是默认开放要想清楚再往这张表里加。 */
  var STAFF_BLOCKED = {
    menuEdit: true,      // 改菜品（含主食配置）与分类
    staffManage: true,   // 员工管理
    bossPassword: true,  // 改老板密码
    settings: true,      // 系统设置
    export: true,        // 导出 JSON 备份
    reset: true,         // 全部重置
    pdfDelete: true,     // 删 PDF 档案
    invEdit: true,       // 进出货：新增 / 修改 / 删除单据、改供应商档案
    invExport: true,     // 进出货：导出 Excel / PDF（员工只能看，不能带走数据）
    refund: true,        // 订单退款（涉及钱，员工一律不能碰）
    holdDelete: true,    // 删挂单（挂单还没收款，删了就是凭空少一单）
    viewAllHistory: true,// 看 7 天以前的订单 / 报表
    wipe: true           // 一键清空业务数据（老板专属，清订单/进出货/菜单/员工）
  };
  /* 说明：需求列的禁用项只有「改菜品 / 进员工管理 / 改系统设置 / 改老板密码」，
     另外补了导出备份、重置数据、删 PDF 档案三条（都在设置页，属于高危）。
     没有再额外限制翻历史订单 —— 要收紧的话往上面这张表加一行即可。 */
  function canOperator(action) {
    return roleNow() !== 'staff' || !STAFF_BLOCKED[action];
  }

  /* 启动时：先搬旧身份 → 校验当前员工仍然有效 → 把员工名读进内存 */
  var opBoot = migrateOperator()
    .then(ensureValidRole)
    .then(loadStaffName)
    .catch(function () {});

  G.App = {
    operator: {
      get: getOperator, set: setOperator, current: operatorName, can: canOperator,
      role: roleNow, staffId: staffIdNow, name: operatorName, labelOf: orderOperatorLabel,
      switchBoss: switchBoss, switchStaff: switchStaff,
      boot: function () { return opBoot; }, reloadName: loadStaffName, recheck: ensureValidRole,
      hasPassword: hasBossPassword, setPassword: setBossPassword, verifyPassword: verifyBossPassword,
      secureContext: cryptoOK
    },
    staff: { list: listStaff, active: listActiveStaff, get: getStaff, save: saveStaff, del: delStaff },
    cfg: { load: load, save: save, get: get, set: set, setRaw: setRaw,
           all: function () { if (!cfg) load(); return cfg; } },
    menu: { list: listMenu, get: getMenu, save: saveMenu, del: delMenu, assign: assignDishes },
    cats: {
      list: listCategories, listSubs: listSubCategories, listThirds: listThirdCategories,
      listFourths: listFourthCategories,
      save: saveCategory, saveSub: saveSubCategory, saveThird: saveThirdCategory,
      saveFourth: saveFourthCategory,
      del: delCategory, delSub: delSubCategory, delThird: delThirdCategory, delFourth: delFourthCategory,
      checkDelete: checkDelete, path: pathOf,
      ensureDefaults: ensureDefaultCategories, reindex: reindexDishes,
      deepestLevel: deepestLevel, ownDishes: ownDishes, ID_KEY: ID_KEY,
      DEFAULT_CAT: DEFAULT_CAT, DEFAULT_SUB: DEFAULT_SUB,
      DEFAULT_THIRD: DEFAULT_THIRD, DEFAULT_FOURTH: DEFAULT_FOURTH
    },
    addons: { list: listAddons, save: saveAddon, del: delAddon },
    orders: {
      list: listOrders, get: getOrder, save: saveOrder, del: delOrder, clearAll: clearAllOrders,
      refundedOf: refundedOf, netOf: netOf, isFullyRefunded: isFullyRefunded,
      refundedQtyOf: refundedQtyOf,
      dateWindow: orderDateWindow, dateMin: orderDateMin, STAFF_DAYS: STAFF_DAYS
    },
    ledger: { list: listLedger, listWith: listLedgerWithTurnover, turnover: turnoverRows,
              save: saveLedger, del: delLedger },
    photos: { save: savePhoto, get: getPhoto, del: delPhoto },
    pdf: { list: listPDFs, save: savePDF, get: getPDF, del: delPDF, clear: clearPDFs },
    carts: {
      get: getCart, save: saveCart, clear: clearCart, list: listCarts, clearAll: clearAllCarts,
      markPaid: markPaid,
      takeawayId: TAKEAWAY_SLOT, tableSlotId: tableSlotId, empty: emptyCart,
      acquireLock: acquireLock, releaseLock: releaseLock,
      touchLock: touchLock, peekLock: peekLock, lockedSlots: lockedSlots,
      clearAllLocks: clearAllLocks, purgeLocks: purgeLocks, sessionId: SESSION_ID

    seq: {
      nextDineIn: nextDineInNo, nextTakeaway: nextTakeawayNo,
      peekDI: peekDI, get: getCounters, set: setCounters,
      fmtDI: fmtDI, fmtTA: fmtTA

    io: { exportJSON: exportJSON, importJSON: importJSON },

/* 25-flow.js · 下单 / 结账 共用流程
   点餐页与结账页都走这里，保证单号生成、历史写入、购物车清空、打印行为一致。 */
(function (G) {
  'use strict';
  var U = G.U;

  /* 生成单号（堂食 DI / 外带 TA） */
  function nextOrderNo(kind) {
    return kind === 'takeaway' ? G.App.seq.nextTakeaway() : G.App.seq.nextDineIn();
  }

  /* 四舍五入到分：浮点相加会出现 12.300000000000001 这种值，落库前必须抹平 */
  function money(n) { return Math.round((+n || 0) * 100) / 100; }

  /* 购物车 → 历史订单记录（不落单号前不写库）
     应付 due 永远由菜品算出，实收 paid 只能用键盘输入，
     找零 change = paid - due，只做展示与存档，不允许反过来改总价。 */
  function buildOrder(cart, orderNo, payInfo) {
    var due = 0;
    (cart.items || []).forEach(function (l) { due += +l.subtotal || 0; });
    due = money(due);
    payInfo = payInfo || {};
    var paid = payInfo.paid == null || payInfo.paid === '' ? due : money(payInfo.paid);
    var change = payInfo.change == null ? money(paid - due) : money(payInfo.change);
    var now = new Date();
    return {
      orderNo: orderNo,
      kind: cart.kind || 'dinein',
      date: U.todayKey(now),
      createTime: now.toISOString(),
      table: cart.kind === 'takeaway' ? null : (cart.table || 0),
      pax: cart.kind === 'takeaway' ? 0 : (cart.pax || 1),
      payMethod: cart.payMethod || 'CASH',
      items: (cart.items || []).map(function (l) {
        return {
          menuId: l.menuId, name: l.name, specId: l.specId, specName: l.specName,
          unitPrice: l.unitPrice, qty: l.qty,
          addons: l.addons || [], excludes: l.excludes || [],
          // 主食快照：存下单当时的名称与加价，后台改配置不影响历史订单
          stapleName: l.stapleName || '', staplePriceAdd: +l.staplePriceAdd || 0,
          photoId: l.photoId || '', subtotal: l.subtotal
        };
      }),
      // 历史订单只存菜品快照，不存一/二/三级分类，改名或移动分组不影响旧单据
      total: due,
      due: due,
      paid: paid,
      change: change,
      // 操作员：新单同时存角色（boss / staff）与名字。
      // 老单只有 operator 一个字符串，读取时由 App.operator.labelOf 兜底，绝不回头改老数据。
      operator: (G.App.operator && G.App.operator.current) ? G.App.operator.current() : '老板',
      operatorRole: (G.App.operator && G.App.operator.role) ? G.App.operator.role() : 'boss',
      operatorName: (G.App.operator && G.App.operator.name) ? G.App.operator.name() : '老板',
      // 营业模式快照：存下单当时是早餐还是晚餐，不存引用。
      // 老板以后把「早餐」改名或删掉，这张单上的 history 仍然对得上。
      businessMode: (G.App.biz && G.App.biz.mode) ? G.App.biz.mode() : '',
      settled: true
    };
  }

  /* 收银键盘的纯输入规则：只吃数字与一个小数点，小数最多两位，总长封顶 9 位。
     抽成纯函数是为了能被冒烟测试直接调用（'00' 这类连按键也走同一套规则）。
     返回处理后的新字符串，不改动入参。 */
  function keypad(str, key) {
    str = String(str == null ? '' : str);
    if (key === 'back') return str.slice(0, -1);
    if (key === 'clear') return '';
    var chars = String(key).split('');
    for (var i = 0; i < chars.length; i++) {
      var k = chars[i];
      if (k === '.') {
        if (str.indexOf('.') >= 0) continue;
        str = str === '' ? '0.' : str + '.';
        continue;
      }
      if (k < '0' || k > '9') continue;
      var dotAt = str.indexOf('.');
      if (dotAt >= 0 && str.length - dotAt - 1 >= 2) continue;   // 分位封顶
      str = (str === '0') ? k : str + k;
      if (str.length > 9) str = str.slice(0, 9);
    }
    return str;
  }

  /* 确保购物车已分配单号（已分配则沿用，不重复消耗计数） */
  function ensureOrderNo(cart) {
    if (cart.orderNo) return Promise.resolve(cart.orderNo);
    return nextOrderNo(cart.kind).then(function (no) {
      cart.orderNo = no;
      return no;
    });
  }

  /* 结账：校验收款 → 取/生成单号 → 写历史 → 清空购物车 →（可选）打印
     opts.paid 为客户实际给的钱；缺则默认刚好付清（点餐页「下单收银」直接走的分支）。 */
  function checkout(cart, opts) {
    opts = opts || {};
    if (!cart || !cart.items || cart.items.length === 0) {
      return Promise.reject(new Error('购物车为空，无法结账'));
    }
    var due = 0;
    (cart.items || []).forEach(function (l) { due += +l.subtotal || 0; });
    due = money(due);
    var paid = (opts.paid == null || opts.paid === '') ? due : money(opts.paid);
    if (paid < due - 0.0001) {
      return Promise.reject(new Error('收款不足，金额不能小于应付 RM ' + U.formatMoneyPlain(due)));
    }
    var change = money(paid - due);
    return ensureOrderNo(cart).then(function (no) {
      var order = buildOrder(cart, no, { paid: paid, change: change });
      return G.App.orders.save(order).then(function () {
        // 台桌翻成「已结账绿」而不是直接删掉：删了台桌页就看不出这桌刚结过账，
        // 服务员会以为还能再开一次台。重置台桌时才真正清除。
        return G.App.carts.markPaid(cart.slotId, order, cart).then(function () { return order; });
      });
    }).then(function (order) {
      // 结账页自己控制打印时机；autoPrint 打开时才在这里自动出票
      if (opts.print !== false && G.App.cfg.get('autoPrint')) {
        return G.Print.print(order).then(function () { return order; },
                             function () { return order; });
      }
      return order;
    });
  }

  /* 挂单：生成单号（若还没有）→ 状态置 pending，购物车留在库里但不写历史订单。
     挂单没收到钱，所以绝不能进营业额 —— 营业额只由 orders 表拼出来，
     这里不写 orders，挂单就天然不计营收。 */
  function placeOrder(cart) {
    if (!cart || !cart.items || cart.items.length === 0) {
      return Promise.reject(new Error('购物车为空'));
    }
    return ensureOrderNo(cart).then(function (no) {
      cart.status = 'pending';
      cart.heldAt = new Date().toISOString();
      return G.App.carts.save(cart).then(function () { return no; });
    });
  }

  /* 所有挂单（pending 且车里有菜），按最近更新倒序 —— 台桌页的挂单列表走这里 */
  function holdList() {
    return G.App.carts.list().then(function (carts) {
      return (carts || []).filter(function (c) {
        return c.status === 'pending' && c.items && c.items.length > 0;
      }).sort(function (a, b) {
        return String(b.updatedAt || '').localeCompare(String(a.updatedAt || ''));
      });
    });
  }

  /* 删挂单：只有老板能删。挂单还没收款，删掉就是凭空少一单，所以单独立一条权限 */
  function dropHold(slotId) {
    if (!G.App.operator.can('holdDelete')) {
      return Promise.reject(new Error('员工模式不能删除挂单，请切换为老板'));
    }
    return G.App.carts.clear(slotId);
  }

  /* ---- 退款 ----
     退款不删单、不改写原单金额，只在订单上追加一条 refundRecord：
       原单金额 = 当时真实发生了什么
       退款记录 = 后来又发生了什么
     两件事都要留痕，营业额由 App.orders.netOf() 现算，删掉退款记录营收就自动回来。
     挂单不在 orders 表里，压根走不到这个函数 —— 挂单不可退是天然的。 */
  function refund(order, opts) {
    opts = opts || {};
    if (!G.App.operator.can('refund')) {
      return Promise.reject(new Error('员工模式不能退款，请切换为老板'));
    }
    if (!order || !order.id) return Promise.reject(new Error('订单不存在，无法退款'));

    var total = +order.total || 0;
    var remain = G.App.orders.netOf(order);          // 可退余额 = 原价 − 已退
    if (remain <= 0.0001) return Promise.reject(new Error('该单已全额退款'));

    var type = opts.type === 'partial' ? 'partial' : 'full';
    var items = (opts.items || []).filter(function (it) { return +it.qty > 0; });
    var amount = type === 'full' ? remain : money(+opts.amount || 0);

    if (type === 'partial') {
      if (!(amount > 0)) return Promise.reject(new Error('请填写退款金额'));
      if (items.length === 0) return Promise.reject(new Error('请选择要退的菜品'));
      if (amount > remain + 0.0001) {
        return Promise.reject(new Error('退款金额超出可退余额 RM ' + U.formatMoneyPlain(remain)));
      }
    }

    var rec = {
      id: U.uid(),
      type: type,
      amount: amount,
      reason: String(opts.reason || '').trim(),
      items: items.map(function (it) {
        return { key: it.key, name: it.name, specName: it.specName || '',
                 qty: +it.qty || 0, amount: money(+it.amount || 0) };
      }),
      time: new Date().toISOString(),
      operator: (G.App.operator && G.App.operator.current) ? G.App.operator.current() : '老板',
      operatorRole: (G.App.operator && G.App.operator.role) ? G.App.operator.role() : 'boss',
      operatorName: (G.App.operator && G.App.operator.name) ? G.App.operator.name() : '老板'
    };

    order.refundRecords = (order.refundRecords || []).concat([rec]);
    order.isRefund = true;
    // 整单退完是 full；部分退过钱但还有余额，就叫 partial
    order.refundType = G.App.orders.netOf(order) <= 0.0001 ? 'full' : 'partial';
    return G.App.orders.save(order).then(function () { return rec; });
  }

  /* 撤掉某一条退款记录（退错了要能反悔）。删掉后营业额自动回来，不用手工补账。 */
  function undoRefund(order, recId) {
    if (!G.App.operator.can('refund')) {
      return Promise.reject(new Error('员工模式不能操作退款，请切换为老板'));
    }
    var before = (order.refundRecords || []).length;
    order.refundRecords = (order.refundRecords || []).filter(function (r) { return r.id !== recId; });
    if (order.refundRecords.length === before) return Promise.reject(new Error('没找到该条退款记录'));
    order.isRefund = order.refundRecords.length > 0;
    order.refundType = order.isRefund
      ? (G.App.orders.netOf(order) <= 0.0001 ? 'full' : 'partial')
      : '';
    return G.App.orders.save(order).then(function () { return order; });
  }

  /* 订单里每一项还能退几份：总数 − 历次退款里已退掉的份数 */
  function refundableItems(order) {
    var out = [];
    (order.items || []).forEach(function (it, i) {
      var key = 'L' + i;   // 行号即 key，同名单品不同规格也各算各的
      var left = (+it.qty || 0) - G.App.orders.refundedQtyOf(order, key);
      if (left > 0) {
        out.push({
          key: key, name: it.name, specName: it.specName || '',
          unitPrice: +it.unitPrice || 0, subtotal: +it.subtotal || 0,
          qty: +it.qty || 0, left: left

      }

  }

     30 秒后锁就过期了，别的会话会以为这桌没人操作 → 边界规则 3 形同虚设。
     这里每 10 秒续一次期；离开本页（路由变化 / 关闭标签页）自动停表。

  function holdLock(slotId) {

    var timer = setInterval(function () { G.App.carts.touchLock(slotId); }, 10000);
    var stopped = false;
    function stop() {
      if (stopped) return;
      stopped = true;
      clearInterval(timer);
      window.removeEventListener('hashchange', stop);
      window.removeEventListener('pagehide', stop);
    }

    window.addEventListener('pagehide', stop);
    return stop;
  }

  function reprint(order) {
    return G.Print.print(order);
  }

  /* 显示用：桌号 / 外带 标签 */
  function slotLabel(order) {
    if (order.kind === 'takeaway') return '外带';
    return '桌 ' + (order.table || '-') + ' 号';
  }

  G.Flow = {
    keypad: keypad,
    nextOrderNo: nextOrderNo,
    ensureOrderNo: ensureOrderNo,
    buildOrder: buildOrder,
    checkout: checkout,
    placeOrder: placeOrder,
    holdList: holdList,
    dropHold: dropHold,
    refund: refund,
    undoRefund: undoRefund,
    refundableItems: refundableItems,
    reprint: reprint,
    slotLabel: slotLabel,
    holdLock: holdLock

/* 26-cats.js · 一 / 二 / 三 / 四级分类树：加载、渲染、排序、增删改、删除保护
   二级 / 三级 / 四级都是可选的：分类不必建满四层，
   菜挂到哪一级就以哪一级为准（只有最深层级决定它出现在哪个分组下）。
   菜单管理页的分类管理与点餐页的多层标签栏共用这里，
   保证「后台怎么排，前台就怎么显示」。 */
(function (G) {
  'use strict';
  var U = G.U;

  var KINDS = ['cat', 'sub', 'third', 'fourth'];
  var ID_KEY = { cat: 'categoryId', sub: 'subId', third: 'thirdId', fourth: 'fourthId' };
  var NODE_KEY = { cat: 'cat', sub: 'sub', third: 'third', fourth: 'fourth' };
  var CHILD_KEY = { cat: 'subs', sub: 'thirds', third: 'fourths' };
  var PARENT_FIELD = { sub: 'parentCategoryId', third: 'parentSubId', fourth: 'parentThirdId' };
  var LEVEL_NAME = { cat: '一级', sub: '二级', third: '三级', fourth: '四级' };
  var CHILD_NAME = { cat: '二级', sub: '三级', third: '四级' };

  /* 一次性拉出完整四层树 + 每个节点「直属」的菜品 */
  function loadTree() {
    return Promise.all([
      G.App.cats.list(), G.App.cats.listSubs(), G.App.cats.listThirds(),
      G.App.cats.listFourths(), G.App.menu.list()
    ]).then(function (r) {
      var cats = r[0], subs = r[1], ths = r[2], fs = r[3], menu = r[4] || [];
      var own = function (kind, id) { return G.App.cats.ownDishes(menu, kind, id); };
      return cats.map(function (c) {
        return {
          cat: c,
          dishes: own('cat', c.categoryId),
          subs: subs.filter(function (s) { return s.parentCategoryId === c.categoryId; })
            .map(function (s) {
              return {
                sub: s,
                dishes: own('sub', s.subId),
                thirds: ths.filter(function (t) { return t.parentSubId === s.subId; })
                  .map(function (t) {
                    return {
                      third: t,
                      dishes: own('third', t.thirdId),
                      fourths: fs.filter(function (f) { return f.parentThirdId === t.thirdId; })
                        .map(function (f) {
                          return { fourth: f, dishes: own('fourth', f.fourthId) };
                        })
                    };
                  })
              };
            })
        };
      });
    });
  }

  /* 点餐页的标签只展示「启用 + 下面确实有上架菜」的分支：
     停用的分类、整组菜品都下架的分支，整条隐藏，不留空标签。
     每个节点自己直属的菜也算一组 —— 没再往下细分时，菜就停在这一层。
     抽在这里而不是点餐页内部，是为了让冒烟测试能直接验证这套规则。 */
  function onSale(m) { return m.available !== false; }
  function hasSale(list) { return (list || []).some(onSale); }

  function prune(tree) {
    var out = [];
    (tree || []).forEach(function (c) {
      if (c.cat.isActive === false) return;
      var cDishes = (c.dishes || []).filter(onSale);
      var subs = [];
      (c.subs || []).forEach(function (s) {
        if (s.sub.isActive === false) return;
        var sDishes = (s.dishes || []).filter(onSale);
        var thirds = [];
        (s.thirds || []).forEach(function (t) {
          if (t.third.isActive === false) return;
          var tDishes = (t.dishes || []).filter(onSale);
          var fourths = (t.fourths || []).filter(function (f) {
            return f.fourth.isActive !== false && hasSale(f.dishes);
          });
          if (fourths.length || tDishes.length) {
            thirds.push({ third: t.third, dishes: tDishes, fourths: fourths });
          }
        });
        if (thirds.length || sDishes.length) subs.push({ sub: s.sub, dishes: sDishes, thirds: thirds });
      });
      if (subs.length || cDishes.length) out.push({ cat: c.cat, dishes: cDishes, subs: subs });
    });
    return out;
  }

  /* 拖拽排序落库：按传入顺序重写 sort（10、20、30…） */
  function persistOrder(list, saveFn) {
    var jobs = list.map(function (it, i) {
      it.sort = (i + 1) * 10;
      return saveFn(it);
    });
    return Promise.all(jobs);
  }

  var SAVE_FN = {
    cat: function (it) { return G.App.cats.save(it); },
    sub: function (it) { return G.App.cats.saveSub(it); },
    third: function (it) { return G.App.cats.saveThird(it); },
    fourth: function (it) { return G.App.cats.saveFourth(it); }
  };
  var DEL_FN = {
    cat: function (id) { return G.App.cats.del(id); },
    sub: function (id) { return G.App.cats.delSub(id); },
    third: function (id) { return G.App.cats.delThird(id); },
    fourth: function (id) { return G.App.cats.delFourth(id); }
  };

  /* 取同层兄弟（含自己），用于上移 / 下移 / 拖拽回写 */
  function siblingsOf(tree, kind, id) {
    if (kind === 'cat') return tree.map(function (x) { return x.cat; });
    var out = null;
    tree.forEach(function (c) {
      if (kind === 'sub' && c.subs.some(function (s) { return s.sub.subId === id; })) {
        out = c.subs.map(function (s) { return s.sub; });
      }
      (c.subs || []).forEach(function (s) {
        if (kind === 'third' && s.thirds.some(function (t) { return t.third.thirdId === id; })) {
          out = s.thirds.map(function (t) { return t.third; });
        }
        (s.thirds || []).forEach(function (t) {
          if (kind === 'fourth' && t.fourths.some(function (f) { return f.fourth.fourthId === id; })) {
            out = t.fourths.map(function (f) { return f.fourth; });
          }
        });
      });
    });
    return out;
  }

  /* 同级上移 / 下移（手机触摸端 HTML5 拖拽不好使，按钮是主力） */
  function move(kind, tree, id, dir) {
    var list = siblingsOf(tree, kind, id);
    if (!list || list.length < 2) return Promise.resolve(false);
    var i = list.findIndex(function (x) { return x[ID_KEY[kind]] === id; });
    var j = i + dir;
    if (i < 0 || j < 0 || j >= list.length) return Promise.resolve(false);
    var t = list[i]; list[i] = list[j]; list[j] = t;
    return persistOrder(list, SAVE_FN[kind]).then(function () { return true; });
  }

  /* 按 kind 取删除前检查函数与删除函数。
     四个层级都有删除入口，但下面还挂着东西时会被挡下，
     提示里写明要先处理的是哪一层、多少个。 */
  function tryDelete(kind, id, name) {
    return G.App.cats.checkDelete(kind, id).then(function (res) {
      if (!res.ok) {
        U.toast('无法删除「' + name + '」：' + res.why + '。', 'err');
        return false;
      }
      return U.confirm({
        title: '删除' + LEVEL_NAME[kind] + '分类？',
        message: '确定删除「' + name + '」？该操作不可撤销。',
        okText: '删除', danger: true
      }).then(function (ok) {
        if (!ok) return false;
        return DEL_FN[kind](id).then(function () { return true; });
      });
    });
  }

  /* 名称编辑弹窗 */
  function rename(kind, node) {
    return U.prompt({
      title: '重命名', label: '分类名称', value: node.name, placeholder: '例如：汤面'
    }).then(function (v) {
      if (v == null) return false;
      v = String(v).trim();
      if (!v) { U.toast('名称不能为空', 'err'); return false; }
      node.name = v;
      return SAVE_FN[kind](node).then(function () { return true; });
    });
  }

  /* 新增分类：一级无需父级；二级绑一级；三级绑二级；四级绑三级 */
  function create(kind, parent) {
    return U.prompt({
      title: '新增' + LEVEL_NAME[kind] + '分类',
      label: '名称',
      placeholder: kind === 'cat' ? '例如：面类' : (kind === 'sub' ? '例如：汤面' : (kind === 'third' ? '例如：细汤面' : '例如：微辣'))
    }).then(function (v) {
      if (v == null) return false;
      v = String(v).trim();
      if (!v) { U.toast('名称不能为空', 'err'); return false; }
      if (kind === 'cat') return G.App.cats.save({ name: v, isActive: true }).then(function () { return true; });
      var payload = { name: v, isActive: true };
      payload[PARENT_FIELD[kind]] = parent;
      return SAVE_FN[kind](payload).then(function () { return true; });
    });
  }

  function toggle(node, kind) {
    node.isActive = !node.isActive;
    return SAVE_FN[kind](node);
  }

  /* ------------------------------------------------------------
   * 渲染分类树（可编辑版，用于菜单管理页）
   * opts: { editable, onChanged, container }
   * ---------------------------------------------------------- */
  function renderTree(container, tree, opts) {
    opts = opts || {};
    container.innerHTML = '';
    if (!tree.length) {
      container.appendChild(U.el('div', { class: 'empty' }, [
        U.el('div', { class: 'em' }, '🗂️'),
        U.el('p', null, '还没有分类，先新增一个一级分类')
      ]));
      return;
    }
    tree.forEach(function (c, ci) {
      container.appendChild(row('cat', c.cat, 0, {
        count: countText(c),
        canAdd: true, addLabel: '+二级',
        up: ci > 0, down: ci < tree.length - 1
      }));
      (c.subs || []).forEach(function (s, si) {
        container.appendChild(row('sub', s.sub, 1, {
          count: countText(s),
          canAdd: true, addLabel: '+三级',
          up: si > 0, down: si < c.subs.length - 1
        }));
        (s.thirds || []).forEach(function (t, ti) {
          container.appendChild(row('third', t.third, 2, {
            count: countText(t),
            canAdd: true, addLabel: '+四级（可选）',
            up: ti > 0, down: ti < s.thirds.length - 1
          }));
          (t.fourths || []).forEach(function (f, fi) {
            container.appendChild(row('fourth', f.fourth, 3, {
              count: countText(f),
              canAdd: false,
              up: fi > 0, down: fi < t.fourths.length - 1
            }));
          });
        });
      });
    });

    /* 统计文案：下级数量 + 本层直属菜数 */
    function countText(node) {
      var parts = [];
      var kids = node.subs || node.thirds || node.fourths;
      if (kids) parts.push(kids.length + ' 个下级');
      var d = node.dishes || [];
      if (d.length) parts.push(d.length + ' 道菜');
      return parts.join(' · ') || '空';
    }

    function row(kind, node, level, cfg) {
      var id = node[ID_KEY[kind]];
      var r = U.el('div', { class: 'cat-row lv' + level + (node.isActive ? '' : ' off'), 'data-kind': kind, 'data-id': id });
      r.innerHTML =
        '<span class="cr-grip" title="拖动排序">⋮⋮</span>' +
        '<span class="cr-dot lv' + level + '"></span>' +
        '<span class="cr-lv">' + LEVEL_NAME[kind] + '</span>' +
        '<span class="cr-nm">' + U.escapeHTML(node.name) + '</span>' +
        (node.isActive ? '' : '<span class="tag">已停用</span>') +
        '<span class="cr-cnt">' + U.escapeHTML(cfg.count || '') + '</span>';
      var acts = U.el('div', { class: 'cr-acts' });
      if (opts.editable) {
        if (cfg.up) acts.appendChild(mini('↑', 'up', '上移'));
        if (cfg.down) acts.appendChild(mini('↓', 'down', '下移'));
        acts.appendChild(mini('改名', 'edit', '重命名'));
        acts.appendChild(mini(node.isActive ? '停用' : '启用', 'toggle', '点餐页显示 / 隐藏'));
        if (cfg.canAdd) acts.appendChild(mini(cfg.addLabel, 'add', '新增下级分类'));
        acts.appendChild(mini('删除', 'del', '删除' + LEVEL_NAME[kind] + '分类', true));
      } else {
        acts.appendChild(U.el('span', { class: 'cr-locked' }, '🔒 员工只读'));
      }
      r.appendChild(acts);
      if (opts.editable) r.setAttribute('draggable', 'true');
      return r;

      function mini(label, act, title, danger) {
        return U.el('button', { class: 'btn-mini' + (danger ? ' danger' : ''), 'data-act': act, title: title }, label);
      }
    }

    if (!opts.editable) return;

    /* 事件委托：整棵树只挂一份监听 */
    container.onclick = function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      var rowEl = e.target.closest('.cat-row');
      if (!rowEl) return;
      var kind = rowEl.getAttribute('data-kind');
      var id = rowEl.getAttribute('data-id');
      var node = findNode(tree, kind, id);
      if (!node) return;
      var act = b.getAttribute('data-act');

      if (act === 'up' || act === 'down') {
        move(kind, tree, id, act === 'up' ? -1 : 1).then(function (ok) { if (ok) opts.onChanged && opts.onChanged(); });
      } else if (act === 'edit') {
        rename(kind, node).then(function (ok) { if (ok) opts.onChanged && opts.onChanged(); });
      } else if (act === 'toggle') {
        toggle(node, kind).then(function () { opts.onChanged && opts.onChanged(); });
      } else if (act === 'add') {
        var childKind = kind === 'cat' ? 'sub' : (kind === 'sub' ? 'third' : 'fourth');
        create(childKind, id).then(function (ok) { if (ok) opts.onChanged && opts.onChanged(); });
      } else if (act === 'del') {
        tryDelete(kind, id, node.name).then(function (ok) { if (ok) opts.onChanged && opts.onChanged(); });
      }
    };

    /* HTML5 拖拽排序（桌面端）；同层级之间才允许换位置 */
    var dragRow = null;
    container.ondragstart = function (e) {
      var rowEl = e.target.closest('.cat-row');
      if (!rowEl) return;
      dragRow = rowEl;
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', rowEl.getAttribute('data-id')); } catch (err) {}
      rowEl.classList.add('dragging');
    };
    container.ondragover = function (e) {
      if (!dragRow) return;
      var over = e.target.closest('.cat-row');
      if (!over || over === dragRow) return;
      if (over.getAttribute('data-kind') !== dragRow.getAttribute('data-kind')) return;  // 跨层不允许
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      var box = over.getBoundingClientRect();
      var after = (e.clientY - box.top) > box.height / 2;
      container.insertBefore(dragRow, after ? over.nextSibling : over);
    };
    container.ondragend = function () {
      if (!dragRow) return;
      dragRow.classList.remove('dragging');
      var kind = dragRow.getAttribute('data-kind');
      var ids = U.qsa('.cat-row[data-kind="' + kind + '"]', container)
        .map(function (x) { return x.getAttribute('data-id'); });
      dragRow = null;
      commitDrag(kind, ids, tree).then(function (ok) { if (ok) opts.onChanged && opts.onChanged(); });
    };
  }

  /* 拖拽结束后：只把「同一父级下的同一层」按 DOM 新顺序写回 sort */
  function commitDrag(kind, ids, tree) {
    var jobs = [];
    if (kind === 'cat') {
      var list = ids.map(function (id) {
        return tree.filter(function (x) { return x.cat.categoryId === id; })[0];
      }).filter(Boolean).map(function (x) { return x.cat; });
      if (list.length === tree.length && list.length > 1) jobs.push(persistOrder(list, SAVE_FN.cat));
    } else if (kind === 'sub') {
      tree.forEach(function (c) {
        var own = ids.map(function (id) {
          return c.subs.filter(function (s) { return s.sub.subId === id; })[0];
        }).filter(Boolean).map(function (x) { return x.sub; });
        if (own.length === c.subs.length && own.length > 1) jobs.push(persistOrder(own, SAVE_FN.sub));
      });
    } else if (kind === 'third') {
      tree.forEach(function (c) {
        c.subs.forEach(function (s) {
          var own = ids.map(function (id) {
            return s.thirds.filter(function (t) { return t.third.thirdId === id; })[0];
          }).filter(Boolean).map(function (x) { return x.third; });
          if (own.length === s.thirds.length && own.length > 1) jobs.push(persistOrder(own, SAVE_FN.third));
        });
      });
    } else {
      tree.forEach(function (c) {
        c.subs.forEach(function (s) {
          s.thirds.forEach(function (t) {
            var own = ids.map(function (id) {
              return t.fourths.filter(function (f) { return f.fourth.fourthId === id; })[0];
            }).filter(Boolean).map(function (x) { return x.fourth; });
            if (own.length === t.fourths.length && own.length > 1) jobs.push(persistOrder(own, SAVE_FN.fourth));
          });
        });
      });
    }
    if (!jobs.length) return Promise.resolve(false);
    return Promise.all(jobs).then(function () { return true; });
  }

  function findNode(tree, kind, id) {
    var out = null;
    tree.forEach(function (c) {
      if (kind === 'cat' && c.cat.categoryId === id) out = c.cat;
      (c.subs || []).forEach(function (s) {
        if (kind === 'sub' && s.sub.subId === id) out = s.sub;
        (s.thirds || []).forEach(function (t) {
          if (kind === 'third' && t.third.thirdId === id) out = t.third;
          (t.fourths || []).forEach(function (f) {
            if (kind === 'fourth' && f.fourth.fourthId === id) out = f.fourth;
          });
        });
      });
    });
    return out;
  }

  G.Cats = {
    loadTree: loadTree,
    prune: prune,
    onSale: onSale,
    renderTree: renderTree,
    create: create,
    rename: rename,
    tryDelete: tryDelete,
    move: move,
    siblingsOf: siblingsOf,
    findNode: findNode,
    KINDS: KINDS,
    ID_KEY: ID_KEY,
    LEVEL_NAME: LEVEL_NAME,
    CHILD_NAME: CHILD_NAME
  };
})(window);

/* 27-paycalc.js · 收款计算器（共用组件）
   应付 / 实收 / 找零 + 快捷金额 + 数字键盘，一个组件两处用：
     · 结账页（68）把它内嵌在页面卡片里
     · 点餐页（61）点「收款」时把它装进弹窗
   两边共用同一套录入规则（走 Flow.keypad），不会出现"这里能按三位小数、那里只能两位"的分歧。
   应付只能由菜品算出，这里改不了。 */
(function (G) {
  'use strict';
  var U = G.U;

  function money(n) { return Math.round((+n || 0) * 100) / 100; }

  /* 只有现金需要点钞算找零。Bank / Tng / Boost / Shopee / Grab 这类电子支付，
     客人付的就是账单上那个数，再让收银员敲一遍实收纯属多余 ——
     所以电子支付默认「实收 = 应付」，打开就能直接确认，想抹零再手改。 */
  function needsCounting(m) { return (m || 'CASH') === 'CASH'; }

  /* 末行让 0 与 . 各占两格，手指更容易点中 */
  var KEYS = [
    ['7', '8', '9', 'back'],
    ['4', '5', '6', 'clear'],
    ['1', '2', '3', '00'],
    [['0', 2], ['.', 2]]
  ];

  /* opts: { due: number, payMethod: 'CASH'|'Bank'|…, onChange: function(state) }
     state = { due, paid, change, paidStr, insufficient, payMethod, autoFilled }
     返回 { el, state, paint, setDue, setPayMethod, pushKey, paid, change, insufficient, reset }

     autoFilled：当前实收是不是「按应付自动填的」。是的话切支付方式、改应付都会跟着重填；
     收银员一旦敲了键盘就变成手输值，不再被覆盖 —— 免得他抹完零又被冲掉。 */
  function create(opts) {
    opts = opts || {};
    var due = money(opts.due || 0);
    var st = { paidStr: '' };
    var payMethod = opts.payMethod || 'CASH';
    var autoFilled = false;

    var el = U.el('div', { class: 'pc-body' });
    el.innerHTML =
      '<div class="co-rows">' +
        '<div class="co-row"><span class="k">应付</span><span class="v" data-f="due">RM 0.00</span></div>' +
        '<div class="co-row"><span class="k">实收</span><span class="v big" data-f="paid">RM 0.00</span></div>' +
        '<div class="co-row change" data-f="chgrow"><span class="k">找零</span><span class="v big" data-f="change">RM 0.00</span></div>' +
      '</div>' +
      '<div class="co-auto" data-f="autotag" style="display:none;">已按应付自动填入，可直接确认；要抹零就手输</div>' +
      '<div class="co-err" data-f="err" style="display:none;">收款不足，金额不能小于应付</div>' +
      '<div class="co-quick" data-f="quick"></div>' +
      '<div class="co-keypad" data-f="keypad"></div>';

    function q(f) { return el.querySelector('[data-f="' + f + '"]'); }

    var api = {
      el: el,
      state: st,
      due: function () { return due; },
      paid: function () { return st.paidStr === '' ? 0 : money(parseFloat(st.paidStr)); },
      change: function () { return money(api.paid() - due); },
      insufficient: function () { return st.paidStr !== '' && api.paid() < due - 0.0001; },
      setDue: function (v) {
        due = money(v || 0);
        // 自动填的那份要跟着应付走（电子支付下加菜了，实收也该跟着涨）
        if (autoFilled) fillAuto();
        paint();
      },
      /* 切支付方式：电子支付自动按应付填好，切回现金则把自动值撤掉重新点钞。
         手输的值一概不动，只撤自动值。 */
      setPayMethod: function (v) {
        payMethod = v || 'CASH';
        if (needsCounting(payMethod)) { if (autoFilled) clearAuto(); }
        else if (autoFilled || st.paidStr === '') fillAuto();
        paint();
      },
      payMethod: function () { return payMethod; },
      needsCounting: function () { return needsCounting(payMethod); },
      isAuto: function () { return autoFilled; },
      pushKey: function (k) { st.paidStr = G.Flow.keypad(st.paidStr, k); autoFilled = false; paint(); },
      reset: function () { st.paidStr = ''; autoFilled = false; paint(); },
      paint: paint
    };

    function fillAuto() { st.paidStr = String(due); autoFilled = true; }
    function clearAuto() { st.paidStr = ''; autoFilled = false; }

    /* 只改文本和状态类，不重建键盘 —— 按数字时不会因为重绘而丢焦点 */
    function paint() {
      var paid = api.paid(), chg = api.change(), bad = api.insufficient();
      q('due').textContent = 'RM ' + U.formatMoneyPlain(due);
      q('paid').textContent = 'RM ' + U.formatMoneyPlain(paid);
      // 还没录实收时别显示负数找零（看着像少收钱）
      q('change').textContent = 'RM ' + U.formatMoneyPlain(st.paidStr === '' ? 0 : chg);
      q('chgrow').classList.toggle('over', chg > 0.0001);
      q('err').style.display = bad ? 'block' : 'none';
      // 电子支付下实收是自动填的，标一句出来，免得收银员以为自己已经收过钱
      q('autotag').style.display = autoFilled ? 'block' : 'none';
      if (opts.onChange) {
        opts.onChange({ due: due, paid: paid, change: chg, paidStr: st.paidStr,
                        insufficient: bad, payMethod: payMethod, autoFilled: autoFilled });
      }
    }

    /* 快捷金额：一键填够。+5 / +10 也可能不够付，取 max 兜底 */
    var quick = q('quick');
    [['应付', due], ['+5', due + 5], ['+10', due + 10], ['50', 50], ['100', 100]].forEach(function (item) {
      var b = U.el('button', { class: 'chip' }, item[0]);
      b.addEventListener('click', function () {
        st.paidStr = String(money(Math.max(item[1], due)));
        autoFilled = false;      // 快捷金额也是收银员主动点的，算手输值
        paint();
      });
      quick.appendChild(b);
    });

    var kp = q('keypad');
    KEYS.forEach(function (row) {
      row.forEach(function (cell) {
        var key = Array.isArray(cell) ? cell[0] : cell;
        var span = Array.isArray(cell) ? cell[1] : 1;
        var label = key === 'back' ? '⌫' : (key === 'clear' ? 'C' : key);
        var b = U.el('button', {
          class: 'co-key' + (key === 'back' || key === 'clear' ? ' fn' : ''),
          'data-key': key
        }, label);
        if (span > 1) b.style.gridColumn = 'span ' + span;
        kp.appendChild(b);
      });
    });
    kp.addEventListener('click', function (e) {
      var b = e.target.closest('[data-key]');
      if (!b) return;
      api.pushKey(b.getAttribute('data-key'));
    });

    // 电子支付一进来就填好实收，收银员点确认就能走
    if (!needsCounting(payMethod) && st.paidStr === '') fillAuto();
    paint();
    return api;
  }

  /* 弹窗版：点餐页点「收款」时用。确认后 resolve({paid, change})，取消 resolve(null) */
  function prompt(o) {
    o = o || {};
    return new Promise(function (resolve) {
      var okBtn = null, settled = false;
      var calc = create({
        due: o.due,
        payMethod: o.payMethod,
        onChange: function (s) { if (okBtn) okBtn.disabled = s.insufficient; }
      });

      var host = U.el('div', { class: 'co-pay' });
      host.appendChild(calc.el);

      var html =
        '<div class="modal-mask"><div class="modal" style="max-width:420px;">' +
          '<div class="modal-head"><h3>' + U.escapeHTML(o.title || '收款') + '</h3>' +
            '<button class="icon-btn" data-act="x" aria-label="关闭">' +
              '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>' +
            '</button></div>' +
          '<div class="modal-body">' +
            (o.subtitle ? '<div class="pc-sub">' + U.escapeHTML(o.subtitle) + '</div>' : '') +
            '<div data-slot="calc"></div>' +
          '</div>' +
          '<div class="modal-foot">' +
            '<button class="btn btn-gray" data-act="cancel">取消</button>' +
            '<button class="btn" data-act="ok">' + U.escapeHTML(o.okText || '确认收款') + '</button>' +
          '</div>' +
        '</div></div>';
      var m = U.openModal(html);
      m.querySelector('[data-slot="calc"]').appendChild(host);
      okBtn = m.querySelector('[data-act="ok"]');

      function done(v) {
        if (settled) return;
        settled = true;
        U.closeAllModals();
        resolve(v);
      }

      m.addEventListener('click', function (e) {
        if (e.target === m || e.target.closest('[data-act="cancel"]') || e.target.closest('[data-act="x"]')) {
          done(null);
          return;
        }
        if (!e.target.closest('[data-act="ok"]')) return;
        // 只有现金会走到这里：电子支付一打开就已经按应付填好了
        if (calc.state.paidStr === '') { U.toast('请先输入实收金额', 'err'); return; }
        if (calc.insufficient()) {
          U.toast('收款不足，金额不能小于应付 RM ' + U.formatMoneyPlain(calc.due()), 'err');
          return;
        }
        done({ paid: calc.paid(), change: calc.change() });
      });
    });
  }

  G.PayCalc = { create: create, prompt: prompt, KEYS: KEYS, needsCounting: needsCounting };
})(window);

/* 28-xlsx.js · 自写 XLSX 生成器（零依赖）
   为什么不用 SheetJS：这个 PWA 是纯前端离线单文件，不能引 CDN，
   打包 SheetJS 又要多出几百 KB。这里手写一个够用的最小 xlsx：
     · ZIP 容器（stored，不压缩）+ CRC32
     · sheet XML（数字用 <v>，文字用 inlineStr，省掉 sharedStrings）
     · 表头加粗、可冻结首行、可设列宽、可整格标黄
   用法：
     G.XLSX.download('库存.xlsx', [
       { name: '库存汇总', cols: [18, 10, 10], rows: [
           ['货品名', '单位', '当前库存'],
           ['白菜', '公斤 Kg', 3]
       ] }
     ]);
   单元格可以是裸值（string / number / null），
   也可以是 { v: 值, s: 样式号 }；样式号：1 = 表头加粗，2 = 加粗+黄底 */
(function (G) {
  'use strict';

  /* ---------- CRC32 ---------- */
  var CRC_TABLE = (function () {
    var t = new Uint32Array(256), n, k, c;
    for (n = 0; n < 256; n++) {
      c = n;
      for (k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(buf) {
    var c = 0xFFFFFFFF, i;
    for (i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  /* ---------- UTF-8（不依赖 TextEncoder，file:// 下也稳） ---------- */
  function utf8(str) {
    var out = [], i, c, c2, cp;
    for (i = 0; i < str.length; i++) {
      c = str.charCodeAt(i);
      if (c < 0x80) {
        out.push(c);
      } else if (c < 0x800) {
        out.push(0xC0 | (c >> 6), 0x80 | (c & 0x3F));
      } else if (c >= 0xD800 && c <= 0xDBFF && i + 1 < str.length) {
        c2 = str.charCodeAt(i + 1);
        cp = 0x10000 + ((c - 0xD800) << 10) + (c2 - 0xDC00);
        i++;
        out.push(0xF0 | (cp >> 18), 0x80 | ((cp >> 12) & 0x3F),
                 0x80 | ((cp >> 6) & 0x3F), 0x80 | (cp & 0x3F));
      } else {
        out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 0x3F), 0x80 | (c & 0x3F));

  var DOS_TIME = 0;                      // 00:00:00
  var DOS_DATE = 0x21;                   // 1980-01-01
