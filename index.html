<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FF7A00">
<meta name="description" content="离线点餐收银工作台">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="YH POS SYS">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="YH POS SYS">
<title>YH POS SYS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* ==========================================================================
   点餐收银离线 PWA · 全局样式
   风格：白色背景 + 橘色栏目 + 轻毛玻璃
   字体：仅系统自带字体，无任何网络字体 / 外部资源
   ========================================================================== */

/* ---------- 设计令牌 ---------- */
:root{
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC",
               "Noto Sans CJK SC", "WenQuanYi Micro Hei", sans-serif;

  --bg:#F8F9FA;
  --bg-plain:#FFFFFF;
  --surface:rgba(255,255,255,.85);
  --surface-solid:#FFFFFF;
  --surface-strong:rgba(255,255,255,.92);
  --surface-soft:rgba(255,255,255,.6);

  --primary:#FF7A00;
  --primary-hi:#E66A00;
  --primary-soft:rgba(255,122,0,.10);
  --primary-soft-2:rgba(255,122,0,.18);
  --grad:linear-gradient(135deg,#FF8A00 0%,#FF6A00 100%);

  --text:#1F2937;
  --muted:#6B7280;
  --faint:#9CA3AF;
  --border:#E5E7EB;

  --ok:#0F9D58;
  --warn:#EA580C;
  --danger:#DC2626;
  --danger-soft:#FEF2F2;
  --danger-line:#FECACA;

  --r-sm:10px;
  --r-md:14px;
  --r-lg:16px;
  --r-xl:20px;
  --shadow:0 4px 12px rgba(0,0,0,.08);
  --shadow-up:0 -4px 16px rgba(0,0,0,.12);
  --shadow-lg:0 10px 30px rgba(0,0,0,.16);
  --blur:blur(10px);

  --topbar-h:60px;
  --tabbar-h:62px;
  --side-w:236px;

  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);

  --clock-size:17px;
}

/* ---------- 换肤主题（暖色 / 中性，禁止紫蓝绿） ---------- */
[data-theme="caramel"]{
  --primary:#B45309; --primary-hi:#92400E;
  --primary-soft:rgba(180,83,9,.10); --primary-soft-2:rgba(180,83,9,.18);
  --grad:linear-gradient(135deg,#C2701B 0%,#9A4A0B 100%);
  --warn:#B45309;
}
[data-theme="cinnabar"]{
  --primary:#E23D28; --primary-hi:#B91C1C;
  --primary-soft:rgba(226,61,40,.10); --primary-soft-2:rgba(226,61,40,.18);
  --grad:linear-gradient(135deg,#EF5A3E 0%,#C62D1A 100%);
  --warn:#E23D28;
}
[data-theme="graphite"]{
  --primary:#4B5563; --primary-hi:#374151;
  --primary-soft:rgba(75,85,99,.10); --primary-soft-2:rgba(75,85,99,.18);
  --grad:linear-gradient(135deg,#5B6675 0%,#3A4351 100%);
  --warn:#57534E;
}
/* 大字号主题（无障碍） */
[data-fontscale="large"]{ font-size:17px; }
[data-fontscale="xlarge"]{ font-size:19px; }

/* ---------- 基础重置 ---------- */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; padding:0;
  font-family:var(--font-sans);
  font-size:16px; line-height:1.5;
  color:var(--text);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
button{ cursor:pointer; border:none; background:none; padding:0; }
input,select,textarea{ outline:none; }
ul,ol{ margin:0; padding:0; list-style:none; }
h1,h2,h3,h4,p{ margin:0; }
img{ display:block; max-width:100%; }
svg{ display:block; }
[hidden]{ display:none !important; }

::-webkit-scrollbar{ width:6px; height:6px; }
::-webkit-scrollbar-thumb{ background:rgba(0,0,0,.16); border-radius:99px; }
::-webkit-scrollbar-track{ background:transparent; }

/* ==========================================================================
   布局骨架
   ========================================================================== */
#app-shell{
  position:relative;
  min-height:100dvh;
  display:flex; flex-direction:column;
  background:
    radial-gradient(900px 420px at 110% -8%, var(--primary-soft) 0%, transparent 62%),
    radial-gradient(700px 380px at -10% 4%, rgba(255,138,0,.06) 0%, transparent 60%),
    var(--bg);
}

/* ---------- 顶部橘色栏目 ---------- */
#topbar{
  position:sticky; top:0; z-index:60;
  padding-top:var(--safe-t);
  background:var(--grad);
  box-shadow:0 2px 12px rgba(255,106,0,.24);
  flex:0 0 auto;
}
.topbar-inner{
  height:var(--topbar-h);
  padding:0 12px;
  display:flex; align-items:center; gap:10px;
  color:#fff;
}
.topbar-inner .icon-btn{ color:#fff; }
.topbar-clock{
  flex:1 1 auto; min-width:0; text-align:center;
  color:#fff; line-height:1.15;
  text-shadow:0 1px 2px rgba(0,0,0,.12);
}
.clock-time{
  font-size:var(--clock-size);
  font-weight:700;
  font-variant-numeric:tabular-nums;
  letter-spacing:.4px;
}
.clock-sub{
  font-size:calc(var(--clock-size) - 6px);
  opacity:.92; font-weight:500;
}
.clock-sub .dot{ margin:0 5px; opacity:.7; }
.topbar-right{ display:flex; align-items:center; gap:6px; justify-content:flex-end; min-width:44px; }
.pill-status{
  font-size:11px; font-weight:600; padding:3px 8px; border-radius:99px;
  background:rgba(255,255,255,.22);
  -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
  white-space:nowrap;
}

/* ---------- 主内容 ---------- */
#main{
  flex:1 1 auto; min-height:0;
  position:relative;
  display:flex; flex-direction:column;
}
#view-root{ flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
.page{
  flex:1 1 auto; min-height:0;
  display:flex; flex-direction:column;
  padding:12px 12px calc(10px + var(--tabbar-h) + var(--safe-b));
  padding-left:calc(12px + var(--safe-l));
  padding-right:calc(12px + var(--safe-r));
}
.page-scroll{ overflow-y:auto; -webkit-overflow-scrolling:touch; }
.page-title{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin-bottom:12px; flex:0 0 auto;
}
.page-title h1{ font-size:20px; font-weight:800; letter-spacing:.3px; }
.page-title .sub{ font-size:12px; color:var(--muted); margin-top:2px; }

/* ---------- 底部 Tab（手机） ---------- */
#tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  display:flex;
  padding-bottom:var(--safe-b);
  background:var(--surface-strong);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
  box-shadow:var(--shadow-up);
}
#tabbar .tab{
  flex:1 1 0; min-width:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  height:var(--tabbar-h);
  color:var(--muted); font-size:11px; font-weight:600;
}
#tabbar .tab svg{ width:22px; height:22px; }
#tabbar .tab.active{ color:var(--primary); }
#tabbar .tab.active svg{ transform:translateY(-1px); }

/* ---------- 侧边导航 ---------- */
#sidenav{
  position:fixed; top:0; left:0; bottom:0; z-index:80;
  width:var(--side-w);
  padding:calc(var(--safe-t) + 14px) 12px calc(14px + var(--safe-b));
  padding-left:calc(12px + var(--safe-l));
  background:var(--grad);
  color:#fff;
  display:flex; flex-direction:column;
  transform:translateX(-100%);
  transition:transform .26s cubic-bezier(.4,0,.2,1);
  box-shadow:var(--shadow-lg);
  overflow-y:auto;
}
#sidenav.open{ transform:translateX(0); }
.sidenav-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:16px; }
.brand{ display:flex; align-items:center; gap:10px; }
.brand-logo{
  width:40px;height:40px;border-radius:12px;flex:0 0 auto;
  background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:19px;
  -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
}
.brand-text b{ display:block; font-size:15px; font-weight:800; }
.brand-text small{ display:block; font-size:11px; opacity:.85; }
.nav-list{ flex:1 1 auto; display:flex; flex-direction:column; gap:4px; }
.nav-list li a,.nav-list li button{
  display:flex; align-items:center; gap:10px;
  width:100%; text-align:left;
  padding:12px 12px; border-radius:12px;
  color:#fff; font-size:14px; font-weight:600;
  transition:background .18s;
}
.nav-list li svg{ width:20px;height:20px;flex:0 0 auto; opacity:.95; }
.nav-list li a:hover,.nav-list li button:hover{ background:rgba(255,255,255,.14); }
.nav-list li .active{ background:rgba(255,255,255,.24); box-shadow:inset 0 0 0 1px rgba(255,255,255,.28); }
.sidenav-foot{ padding-top:12px; border-top:1px solid rgba(255,255,255,.22); }
#nav-backdrop{
  position:fixed; inset:0; z-index:70;
  background:rgba(17,24,39,.42);
  opacity:0; pointer-events:none; transition:opacity .26s;
}
#nav-backdrop.show{ opacity:1; pointer-events:auto; }

/* ==========================================================================
   通用组件
   ========================================================================== */
.card{
  background:var(--surface);
  -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
  border:1px solid rgba(255,255,255,.6);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow);
  padding:14px;
  margin-bottom:12px;
}
.card.tight{ padding:12px; }
.card-title{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  font-size:14px; font-weight:800; margin-bottom:10px;
}
.card-title .hint{ font-size:12px; font-weight:500; color:var(--muted); }

/* 橘色栏目 */
.bar-orange{
  background:var(--grad);
  color:#fff;
  border-radius:var(--r-lg);
  padding:12px 14px;
  box-shadow:0 6px 16px rgba(255,106,0,.20);
}
.bar-orange .lbl{ font-size:12px; opacity:.9; font-weight:600; }
.bar-orange .val{ font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:.5px; }

/* 按钮 */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:48px; padding:0 16px;
  border-radius:12px;
  font-size:15px; font-weight:700;
  background:var(--primary); color:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.10);
  transition:transform .12s, background .18s, box-shadow .18s;
  white-space:nowrap;
}
.btn:active{ transform:scale(.975); }
.btn:hover{ background:var(--primary-hi); }
.btn svg{ width:18px;height:18px; }
.btn-block{ width:100%; }
.btn-ghost{
  background:var(--surface-solid); color:var(--primary);
  border:1.5px solid var(--primary);
  box-shadow:none;
}
.btn-ghost:hover{ background:var(--primary-soft); }
.btn-soft{
  background:var(--primary-soft); color:var(--primary-hi);
  box-shadow:none;
}
.btn-soft:hover{ background:var(--primary-soft-2); }
.btn-danger{
  background:var(--danger-soft); color:var(--danger);
  border:1px solid var(--danger-line); box-shadow:none;
}
.btn-danger:hover{ background:#FEE2E2; }
.btn-gray{
  background:#F3F4F6; color:var(--text); box-shadow:none;
}
.btn-gray:hover{ background:#E5E7EB; }
.btn-ghost-light{
  min-height:44px; width:100%;
  background:rgba(255,255,255,.18); color:#fff;
  border:1px solid rgba(255,255,255,.32); box-shadow:none;
  font-weight:600;
}
.btn-ghost-light:hover{ background:rgba(255,255,255,.28); }
.btn-sm{ min-height:38px; padding:0 12px; font-size:13px; border-radius:10px; }
.btn:disabled{ opacity:.5; pointer-events:none; }

.icon-btn{
  width:40px;height:40px;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:11px; color:var(--text);
  transition:background .18s;
}
.icon-btn:hover{ background:rgba(0,0,0,.06); }
.icon-btn.light:hover{ background:rgba(255,255,255,.18); }

/* 表单 */
.field{ margin-bottom:12px; }
.field > label{
  display:block; font-size:13px; font-weight:700; color:var(--muted);
  margin-bottom:6px;
}
.input,.select,.textarea{
  width:100%; min-height:48px;
  padding:10px 12px;
  background:var(--surface-solid);
  border:1.5px solid var(--border);
  border-radius:12px;
  font-size:15px;
  transition:border-color .18s, box-shadow .18s;
}
.textarea{ min-height:84px; resize:vertical; line-height:1.5; }
.input:focus,.select:focus,.textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-soft);
}
.select{
  appearance:none; -webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
                   linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 21px, calc(100% - 12px) 21px;
  background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;
  padding-right:34px;
}
.input-money{ font-variant-numeric:tabular-nums; font-weight:700; }

/* 分段控件 */
.seg{
  display:flex; gap:6px; padding:4px;
  background:#F3F4F6; border-radius:12px;
}
.seg button{
  flex:1 1 0; min-height:38px; border-radius:9px;
  font-size:14px; font-weight:700; color:var(--muted);
  transition:all .18s;
}
.seg button.active{
  background:var(--surface-solid); color:var(--primary);
  box-shadow:0 2px 6px rgba(0,0,0,.10);
}

/* 开关 */
.switch{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; }
.switch .sw-label{ font-size:14px; font-weight:700; }
.switch .sw-desc{ font-size:12px; color:var(--muted); margin-top:2px; }
.sw-track{
  flex:0 0 auto; width:52px;height:31px;border-radius:99px;
  background:#D1D5DB; position:relative; transition:background .2s;
}
.sw-track::after{
  content:""; position:absolute; top:3px; left:3px;
  width:25px;height:25px;border-radius:50%;
  background:#fff; box-shadow:0 2px 5px rgba(0,0,0,.22);
  transition:transform .2s;
}
.switch.on .sw-track{ background:var(--primary); }
.switch.on .sw-track::after{ transform:translateX(21px); }

/* 徽标 / 标签 */
.tag{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;border-radius:99px;
  font-size:11px;font-weight:700;
  background:var(--primary-soft); color:var(--primary-hi);
}
.tag.gray{ background:#F3F4F6; color:var(--muted); }
.tag.ok{ background:#ECFDF5; color:var(--ok); }
.tag.warn{ background:#FFF7ED; color:var(--warn); }
.tag.danger{ background:var(--danger-soft); color:var(--danger); }

/* 统计网格 */
.stat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:12px; }
.stat{
  background:var(--surface);
  -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
  border:1px solid rgba(255,255,255,.6);
  border-radius:var(--r-md);
  box-shadow:var(--shadow);
  padding:12px;
}
.stat .k{ font-size:12px; color:var(--muted); font-weight:600; }
.stat .v{ font-size:21px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:3px; }

/* 列表行 */
.row{
  display:flex; align-items:center; gap:10px;
  padding:11px 0; border-bottom:1px solid var(--border);
}
.row:last-child{ border-bottom:none; }
.row .grow{ flex:1 1 auto; min-width:0; }
.row .t{ font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .s{ font-size:12px; color:var(--muted); margin-top:2px; }
.row .amt{ font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
.amount-in{ color:var(--ok); }
.amount-out{ color:var(--danger); }

.empty{
  text-align:center; padding:34px 16px; color:var(--faint);
}
.empty .em{ font-size:34px; margin-bottom:8px; opacity:.55; }
.empty p{ font-size:14px; }

/* 弹窗 */
#modal-root{ position:fixed; inset:0; z-index:100; pointer-events:none; }
.modal-mask{
  position:absolute; inset:0;
  background:rgba(17,24,39,.46);
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
  display:flex; align-items:flex-end; justify-content:center;
  pointer-events:auto;
  animation:fadeIn .18s ease;
}
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
@keyframes slideUp{ from{transform:translateY(24px);opacity:.4} to{transform:translateY(0);opacity:1} }
.modal{
  width:100%; max-width:520px;
  max-height:min(88dvh, 900px);
  display:flex; flex-direction:column;
  background:var(--surface-solid);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  box-shadow:var(--shadow-lg);
  animation:slideUp .24s cubic-bezier(.4,0,.2,1);
  margin-bottom:0;
}
.modal-head{
  flex:0 0 auto;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:16px 16px 12px;
  border-bottom:1px solid var(--border);
}
.modal-head h3{ font-size:17px; font-weight:800; }
.modal-body{ flex:1 1 auto; overflow-y:auto; padding:14px 16px; -webkit-overflow-scrolling:touch; }
.modal-foot{
  flex:0 0 auto; display:flex; gap:10px;
  padding:12px 16px calc(12px + var(--safe-b));
  border-top:1px solid var(--border);
  background:var(--surface-solid);
  border-radius:0 0 var(--r-xl) var(--r-xl);
}
.modal-foot .btn{ flex:1 1 0; }

/* Toast */
#toast-root{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(var(--tabbar-h) + var(--safe-b) + 18px);
  z-index:200; display:flex; flex-direction:column; gap:8px;
  align-items:center; pointer-events:none; width:max-content; max-width:88vw;
}
.toast{
  background:rgba(31,41,55,.94); color:#fff;
  padding:10px 16px; border-radius:12px;
  font-size:14px; font-weight:600;
  box-shadow:var(--shadow-lg);
  animation:toastIn .22s ease;
}
.toast.ok{ background:rgba(15,157,88,.95); }
.toast.err{ background:rgba(220,38,38,.95); }
@keyframes toastIn{ from{transform:translateY(10px);opacity:0} to{transform:translateY(0);opacity:1} }

/* ==========================================================================
   点餐页（手机竖屏：上 2/3 菜品滚动区 + 下 1/3 固定结算面板）
   ========================================================================== */
.order-body{
  flex:1 1 auto; min-height:0;
  display:flex; flex-direction:column;
  overflow:hidden;
}
.order-dishes{
  flex:2 1 0; min-height:0;
  display:flex; flex-direction:column;
  overflow:hidden;
}
.order-dishes-scroll{
  flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:2px 2px 8px;
}
.order-checkout{
  flex:1 1 0; min-height:0;
  display:flex; flex-direction:column;
  background:var(--surface-strong);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  border-top-left-radius:var(--r-xl);
  border-top-right-radius:var(--r-xl);
  box-shadow:var(--shadow-up);
  border-top:1px solid rgba(255,255,255,.7);
  padding:10px 12px 0;
  overflow:hidden;
}

/* 分类横滑 */
.cat-bar{
  flex:0 0 auto;
  display:flex; gap:6px; overflow-x:auto;
  padding:2px 0 10px;
  scrollbar-width:none;
}
.cat-bar::-webkit-scrollbar{ display:none; }
.cat-chip{
  flex:0 0 auto; min-height:36px; padding:0 14px;
  border-radius:99px;
  background:var(--surface-solid);
  border:1.5px solid var(--border);
  color:var(--muted);
  font-size:13px; font-weight:700;
  display:inline-flex; align-items:center;
}
.cat-chip.active{
  background:var(--grad); color:#fff; border-color:transparent;
  box-shadow:0 3px 8px rgba(255,106,0,.26);
}
.dish-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.dish-card{
  background:var(--surface);
  -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
  border:1px solid rgba(255,255,255,.6);
  border-radius:var(--r-md);
  box-shadow:var(--shadow);
  overflow:hidden;
  display:flex; flex-direction:column;
  transition:transform .14s;
  position:relative;
}
.dish-card:active{ transform:scale(.98); }
.dish-card.off{ opacity:.55; }
.dish-thumb{
  position:relative; width:100%; aspect-ratio:4/3;
  background:linear-gradient(135deg,#FFF1E0,#FFE2C6);
  display:flex;align-items:center;justify-content:center;
  color:var(--primary-hi); font-weight:800; font-size:20px;
  overflow:hidden;
}
.dish-thumb img{ width:100%; height:100%; object-fit:cover; }
.dish-badge-off{
  position:absolute; inset:0; display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.72); color:var(--muted); font-size:13px; font-weight:800;
}
.dish-info{ padding:9px 10px 10px; flex:1 1 auto; display:flex; flex-direction:column; gap:4px; }
.dish-name{ font-size:14px; font-weight:800; line-height:1.25; }
.dish-price{ font-size:13px; font-weight:800; color:var(--primary); font-variant-numeric:tabular-nums; }
.dish-spec-mini{ font-size:11px; color:var(--muted); }

/* 结算面板内部 */
.ck-head{ flex:0 0 auto; display:flex; gap:8px; align-items:center; }
.ck-head .num-wrap{ flex:1 1 0; min-width:0; }
.ck-num{
  display:flex; align-items:center; gap:6px;
  background:var(--surface-solid);
  border:1.5px solid var(--border);
  border-radius:12px; padding:0 6px; height:46px;
}
.ck-num label{ font-size:12px; color:var(--muted); font-weight:700; flex:0 0 auto; padding-left:6px; }
.ck-num input{
  flex:1 1 auto; min-width:0; width:100%;
  border:none; background:transparent; height:44px;
  font-size:16px; font-weight:800; text-align:center;
  font-variant-numeric:tabular-nums;
  -moz-appearance:textfield;
}
.ck-num input::-webkit-outer-spin-button,
.ck-num input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.ck-num .step{
  width:34px;height:34px;flex:0 0 auto;border-radius:9px;
  background:var(--primary-soft); color:var(--primary-hi);
  font-size:18px; font-weight:800; line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.ck-num .step:active{ background:var(--primary-soft-2); }

.ck-cart{
  flex:1 1 auto; min-height:0; overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  margin:8px 0 6px;
  border-top:1px dashed var(--border);
  border-bottom:1px dashed var(--border);
  padding:4px 0;
}
.ck-item{ display:flex; align-items:flex-start; gap:8px; padding:7px 0; }
.ck-item .ck-i-main{ flex:1 1 auto; min-width:0; }
.ck-item .ck-i-name{ font-size:13.5px; font-weight:800; line-height:1.3; }
.ck-item .ck-i-meta{ font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.35; }
.ck-item .ck-i-amt{ font-weight:800; font-size:13.5px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.qty-ctl{ display:flex; align-items:center; gap:2px; flex:0 0 auto; }
.qty-ctl button{
  width:28px;height:28px;border-radius:8px;
  background:var(--primary-soft); color:var(--primary-hi);
  font-size:16px;font-weight:800;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.qty-ctl .q{ min-width:22px; text-align:center; font-weight:800; font-size:14px; font-variant-numeric:tabular-nums; }

.ck-foot{
  flex:0 0 auto;
  padding-bottom:calc(8px + var(--safe-b));
}
.ck-total-row{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:8px;
}
.ck-total-row .lbl{ font-size:13px; color:var(--muted); font-weight:700; }
.ck-total-row .val{ font-size:26px; font-weight:900; color:var(--primary); font-variant-numeric:tabular-nums; letter-spacing:.5px; }

/* ==========================================================================
   台桌管理
   ========================================================================== */
/* 手机 3 列 → 平板 4~5 列 → 电脑 6~8 列 */
.table-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}
.table-card{
  position:relative;
  min-height:88px;                       /* 触摸友好 */
  border-radius:16px;
  padding:10px 6px 8px;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:2px; text-align:center;
  background:var(--surface);
  -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur);
  border:1.5px solid var(--border);
  box-shadow:var(--shadow);
  transition:transform .12s, box-shadow .18s, border-color .18s;
  overflow:hidden;
}
.table-card:active{ transform:scale(.96); }
.tc-num{ font-size:20px; font-weight:900; color:var(--text); line-height:1.1; }
.tc-state{ font-size:11.5px; font-weight:700; color:var(--muted); }
.tc-amt{ font-size:12.5px; font-weight:800; color:var(--primary); font-variant-numeric:tabular-nums; margin-top:1px; }

/* 使用中：橘色边框高亮 */
.table-card.status-using{
  border-color:var(--primary);
  background:linear-gradient(180deg, var(--primary-soft) 0%, var(--surface) 62%);
  box-shadow:0 4px 14px rgba(255,106,0,.18);
}
.table-card.status-using .tc-num{ color:var(--primary-hi); }
.table-card.status-using .tc-state{ color:var(--primary-hi); }

/* 待付款：浅红边框警示 */
.table-card.status-pending{
  border-color:var(--danger);
  background:linear-gradient(180deg, var(--danger-soft) 0%, var(--surface) 62%);
  box-shadow:0 4px 14px rgba(220,38,38,.14);
}
.table-card.status-pending .tc-num{ color:var(--danger); }
.table-card.status-pending .tc-state{ color:var(--danger); }
.table-card.status-pending .tc-amt{ color:var(--danger); }

/* 外带独立大卡片 */
.ta-card{
  width:100%;
  min-height:96px;
  padding:0;
  align-items:stretch;
  border-color:var(--primary);
  background:var(--surface);
  box-shadow:0 6px 18px rgba(255,106,0,.16);
}
.ta-head{
  width:100%;
  display:flex; align-items:center; justify-content:space-between;
  padding:9px 14px;
  background:var(--grad);
  color:#fff;
}
.ta-badge{
  font-size:11px; font-weight:800;
  padding:3px 9px; border-radius:99px;
  background:rgba(255,255,255,.26);
}
.ta-body{
  flex:1 1 auto;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:12px 14px 14px;
  gap:2px;
}
.ta-card.status-using .tc-state{ color:var(--primary); font-weight:800; }
.ta-card.status-pending .tc-state{ color:var(--danger); font-weight:800; }

/* 断点：平板 4~5，电脑 6~8 */
@media (min-width:820px){
  .table-grid{ grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
  .table-card{ min-height:104px; padding:14px 8px 12px; }
  .tc-num{ font-size:26px; }
  .tc-state{ font-size:13px; }
  .tc-amt{ font-size:14px; }
  .ta-card{ min-height:112px; }
}
@media (min-width:1100px){ .table-grid{ grid-template-columns:repeat(5,minmax(0,1fr)); } }
@media (min-width:1400px){ .table-grid{ grid-template-columns:repeat(6,minmax(0,1fr)); } }
@media (min-width:1700px){ .table-grid{ grid-template-columns:repeat(7,minmax(0,1fr)); } }
@media (min-width:2000px){ .table-grid{ grid-template-columns:repeat(8,minmax(0,1fr)); } }

/* 单号小字（订单列表 / 小票 / PDF 通用） */
.order-no{
  display:inline-block;
  font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size:12px; font-weight:800; letter-spacing:.4px;
  padding:2px 7px; border-radius:6px;
  background:var(--primary-soft); color:var(--primary-hi);
  white-space:nowrap;
}

/* ==========================================================================
   菜单管理
   ========================================================================== */
.menu-item-row{
  display:flex; gap:10px; align-items:center;
  padding:10px; border-radius:var(--r-md);
  background:var(--surface-solid);
  border:1px solid var(--border);
  margin-bottom:8px;
}
.menu-thumb{
  width:56px;height:56px;flex:0 0 auto;border-radius:11px;overflow:hidden;
  background:linear-gradient(135deg,#FFF1E0,#FFE2C6);
  display:flex;align-items:center;justify-content:center;
  color:var(--primary-hi);font-weight:800;font-size:17px;
}
.menu-thumb img{ width:100%;height:100%;object-fit:cover; }
.spec-row{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.spec-row .input{ flex:1 1 auto; }
.spec-row .input:nth-child(2){ max-width:118px; }
.chip-wrap{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:6px 10px;border-radius:99px;
  background:var(--surface-solid);
  border:1.5px solid var(--border);
  font-size:13px;font-weight:700;color:var(--text);
  min-height:38px;
}
.chip.on{ background:var(--primary-soft); border-color:var(--primary); color:var(--primary-hi); }
.chip.x{ background:var(--danger-soft); border-color:var(--danger-line); color:var(--danger); }
.chip .x-btn{ font-weight:900; opacity:.6; }

/* 搜索 */
.search-bar{ position:relative; margin-bottom:10px; flex:0 0 auto; }
.search-bar .input{ padding-left:38px; }
.search-bar .ico{
  position:absolute; left:12px; top:50%; transform:translateY(-50%);
  color:var(--faint); pointer-events:none;
}
.search-bar .ico svg{ width:18px;height:18px; }

/* 日历 */
.cal-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.cal-head b{ font-size:16px; font-weight:800; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal-dow{ text-align:center; font-size:11px; color:var(--faint); font-weight:700; padding-bottom:4px; }
.cal-cell{
  aspect-ratio:1/1; border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:var(--text);
  background:var(--surface-solid);
  border:1.5px solid transparent;
  position:relative;
}
.cal-cell.blank{ background:transparent; }
.cal-cell.today{ border-color:var(--primary); color:var(--primary); }
.cal-cell.has-data{ background:var(--primary-soft); color:var(--primary-hi); }
.cal-cell.sel{ background:var(--grad); color:#fff; box-shadow:0 3px 8px rgba(255,106,0,.3); }
.cal-dot{
  position:absolute; bottom:4px; width:4px;height:4px;border-radius:50%;
  background:var(--primary);
}
.cal-cell.sel .cal-dot{ background:#fff; }

/* PDF 档案 */
.pdf-item{
  display:flex; align-items:center; gap:10px;
  padding:11px; border-radius:var(--r-md);
  background:var(--surface-solid); border:1px solid var(--border);
  margin-bottom:8px;
}
.pdf-ico{
  width:40px;height:40px;flex:0 0 auto;border-radius:10px;
  background:var(--danger-soft); color:var(--danger);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:900;
}
.pdf-actions{ display:flex; gap:6px; flex:0 0 auto; }
.pdf-actions .btn{ min-height:36px; padding:0 10px; font-size:12.5px; }

/* 设置项 */
.set-row{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 0; border-bottom:1px solid var(--border);
}
.set-row:last-child{ border-bottom:none; }
.set-row .t{ font-size:14.5px; font-weight:700; }
.set-row .d{ font-size:12px; color:var(--muted); margin-top:2px; }
.theme-swatches{ display:flex; gap:10px; flex-wrap:wrap; }
.swatch{
  width:52px;height:52px;border-radius:14px;
  border:3px solid transparent; position:relative;
  box-shadow:var(--shadow);
}
.swatch.on{ border-color:var(--text); }
.swatch span{
  position:absolute; bottom:-18px; left:50%; transform:translateX(-50%);
  font-size:11px; color:var(--muted); white-space:nowrap; font-weight:600;
}

/* ==========================================================================
   平板 / 大屏
   ========================================================================== */
@media (min-width:820px){
  :root{ --topbar-h:66px; }
  #tabbar{ display:none; }
  #sidenav{
    transform:translateX(0);
    box-shadow:none;
    border-right:1px solid rgba(255,255,255,.16);
  }
  #nav-backdrop{ display:none; }
  #btn-menu-toggle, #btn-menu-close{ display:none; }
  #app-shell{ padding-left:var(--side-w); }
  #topbar{ margin-left:0; }
  .page{
    padding:18px 22px 26px;
    padding-left:calc(22px + var(--safe-l));
    padding-right:calc(22px + var(--safe-r));
  }
  .page-title h1{ font-size:24px; }
  .btn{ min-height:56px; font-size:15.5px; }
  .btn-sm{ min-height:42px; font-size:13.5px; }
  .input,.select{ min-height:56px; font-size:15.5px; }
  .select{ background-position:calc(100% - 18px) 25px, calc(100% - 13px) 25px; }
  .cat-chip{ min-height:42px; font-size:14px; }
  .stat-grid{ grid-template-columns:repeat(4,1fr); gap:14px; }
  .stat .v{ font-size:26px; }
  .dish-grid{ grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:14px; }
  .card{ padding:18px; margin-bottom:14px; }
  .modal-mask{ align-items:center; }
  .modal{ border-radius:var(--r-xl); max-height:86dvh; }
  .modal-foot{ padding-bottom:12px; }
  #toast-root{ bottom:calc(22px + var(--safe-b)); }

  /* 平板点餐：左右多列，不受 2/3 + 1/3 约束 */
  .order-body{ flex-direction:row; gap:16px; }
  .order-dishes{
    flex:1 1 auto; min-height:0;
  }
  .order-checkout{
    flex:0 0 380px; width:380px;
    border-radius:var(--r-xl);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:var(--shadow);
    padding:14px;
  }
  .order-checkout .ck-foot{ padding-bottom:0; }
  .ck-total-row .val{ font-size:32px; }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start; }
  .two-col > .card{ margin-bottom:0; }
}
@media (min-width:1180px){
  .dish-grid{ grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); }
  .order-checkout{ flex:0 0 420px; width:420px; }
}

/* 横屏手机：放宽点餐面板 */
@media (max-width:819px) and (orientation:landscape){
  .order-dishes{ flex:1 1 0; }
  .order-checkout{ flex:1 1 0; }
  .dish-grid{ grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
}

/* 打印兜底（浏览器通用打印）—— 不污染屏幕样式 */
#print-root{ display:none; }
@media print{
  body *{ visibility:hidden !important; }
  #print-root, #print-root *{ visibility:visible !important; }
  #print-root{ display:block; position:absolute; left:0; top:0; width:58mm; }
  @page{ margin:2mm; size:58mm auto; }
}

/* 启动屏 */
#boot-screen{
  position:fixed; inset:0; z-index:300;
  background:var(--grad);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  color:#fff;
  transition:opacity .3s;
}
#boot-screen.hide{ opacity:0; pointer-events:none; }
.boot-logo{
  width:74px;height:74px;border-radius:22px;
  background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;
  font-size:34px;font-weight:800;
  animation:pulse 1.4s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
.boot-text{ font-size:14px; opacity:.92; font-weight:600; }

/* 无障碍：减少动效 */
@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}

/* ==========================================================================
   操作员身份 / 结账计算器 / 三级分类（后加模块）
   ========================================================================== */

/* ---------- 顶部操作员身份 ---------- */
.op-chip{
  min-height:34px; padding:0 12px;
  border-radius:99px;
  background:rgba(255,255,255,.22);
  border:1px solid rgba(255,255,255,.45);
  color:#fff; font-size:12.5px; font-weight:800;
  display:inline-flex; align-items:center; gap:5px;
  white-space:nowrap;
}
.op-chip:active{ background:rgba(255,255,255,.34); }
.op-chip.staff{ background:rgba(255,255,255,.14); }

/* 员工模式置灰的高危按钮 */
.is-locked{
  opacity:.45 !important;
  filter:grayscale(1);
  cursor:not-allowed !important;
  pointer-events:auto;   /* 保留 title 提示，点击由 JS 拦截 */
}
.locked-tip{
  background:var(--danger-soft) !important;
  border-color:var(--danger-line) !important;
  color:var(--danger);
  font-size:13px; font-weight:700; line-height:1.6;
}

/* ---------- 结账页：收款 / 计算器 ---------- */
.co-pay{ padding-bottom:14px; }
.co-rows{ margin:2px 0 10px; }
.co-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:7px 0;
  border-bottom:1px dashed var(--border);
}
.co-row:last-child{ border-bottom:none; }
.co-row .k{ font-size:13px; font-weight:700; color:var(--muted); }
.co-row .v{ font-size:20px; font-weight:800; color:var(--text); font-variant-numeric:tabular-nums; }
.co-row .v.big{ font-size:26px; }
.co-row.change .v{ color:var(--muted); }
.co-row.change.over{ background:var(--primary-soft); margin:0 -10px; padding:8px 10px; border-radius:12px; border-bottom:none; }
.co-row.change.over .k,
.co-row.change.over .v{ color:var(--primary-hi); }
.co-err{
  margin:2px 0 10px;
  background:var(--danger-soft);
  border:1px solid var(--danger-line);
  color:var(--danger);
  font-size:13px; font-weight:800;
  padding:9px 12px; border-radius:12px;
}
.co-quick{ display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; scrollbar-width:none; }
.co-quick::-webkit-scrollbar{ display:none; }
.co-quick .chip{ flex:0 0 auto; min-height:38px; }

.co-keypad{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.co-key{
  min-height:72px;               /* 触屏友好：≥72px */
  border-radius:16px;
  border:1.5px solid var(--border);
  background:var(--surface-solid);
  color:var(--text);
  font-size:26px; font-weight:800;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.06);
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
.co-key:active{ background:var(--primary-soft); border-color:var(--primary); color:var(--primary-hi); transform:scale(.97); }
.co-key.fn{ font-size:20px; color:var(--muted); background:rgba(0,0,0,.03); }
.co-key.fn:active{ color:var(--danger); border-color:var(--danger-line); background:var(--danger-soft); }

/* ---------- 分类管理树 ---------- */
.cat-tree{ padding:6px 8px; }
.cat-row{
  display:flex; align-items:center; gap:8px;
  padding:8px 6px;
  border-radius:12px;
  background:transparent;
}
.cat-row + .cat-row{ margin-top:2px; }
.cat-row:hover{ background:var(--primary-soft); }
.cat-row.lv0{ padding-left:6px;  background:rgba(255,122,0,.05); }
.cat-row.lv1{ padding-left:22px; }
.cat-row.lv2{ padding-left:38px; }
.cat-row.off{ opacity:.5; }
.cat-row.dragging{ opacity:.4; background:var(--primary-soft-2); }
.cr-grip{ color:var(--faint); font-size:13px; letter-spacing:-2px; cursor:grab; flex:0 0 auto; }
.cr-dot{ width:7px; height:7px; border-radius:99px; flex:0 0 auto; }
.cr-dot.lv0{ background:var(--primary); width:9px; height:9px; }
.cr-dot.lv1{ background:var(--warn); }
.cr-dot.lv2{ background:var(--faint); }
.cr-nm{ font-size:14px; font-weight:800; color:var(--text); flex:0 0 auto; max-width:44%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cat-row.lv2 .cr-nm{ font-weight:700; }
.cr-cnt{ font-size:11.5px; color:var(--faint); flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cr-acts{ display:flex; gap:4px; flex:0 0 auto; flex-wrap:wrap; justify-content:flex-end; }
.cr-locked{ font-size:11.5px; color:var(--faint); }
.btn-mini{
  min-height:30px; padding:0 9px;
  border-radius:9px;
  border:1.5px solid var(--border);
  background:var(--surface-solid);
  color:var(--muted);
  font-size:12px; font-weight:700;
}
.btn-mini:active{ background:var(--primary-soft); border-color:var(--primary); color:var(--primary-hi); }
.btn-mini.danger{ color:var(--danger); border-color:var(--danger-line); }
.btn-mini.danger:active{ background:var(--danger-soft); }

/* 菜品列表行（可拖拽） */
.dish-row{ transition:opacity .15s; }
.dish-row.off{ opacity:.55; }

/* 00-util.js · 通用工具 */
(function (G) {
  'use strict';

  var U = {};

  U.uid = function () {
    return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  };

  /* 马来西亚习惯：日期 DD/MM/YYYY，时间 12 小时制带 AM / PM。
     全站只有这四个出口，改这里就等于全站改。 */
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function h12(h) { var x = h % 12; return x === 0 ? 12 : x; }   // 0 点→12，12 点→12
  function ampm(h) { return h < 12 ? 'AM' : 'PM'; }

  /* 14:05:09 → 02:05:09 PM */
  U.formatTime = function (d) {
    var h = d.getHours();
    return pad2(h12(h)) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()) + ' ' + ampm(h);
  };

  /* 14:05 → 02:05 PM（小票 / 单据上用的到时分） */
  U.formatHM = function (d) {
    var h = d.getHours();
    return pad2(h12(h)) + ':' + pad2(d.getMinutes()) + ' ' + ampm(h);
  };

  /* 2026-08-30 → 30/08/2026 */
  U.formatDate = function (d) {

  U.formatDateCN = U.formatDate;

  U.greeting = function (d) {
    var h = d.getHours();

    if (h < 9) return '早上好';
    if (h < 11) return '上午好';
    if (h < 14) return '中午好';
    if (h < 17) return '下午好';

    if (h < 22) return '晚上好';
    return '夜深了';
  };

  U.weekdayCN = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

  U.formatMoney = function (n) {
    if (typeof n !== 'number' || isNaN(n)) n = 0;
    return 'RM ' + (Math.round(n * 100) / 100).toFixed(2);
  };

  U.formatMoneyPlain = function (n) {
    if (typeof n !== 'number' || isNaN(n)) n = 0;
    return (Math.round(n * 100) / 100).toFixed(2);

  U.todayKey = function (d) {
    d = d || new Date();
    var y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    return y + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  };

  U.parseKey = function (k) {
    if (!k) return null;
    var p = k.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  };

  U.clamp = function (n, lo, hi) { return Math.max(lo, Math.min(hi, n)); };

  U.debounce = function (fn, ms) {
    var t = null;
    return function () {
      var args = arguments, ctx = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(ctx, args); }, ms);
    };
  };

  U.escapeHTML = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  U.bytes = function (n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';

  };

  U.el = function (tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (k === 'class') n.className = attrs[k];
        else if (k === 'style' && typeof attrs[k] === 'object') {
          for (var s in attrs[k]) n.style[s] = attrs[k][s];
        }
        else if (k === 'html') n.innerHTML = attrs[k];
        else if (k === 'text') n.textContent = attrs[k];
        else if (k.indexOf('on') === 0 && typeof attrs[k] === 'function') n.addEventListener(k.slice(2), attrs[k]);
        else n.setAttribute(k, attrs[k]);
      }
    }
    if (children) {
      (Array.isArray(children) ? children : [children]).forEach(function (c) {
        if (c == null || c === false) return;
        n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);

  U.qs = function (sel, root) { return (root || document).querySelector(sel); };

  U.confirm = function (opts) {
    return new Promise(function (resolve) {

          '<button class="btn ' + (opts.danger ? 'btn-danger' : '') + '" data-act="ok">' + U.escapeHTML(opts.okText || '确定') + '</button>' +
        '</div>';
      mask.appendChild(modal);
      root.appendChild(mask);
      function close(v) { mask.remove(); resolve(v); }
      mask.addEventListener('click', function (e) {
        if (e.target === mask) close(false);
      });
      modal.querySelector('[data-act="cancel"]').addEventListener('click', function () { close(false); });
      modal.querySelector('[data-act="ok"]').addEventListener('click', function () { close(true); });
    });
  };

  U.prompt = function (opts) {
    return new Promise(function (resolve) {
      var root = document.getElementById('modal-root');
      var mask = U.el('div', { class: 'modal-mask' });
      var modal = U.el('div', { class: 'modal' });
      var inputId = 'in_' + U.uid();
      modal.innerHTML =
        '<div class="modal-head"><h3>' + U.escapeHTML(opts.title || '请输入') + '</h3></div>' +
        '<div class="modal-body">' +
          (opts.label ? '<div style="font-size:13px;color:var(--muted);margin-bottom:6px;">' + U.escapeHTML(opts.label) + '</div>' : '') +
          '<textarea class="textarea" id="' + inputId + '" rows="' + (opts.rows || 4) + '" placeholder="' + U.escapeHTML(opts.placeholder || '') + '">' + U.escapeHTML(opts.value || '') + '</textarea>' +
        '</div>' +
        '<div class="modal-foot">' +
          '<button class="btn btn-gray" data-act="cancel">' + U.escapeHTML(opts.cancelText || '取消') + '</button>' +
          '<button class="btn" data-act="ok">' + U.escapeHTML(opts.okText || '确定') + '</button>' +
        '</div>';
      mask.appendChild(modal);
      root.appendChild(mask);
      var ta = modal.querySelector('#' + inputId);
      setTimeout(function () { ta.focus(); }, 80);
      function close(v) { mask.remove(); resolve(v); }
      mask.addEventListener('click', function (e) { if (e.target === mask) close(null); });
      modal.querySelector('[data-act="cancel"]').addEventListener('click', function () { close(null); });
      modal.querySelector('[data-act="ok"]').addEventListener('click', function () { close(ta.value); });
    });
  };

  U.openModal = function (html) {
    var root = document.getElementById('modal-root');
    var mask = U.el('div', { class: 'modal-mask' });
    mask.innerHTML = html;
    root.appendChild(mask);
    return mask;
  };
  U.closeAllModals = function () {
    var root = document.getElementById('modal-root');
    while (root.firstChild) root.removeChild(root.firstChild);
  };

  U.isMobile = function () { return window.innerWidth < 820; };
  U.isTablet = function () { return window.innerWidth >= 820; };

  /* 文件下载 */
  U.download = function (filename, blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  };

  /* 异步读取文件 */
  U.readFile = function (file, as) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = function () { reject(r.error); };
      if (as === 'text') r.readAsText(file);
      else if (as === 'dataURL') r.readAsDataURL(file);
      else r.readAsArrayBuffer(file);
    });
  };

  /* 深拷贝（仅 JSON 安全数据） */
  U.clone = function (v) { return v == null ? v : JSON.parse(JSON.stringify(v)); };

  /* 数字千分位 */
  U.thousand = function (n) {
    n = Math.round((+n || 0) * 100) / 100;
    var s = n.toFixed(2);
    var p = s.split('.');
    p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  };

/* ============ 10-db.js ============ */
/* 10-db.js · IndexedDB 封装
   仓库：menu / orders / ledger / addons / photos / pdfArchives / kv
         carts（台桌 & 外带进行中购物车）/ counters（单号计数器）
         locks（工位软锁，跨会话互斥）
         categories（一级）/ subCategories（二级）
         thirdCategories（三级）/ fourthCategories（四级）
         二 / 三 / 四级都可选，菜挂到哪级算哪级 */
(function (G) {
  'use strict';

  var DB_NAME = 'pos-cashier-db';
  var DB_VERSION = 5;

  var STORES = {
    menu:        { keyPath: 'id', auto: true, indexes: [['category','category','unique:false']] },
    categories:       { keyPath: 'categoryId' },
    subCategories:    { keyPath: 'subId', indexes: [['parentCategoryId','parentCategoryId','unique:false']] },
    thirdCategories:  { keyPath: 'thirdId', indexes: [['parentSubId','parentSubId','unique:false']] },
    fourthCategories: { keyPath: 'fourthId', indexes: [['parentThirdId','parentThirdId','unique:false']] },
    orders:      { keyPath: 'id', auto: true, indexes: [['date','date','unique:false'], ['createTime','createTime','unique:false']] },
    ledger:      { keyPath: 'id', auto: true, indexes: [['date','date','unique:false'], ['type','type','unique:false']] },
    addons:      { keyPath: 'id', auto: true, indexes: [['kind','kind','unique:false']] },
    photos:      { keyPath: 'id', auto: true },
    pdfArchives: { keyPath: 'pdfId', auto: true, indexes: [['createTime','createTime','unique:false'], ['label','label','unique:false']] },
    kv:          { keyPath: 'k' },
    carts:       { keyPath: 'slotId' },
    counters:    { keyPath: 'k' },
    locks:       { keyPath: 'slotId' }
  };

  var _db = null;

  function open() {
    if (_db) return Promise.resolve(_db);
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function (e) {
        var db = e.target.result;
        Object.keys(STORES).forEach(function (name) {
          if (db.objectStoreNames.contains(name)) return;
          var def = STORES[name];
          var store = db.createObjectStore(name, { keyPath: def.keyPath });
          if (def.indexes) {
            def.indexes.forEach(function (ix) {
              store.createIndex(ix[0], ix[1], { unique: ix[2] === 'unique:true' });
            });
          }
        });
      };
      req.onsuccess = function (e) { _db = e.target.result; resolve(_db); };
      req.onerror = function (e) { reject(e.target.error); };
    });
  }

  function tx(names, mode) {
    return open().then(function (db) {
      return db.transaction(names, mode || 'readonly');
    });
  }

  function reqAsPromise(req) {
    return new Promise(function (resolve, reject) {
      req.onsuccess = function (e) { resolve(e.target.result); };
      req.onerror = function (e) { reject(e.target.error); };
    });
  }

  function getAll(store) {
    return tx([store]).then(function (t) {
      return reqAsPromise(t.objectStore(store).getAll());
    });
  }

  function get(store, key) {
    return tx([store]).then(function (t) {
      return reqAsPromise(t.objectStore(store).get(key));
    });
  }

  function put(store, val) {
    return tx([store], 'readwrite').then(function (t) {
      return reqAsPromise(t.objectStore(store).put(val));
    });
  }

  function add(store, val) {
    return tx([store], 'readwrite').then(function (t) {
      return reqAsPromise(t.objectStore(store).add(val));
    });
  }

  function del(store, key) {
    return tx([store], 'readwrite').then(function (t) {
      return reqAsPromise(t.objectStore(store).delete(key));
    });
  }

  function clear(store) {
    return tx([store], 'readwrite').then(function (t) {
      return reqAsPromise(t.objectStore(store).clear());
    });
  }

  function getByIndex(store, indexName, value) {
    return tx([store]).then(function (t) {
      return reqAsPromise(t.objectStore(store).index(indexName).getAll(value));
    });
  }

  function getAllInRange(store, indexName, range) {
    return tx([store]).then(function (t) {
      return reqAsPromise(t.objectStore(store).index(indexName).getAll(range));
    });
  }

  /* kv 辅助 */
  function kvGet(k) {
    return get('kv', k).then(function (r) { return r ? r.v : null; });
  }
  function kvSet(k, v) {
    return put('kv', { k: k, v: v });
  }
  function kvDel(k) { return del('kv', k); }

  G.DB = {
    open: open,
    getAll: getAll,
    get: get,
    put: put,
    add: add,
    del: del,
    clear: clear,
    getByIndex: getByIndex,
    getAllInRange: getAllInRange,
    kvGet: kvGet,
    kvSet: kvSet,
    kvDel: kvDel,
    STORES: STORES,
    DB_NAME: DB_NAME
  };
})(window);

    tableCount: 50,          // 台桌数量，改这个数字即可扩充桌号，页面布局自适应

    printerMode: 'auto',     // auto | usb | ble | browser
    autoPrint: false,
    bleDeviceId: '',
    bleDeviceName: '',
    receiptHeader: 'YH POS SYS',   // 店铺名称（小票大标题）
    shopAddr: '',                  // 地址
    shopPhone: '',                 // 电话
    shopReg: '',                   // REG NO. 注册号
    receiptFooter: '谢谢惠顾，欢迎再次光临',

    exportIncludePdf: false
  };

  var cfg = null;
  function load() {
    try {
      var s = localStorage.getItem(LS_KEY);
      cfg = s ? Object.assign({}, DEFAULTS, JSON.parse(s)) : Object.assign({}, DEFAULTS);
    } catch (e) { cfg = Object.assign({}, DEFAULTS); }
    return cfg;
  }
  function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(cfg)); } catch (e) {} }
  function get(k) { if (!cfg) load(); return cfg[k]; }
  function set(k, v) { if (!cfg) load(); cfg[k] = v; save(); }

  /* ============== 业务数据封装 ============== */
  var DB = G.DB;

  function nowISO() { return new Date().toISOString(); }

  /* ---- 菜单 ---- */
  function listMenu() { return DB.getAll('menu').then(function (arr) { arr.sort(function (a,b) { return (a.sort||0) - (b.sort||0) || (a.createdAt||'').localeCompare(b.createdAt||''); }); return arr; }); }
  function getMenu(id) { return DB.get('menu', id); }
  function saveMenu(item) {
    if (!item.id) { item.id = U.uid(); item.createdAt = nowISO(); }
    item.updatedAt = nowISO();
    if (!Array.isArray(item.specs)) item.specs = [];
    if (item.specs.length === 0) {
      item.specs = [{ id: U.uid(), name: '标准', price: +item.price || 0 }];

  }

  /* ---- 配料库（小料 / 可去配料） ---- */
  function listAddons() { return DB.getAll('addons'); }
  function saveAddon(it) {
    if (!it.id) it.id = U.uid();
    if (!['extra', 'ingredient'].indexOf(it.kind) + 1) it.kind = 'extra';
    if (typeof it.price !== 'number') it.price = +it.price || 0;
    it.createdAt = it.createdAt || nowISO();
    return DB.put('addons', it);
  }
  function delAddon(id) { return DB.del('addons', id); }

  /* ================= 一 / 二 / 三 / 四级分类 =================
     层级强绑定：二级依附一级，三级依附二级，四级依附三级，菜品必须归属到四级分类。
     历史订单只存菜品本身快照，不存分类 ID —— 改名 / 移动分组不影响旧小票与 PDF。 */
  var DEFAULT_CAT = { name: '未分类' }, DEFAULT_SUB = { name: '默认子分类' },
      DEFAULT_THIRD = { name: '默认分组' }, DEFAULT_FOURTH = { name: '默认细分组' };

  function bySort(a, b) {
    return (a.sort || 0) - (b.sort || 0) || String(a.name || '').localeCompare(String(b.name || ''), 'zh');
  }
  function listCategories() { return DB.getAll('categories').then(function (a) { a.sort(bySort); return a; }); }
  function listSubCategories() { return DB.getAll('subCategories').then(function (a) { a.sort(bySort); return a; }); }
  function listThirdCategories() { return DB.getAll('thirdCategories').then(function (a) { a.sort(bySort); return a; }); }
  function listFourthCategories() { return DB.getAll('fourthCategories').then(function (a) { a.sort(bySort); return a; }); }

  /* 新建时若未给 sort，按同级当前最大 sort + 10 追加到末尾 */
  function tailSort(store, filterFn) {
    return DB.getAll(store).then(function (arr) {
      var list = (arr || []).filter(filterFn || function () { return true; });
      var max = list.reduce(function (m, x) { return Math.max(m, +x.sort || 0); }, 0);
      return max + 10;
    });
  }
  function saveCategory(it) {
    it.isActive = it.isActive !== false;
    if (it.categoryId && it.sort != null) return DB.put('categories', it);
    if (!it.categoryId) it.categoryId = U.uid();
    return tailSort('categories').then(function (s) {
      it.sort = s;
      return DB.put('categories', it);
    });
  }
  function saveSubCategory(it) {
    it.isActive = it.isActive !== false;
    if (it.subId && it.sort != null) return DB.put('subCategories', it);
    if (!it.subId) it.subId = U.uid();
    return tailSort('subCategories', function (x) { return x.parentCategoryId === it.parentCategoryId; })
      .then(function (s) { it.sort = s; return DB.put('subCategories', it); });
  }
  function saveThirdCategory(it) {
    it.isActive = it.isActive !== false;
    if (it.thirdId && it.sort != null) return DB.put('thirdCategories', it);
    if (!it.thirdId) it.thirdId = U.uid();
    return tailSort('thirdCategories', function (x) { return x.parentSubId === it.parentSubId; })
      .then(function (s) { it.sort = s; return DB.put('thirdCategories', it); });
  }
  function saveFourthCategory(it) {
    it.isActive = it.isActive !== false;
    if (it.fourthId && it.sort != null) return DB.put('fourthCategories', it);
    if (!it.fourthId) it.fourthId = U.uid();
    return tailSort('fourthCategories', function (x) { return x.parentThirdId === it.parentThirdId; })
      .then(function (s) { it.sort = s; return DB.put('fourthCategories', it); });
  }

  /* ============================================================
   * 菜品归属的「最深层级」
   * 二级 / 三级 / 四级都是可选的：菜挂到哪一级，就以哪一级为准。
   * 只有最深层级的那个 ID 决定菜品出现在哪个分组下，不会重复统计。
   * ============================================================ */
  var ID_KEY = { cat: 'categoryId', sub: 'subCategoryId', third: 'thirdCategoryId', fourth: 'fourthCategoryId' };
  function deepestLevel(m) {
    if (m.fourthCategoryId) return 'fourth';
    if (m.thirdCategoryId) return 'third';
    if (m.subCategoryId) return 'sub';
    if (m.categoryId) return 'cat';
    return '';
  }
  /* 直接挂在某个节点下的菜品（只认最深层级，避免上级重复计数） */
  function ownDishes(menu, level, id) {
    return (menu || []).filter(function (m) {
      return deepestLevel(m) === level && m[ID_KEY[level]] === id;
    });
  }

  /* 删除保护：有子节点 / 挂着菜品一律拒绝，并把"要先处理什么"说清楚 */
  function checkDelete(kind, id) {
    var KID = { cat: ['subCategories', 'parentCategoryId', '二级分类'],
                sub: ['thirdCategories', 'parentSubId', '三级分类'],
                third: ['fourthCategories', 'parentThirdId', '四级分类'] }[kind];
    return Promise.all([
      KID ? DB.getAll(KID[0]) : Promise.resolve([]),
      DB.getAll('menu')
    ]).then(function (r) {
      if (KID) {
        var kids = (r[0] || []).filter(function (x) { return x[KID[1]] === id; });
        if (kids.length) return { ok: false, why: '下面还有 ' + kids.length + ' 个' + KID[2] + '，请先删掉或把菜迁走' };
      }
      var dishes = ownDishes(r[1], kind, id);
      if (dishes.length) return { ok: false, why: '下面还直接挂着 ' + dishes.length + ' 个菜品，请先把菜移到别的分组' };
      return { ok: true };
    });
  }
  function delCategory(id) { return DB.del('categories', id); }
  function delSubCategory(id) { return DB.del('subCategories', id); }
  function delThirdCategory(id) { return DB.del('thirdCategories', id); }
  function delFourthCategory(id) { return DB.del('fourthCategories', id); }

  /* 全路径，给菜品列表 / 点餐页展示用（哪一级别没建就跳过那一段） */
  function pathOf(ids) {
    return Promise.all([listCategories(), listSubCategories(), listThirdCategories(), listFourthCategories()])
      .then(function (r) {
        var c = (r[0] || []).find(function (x) { return x.categoryId === ids.categoryId; });
        var s = (r[1] || []).find(function (x) { return x.subId === ids.subCategoryId; });
        var t = (r[2] || []).find(function (x) { return x.thirdId === ids.thirdCategoryId; });
        var f = (r[3] || []).find(function (x) { return x.fourthId === ids.fourthCategoryId; });
        return {
          cat: c, sub: s, third: t, fourth: f,
          text: [c && c.name, s && s.name, t && t.name, f && f.name].filter(Boolean).join(' / ')
        };
      });
  }

  /* 首次使用 / 老库升级：建默认分支，并把无归属的历史菜品挂进去。
     默认只建到三级 —— 第四级是可选的，需要细分时到分类管理里自己加。 */
  function ensureDefaultCategories() {
    return listCategories().then(function (cats) {
      if (cats.length) return ensureDefaultSubs(cats[0]);
      return saveCategory(Object.assign({ categoryId: U.uid(), sort: 10 }, DEFAULT_CAT))
        .then(function () { return listCategories(); })
        .then(function (c2) { return ensureDefaultSubs(c2[0]); });
    }).then(function (third) {
      // 历史菜品兜底归属：连三级都没有的，挂进默认分支
      return DB.getAll('menu').then(function (arr) {
        var jobs = [];
        (arr || []).forEach(function (m) {
          if (m.thirdCategoryId || m.subCategoryId) return;
          m.categoryId = third.catId;
          m.subCategoryId = third.subId;
          m.thirdCategoryId = third.thirdId;
          jobs.push(DB.put('menu', m));
        });
        return Promise.all(jobs);
      });
    });
  }
  function ensureDefaultSubs(cat) {
    return listSubCategories().then(function (subs) {
      var own = subs.filter(function (s) { return s.parentCategoryId === cat.categoryId; });
      if (own.length) return ensureDefaultThirds(own[0], cat);
      return saveSubCategory({ subId: U.uid(), parentCategoryId: cat.categoryId, name: DEFAULT_SUB.name, sort: 10, isActive: true })
        .then(function () { return listSubCategories(); })
        .then(function (s2) { return ensureDefaultThirds(s2.filter(function (s) { return s.parentCategoryId === cat.categoryId; })[0], cat); });
    });
  }
  function ensureDefaultThirds(sub, cat) {
    return listThirdCategories().then(function (ths) {
      var own = ths.filter(function (t) { return t.parentSubId === sub.subId; });
      if (own.length) return { catId: cat.categoryId, subId: sub.subId, thirdId: own[0].thirdId };
      var thirdId = U.uid();
      return saveThirdCategory({ thirdId: thirdId, parentSubId: sub.subId, name: DEFAULT_THIRD.name, sort: 10, isActive: true })
        .then(function () { return { catId: cat.categoryId, subId: sub.subId, thirdId: thirdId }; });
    });
  }

  /* 菜品重排序号：按分类树深度优先的扁平序号 * 1000 + 组内序号，
     让点餐页与后台列表的显示顺序与分类树一致（每一层自己的直属菜也算一组） */
  function reindexDishes() {
    return Promise.all([listCategories(), listSubCategories(), listThirdCategories(),
                        listFourthCategories(), DB.getAll('menu')])
      .then(function (r) {
        var cats = r[0], subs = r[1], ths = r[2], fs = r[3], menu = r[4] || [];
        var gi = 0, jobs = [];
        function group(level, id) {
          var dishes = ownDishes(menu, level, id).slice().sort(bySort);
          dishes.forEach(function (m, i) {
            var v = gi * 1000 + i;
            if (m.sort !== v) { m.sort = v; jobs.push(DB.put('menu', m)); }
          });
          gi++;
        }
        cats.forEach(function (c) {
          group('cat', c.categoryId);
          subs.filter(function (s) { return s.parentCategoryId === c.categoryId; }).forEach(function (s) {
            group('sub', s.subId);
            ths.filter(function (t) { return t.parentSubId === s.subId; }).forEach(function (t) {
              group('third', t.thirdId);
              fs.filter(function (f) { return f.parentThirdId === t.thirdId; }).forEach(function (f) {
                group('fourth', f.fourthId);
              });
            });
          });
        });
        // 没挂到任何分类的孤儿菜品，排到最后
        menu.filter(function (m) { return !deepestLevel(m); }).forEach(function (m, i) {
          var v = gi * 1000 + i;
          if (m.sort !== v) { m.sort = v; jobs.push(DB.put('menu', m)); }
        });
        return Promise.all(jobs);
      });
  }

  /* 批量把菜品重新分配到指定分类（落到哪一级由 ids 里最深的那个决定） */
  function assignDishes(menuIds, ids) {
    return DB.getAll('menu').then(function (arr) {
      var jobs = [];
      (arr || []).forEach(function (m) {
        if (menuIds.indexOf(m.id) < 0) return;
        m.categoryId = ids.categoryId;
        m.subCategoryId = ids.subCategoryId || '';
        m.thirdCategoryId = ids.thirdCategoryId || '';
        // 第四级是可选的：没传就清掉，菜直接挂在三级下
        m.fourthCategoryId = ids.fourthCategoryId || '';
        jobs.push(DB.put('menu', m));
      });
      return Promise.all(jobs).then(reindexDishes);
    });
  }

  /* ---- 订单 ---- */
  function listOrders(opts) {
    opts = opts || {};
    return DB.getAll('orders').then(function (arr) {
      if (opts.date) arr = arr.filter(function (x) { return x.date === opts.date; });
      if (opts.from) arr = arr.filter(function (x) { return x.date >= opts.from; });
      if (opts.to) arr = arr.filter(function (x) { return x.date <= opts.to; });
      arr.sort(function (a, b) { return (b.createTime || '').localeCompare(a.createTime || ''); });
      return arr;
    });
  }
  function getOrder(id) { return DB.get('orders', id); }
  function saveOrder(o) {
    if (!o.id) o.id = U.uid();
    if (!o.createTime) o.createTime = nowISO();
    o.date = o.date || U.todayKey();
    return DB.put('orders', o);
  }
  function delOrder(id) { return DB.del('orders', id); }
  function clearAllOrders() { return DB.clear('orders'); }

  /* ---- 收支流水 ---- */
  function listLedger(opts) {
    opts = opts || {};
    return DB.getAll('ledger').then(function (arr) {
      if (opts.date) arr = arr.filter(function (x) { return x.date === opts.date; });
      // 区间筛选（周 / 月统计）：date 是 YYYY-MM-DD，字典序即时间序
      if (opts.from) arr = arr.filter(function (x) { return !!x.date && x.date >= opts.from; });
      if (opts.to) arr = arr.filter(function (x) { return !!x.date && x.date <= opts.to; });
      if (opts.type) arr = arr.filter(function (x) { return x.type === opts.type; });
      arr.sort(function (a, b) { return (b.createTime || '').localeCompare(a.createTime || ''); });
      return arr;
    });
  }
  function saveLedger(it) {
    if (!it.id) it.id = U.uid();
    if (!it.createTime) it.createTime = nowISO();
    it.date = it.date || U.todayKey();
    it.amount = +it.amount || 0;
    return DB.put('ledger', it);
  }
  function delLedger(id) { return DB.del('ledger', id); }

  /* ================= 台桌 / 外带 进行中购物车 =================
     slotId 规则：
       堂食  → 'T' + 桌号补零（T01 .. T50，随 tableCount 扩展）
       外带  → 'TAKEAWAY'
     每个 slot 同时只允许一组购物车。 */
  var TAKEAWAY_SLOT = 'TAKEAWAY';
  function tableSlotId(t) { return 'T' + String(+t).padStart(2, '0'); }

  function emptyCart(slotId, kind, table) {
    return {
      slotId: slotId,
      kind: kind,                 // 'dinein' | 'takeaway'
      table: (kind === 'dinein' ? +table : null),
      items: [],
      status: 'idle',             // idle | using | pending
      total: 0,
      pax: 2,
      payMethod: get('defaultPay') || 'CASH',
      updatedAt: nowISO()
    };
  }

  function getCart(slotId) {
    return DB.get('carts', slotId).then(function (c) {
      if (c) return c;
      // 惰性创建一个空壳（不落库，避免数据库塞满空记录）
      var isTA = slotId === TAKEAWAY_SLOT;
      return emptyCart(slotId, isTA ? 'takeaway' : 'dinein', isTA ? null : +slotId.slice(1));
    });
  }
  function saveCart(cart) {
    cart.updatedAt = nowISO();
    cart.total = (cart.items || []).reduce(function (s, it) { return s + (+it.subtotal || 0); }, 0);
    cart.total = Math.round(cart.total * 100) / 100;
    if (!cart.items || cart.items.length === 0) cart.status = 'idle';
    else if (cart.status === 'idle') cart.status = 'using';
    return DB.put('carts', cart);
  }
  /* 清空购物车时一并解锁，否则结账后 30 秒内会被误判为「其他会话操作中」 */
  function clearCart(slotId) {
    return DB.del('carts', slotId).then(function () { return releaseLock(slotId); });
  }
  function listCarts() { return DB.getAll('carts'); }
  function clearAllCarts() {
    return DB.clear('carts').then(function () { return clearAllLocks(); });
  }

  /* ================= 工位软锁（跨会话互斥） =================
     锁单独存 locks 仓库，不塞进 carts：
       - 空闲桌的购物车是惰性空壳、不落库，锁必须能独立存在；
       - 避免锁字段把空购物车写进库里，污染数据。
     规则：同一个 slot 同一时间只允许一个会话持有；
           超过 LOCK_TTL 未续期视为已释放（防死锁）。 */
  var SESSION_ID = U.uid();
  var LOCK_TTL = 30000;

  function lockHeldByOther(rec) {
    if (!rec) return false;
    if (rec.sid === SESSION_ID) return false;          // 自己持有
    return (Date.now() - (rec.ts || 0)) < LOCK_TTL;    // 别人持有且未过期
  }

  /* 抢占锁：Promise<boolean>，true=拿到，false=被别的会话占用 */
  function acquireLock(slotId) {
    return DB.get('locks', slotId).then(function (rec) {
      if (lockHeldByOther(rec)) return false;
      return DB.put('locks', { slotId: slotId, sid: SESSION_ID, ts: Date.now() })
               .then(function () { return true; })
               .catch(function () { return true; });   // 写失败不阻断使用
    }).catch(function () { return true; });
  }

  /* 释放锁：只释放自己持有的，避免误删别人的锁 */
  function releaseLock(slotId) {
    if (!slotId) return Promise.resolve(false);
    return DB.get('locks', slotId).then(function (rec) {
      if (!rec || rec.sid !== SESSION_ID) return false;
      return DB.del('locks', slotId).then(function () { return true; });
    }).catch(function () { return false; });
  }

  /* 续期：仍在本会话操作就刷新时间戳 */
  function touchLock(slotId) {
    if (!slotId) return Promise.resolve(false);
    return DB.get('locks', slotId).then(function (rec) {
      if (!rec || rec.sid !== SESSION_ID) return false;
      return DB.put('locks', { slotId: slotId, sid: SESSION_ID, ts: Date.now() })
               .then(function () { return true; });
    }).catch(function () { return false; });
  }

  /* 查锁（给台桌页显示占用提示用） */
  function peekLock(slotId) {
    return DB.get('locks', slotId).then(function (rec) {
      return lockHeldByOther(rec);
    }).catch(function () { return false; });
  }
  /* 批量查锁：给台桌页一次拿到所有「被别的会话占用」的工位，避免逐桌查询 */
  function lockedSlots() {
    return DB.getAll('locks').then(function (recs) {
      var out = {}, now = Date.now();
      (recs || []).forEach(function (r) {
        if (r.sid === SESSION_ID) return;                 // 自己持有的不算占用
        if ((now - (r.ts || 0)) < LOCK_TTL) out[r.slotId] = true;
      });
      return out;
    }).catch(function () { return {}; });
  }
  function clearAllLocks() { return DB.clear('locks').catch(function () {}); }
  /* 清掉已过期的锁记录：过期锁已不具互斥效力，留着只会让 locks 仓库越积越多 */
  function purgeLocks() {
    return DB.getAll('locks').then(function (recs) {
      var now = Date.now();
      var jobs = (recs || []).filter(function (r) { return (now - (r.ts || 0)) >= LOCK_TTL; })
        .map(function (r) { return DB.del('locks', r.slotId); });
      return Promise.all(jobs);
    }).catch(function () { return null; });
  }

  /* ================= 单号计数器 =================
     堂食 DI：DI 001 → DI 9999，累计不按天重置，满 9999 后回 DI 001
     外带 TA：TA001 起，每个自然日重置 */
  function fmtDI(n) { return 'DI ' + String(n).padStart(3, '0'); }
  function fmtTA(n) { return 'TA' + String(n).padStart(3, '0'); }

  function peekDI() {
    return DB.get('counters', 'dineInSeq').then(function (r) { return r ? r.v : 0; });
  }
  function nextDineInNo() {
    // 原子式：读取 → +1 → 写回 → 返回格式化单号
    return DB.get('counters', 'dineInSeq').then(function (r) {
      var cur = r ? r.v : 0;
      var next = cur + 1;
      if (next > 9999) next = 1;            // 到上限回环
      return DB.put('counters', { k: 'dineInSeq', v: next }).then(function () { return fmtDI(next); });
    });
  }
  function nextTakeawayNo() {
    var today = U.todayKey();
    return DB.get('counters', 'takeawaySeq').then(function (r) {
      var n = 1, d = today;
      if (r && r.date === today) { n = (r.v || 0) + 1; d = r.date; }
      return DB.put('counters', { k: 'takeawaySeq', v: n, date: d }).then(function () { return fmtTA(n); });
    });
  }
  function getCounters() {
    return Promise.all([DB.get('counters', 'dineInSeq'), DB.get('counters', 'takeawaySeq')])
      .then(function (r) {
        return {
          dineInSeq: r[0] ? r[0].v : 0,
          takeawayDate: r[1] ? r[1].date : '',
          takeawaySeq: r[1] ? r[1].v : 0
        };
      });
  }
  function setCounters(c) {
    var jobs = [];
    if (c && typeof c.dineInSeq === 'number') jobs.push(DB.put('counters', { k: 'dineInSeq', v: c.dineInSeq }));
    if (c && typeof c.takeawaySeq === 'number') jobs.push(DB.put('counters', { k: 'takeawaySeq', v: c.takeawaySeq, date: c.takeawayDate || U.todayKey() }));

      payMethod: cart.payMethod || 'CASH',
      items: (cart.items || []).map(function (l) {

          menuId: l.menuId, name: l.name, specId: l.specId, specName: l.specName,

      });
